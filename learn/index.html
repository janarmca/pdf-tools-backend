<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>கல்வி களஞ்சியம் — Kalvi Kalanjiyam | Free lessons for TN students</title>
<meta name="description" content="Free, world-class lessons for Tamil Nadu students (Samacheer Kalvi): understand first with real-life examples and hands-on animations, then practise and test. Tamil + English. No login, no fees.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--ink:#14213d;--sub:#5b6478;--line:#e2e6ef;--bg:#f6f7fb;--card:#fff;--brand:#3b2fc9;--brand2:#eeecff;--ok:#127a3e;--okbg:#e8f8ee;--bad:#b42318;--badbg:#fdecea;--warm:#fff7e3;--math:#0b5d7a;
 --c-math:#3b2fc9;--c-phy:#0b7a75;--c-che:#b3541e;--c-bio:#2f7d32;--c-tam:#a4133c;--c-eng:#1d4ed8;--c-soc:#7c5e10;--c-evs:#2f7d32;--c-sci:#0b7a75;--c-think:#6d28d9;--c-val:#be185d;--c-nat:#c2410c;--c-lang:#0369a1;--c-beyond:#0f766e}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Tamil',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.7}
a{color:var(--brand)}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.topin{max-width:980px;margin:auto;padding:10px 16px;display:flex;gap:10px;align-items:center}
.logo{font-weight:800;font-size:1.05rem;cursor:pointer;white-space:nowrap}
.logo small{display:block;font-size:.68rem;font-weight:600;color:var(--sub);line-height:1.2}
.sp{flex:1}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{border:0;background:#fff;padding:7px 11px;font:inherit;font-size:.82rem;cursor:pointer}
.lang button.on{background:var(--brand);color:#fff}
.wrap{max-width:980px;margin:auto;padding:16px}
.hero{background:linear-gradient(135deg,#3b2fc9,#7b2cbf);color:#fff;border-radius:22px;padding:22px}
.hero h1{margin:0 0 6px;font-size:1.45rem;line-height:1.35}
.hero p{margin:0;opacity:.92;font-size:.92rem}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.pillars div{background:#ffffff1f;border-radius:12px;padding:8px 10px;font-size:.78rem;line-height:1.4}
.classes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}
.cls{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;font-weight:800}
.cls b{display:block;font-size:1.6rem;color:var(--brand)}
.cls.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand2)}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.subj{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;border-top:5px solid var(--c,#888)}
.subj h3{margin:0 0 2px;font-size:1rem}
.subj .meta{font-size:.78rem;color:var(--sub)}
.bar{height:6px;background:#eef0f5;border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.chap{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.chap>.h{padding:12px 14px;display:flex;gap:10px;align-items:center;cursor:pointer}
.chap .no{width:30px;height:30px;border-radius:9px;background:var(--brand2);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto;font-size:.85rem}
.chap .t{flex:1;font-weight:700}
.tag{font-size:.68rem;padding:3px 8px;border-radius:99px;font-weight:800;white-space:nowrap}
.tag.ready{background:var(--okbg);color:var(--ok)}.tag.soon{background:#f1f2f6;color:#7b8194}.tag.done{background:#dff3ff;color:#075985}
.lessons{border-top:1px solid var(--line);padding:6px 14px 12px}
.les{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.les:last-child{border-bottom:0}
.les .ic{font-size:1.2rem}
.crumbs{font-size:.8rem;color:var(--sub);margin-bottom:8px;cursor:pointer}
.crumbs span:hover{text-decoration:underline}
/* lesson */
.lhead{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.lhead h1{margin:0;font-size:1.3rem;line-height:1.4}
.lhead .goal{margin-top:8px;font-size:.88rem;color:var(--sub)}
.prog{position:sticky;top:57px;z-index:10;height:5px;background:#e8e9f3;border-radius:9px;margin-bottom:12px;overflow:hidden}.prog i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
.blk{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.blk h2{font-size:1.02rem;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.blk p{margin:0 0 10px}
.blk p:last-child{margin-bottom:0}
.hook{background:var(--warm);border-color:#f5dfa6}
.key{background:var(--brand2);border-color:#d8d4ff}
.formula{white-space:pre-wrap;font-family:'Noto Sans Tamil',Georgia,serif;background:#f4f6ff;border:1px dashed #b9b3ff;border-radius:12px;padding:10px 14px;margin:10px 0;font-size:1.05rem;text-align:center;color:var(--math);font-weight:700;overflow-x:auto}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0 0}
.steps li{counter-increment:s;position:relative;padding:6px 0 6px 36px}
.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:.75rem;display:flex;align-items:center;justify-content:center;font-weight:800}
.reveal{margin-top:8px}
.btn{border:0;border-radius:11px;padding:10px 15px;font:inherit;font-weight:800;cursor:pointer;background:#eceef5;color:var(--ink)}
.btn.p{background:var(--brand);color:#fff}
.btn.sm{padding:6px 11px;font-size:.82rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input.ans{width:130px;padding:9px 10px;border:1px solid #cfd4e2;border-radius:10px;font:inherit}
.fb{margin-top:8px;padding:9px 12px;border-radius:10px;font-size:.9rem}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}.fb.hint{background:var(--warm);color:#7a5200}
.opt{display:block;width:100%;text-align:left;margin:6px 0;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.widget{background:#fbfbff;border:1px solid #e3e1fb;border-radius:14px;padding:12px;margin-top:8px}
.widget svg{width:100%;height:auto;display:block;touch-action:none}
.ctrl{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:.85rem;margin-top:8px}
.ctrl input[type=range]{width:100%}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}
.readout div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:.8rem}
.readout b{display:block;font-size:1.05rem;color:var(--math)}
.activity{background:#effaf3;border-color:#bfe8cc}
.summary{background:#f3f1ff}
.summary li{margin-bottom:4px}
.tbl{border-collapse:collapse;width:100%;margin:6px 0;text-align:center;font-size:.95rem}.tbl th,.tbl td{border:1px solid #dcdff0;padding:7px 6px}.tbl tr:first-child th{background:#eeecff;color:#3b2fc9}.tbl td{color:#0b5d7a;font-weight:700}
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.door{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;transition:transform .15s}
.door:hover{transform:translateY(-2px)}
.door b{display:block;font-size:1.05rem;margin-bottom:4px}.door span{font-size:.82rem;color:var(--sub)}
.door.d1{border-top:5px solid #3b2fc9}.door.d2{border-top:5px solid #0b7a75}.door.d3{border-top:5px solid #b3541e}
.predict{background:#fff4f8;border-color:#f6c6d8}
.discover{background:#f1fbff;border-color:#bfe6f6}
.world{background:#fff}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.wcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.88rem}
.wcard b{display:block;margin-bottom:2px}
.invent{background:#fffbea;border-color:#f2dc8a}
.future{background:linear-gradient(135deg,#f5f3ff,#eefbf6);border-color:#d6d0ff}
.fbox{border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.9rem}
.fbox.r{background:#fdecea}.fbox.f{background:#e8f8ee}.fbox.q{background:#fff}
.explain{background:#f7f7ff}
textarea.journal{width:100%;min-height:90px;border:1px solid #cfd4e2;border-radius:12px;padding:10px;font:inherit;margin-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:.72rem;padding:4px 9px;border-radius:99px;background:#eef0f7;color:#334}
.chip.b1{background:#fde2e1;color:#8a1c14}.chip.b2{background:#e0ecff;color:#1d4ed8}.chip.b3{background:#e8f8ee;color:#127a3e}
.kw{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border-radius:99px;font-size:.78rem}
.kw.y{background:var(--okbg);color:var(--ok)}.kw.n{background:#fff1cc;color:#7a4f00}
@media(max-width:700px){.doors{grid-template-columns:1fr}}

/* ===== games ===== */
.gcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:12px}
.ghead{display:flex;gap:12px;align-items:center}.ghead h1{margin:0;font-size:1.15rem}
.gicon{width:48px;height:48px;border-radius:14px;background:var(--brand2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;color:var(--brand)}
.gstage{margin-top:12px}
.mrow{display:flex;gap:10px;align-items:flex-end}
.mayilu{width:78px;height:78px;flex:0 0 auto;animation:bob 2.4s ease-in-out infinite}
.mayilu .tail{transform-origin:60px 78px;animation:fan 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}} @keyframes fan{50%{transform:scale(1.06)}}
.bubble{background:#fff7e3;border:1px solid #f5dfa6;border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:.92rem;line-height:1.6}
.demo{margin-top:12px;border:2px dashed #d8d4ff;border-radius:16px;padding:10px 12px;background:#fbfaff}
.demo-t{font-weight:800;font-size:.85rem;color:var(--brand);margin-bottom:6px}
.gopt.will{border-style:dashed}
.big-btn{font-size:1.1rem;padding:14px 26px;border-radius:16px}
.gq{font-size:1.15rem;font-weight:800;text-align:center;margin:6px 0 4px}
.scene{display:flex;flex-direction:column;align-items:center;gap:6px;margin:8px 0;min-height:40px}
.scene .pic{width:100%;max-width:420px;height:auto}
.emo{font-size:30px;line-height:1.35;text-align:center}
.two{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}.two>div{text-align:center}
.nl{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.nl span{min-width:48px;padding:8px 6px;border-radius:12px;background:#eef0f7;font-weight:800;font-size:1.05rem;text-align:center}.nl span.on{background:#3b2fc9;color:#fff}
.nl.ta span{font-size:1.4rem}
.big{font-size:2.2rem;font-weight:800;letter-spacing:.04em;text-align:center}.big .hl{color:#b3541e;text-decoration:underline}
.big.ta{font-size:2.4rem}
.col{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.7rem;font-weight:800;text-align:right;display:inline-block}.col .bar{border-top:3px solid #14213d;margin:2px 0}
.qbox{display:inline-block;min-width:40px;border:3px dashed #b3541e;border-radius:10px;color:#b3541e;text-align:center}
.gopts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.gopt{border:2px solid #d6d9ea;background:#fff;border-radius:16px;padding:14px 10px;font:inherit;font-size:1.1rem;font-weight:800;cursor:pointer;min-height:58px;transition:transform .1s}
.gopt:active{transform:scale(.97)}
.gopt.ok{border-color:#127a3e;background:#e8f8ee;color:#0d5c2e}.gopt.bad{border-color:#b42318;background:#fdecea;color:#8a1c14}
.ta-big{font-size:1.9rem}.ta-mid{font-size:1.3rem}
.pop{animation:pop .45s}.shake{animation:shake .45s}
@keyframes pop{40%{transform:scale(1.12)}} @keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.cheer{display:flex;align-items:center;justify-content:center;gap:8px;font-size:1.3rem;color:#127a3e;animation:pop .5s}.cheer .mayilu{width:54px;height:54px}
.dots{display:flex;gap:5px;justify-content:center;margin-bottom:6px}.dots span{width:10px;height:10px;border-radius:50%;background:#e2e6ef}.dots .d-done{background:#3b2fc9}.dots .d-now{background:#f59e0b;transform:scale(1.25)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.chipi{display:inline-flex;gap:6px;align-items:center;border:2px solid #d6d9ea;background:#fff;border-radius:14px;padding:8px 10px;font:inherit;cursor:pointer;text-align:left}
.chipi .it-e{font-size:1.6rem}.chipi small,.bin small{display:block;font-size:.7rem;color:var(--sub);font-weight:600}.chipi .it-t{font-weight:700;font-size:.9rem;line-height:1.25}
.chipi.sel{border-color:#3b2fc9;box-shadow:0 0 0 3px #d8d4ff;transform:translateY(-2px)}
.chipi.placed{border-color:#127a3e;background:#e8f8ee;cursor:default;padding:4px 8px;pointer-events:none}.chipi.placed .it-e{font-size:1.2rem}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}
.bin{border:3px dashed #b9b3ff;background:#faf9ff;border-radius:18px;padding:10px;min-height:120px;cursor:pointer;font:inherit;text-align:center}
.bin-h{font-weight:800;font-size:1rem}.bin-in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.map table{border-collapse:separate;border-spacing:6px;margin:auto}.map td{width:84px;height:74px;border-radius:12px;background:#f1f5f9;text-align:center;vertical-align:middle}.map small{font-size:.7rem}.compass{text-align:center;font-weight:800;color:#b42318}
.finish{text-align:center;position:relative;overflow:hidden;padding:10px 0}.finish .mayilu{width:110px;height:110px}.stars{font-size:2.2rem;letter-spacing:.1em}
.confetti{position:absolute;inset:0;pointer-events:none}.confetti i{position:absolute;top:-30px;font-style:normal;font-size:22px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(420px) rotate(360deg);opacity:0}}
@media(max-width:700px){.gopts{grid-template-columns:1fr 1fr}.big{font-size:1.8rem}}
.done-card{text-align:center;padding:22px}
.score{font-size:2rem;font-weight:800;color:var(--brand)}
.nav{display:flex;justify-content:space-between;gap:10px;margin:16px 0 40px}
.note{font-size:.82rem;color:var(--sub)}
.soonbox{background:#fff;border:1px dashed #c9cde0;border-radius:16px;padding:18px;text-align:center;color:var(--sub)}
@media(max-width:700px){.classes{grid-template-columns:repeat(5,1fr);gap:6px}.cls{padding:10px 2px;font-size:.72rem}.cls b{font-size:1.2rem}.pillars{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:1.2rem}.prog{top:53px}}
@media print{.top,.nav,.prog,.btn,.noprint,.crumbs{display:none!important}.blk{break-inside:avoid;border:0}}
</style>

<div class="top"><div class="topin">
  <div class="logo" id="home">📚 கல்வி களஞ்சியம்<small>Kalvi Kalanjiyam · pdftoolsindia.com</small></div>
  <div class="sp"></div>
  <div class="lang"><button data-l="ta" class="on">தமிழ்</button><button data-l="en">EN</button></div>
</div></div>
<div class="wrap" id="app"></div>
<script src="games-math.js?v=2"></script>
<script src="games-lang.js?v=2"></script>
<script src="games-think.js?v=2"></script>
<script src="play.js?v=2"></script>
<script>
(function(){
'use strict';
const $ = (s, r) => (r||document).querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let LANG = (()=>{ try{ return localStorage.getItem('kalviLang') || 'ta'; }catch(e){ return 'ta'; } })();
const L = o => o==null ? '' : (typeof o === 'string' ? o : (o[LANG] || o.ta || o.en || ''));
// tiny markup: **bold**, blank line = new paragraph, [[formula]] on its own line
function md(s){
  return esc(L(s)).split(/\n\s*\n/).map(p=>{
    p = p.trim();
    const f = p.match(/^\[\[([\s\S]+)\]\]$/); if(f) return `<div class="formula">${f[1].replace(/\n/g,'<br>')}</div>`;
    return '<p>' + p.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>') + '</p>';
  }).join('');
}
const UI = {
  ta:{hero:'மனப்பாடம் செய்யாதே — கண்டுபிடி', heroP:'இங்கே விடைகள் முதலில் வராது. முதலில் நீ ஊகிப்பாய், விளையாடி விதியை நீயே கண்டுபிடிப்பாய், பிறகு புரிந்துகொள்வாய் — அதை வைத்து புதியது உருவாக்குவாய். முழுக்க இலவசம் — login இல்லை, கட்டணம் இல்லை.',
    p1:'🤔 ஊகி',p2:'🔍 கண்டுபிடி',p3:'💡 உருவாக்கு',p4:'🚀 எதிர்காலம்',
    d1:'📘 பாடம் புரிந்துகொள்', d1s:'வகுப்பு வாரியாக — ஊகி, கண்டுபிடி, புரிந்துகொள், உருவாக்கு', d2:'🧠 திட்ட வழிகாட்டி', d2s:'பள்ளி project? விடை அல்ல — உன்னைச் சிந்திக்க வைக்கும் கேள்விகள். நீயே செய்வாய்!', d3:'🚀 எதிர்கால சிந்தனையாளர்', d3s:'AI எப்படிக் கற்கிறது, கண்டுபிடிப்பது எப்படி, தொழில்நுட்பத்தின் பக்கவிளைவுகளைச் சரிசெய்வது எப்படி',

const U = k => UI[LANG][k];

/* ---------------- progress (this device) ---------------- */
function getProg(){ try{ return JSON.parse(localStorage.getItem('kalviProgress')||'{}'); }catch(e){ return {}; } }
function setProg(id, v){ try{ const p = getProg(); p[id] = Object.assign(p[id]||{}, v); localStorage.setItem('kalviProgress', JSON.stringify(p)); }catch(e){} }

/* ---------------- data ---------------- */
let CATALOG = null;
async function loadCatalog(){ if(CATALOG) return CATALOG; const r = await fetch('catalog.json?v=1'); CATALOG = await r.json(); return CATALOG; }
const lessonCache = {};
async function loadLesson(id){ if(lessonCache[id]) return lessonCache[id]; const r = await fetch('lessons/' + id + '.json?v=1'); if(!r.ok) throw new Error(r.status); return (lessonCache[id] = await r.json()); }

/* ---------------- router (#/9/maths/6/l-id) ---------------- */
function go(h){ location.hash = h; }
window.addEventListener('hashchange', route);
async function route(){
  const app = $('#app'); app.innerHTML = `<p class="note">${U('loading')}</p>`;
  try{ await loadCatalog(); }catch(e){ app.innerHTML = `<p class="note">${U('loadErr')}</p>`; return; }
  const [, c, s, ch, les] = (location.hash || '#').replace(/^#\/?/, '#/').split('/');
  if(c === 'project') return renderProject(s);
  if(c === 'future') return s ? renderFutureLesson(s) : renderFutureHome();
  if(les) return renderLesson(c, s, ch, les);
  if(s) return renderSubject(c, s);
  return renderHome(c || (()=>{ try{ return localStorage.getItem('kalviClass'); }catch(e){ return null; } })() || '10');
}
function subjById(c, s){ const k = CATALOG.classes[c]; return k && k.subjects.find(x=>x.id===s); }
function lessonsOf(subj){ const out=[]; (subj.chapters||[]).forEach((ch,ci)=> (ch.lessons||[]).forEach(l=> out.push({ch:ci+1, id:l.id, title:l.title}))); return out; }

function renderHome(c){
  try{ localStorage.setItem('kalviClass', c); }catch(e){}
  const prog = getProg();
  const cls = CATALOG.classes[c];
  $('#app').innerHTML = `
    <div class="hero"><h1>${U('hero')}</h1><p>${U('heroP')}</p>
      <div class="pillars"><div>${U('p1')}</div><div>${U('p2')}</div><div>${U('p3')}</div><div>${U('p4')}</div></div></div>
    <div class="doors"><div class="door d1" data-door="#learn"><b>${U('d1')}</b><span>${U('d1s')}</span></div><div class="door d2" data-door="#/project"><b>${U('d2')}</b><span>${U('d2s')}</span></div><div class="door d3" data-door="#/future"><b>${U('d3')}</b><span>${U('d3s')}</span></div></div>
    <h3 style="margin:18px 0 0" id="learnpick">${U('pick')}</h3>
    <div class="classes">${Object.keys(CATALOG.classes).map(k=>`<div class="cls ${k===c?'on':''}" data-c="${k}"><b>${k}</b>${U('cls')}</div>`).join('')}</div>
    <div class="subjects">${cls.subjects.map(sb=>{
      const ls = lessonsOf(sb), dn = ls.filter(l=>prog[l.id]&&prog[l.id].done).length, chN = (sb.chapters||[]).length;
      return `<div class="subj" style="--c:var(--c-${sb.color||'math'})" data-s="${sb.id}">
        <h3>${sb.icon||''} ${esc(L(sb.name))}</h3>
        <div class="meta">${chN?`${chN} ${U('chapters')} · `:''}${ls.length ? `${ls.length} ${U('lessons')} ${U('ready')}` : U('soon')}</div>
        ${ls.length?`<div class="bar"><i style="width:${Math.round(dn/ls.length*100)}%"></i></div>`:''}
      </div>`; }).join('')}</div>
    <p class="note" style="margin-top:18px">${LANG==='ta'?'அத்தியாயங்கள் சமச்சீர் பாடநூல் வரிசையில் உள்ளன (தேர்வுக்கு உதவ); ஒவ்வொரு பாடத்திலும் CBSE/உலகப் பாடத்திட்டங்களில் அது எங்கே வருகிறது என்றும் காட்டுகிறோம். விளக்கும் முறை முழுக்க நம்முடையது. முன்னேற்றம் இந்த போனில் மட்டும் சேமிக்கப்படும்.':'Chapters follow the Samacheer textbook order (to help with exams); each lesson also shows where the idea appears in CBSE and international syllabuses. The way we teach is entirely our own. Progress is saved on this device only.'}</p>`;
  document.querySelectorAll('.cls').forEach(n=> n.onclick = ()=> renderHome(n.dataset.c));
  document.querySelectorAll('.door').forEach(n=> n.onclick = ()=>{ const t = n.dataset.door; if(t==='#learn') $('#learnpick').scrollIntoView({behavior:'smooth'}); else go(t); });
  document.querySelectorAll('.subj').forEach(n=> n.onclick = ()=> go(`#/${c}/${n.dataset.s}`));
}

function renderSubject(c, s){
  const sb = subjById(c, s); if(!sb) return renderHome(c);
  const prog = getProg();
  const chs = sb.chapters || [];
  $('#app').innerHTML = `
    <div class="crumbs"><span data-go="#/${c}">${U('home')}</span> › ${c} ${U('cls')} › ${esc(L(sb.name))}</div>
    <h2 style="margin:0 0 12px">${sb.icon||''} ${esc(L(sb.name))} — ${c} ${U('cls')}</h2>
    ${chs.length ? chs.map((ch,i)=>{
      const ls = ch.lessons||[], dn = ls.filter(l=>prog[l.id]&&prog[l.id].done).length;
      const tag = ls.length ? (dn===ls.length ? `<span class="tag done">✓ ${U('done')}</span>` : `<span class="tag ready">${ls.length} ${U('lessons')}</span>`) : `<span class="tag soon">${U('soon')}</span>`;
      return `<div class="chap"><div class="h" data-i="${i}"><div class="no">${ch.no||i+1}</div><div class="t">${esc(L(ch.title))}${ch.part?`<div class="note">${esc(L(ch.part))}</div>`:''}</div>${tag}</div>
        <div class="lessons" style="display:${ls.length?'block':'none'}">${ls.map(l=>{
          const p = prog[l.id]; const st = p && p.stars; return `<div class="les" data-l="${l.id}" data-ch="${i+1}"><span class="ic">${l.game ? (window.KALVI_GAMES && KALVI_GAMES[l.game] ? KALVI_GAMES[l.game].icon : '🎮') : (p&&p.done?'✅':'▶️')}</span><span style="flex:1">${esc(L(l.title))}${l.game?`<div class="note">🎮 ${LANG==='ta'?'விளையாட்டு':'Game'}</div>`:''}</span>${l.game ? `<span class="tag done">${'⭐'.repeat(st||0)}${'☆'.repeat(3-(st||0))}</span>` : (p&&p.score!=null?`<span class="tag done">${p.score}%</span>`:'')}</div>`; }).join('')}</div></div>`;
    }).join('') : `<div class="soonbox">${U('soonSub')}</div>`}`;
  document.querySelectorAll('[data-go]').forEach(n=> n.onclick = ()=> go(n.dataset.go));
  document.querySelectorAll('.les').forEach(n=> n.onclick = ()=> go(`#/${c}/${s}/${n.dataset.ch}/${n.dataset.l}`));
  document.querySelectorAll('.chap .h').forEach(n=> n.onclick = ()=>{ const b = n.nextElementSibling; if(!b.children.length){ b.style.display='block'; b.innerHTML = `<p class="note">${U('soonLes')}</p>`; return; } b.style.display = b.style.display==='none'?'block':'none'; });
  window.scrollTo(0,0);
}

/* ---------------- lesson renderer ---------------- */
let CUR = {id:null, n:0};
async function renderLesson(c, s, ch, id){
  const sb = subjById(c, s); const app = $('#app');
  if(!sb){ return renderHome(c); }
  const all = lessonsOf(sb), idx = all.findIndex(x=>x.id===id), prev = all[idx-1], next = all[idx+1];
  const chap = sb.chapters[Number(ch)-1];
  const crumbs = `<span data-go="#/${c}">${U('home')}</span> › <span data-go="#/${c}/${s}">${esc(L(sb.name))} ${c}</span> › ${esc(L(chap&&chap.title))}`;
  const entry = chap && (chap.lessons||[]).find(l=>l.id===id);
  const nav0 = `${prev?`<button class="btn" data-go="#/${c}/${s}/${prev.ch}/${prev.id}">${U('prev')}</button>`:`<button class="btn" data-go="#/${c}/${s}">${U('back')}</button>`}
      ${next?`<button class="btn p" data-go="#/${c}/${s}/${next.ch}/${next.id}">${U('next')}</button>`:`<button class="btn" data-go="#/${c}/${s}">${U('back')}</button>`}`;
  if(entry && entry.game && window.KALVI_PLAY){ return window.KALVI_PLAY.render($('#app'), entry, crumbs, nav0); }
  return renderLessonCore(id, crumbs, nav0);
}
async function renderFutureLesson(id){
  const list = CATALOG.future || [], i = list.findIndex(x=>x.id===id), prev = list[i-1], next = list[i+1];
  const crumbs = `<span data-go="#/">${U('home')}</span> › <span data-go="#/future">${U('futureHome')}</span>`;
  const nav = `${prev?`<button class="btn" data-go="#/future/${prev.id}">${U('prev')}</button>`:`<button class="btn" data-go="#/future">←</button>`}${next?`<button class="btn p" data-go="#/future/${next.id}">${U('next')}</button>`:`<button class="btn" data-go="#/project">${U('d2')}</button>`}`;
  return renderLessonCore(id, crumbs, nav);
}
function renderFutureHome(){
  const prog = getProg();
  $('#app').innerHTML = `<div class="crumbs"><span data-go="#/">${U('home')}</span> › ${U('futureHome')}</div>
    <div class="hero" style="background:linear-gradient(135deg,#b3541e,#7b2cbf)"><h1>🚀 ${U('futureHome')}</h1><p>${U('futureSub')}</p></div>
    <div style="margin-top:14px">${(CATALOG.future||[]).map(m=>`<div class="chap"><div class="h" data-f="${m.id}"><div class="no" style="font-size:1.2rem">${m.icon}</div><div class="t">${esc(L(m.title))}<div class="note">${esc(L(m.desc))}</div></div>${prog[m.id]&&prog[m.id].done?`<span class="tag done">✓</span>`:''}</div></div>`).join('')}</div>`;
  document.querySelectorAll('[data-go]').forEach(n=> n.onclick = ()=> go(n.dataset.go));
  document.querySelectorAll('[data-f]').forEach(n=> n.onclick = ()=> go('#/future/' + n.dataset.f));
  window.scrollTo(0,0);
}
async function renderLessonCore(id, crumbs, nav){
  const app = $('#app');
  let les; try{ les = await loadLesson(id); }catch(e){ app.innerHTML = `<p class="note">${U('loadErr')}</p>`; return; }
  CUR = {id, n:0};
  const bcls = b => /samacheer|சமச்சீர்/i.test(b) ? 'b1' : /cbse|ncert/i.test(b) ? 'b2' : 'b3';
  app.innerHTML = `
    <div class="crumbs">${crumbs}</div>
    <div class="lhead"><h1>${esc(L(les.title))}</h1>
      ${les.goals?`<div class="goal"><b>${U('goal')}</b><ul style="margin:4px 0 0;padding-left:20px">${les.goals.map(g=>`<li>${esc(L(g))}</li>`).join('')}</ul></div>`:''}
      ${les.curriculum?`<div class="note" style="margin-top:8px">${U('curric')}</div><div class="chips">${les.curriculum.map(c=>`<span class="chip ${bcls(c.b)}"><b>${esc(c.b)}</b> · ${esc(L(c.w))}</span>`).join('')}</div>`:''}
      ${les.minutes?`<div class="note" style="margin-top:6px">⏱️ ~${les.minutes} ${U('mins')}</div>`:''}</div>
    <div class="prog"><i id="progbar"></i></div>
    <div id="blocks"></div>
    <div id="quiz"></div>
    <div class="nav">${nav}</div>`;
  const B = $('#blocks');
  les.blocks.forEach(b=>{ CUR.n++; B.appendChild(renderBlock(b)); });
  if(les.quiz && les.quiz.length) renderQuiz($('#quiz'), les, id);
  document.querySelectorAll('[data-go]').forEach(n=> n.onclick = ()=> go(n.dataset.go));
  const pb = $('#progbar');
  window.onscroll = ()=>{ const h = document.documentElement; pb.style.width = Math.min(100, (h.scrollTop/(h.scrollHeight-h.clientHeight||1))*100) + '%'; };
  window.scrollTo(0,0);
  setProg(id, {opened: Date.now()});
}

function numOk(val, b){

  tools.innerHTML = `${b.hint?`<button class="btn sm h">${U('hint')}</button>`:''}${b.solution?`<button class="btn sm s">${U('showSol')}</button>`:''}`;
  const out = document.createElement('div');

  if(b.solution) tools.querySelector('.s').onclick = ()=>{ out.innerHTML = `<div class="fb hint">${md(b.solution)}</div>`; };

const DEG = Math.PI/180;

function readout(host){ const d = document.createElement('div'); d.className = 'readout'; host.appendChild(d); return items => { d.innerHTML = items.map(([k,v])=>`<div>${k}<b>${v}</b></div>`).join(''); }; }

function svg(host, w, h){ const s = document.createElementNS(svgNS,'svg'); s.setAttribute('viewBox', `0 0 ${w} ${h}`); host.appendChild(s); return s; }
const T = (ta, en) => LANG==='ta' ? ta : en;

const WIDGETS = {
  /* Eratosthenes: shadow angle at Alexandria → Earth's circumference */

        <line x1="${x1}" y1="${y1}" x2="${t1x}" y2="${t1y}" stroke="#14213d" stroke-width="4"/><text x="${t1x + 6}" y="${t1y + 4}" font-size="11">${T('சயீன் — நிழல் இல்லை','Syene — no shadow')}</text>

        <text x="${cx}" y="${cy - 40}" font-size="12" text-anchor="middle">🌍 ${T('பூமி (படம் அளவில் அல்ல)','Earth (not to scale)')}</text>`;

  /* Build a program for the robot and run it */
  robotProgram(host, p){

            `The AI learnt from ${data.length} examples. Yellow area = where it thinks "ripe"; green area = "not ripe". For a new mango it looks at the 3 nearest examples and takes a vote.`)
          + (soft ? '' : T(' <b>கவனி:</b> பச்சையாக இருந்தும் மென்மையான (பழுத்த) மாம்பழம் ஒன்றுகூட இதற்குக் காட்டப்படவில்லை!', ' <b>Notice:</b> it has never been shown a mango that is green but soft (ripe)!'));

  motion(host){
    const plans = {
      uniform:{ta:'சீரான வேகம் (60 km/h)',en:'Uniform speed (60 km/h)', v:t=>60},
      accel:{ta:'பேருந்து நிலையத்திலிருந்து புறப்படுதல் (சீரான முடுக்கம்)',en:'Leaving the bus stand (uniform acceleration)', v:t=>Math.min(80, 160*t)},

    };
    let key = 'uniform';
    const bar = document.createElement('div'); bar.className='row'; host.appendChild(bar);
    const S = svg(host, 360, 330); const ro = readout(host);
    function draw(){
      bar.innerHTML = Object.entries(plans).map(([k,p])=>`<button class="btn sm ${k===key?'p':''}" data-k="${k}">${esc(p[LANG])}</button>`).join('');
      bar.querySelectorAll('button').forEach(b=> b.onclick = ()=>{ key=b.dataset.k; draw(); });
      const P = plans[key], N = 100, dt = 1/N; let x=0; const xs=[0], vs=[P.v(0)];
      for(let i=1;i<=N;i++){ const v = P.v(i*dt); x += (v + vs[i-1])/2*dt; xs.push(x); vs.push(v); }

  }
  const [pid, sub] = (arg||'').split(':');
  if(pid && P[pid]) return sub === 'report' ? renderReport(pid) : renderCoachStep(pid);
  // list
  const ids = Object.keys(P).sort((a,b)=>P[b].created-P[a].created);
  app.innerHTML = `<div class="crumbs"><span data-go="#/">${U('home')}</span> › ${CU('title')}</div>
    <div class="hero" style="background:linear-gradient(135deg,#0b7a75,#3b2fc9)"><h1>${CU('title')}</h1><p>${CU('sub')}</p></div>
    <div class="row" style="margin:14px 0"><button class="btn p" id="np">${CU('newP')}</button></div>
    <div class="blk"><h2>${CU('mine')}</h2>${ids.length ? ids.map(id=>{ const p=P[id]; return `<div class="les"><span class="ic">${STEPS[p.step||0].icon}</span><span style="flex:1" data-o="${id}">${esc(p.data.topic||'…')}<div class="note">${STEPS.map((s,i)=>i<= (p.step||0)?'●':'○').join(' ')}</div></span><button class="btn sm" data-o="${id}">${CU('open')}</button><button class="btn sm" data-x="${id}">✕</button></div>`; }).join('') : `<p class="note">${CU('none')}</p>`}</div>
    ${grownBlocks()}`;
  $('#np').onclick = ()=> go('#/project/new');
  app.querySelectorAll('[data-o]').forEach(n=> n.onclick = ()=> go('#/project/' + n.dataset.o));
  app.querySelectorAll('[data-x]').forEach(n=> n.onclick = ()=>{ if(!confirm(CU('del') + '?')) return; delete P[n.dataset.x]; saveProjects(P); renderProject(); });
  app.querySelectorAll('[data-go]').forEach(n=> n.onclick = ()=> go(n.dataset.go));
  window.scrollTo(0,0);
}
function grownBlocks(){
  return `<div class="blk activity"><details><summary><b>${CU('grown')}</b></summary>${md({ta:COACH_UI.ta.grownTxt,en:COACH_UI.en.grownTxt})}</details></div>
    <div class="blk key"><details><summary><b>${CU('ai')}</b></summary>${md({ta:COACH_UI.ta.aiTxt,en:COACH_UI.en.aiTxt})}</details></div>`;
}
function renderCoachStep(pid){
  const P = loadProjects(), p = P[pid], k = p.step||0, S = STEPS[k], d = p.data;
  const save = ()=>{ const all = loadProjects(); all[pid] = p; saveProjects(all); };
  const app = $('#app');
  app.innerHTML = `<div class="crumbs"><span data-go="#/project">${CU('title')}</span> › ${esc(d.topic||'…')}</div>
    <div class="row" style="gap:4px;margin-bottom:10px;flex-wrap:nowrap;overflow-x:auto">${STEPS.map((s,i)=>`<button class="btn sm ${i===k?'p':''}" data-s="${i}" title="${esc(T2(s.t))}">${s.icon}</button>`).join('')}</div>
    <div class="blk"><h2>${S.icon} ${k+1}. ${esc(T2(S.t))}</h2><p class="note">${esc(T2(S.why))}</p><div id="fields"></div>
      <div class="row" style="margin-top:12px"><button class="btn sm" id="stuck">${CU('stuck')}</button></div><div id="hint"></div></div>
    ${k===0?`<div class="blk"><h2>${CU('bank')}</h2><div id="bank"></div></div>`:''}
    <div class="nav">${k>0?`<button class="btn" id="pv">${CU('prevS')}</button>`:'<span></span>'}${k<STEPS.length-1?`<button class="btn p" id="nx">${CU('nextS')}</button>`:`<button class="btn p" id="rp">${CU('report')}</button>`}</div>
    ${k===0?grownBlocks():''}`;
  const F = $('#fields');
  S.fields.forEach(f=>{
    const w = document.createElement('div'); w.style.marginTop = '10px';
    const lab = `<label style="display:block;font-weight:700;font-size:.86rem">${esc(T2(f.l))}</label>`;
    if(f.type==='text' || f.type==='date'){
      w.innerHTML = lab + `<input class="ans" style="width:100%" type="${f.type==='date'?'date':'text'}" value="${esc(d[f.k]||'')}">` + (f.templates?`<div class="chips">${f.templates.map((t,i)=>`<button class="chip" data-t="${i}" style="border:0;cursor:pointer">${esc(T2(t))}</button>`).join('')}</div>`:'');
      const inp = w.querySelector('input'); inp.oninput = ()=>{ d[f.k] = inp.value; save(); };
      w.querySelectorAll('[data-t]').forEach(b=> b.onclick = ()=>{ inp.value = T2(f.templates[b.dataset.t]); d[f.k] = inp.value; save(); inp.focus(); });
    } else if(f.type==='area'){
      w.innerHTML = lab + `<textarea class="journal">${esc(d[f.k]||'')}</textarea>`;
      const ta = w.querySelector('textarea'); ta.oninput = ()=>{ d[f.k] = ta.value; save(); };
    } else if(f.type==='kind'){
      w.innerHTML = lab + `<div class="chips">${Object.entries(KINDS).map(([kk,v])=>`<button class="chip" data-k="${kk}" style="border:0;cursor:pointer;${d.kind===kk?'background:#3b2fc9;color:#fff':''}">${esc(T2(v))}</button>`).join('')}</div>`;
      w.querySelectorAll('[data-k]').forEach(b=> b.onclick = ()=>{ d.kind = b.dataset.k; save(); renderCoachStep(pid); });
    } else if(f.type==='check'){
      const on = d[f.k] || [];
      w.innerHTML = lab + f.items.map((it,i)=>`<label style="display:flex;gap:8px;align-items:flex-start;font-size:.88rem;margin:6px 0"><input type="checkbox" data-i="${i}" ${on.includes(i)?'checked':''} style="width:auto;margin-top:5px"> <span>${esc(T2(it))}</span></label>`).join('');
      w.querySelectorAll('input').forEach(c=> c.onchange = ()=>{ d[f.k] = [...w.querySelectorAll('input:checked')].map(x=>Number(x.dataset.i)); save(); });
    } else if(f.type==='ideas'){
      d.ideas = d.ideas || [];
      const paintIdeas = ()=>{
        const tot = it => ['s','c','t','w'].reduce((a,x)=>a+(Number(it[x])||0),0);
        const best = d.ideas.length ? Math.max(...d.ideas.map(tot)) : 0;
        w.innerHTML = lab + `<div class="row"><button class="btn sm" id="spin">${CU('spin')}</button><span class="note" id="spinOut"></span></div>` +
          `<div style="overflow-x:auto"><table class="tbl" style="margin-top:8px"><tr><th>#</th><th style="min-width:160px">💡</th><th>${CU('sSafe')}</th><th>${CU('sCheap')}</th><th>${CU('sTime')}</th><th>${CU('sWow')}</th><th>Σ</th></tr>` +
          d.ideas.map((it,i)=>`<tr><th>${i+1}</th><td><input class="ans" style="width:100%" data-i="${i}" data-f="t" value="${esc(it.t||'')}"></td>${['s','c','t','w'].map(x=>`<td><select data-i="${i}" data-f="${x}">${['','1','2','3'].map(v=>`<option ${String(it[x]||'')===v?'selected':''}>${v}</option>`).join('')}</select></td>`).join('')}<td>${tot(it)||''}${best && tot(it)===best?' ⭐':''}</td></tr>`).join('') + `</table></div><button class="btn sm" id="addI" style="margin-top:6px">${CU('addIdea')}</button>`;
        w.querySelectorAll('[data-f]').forEach(n=> n.onchange = n.oninput = ()=>{ d.ideas[n.dataset.i][n.dataset.f] = n.value; save(); if(n.tagName==='SELECT') paintIdeas(); });
        w.querySelector('#addI').onclick = ()=>{ d.ideas.push({t:''}); save(); paintIdeas(); };
        w.querySelector('#spin').onclick = ()=>{ const s = SCAMPER[Math.floor(Math.random()*SCAMPER.length)]; w.querySelector('#spinOut').textContent = T2(s); };
      };
      if(d.ideas.length < 5) while(d.ideas.length < 5) d.ideas.push({t:''});
      paintIdeas();
    } else if(f.type==='table'){
      d[f.k] = d[f.k] || [['1','',''],['2','',''],['3','','']];
      const paintT = ()=>{
        w.innerHTML = lab + `<div style="overflow-x:auto"><table class="tbl"><tr>${f.cols.map(c=>`<th>${esc(T2(c))}</th>`).join('')}</tr>${d[f.k].map((r,i)=>`<tr>${r.map((c,j)=>`<td><input class="ans" style="width:100%" data-r="${i}" data-c="${j}" value="${esc(c)}"></td>`).join('')}</tr>`).join('')}</table></div><button class="btn sm" id="addR" style="margin-top:6px">${CU('addRow')}</button>`;
        w.querySelectorAll('[data-r]').forEach(n=> n.oninput = ()=>{ d[f.k][n.dataset.r][n.dataset.c] = n.value; save(); });
        w.querySelector('#addR').onclick = ()=>{ d[f.k].push([String(d[f.k].length+1),'','']); save(); paintT(); };
      };
      paintT();
    }
    F.appendChild(w);
  });
  let hi = 0;
  $('#stuck').onclick = ()=>{ const h = S.hints[hi % S.hints.length]; hi++; $('#hint').innerHTML = `<div class="fb hint">${esc(T2(h))}</div>`; };
  if(k===0){
    const bands = {'1-3':'1–3','4-6':'4–6','7-10':'7–10'};
    $('#bank').innerHTML = Object.entries(bands).map(([b,lb])=>`<div class="note" style="margin-top:8px"><b>${CU('cls')} ${lb}</b></div>` + IDEA_BANK.filter(x=>x.band===b).map((x,i)=>`<div class="les"><span class="ic">💡</span><span style="flex:1">${esc(T2(x))} <span class="chip">${esc(T2(KINDS[x.kind]))}</span></span><button class="btn sm" data-b="${IDEA_BANK.indexOf(x)}">${CU('use')}</button></div>`).join('')).join('');
    $('#bank').querySelectorAll('[data-b]').forEach(n=> n.onclick = ()=>{ const x = IDEA_BANK[n.dataset.b]; d.topic = T2(x); d.kind = x.kind; save(); renderCoachStep(pid); });
  }
  app.querySelectorAll('[data-s]').forEach(n=> n.onclick = ()=>{ p.step = Number(n.dataset.s); save(); renderCoachStep(pid); });
  if($('#pv')) $('#pv').onclick = ()=>{ p.step = k-1; save(); renderCoachStep(pid); };
  if($('#nx')) $('#nx').onclick = ()=>{ p.step = k+1; save(); renderCoachStep(pid); };
  if($('#rp')) $('#rp').onclick = ()=> go('#/project/' + pid + ':report');
  app.querySelectorAll('[data-go]').forEach(n=> n.onclick = ()=> go(n.dataset.go));
  window.scrollTo(0,0);
}
function renderReport(pid){
  const p = loadProjects()[pid], d = p.data;
  const para = v => v ? `<p>${esc(v).replace(/\n/g,'<br>')}</p>` : '<p class="note">—</p>';
  const tot = it => ['s','c','t','w'].reduce((a,x)=>a+(Number(it[x])||0),0);
  const ideas = (d.ideas||[]).filter(x=>x.t);
  const chosen = ideas.length ? ideas.reduce((a,b)=> tot(b)>tot(a)?b:a) : null;
  const H = (ta,en) => `<h3>${LANG==='ta'?ta:en}</h3>`;
  $('#app').innerHTML = `<div class="row noprint" style="margin-bottom:10px"><button class="btn" id="bk">${CU('back')}</button><button class="btn p" id="pr">${CU('print')}</button></div>
    <div class="blk" style="font-size:.95rem">
      <h1 style="margin:0 0 4px;font-size:1.3rem">${esc(d.topic||'')}</h1>
      <div class="note">${d.kind?esc(T2(KINDS[d.kind]))+' · ':''}${CU('date')}: ${new Date().toLocaleDateString('en-IN')}</div>
      ${H('❓ என் கேள்வி','❓ My question')}${para(d.question)}
      ${H('📚 எனக்கு முன்பே தெரிந்தது','📚 What I already knew')}${para(d.known)}
      ${H('🔎 நான் கேட்ட கேள்விகள் & தேடிய இடங்கள்','🔎 Questions I asked & where I looked')}${para(d.wonder)}${para(d.sources)}
      ${H('💡 நான் யோசித்த வழிகள்','💡 Ideas I considered')}${ideas.length?`<ol>${ideas.map(x=>`<li>${esc(x.t)}${x===chosen?' ⭐':''}</li>`).join('')}</ol>`:para('')}
      ${H('📝 பொருட்கள் & செய்முறை','📝 Materials & method')}${para(d.materials)}${para(d.method)}${d.fair?para(d.fair):''}
      ${H('🔬 முடிவுகள்','🔬 Results')}${(d.obs||[]).some(r=>r[1]||r[2])?`<table class="tbl">${(d.obs||[]).filter(r=>r[1]||r[2]).map(r=>`<tr>${r.map(c=>`<td style="color:#222;font-weight:400">${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`:''}${para(d.surprise)}
      ${H('🔁 தவறுகளும் மேம்பாடும்','🔁 What went wrong & how I improved')}${para(d.wrong)}${para(d.v2)}
      ${H('✅ முடிவு','✅ Conclusion')}${para(d.answer)}${para(d.learnt)}
      ${H('🚀 அடுத்த கேள்வி','🚀 My next question')}${para(d.next)}
      <div style="margin-top:28px;border-top:1px dashed #bbb;padding-top:10px">${CU('decl')}${d.helpers?`<br><span class="note">${LANG==='ta'?'உதவியவர்கள்':'Helped by'}: ${esc(d.helpers)}</span>`:''}<div style="margin-top:34px">____________________<br><span class="note">${CU('sig')}</span></div></div>
    </div>
    <div class="blk key noprint"><h2>${CU('talk')}</h2><ol><li><b>${CU('talk1')}</b> ${esc(d.question||'')}</li><li><b>${CU('talk2')}</b> ${esc((d.method||'').split('\n')[0])}</li><li><b>${CU('talk3')}</b> ${esc((d.answer||'').split('\n')[0])}</li><li><b>${CU('talk4')}</b> ${esc(d.next||'')}</li></ol></div>`;
  $('#bk').onclick = ()=> go('#/project/' + pid);
  $('#pr').onclick = ()=> window.print();
  window.scrollTo(0,0);
}

/* ---------------- language ---------------- */
function paintLang(){ document.querySelectorAll('.lang button').forEach(b=> b.classList.toggle('on', b.dataset.l===LANG)); document.documentElement.lang = LANG; }
document.querySelectorAll('.lang button').forEach(b=> b.onclick = ()=>{ LANG = b.dataset.l; try{ localStorage.setItem('kalviLang', LANG); }catch(e){} paintLang(); route(); });
$('#home').onclick = ()=> go('#/');
if(window.KALVI_PLAY) KALVI_PLAY.init({lang:()=>LANG, esc, go, getProg, setProg});
paintLang(); route();
})();
</script>
</body>
</html>
