மாற்றங்களையும் செய்து, <b>கடைசியாகவே</b> கையொப்பமிடுங்கள்.</li><li>அளவு அதிகம் என்றால்: கையொப்பமிடும் <b>முன்பே</b> சுருக்குங்கள் (<a href="#" data-go="compress">PDF Compress</a>).</li><li>மின்னஞ்சல்/WhatsApp வழியாக வந்த கோப்பு சில சமயம் மாறியிருக்கும்; அசல் கோப்பை மீண்டும் பதிவிறக்குங்கள்.</li><li>🔏 <a href="#" data-go="dscverify">DSC Verifier</a>-ல் இட்டால் “உள்ளடக்கம் மாறியதா” அல்லது “கையொப்பம் தவறா” என்று சரியாகத் தெரியும்.</li></ul>',!0)+n("2️⃣ Token கணினியில் தெரியவில்லை / PIN கேட்கவில்லை",'<ul style="padding-left:18px;margin:0;"><li>Token-ன் <b>driver</b> (ePass2003, WatchData, Proxkey, Hypersecu போன்றவை) உங்கள் CA-வின் இணையதளத்திலிருந்து நிறுவுங்கள்; நிறுவிய பிறகு கணினியை மறுதொடக்கம் செய்யுங்கள்.</li><li>வேறு USB port-ல் செருகிப் பாருங்கள்; USB hub தவிர்த்து நேரடியாக இணைக்கவும்.</li><li>Token Manager மென்பொருளில் சான்றிதழ் தெரிகிறதா என்று பாருங்கள். தெரியாவிட்டால் driver அல்லது token பிரச்சினை.</li><li>PIN-ஐ பல முறை தவறாக இட்டால் token <b>பூட்டிவிடும்</b>; திறக்க CA-யைத் தொடர்பு கொள்ளவும். அதிகமாக முயற்சிக்காதீர்கள்.</li><li>Windows தான் பெரும்பாலான token-களுக்கு நிலையான ஆதரவு தருகிறது; Mac/Linux-ல் CA-வின் ஆதரவு உள்ளதா எனப் பாருங்கள்.</li></ul>')+n("3️⃣ emSigner / signer நிரல் இணைக்கவில்லை (Java பிரச்சினை)",'<ul style="padding-left:18px;margin:0;"><li>பழைய “Java applet” முறை இப்போது உலாவிகளில் இல்லை. அரசு தளங்கள் இப்போது கணினியில் ஓடும் சிறிய utility (எ.கா. emSigner) வழியாக token-ஐ அணுகுகின்றன. அந்தந்த தளம் (எ.கா. வருமான வரி e-filing) சொல்லும் <b>தற்போதைய</b> பதிப்பை அங்கிருந்தே பதிவிறக்குங்கள்.</li><li>Utility ஓடுகிறதா (system tray / Task Manager) என்று பார்க்கவும்; “Run as administrator” முயற்சிக்கவும்.</li><li>Antivirus / firewall அதன் localhost இணைப்பைத் தடுக்கலாம்; தற்காலிகமாக அனுமதி கொடுங்கள்.</li><li>உலாவியை Chrome / Edge புதிய பதிப்பில் பயன்படுத்துங்கள்; pop-up தடையை அனுமதியுங்கள்; பழைய tab-களை மூடி மீண்டும் தொடங்குங்கள்.</li><li>கணினியின் <b>தேதி-நேரம்</b> தவறாக இருந்தால் சான்றிதழ் “செல்லாது” எனத் தோன்றும்; தானியங்கி நேரத்தை இயக்குங்கள்.</li></ul>'
