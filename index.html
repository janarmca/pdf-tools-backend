TOOL_IMPL.imgwatermark = {
  mount(container){
    let files = [];
    const body = el(`<div></div>`); container.appendChild(body);
    function paint(){
      body.innerHTML = '';
      mountUploader(body, { accept:'image/*', multiple:true, label:'படங்களை drag & drop or tap', sublabel:'',
        onAdd:(fl)=>{ files = files.concat(fl); paint(); } });
      if(files.length){
        mountFileList(body, files, (idx)=>{ files.splice(idx,1); paint(); });
        const opts = el(`
          <div class="opts tamil">
            <div class="field" style="grid-column:1/-1;"><label>Watermark உரை</label><input type="text" id="iwText" value="© என் பெயர்"></div>
            <div class="field"><label>Position</label>
              <select id="iwPos"><option value="br">Bottom-right</option><option value="bl">Bottom-left</option><option value="tr">Top-right</option><option value="tl">Top-left</option><option value="center">Center</option><option value="tile">முழுக்க (Tile)</option></select>
            </div>
            <div class="field"><label>வெளிப்படைத்தன்மை %</label><input type="number" id="iwOpac" value="55" min="10" max="100"></div>
            <div class="field"><label>Font Size</label><input type="number" id="iwSize" value="28" min="10" max="120"></div>
          </div>
        `);
        body.appendChild(opts);
        const row = el(`<div class="btn-row"></div>`);
        const btn = el(`<button class="btn tamil">💧 Watermark சேர்</button>`);
        btn.onclick = doWm;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    async function doWm(){
      const text = body.querySelector('#iwText').value || '';
      const pos = body.querySelector('#iwPos').value;
      const opac = Math.min(1, Math.max(0.1, Number(body.querySelector('#iwOpac').value)/100||0.55));
      const size = Number(body.querySelector('#iwSize').value)||28;
      if(!text.trim()){ mountResult(body,'Watermark உரையை உள்ளிடவும்.').style.background='#FDEDEC'; return; }
      const prog = mountProgress(body);
      try{
        const results = [];
        for(let i=0;i<files.length;i++){
          prog.set((i/files.length)*90, `${files[i].name} — சேர்க்கிறது…`);
          const f = files[i];
          const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });
          const img = new Image(); await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=dataUrl; });
          const canvas = document.createElement('canvas'); canvas.width=img.naturalWidth; canvas.height=img.naturalHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img,0,0);
          ctx.font = `bold ${size}px sans-serif`;
          ctx.fillStyle = `rgba(255,255,255,${opac})`;
          ctx.strokeStyle = `rgba(0,0,0,${opac*0.6})`;
          ctx.lineWidth = Math.max(1, size/16);
          const tw = ctx.measureText(text).width;
          const pad = size*0.8;
          function draw(x,y){ ctx.strokeText(text,x,y); ctx.fillText(text,x,y); }
          if(pos==='tile'){
            ctx.save(); ctx.globalAlpha = opac;
            for(let y=size; y<canvas.height+tw; y+=size*3){
              for(let x=-tw; x<canvas.width+tw; x+=tw+pad*2){
                ctx.save(); ctx.translate(x+tw/2,y); ctx.rotate(-0.4); ctx.fillText(text,-tw/2,0); ctx.restore();
              }
            }
            ctx.restore();
          } else {
            let x,y;
            if(pos==='br'){ x=canvas.width-tw-pad; y=canvas.height-pad; }
            else if(pos==='bl'){ x=pad; y=canvas.height-pad; }
            else if(pos==='tr'){ x=canvas.width-tw-pad; y=pad+size; }
            else if(pos==='tl'){ x=pad; y=pad+size; }
            else { x=(canvas.width-tw)/2; y=canvas.height/2; }
            draw(x,y);
          }
          const blob = await new Promise(res=> canvas.toBlob(res,'image/jpeg',0.95));
          results.push({name: f.name.replace(/\.[^.]+$/,'')+'-wm.jpg', blob});
        }
        prog.set(95,'Preparing…');
        if(results.length===1) downloadBlob(results[0].blob, results[0].name);
        else{
          const zip = new JSZip();
          results.forEach(r=> zip.file(r.name, r.blob));
          downloadBlob(await zip.generateAsync({type:'blob'}), 'watermarked-images.zip');
        }
        prog.set(100,'Done'); prog.remove();
        mountResult(body, `${results.length} படங்களில் Watermark சேர்க்கப்பட்டது.`);
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

      const sizeKey = body.querySelector('#ipSize').value;
      const bg = body.querySelector('#ipBg').value;
      const makeSheet = body.querySelector('#ipSheet').checked;
      const prog = mountProgress(body);

      try{
        prog.set(10,'Crop செய்கிறது…');

        const sx = Math.round(rect.fx0*natW), sy = Math.round(rect.fy0*natH);
        const sw = Math.max(1,Math.round((rect.fx1-rect.fx0)*natW)), sh = Math.max(1,Math.round((rect.fy1-rect.fy0)*natH));
        const mmPerPx = 0.264583; // for reference only; we just keep a fixed print-quality pixel size
        const outW = sizeKey==='2x2in' ? 600 : 413; // ~300dpi equivalents
        const outH = sizeKey==='2x2in' ? 600 : 531;
        const cropCanvas = document.createElement('canvas'); cropCanvas.width=outW; cropCanvas.height=outH;
        const cctx = cropCanvas.getContext('2d');
        cctx.imageSmoothingEnabled=true; cctx.imageSmoothingQuality='high';
        cctx.drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);

        if(bg !== 'none'){
          prog.set(35,'பின்னணியை Converting…');
          const cv = await ensureOpenCv();
          srcMat = cv.imread(cropCanvas);
          rgbMat = new cv.Mat(); cv.cvtColor(srcMat, rgbMat, cv.COLOR_RGBA2RGB);
          mask = new cv.Mat.zeros(outH, outW, cv.CV_8UC1);
          bgdModel = new cv.Mat(); fgdModel = new cv.Mat();
          const pad = Math.round(Math.min(outW,outH)*0.06);
          const cvRect = new cv.Rect(pad, pad, outW-pad*2, outH-pad*2);
          cv.grabCut(rgbMat, mask, cvRect, bgdModel, fgdModel, 5, cv.GC_INIT_WITH_RECT);
          const colorMap = {white:[255,255,255], lightblue:[173,216,230], red:[200,40,40]};
          const [br,bgc,bb] = colorMap[bg]||colorMap.white;
          const outData = cctx.getImageData(0,0,outW,outH);
          for(let p=0,q=0; q<mask.rows*mask.cols; p+=4,q++){
            const v = mask.data[q];
            const isFg = (v===1||v===3);
            if(!isFg){ outData.data[p]=br; outData.data[p+1]=bgc; outData.data[p+2]=bb; outData.data[p+3]=255; }
          }
          cctx.putImageData(outData,0,0);
        }
        prog.set(70,'Preparing…');
        if(makeSheet){
          const sheet = document.createElement('canvas');
          sheet.width = 1800; sheet.height = 1200; // 6x4in @300dpi
          const sctx = sheet.getContext('2d');
          sctx.fillStyle = '#fff'; sctx.fillRect(0,0,sheet.width,sheet.height);
          const cols = Math.floor(sheet.width/(outW+20)), rows = Math.floor(sheet.height/(outH+20));
          for(let r=0;r<rows;r++){
            for(let c=0;c<cols;c++){
              sctx.drawImage(cropCanvas, 10+c*(outW+20), 10+r*(outH+20), outW, outH);
            }
          }
          const blob = await new Promise(res=> sheet.toBlob(res,'image/jpeg',0.95));
          downloadBlob(blob, file.name.replace(/\.[^.]+$/,'')+'-passport-sheet.jpg');
        } else {
          const blob = await new Promise(res=> cropCanvas.toBlob(res,'image/jpeg',0.95));
          downloadBlob(blob, file.name.replace(/\.[^.]+$/,'')+'-passport.jpg');
        }
        prog.set(100,'Done'); prog.remove();
        mountResult(body, 'Passport/ID புகைப்படம் தயார் செய்யப்பட்டு downloaded.');
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
      finally{ [srcMat,rgbMat,mask,bgdModel,fgdModel].forEach(m=>{ try{ m && m.delete(); }catch(e){} }); }
    }
    paint();
  }
};

        btn.onclick = doSketch;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    async function doSketch(){
      const prog = mountProgress(body);
      let src,gray,inv,blur,sketch,edges,color,cartoon;
      try{
        prog.set(15,'Loading AI engine…');
        const cv = await ensureOpenCv();
        prog.set(35,'Converting…');
        const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
        const img = new Image(); await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=dataUrl; });
        const canvas = document.createElement('canvas');
        const maxDim = 1600;
        const scale = Math.min(1, maxDim/Math.max(img.naturalWidth,img.naturalHeight));
        canvas.width = Math.round(img.naturalWidth*scale); canvas.height = Math.round(img.naturalHeight*scale);
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        src = cv.imread(canvas);
        const outCanvas = document.createElement('canvas'); outCanvas.width=canvas.width; outCanvas.height=canvas.height;
        if(style==='pencil'){
          gray = new cv.Mat(); cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
          inv = new cv.Mat(); cv.bitwise_not(gray, inv);
          blur = new cv.Mat(); cv.GaussianBlur(inv, blur, new cv.Size(21,21), 0);
          const invBlur = new cv.Mat(); cv.bitwise_not(blur, invBlur);
          sketch = new cv.Mat(); cv.divide(gray, invBlur, sketch, 256);
          cv.imshow(outCanvas, sketch);
          invBlur.delete();
        } else {
          gray = new cv.Mat(); cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
          blur = new cv.Mat(); cv.medianBlur(gray, blur, 7);
          edges = new cv.Mat(); cv.adaptiveThreshold(blur, edges, 255, cv.ADAPTIVE_THRESH_MEAN_C, cv.THRESH_BINARY, 9, 9);
          color = new cv.Mat(); cv.bilateralFilter(src, color, 9, 250, 250);
          cartoon = new cv.Mat();
          const edgesRgba = new cv.Mat(); cv.cvtColor(edges, edgesRgba, cv.COLOR_GRAY2RGBA);
          cv.bitwise_and(color, edgesRgba, cartoon);
          cv.imshow(outCanvas, cartoon);
          edgesRgba.delete();
        }
        prog.set(85,'Preparing…');
        const blob = await new Promise(res=> outCanvas.toBlob(res,'image/jpeg',0.95));
        downloadBlob(blob, file.name.replace(/\.[^.]+$/,'')+'-'+style+'.jpg');
        prog.set(100,'Done'); prog.remove();
        mountResult(body, 'மாற்றப்பட்ட படம் downloaded.');
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
      finally{ [src,gray,inv,blur,sketch,edges,color,cartoon].forEach(m=>{ try{ m && m.delete(); }catch(e){} }); }
    }
    paint();
  }
};

          }
          paint();
        }});

      ta.addEventListener('input',(e)=> text = e.target.value);

          <div class="field" style="grid-column:1/-1;"><label>குரல் (Voice)</label>
            <select id="raVoice">
              ${tamilVoices.map((v,i)=>`<option value="ta-${i}">🇮🇳 ${v.name} (${v.lang})</option>`).join('')}
              ${otherVoices.map((v,i)=>`<option value="o-${i}">${v.name} (${v.lang})</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>வேகம்</label><input type="range" id="raRate" min="0.5" max="1.8" step="0.1" value="1"></div>
        </div>
      `);
      body.appendChild(opts);
      const row = el(`<div class="btn-row tamil"></div>`);
      const bPlay = el(`<button class="btn">▶️ படி</button>`);
      const bPause = el(`<button class="btn secondary">⏸️ Pause</button>`);
      const bStop = el(`<button class="btn secondary">⏹️ நிறுத்து</button>`);
      bPlay.onclick = doPlay; bPause.onclick = ()=> speechSynthesis.pause(); bStop.onclick = ()=> speechSynthesis.cancel();
      row.appendChild(bPlay); row.appendChild(bPause); row.appendChild(bStop);
      body.appendChild(row);
    }
    function doPlay(){
      const t = body.querySelector('#raText').value || text;
      if(!t.trim()){ mountResult(body,'Please enter text first.').style.background='#FDEDEC'; return; }
      speechSynthesis.cancel();
      const rate = Number(body.querySelector('#raRate').value)||1;
      const voiceSel = body.querySelector('#raVoice').value;
      utterance = new SpeechSynthesisUtterance(t);
      const tamilVoices = voices.filter(v=>/ta|tamil/i.test(v.lang+v.name));
      const otherVoices = voices.filter(v=>!/ta|tamil/i.test(v.lang+v.name));
      if(voiceSel && voiceSel.startsWith('ta-')) utterance.voice = tamilVoices[Number(voiceSel.split('-')[1])];
      else if(voiceSel && voiceSel.startsWith('o-')) utterance.voice = otherVoices[Number(voiceSel.split('-')[1])];
      utterance.rate = rate;
      speechSynthesis.speak(utterance);
    }
    paint();
  }
};

              <select id="pwPos"><option value="br">Bottom-right</option><option value="bl">Bottom-left</option><option value="tr">Top-right</option><option value="tl">Top-left</option><option value="center">Center</option></select>
            </div>
            <div class="field"><label>அகலம் (% பக்கம்)</label><input type="number" id="pwSize" value="20" min="5" max="80"></div>
            <div class="field"><label>வெளிப்படைத்தன்மை %</label><input type="number" id="pwOpac" value="70" min="10" max="100"></div>
          </div>
        `);
        body.appendChild(opts);
        const row = el(`<div class="btn-row"></div>`);

        btn.onclick = doApply;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    async function doApply(){
      const pos = body.querySelector('#pwPos').value;
      const sizePct = Number(body.querySelector('#pwSize').value)/100||0.2;
      const opac = Number(body.querySelector('#pwOpac').value)/100||0.7;
      const prog = mountProgress(body);
      try{
        prog.set(10,'Reading…');
        const doc = await PDFDocument.load(pdfFile._buf, {ignoreEncryption:true});
        const isPng = logoDataUrl.startsWith('data:image/png');
        const imgBytes = await (await fetch(logoDataUrl)).arrayBuffer();
        const embeddedImg = isPng ? await doc.embedPng(imgBytes) : await doc.embedJpg(imgBytes);
        const dims = embeddedImg.scale(1);
        const pages = doc.getPages();
        pages.forEach((page,idx)=>{
          prog.set(10 + (idx/pages.length)*80, `பக்கம் ${idx+1}/${pages.length}…`);
          const {width,height} = page.getSize();
          const w = width*sizePct, h = w*(dims.height/dims.width);
          let x,y;

          if(pos==='br'){ x=width-w-pad; y=pad; }
          else if(pos==='bl'){ x=pad; y=pad; }
          else if(pos==='tr'){ x=width-w-pad; y=height-h-pad; }
          else if(pos==='tl'){ x=pad; y=height-h-pad; }
          else { x=(width-w)/2; y=(height-h)/2; }
          page.drawImage(embeddedImg, {x,y,width:w,height:h,opacity:opac});
        });
        prog.set(92,'Preparing…');
        const bytes = await doc.save();
        downloadBlob(new Blob([bytes],{type:'application/pdf'}), pdfFile.name.replace(/\.pdf$/i,'')+'-logo.pdf');
        prog.set(100,'Done'); prog.remove();
        mountResult(body, 'லோகோ சேர்க்கப்பட்ட PDF downloaded.');
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

    async function doMeme(){
      const top = body.querySelector('#mmTop').value||'';
      const bottom = body.querySelector('#mmBottom').value||'';
      const prog = mountProgress(body);
      try{
        prog.set(20,'Preparing…');
        const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
        const img = new Image(); await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=dataUrl; });
        const canvas = document.createElement('canvas'); canvas.width=img.naturalWidth; canvas.height=img.naturalHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0);
        const fontSize = Math.round(canvas.width/12);
        ctx.font = `900 ${fontSize}px Impact, sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = fontSize/14;
        function wrapAndDraw(str, y){
          const words = str.toUpperCase().split(' ');
          let lines = [], cur='';
          words.forEach(w=>{
            const test = cur? cur+' '+w : w;
            if(ctx.measureText(test).width > canvas.width*0.92 && cur){ lines.push(cur); cur=w; } else cur=test;
          });
          if(cur) lines.push(cur);
          lines.forEach((line,i)=>{
            const ly = y + i*fontSize*1.1;
            ctx.strokeText(line, canvas.width/2, ly);
            ctx.fillText(line, canvas.width/2, ly);
          });
        }
        if(top) wrapAndDraw(top, fontSize*1.1);
        if(bottom) wrapAndDraw(bottom, canvas.height - fontSize*1.3);
        prog.set(85,'Preparing…');
        const blob = await new Promise(res=> canvas.toBlob(res,'image/jpeg',0.95));
        downloadBlob(blob, 'meme.jpg');
        prog.set(100,'Done'); prog.remove();
        mountResult(body, 'Meme படம் downloaded.');
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

    async function doSpeed(){
      const speed = Number(body.querySelector('#vsSpeed').value)||1;
      const prog = mountProgress(body);
      let progHandler=null, ffmpegRef=null;
      try{
        prog.set(5,'Loading video engine…');
        const { ffmpeg, fetchFile } = await ensureFFmpeg();
        ffmpegRef = ffmpeg;
        progHandler = ({progress})=>{ const p=Math.min(1,Math.max(0,progress||0)); prog.set(15+p*75, 'வேகம் Converting… '+Math.round(p*100)+'%'); };
        ffmpeg.on('progress', progHandler);
        const ext = (file.name.split('.').pop()||'mp4').toLowerCase();
        await ffmpeg.writeFile('in.'+ext, await fetchFile(file));
        const videoPts = (1/speed).toFixed(4);
        // atempo only supports 0.5–2.0 per filter instance, so chain it for larger changes
        let atempoChain = [];
        let remaining = speed;
        if(remaining < 0.5){ while(remaining < 0.5){ atempoChain.push(0.5); remaining/=0.5; } atempoChain.push(remaining); }
        else if(remaining > 2){ while(remaining > 2){ atempoChain.push(2); remaining/=2; } atempoChain.push(remaining); }
        else atempoChain.push(remaining);
        const atempoStr = atempoChain.map(v=>`atempo=${v.toFixed(4)}`).join(',');
        prog.set(15,'Processing…');
        await ffmpeg.exec(['-i','in.'+ext,'-filter_complex',`[0:v]setpts=${videoPts}*PTS[v];[0:a]${atempoStr}[a]`,'-map','[v]','-map','[a]','-c:v','libx264','-preset','veryfast','-c:a','aac','out.mp4']);
        prog.set(92,'Preparing file…');
        const data = await ffmpeg.readFile('out.mp4');

        prog.set(100,'Done'); prog.remove();
        mountResult(body, `${speed}× வேகத்தில் வீடியோ downloaded.`);
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
      finally{ if(ffmpegRef && progHandler){ try{ ffmpegRef.off('progress', progHandler); }catch(e){} } }
    }
    paint();
  }
};

        prog.set(60,'Merging…');

};

            <div class="field-inline" style="align-self:end;"><input type="checkbox" id="brAspect" checked><label for="brAspect">Aspect ratio-ஐ பாதுகாக்கவும்</label></div>

        const row = el(`<div class="btn-row"></div>`);

        btn.onclick = doResize;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    async function doResize(){
      const maxW = Number(body.querySelector('#brW').value)||1600;
      const maxH = Number(body.querySelector('#brH').value)||1600;
      const keepAspect = body.querySelector('#brAspect').checked;
      const prog = mountProgress(body);
      try{
        const results = [];
        // Fast path: createImageBitmap + OffscreenCanvas-style decode/draw runs off the main
        // thread's synchronous decode path for a real speed win on batches of many images.
        for(let i=0;i<files.length;i++){
          prog.set((i/files.length)*90, `${files[i].name} — Size Converting…`);
          const f = files[i];
          const bitmap = await createImageBitmap(f);
          let w = bitmap.width, h = bitmap.height;
          if(keepAspect){
            const scale = Math.min(maxW/w, maxH/h, 1);
            w = Math.round(w*scale); h = Math.round(h*scale);
          } else { w = Math.min(w,maxW); h = Math.min(h,maxH); }
          const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
          ctx.drawImage(bitmap,0,0,w,h);
          bitmap.close && bitmap.close();
          const isPng = /\.png$/i.test(f.name);
          const blob = await new Promise(res=> canvas.toBlob(res, isPng?'image/png':'image/jpeg', 0.9));
          results.push({name: f.name.replace(/\.[^.]+$/,'')+'-resized.'+(isPng?'png':'jpg'), blob});
        }
        prog.set(95,'Preparing…');
        if(results.length===1) downloadBlob(results[0].blob, results[0].name);
        else{
          const zip = new JSZip();
          results.forEach(r=> zip.file(r.name, r.blob));
          downloadBlob(await zip.generateAsync({type:'blob'}), 'resized-images.zip');
        }
        prog.set(100,'Done'); prog.remove();
        mountResult(body, `${results.length} படங்கள் Size மாற்றப்பட்டு downloaded.`);
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

TOOL_IMPL.imgcompresskb = {
  mount(container){
    let files = [];
    const body = el(`<div></div>`); container.appendChild(body);
    function paint(){
      body.innerHTML = '';
      mountUploader(body, { accept:'image/*', multiple:true, label:'படங்களை drag & drop or tap', sublabel:'',
        onAdd:(fl)=>{ files = files.concat(fl); paint(); } });
      if(files.length){
        mountFileList(body, files, (idx)=>{ files.splice(idx,1); paint(); });
        const opts = el(`
          <div class="opts one tamil">
            <div class="field">
              <label>இலக்கு Size (KB, ஒரு படத்திற்கு)</label>
              <input type="number" id="icTarget" value="200" min="20">
            </div>
          </div>
        `);
        body.appendChild(opts);
        const row = el(`<div class="btn-row"></div>`);
        const btn = el(`<button class="btn tamil">🗜️ Compress செய்</button>`);
        btn.onclick = doCompress;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    async function compressToTarget(img, targetBytes){
      let canvas = document.createElement('canvas'); canvas.width=img.naturalWidth; canvas.height=img.naturalHeight;
      canvas.getContext('2d').drawImage(img,0,0);
      // Binary-search JPEG quality first (fast); if even quality 0.1 is still too big, also downscale.
      let lo=0.1, hi=0.95, bestBlob=null;
      for(let iter=0; iter<7; iter++){
        const q = (lo+hi)/2;
        const blob = await new Promise(res=> canvas.toBlob(res,'image/jpeg', q));
        if(blob.size > targetBytes){ hi = q; } else { bestBlob = blob; lo = q; }
      }
      if(!bestBlob){
        // Still too big even at lowest quality — progressively downscale resolution.
        let scale = 0.85;
        while(scale > 0.15){
          const c2 = document.createElement('canvas');
          c2.width = Math.round(canvas.width*scale); c2.height = Math.round(canvas.height*scale);
          c2.getContext('2d').drawImage(canvas,0,0,c2.width,c2.height);
          const blob = await new Promise(res=> c2.toBlob(res,'image/jpeg',0.6));
          if(blob.size <= targetBytes){ bestBlob = blob; break; }
          scale -= 0.15;
        }
      }
      return bestBlob || await new Promise(res=> canvas.toBlob(res,'image/jpeg',0.1));
    }
    async function doCompress(){
      const targetKB = Number(body.querySelector('#icTarget').value)||200;
      const targetBytes = targetKB*1024;
      const prog = mountProgress(body);
      try{
        const results = [];
        for(let i=0;i<files.length;i++){
          prog.set((i/files.length)*90, `${files[i].name} — Compress செய்கிறது…`);
          const f = files[i];
          const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });
          const img = new Image(); await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=dataUrl; });
          const blob = await compressToTarget(img, targetBytes);
          results.push({name: f.name.replace(/\.[^.]+$/,'')+'-compressed.jpg', blob});
        }
        prog.set(95,'Preparing…');
        if(results.length===1) downloadBlob(results[0].blob, results[0].name);
        else{
          const zip = new JSZip();
          results.forEach(r=> zip.file(r.name, r.blob));
          downloadBlob(await zip.generateAsync({type:'blob'}), 'compressed-images.zip');
        }
        prog.set(100,'Done'); prog.remove();
        const sizes = results.map(r=>fmtBytes(r.blob.size)).join(', ');
        mountResult(body, `${results.length} படங்கள் Compress ஆனது (${sizes}).`);
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

TOOL_IMPL.imgborder = {
  mount(container){
    let files = [];
    const body = el(`<div></div>`); container.appendChild(body);
    function paint(){
      body.innerHTML = '';
      mountUploader(body, { accept:'image/*', multiple:true, label:'படங்களை drag & drop or tap', sublabel:'',
        onAdd:(fl)=>{ files = files.concat(fl); paint(); } });
      if(files.length){
        mountFileList(body, files, (idx)=>{ files.splice(idx,1); paint(); });
        const opts = el(`
          <div class="opts tamil">
            <div class="field"><label>Border அகலம் (px)</label><input type="number" id="ibW" value="24" min="0" max="200"></div>
            <div class="field"><label>Border Color</label><input type="color" id="ibColor" value="#ffffff" style="width:100%; height:38px; padding:2px; border-radius:8px; border:1px solid var(--line);"></div>
            <div class="field"><label>வட்டமான ஓரங்கள் (px)</label><input type="number" id="ibRadius" value="0" min="0" max="200"></div>
          </div>
        `);
        body.appendChild(opts);
        const row = el(`<div class="btn-row"></div>`);
        const btn = el(`<button class="btn tamil">🖼️ Border சேர் & Download</button>`);
        btn.onclick = doBorder;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    async function doBorder(){
      const bw = Number(body.querySelector('#ibW').value)||0;
      const color = body.querySelector('#ibColor').value;
      const radius = Number(body.querySelector('#ibRadius').value)||0;
      const prog = mountProgress(body);
      try{
        const results = [];
        for(let i=0;i<files.length;i++){
          prog.set((i/files.length)*90, `${files[i].name} — Border சேர்க்கிறது…`);
          const f = files[i];
          const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });
          const img = new Image(); await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=dataUrl; });
          const w = img.naturalWidth+bw*2, h = img.naturalHeight+bw*2;
          const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
          const ctx = canvas.getContext('2d');
          if(radius>0){
            ctx.save();
            roundRectPath(ctx, 0, 0, w, h, radius);
            ctx.clip();
          }
          ctx.fillStyle = color; ctx.fillRect(0,0,w,h);
          if(radius>0){
            roundRectPath(ctx, bw*0.3, bw*0.3, w-bw*0.6, h-bw*0.6, Math.max(0,radius-bw*0.3));
            ctx.save(); ctx.clip();
            ctx.drawImage(img, bw, bw);
            ctx.restore();
          } else {
            ctx.drawImage(img, bw, bw);
          }
          if(radius>0) ctx.restore();
          const blob = await new Promise(res=> canvas.toBlob(res,'image/png'));
          results.push({name: f.name.replace(/\.[^.]+$/,'')+'-framed.png', blob});
        }
        prog.set(95,'Preparing…');
        if(results.length===1) downloadBlob(results[0].blob, results[0].name);
        else{
          const zip = new JSZip();
          results.forEach(r=> zip.file(r.name, r.blob));
          downloadBlob(await zip.generateAsync({type:'blob'}), 'framed-images.zip');
        }
        prog.set(100,'Done'); prog.remove();
        mountResult(body, `${results.length} படங்களில் Border சேர்க்கப்பட்டது.`);
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
    }
    function roundRectPath(ctx,x,y,w,h,r){
      ctx.beginPath();
      ctx.moveTo(x+r,y);
      ctx.arcTo(x+w,y,x+w,y+h,r);
      ctx.arcTo(x+w,y+h,x,y+h,r);
      ctx.arcTo(x,y+h,x,y,r);
      ctx.arcTo(x,y,x+w,y,r);
      ctx.closePath();
    }
    paint();
  }
};

              <input type="text" id="bpPositions" placeholder="எ.கா. 0, 3, 5" value="0">
            </div>
          </div>

        btn.onclick = doInsert;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    async function doInsert(){
      const positions = (body.querySelector('#bpPositions').value||'').split(',').map(s=>parseInt(s.trim())).filter(n=>!isNaN(n)&&n>=0);
      if(!positions.length){ mountResult(body,'குறைந்தது ஒரு இடத்தையாவது குறிப்பிடவும்.').style.background='#FDEDEC'; return; }
      const prog = mountProgress(body);
      try{
        prog.set(15,'Reading…');
        const src = await PDFDocument.load(file._buf, {ignoreEncryption:true});
        const totalPages = src.getPageCount();
        const firstPage = src.getPage(0);
        const {width,height} = firstPage.getSize();
        const outDoc = await PDFDocument.create();
        const sortedPos = new Set(positions);
        prog.set(30,'பக்கங்களை ஒழுங்கமைக்கிறது…');
        if(sortedPos.has(0)) outDoc.addPage([width,height]);
        for(let p=0;p<totalPages;p++){
          const [copied] = await outDoc.copyPages(src, [p]);
          outDoc.addPage(copied);
          if(sortedPos.has(p+1)) outDoc.addPage([width,height]);
        }
        prog.set(90,'Preparing…');
        const bytes = await outDoc.save();
        downloadBlob(new Blob([bytes],{type:'application/pdf'}), file.name.replace(/\.pdf$/i,'')+'-blank.pdf');
        prog.set(100,'Done'); prog.remove();
        mountResult(body, 'காலி பக்கங்கள் சேர்க்கப்பட்ட PDF downloaded.');
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

/* ===================== PDF REDACT (permanent, removes underlying text) ===================== */
TOOL_IMPL.pdfredact = {
  mount(container){
    let file = null, previewUrl = null, selectors = [];
    const body = el(`<div></div>`); container.appendChild(body);
    function paint(){
      body.innerHTML = '';
      body.appendChild(el(`<div class="note tamil" style="background:#FFF3E0; border-color:#FFD699;">⚠️ இது "வாட்டர்மார்க் நீக்கு" கருவியை போல் அல்ல — இங்கே தேர்ந்தெடுக்கப்பட்ட பகுதி Black நிறத்தில் நிரந்தரமாக மறைக்கப்பட்டு, பக்கம் முழுவதும் படமாக மாற்றப்படும் (Flatten) — அதனால் அடியில் இருக்கும் உரையும் நீக்கப்பட்டு, யாராலும் Copy/Extract செய்ய முடியாது. (பக்கத்தின் தெளிவு சற்று குறையலாம்.)</div>`));
      mountUploader(body, { accept:'application/pdf', label:'PDF-ஐ drag & drop or tap', sublabel:'',
        onAdd: async (fl)=>{
          file = fl[0]; file._buf = await readFileAsArrayBuffer(file);
          const pdfjsDoc = await loadPdfJs(file._buf);
          const page = await pdfjsDoc.getPage(1);
          const viewport = page.getViewport({scale: Math.min(1.6, 720/page.getViewport({scale:1}).width)});
          const canvas = document.createElement('canvas'); canvas.width=viewport.width; canvas.height=viewport.height;
          await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
          previewUrl = canvas.toDataURL('image/jpeg',0.85);
          selectors = [];
          paint();
        }});
      if(file && previewUrl){
        mountFileList(body, [file], ()=>{ file=null; previewUrl=null; selectors=[]; paint(); });
        body.appendChild(el(`<div class="note tamil">மறைக்க வேண்டிய பகுதி(களை) பெட்டியால் குறி — இது எல்லா பக்கங்களிலும் ஒரே இடத்தில் பயன்படுத்தப்படும்.</div>`));
        const selWrap = el(`<div id="prSelWrap"></div>`);
        body.appendChild(selWrap);
        if(!selectors.length) addSelector();
        const addRow = el(`<div class="btn-row"></div>`);
        const addBtn = el(`<button class="btn secondary tamil">➕ இன்னொரு பெட்டி சேர்</button>`);
        addBtn.onclick = ()=>{ addSelector(); };
        addRow.appendChild(addBtn);
        body.appendChild(addRow);
        const row = el(`<div class="btn-row"></div>`);
        const btn = el(`<button class="btn tamil">⬛ நிரந்தரமாக மறை (Redact)</button>`);
        btn.onclick = doRedact;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    function addSelector(){
      const selWrap = body.querySelector('#prSelWrap');
      const holder = el(`<div style="margin-bottom:14px;"></div>`);
      selWrap.appendChild(holder);
      const sel = mountRectSelector(holder, previewUrl, {fx0:0.2, fy0:0.42, fx1:0.8, fy1:0.58});
      selectors.push(sel);
    }
    async function doRedact(){
      const prog = mountProgress(body);
      try{
        prog.set(10,'Reading…');
        const rects = selectors.map(s=> s.getRect());
        const pdfjsDoc = await loadPdfJs(file._buf);
        const outDoc = await PDFDocument.create();
        for(let i=1;i<=pdfjsDoc.numPages;i++){
          prog.set(10 + (i/pdfjsDoc.numPages)*75, `பக்கம் ${i}/${pdfjsDoc.numPages} — Flatten செய்கிறது…`);
          const page = await pdfjsDoc.getPage(i);
          const viewport = page.getViewport({scale:2.2});
          const canvas = document.createElement('canvas'); canvas.width=viewport.width; canvas.height=viewport.height;
          const ctx = canvas.getContext('2d');
          await page.render({canvasContext:ctx, viewport}).promise;
          ctx.fillStyle = '#000000';
          rects.forEach(r=>{
            const x = r.fx0*canvas.width, w = (r.fx1-r.fx0)*canvas.width;
            const y = r.fy0*canvas.height, h = (r.fy1-r.fy0)*canvas.height;
            ctx.fillRect(x,y,w,h);
          });
          const jpgDataUrl = canvas.toDataURL('image/jpeg',0.85);
          const jpgBytes = await (await fetch(jpgDataUrl)).arrayBuffer();
          const embedded = await outDoc.embedJpg(jpgBytes);
          const origSize = page.getViewport({scale:1});
          const outPage = outDoc.addPage([origSize.width, origSize.height]);
          outPage.drawImage(embedded, {x:0,y:0,width:origSize.width,height:origSize.height});
        }
        prog.set(92,'Preparing…');
        const bytes = await outDoc.save();
        downloadBlob(new Blob([bytes],{type:'application/pdf'}), file.name.replace(/\.pdf$/i,'')+'-redacted.pdf');
        prog.set(100,'Done'); prog.remove();
        mountResult(body, 'நிரந்தரமாக மறைக்கப்பட்ட PDF downloaded — அடியில் இருந்த உரையும் நீக்கப்பட்டது.');
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

      const angle = Number(body.querySelector('#psAngle').value)||-30;
      const colorMap = { red:rgb(0.75,0.1,0.1), green:rgb(0.1,0.55,0.2), blue:rgb(0.1,0.3,0.7), gray:rgb(0.4,0.4,0.4) };
      const prog = mountProgress(body);
      try{
        prog.set(15,'Reading…');
        const doc = await PDFDocument.load(file._buf, {ignoreEncryption:true});
        prog.set(25,'Loading font…');
        const font = await embedUnicodeFont(doc);
        const pages = doc.getPages();
        pages.forEach((page,idx)=>{
          prog.set(15 + (idx/pages.length)*75, `பக்கம் ${idx+1}/${pages.length}…`);
          const {width,height} = page.getSize();
          const size = Math.min(width,height)/8;
          const tw = font.widthOfTextAtSize(text, size);
          page.drawText(text, {
            x: (width-tw)/2, y: height/2, size, font,
            color: colorMap[colorKey]||colorMap.red,
            opacity: 0.55, rotate: degrees(angle)
          });
          page.drawRectangle({
            x: (width-tw)/2 - size*0.4, y: height/2 - size*0.25, width: tw+size*0.8, height: size*1.15,
            borderColor: colorMap[colorKey]||colorMap.red, borderWidth: Math.max(1,size*0.035),
            opacity: 0.55, borderOpacity: 0.55, rotate: degrees(angle)
          });
        });
        prog.set(92,'Preparing…');
        const bytes = await doc.save();
        downloadBlob(new Blob([bytes],{type:'application/pdf'}), file.name.replace(/\.pdf$/i,'')+'-stamped.pdf');
        prog.set(100,'Done'); prog.remove();
        mountResult(body, 'ஸ்டாம்ப் பதிக்கப்பட்ட PDF downloaded.');
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

/* ===================== PDF WORD HIGHLIGHT ===================== */
TOOL_IMPL.pdfhighlight = {
  mount(container){
    let file = null, pdfjsDoc = null, numPages = 0, curPage = 1;
    let highlightsByPage = {}; // { pageNum: [{x,y,w,h,color}] } — x,y,w,h in PDF points
    let pageData = null;       // current page's {canvas, items, pageWidthPt, pageHeightPt}
    let activeColor = 'yellow';
    let eraseMode = false;
    const scale = 1.5;
    const body = el(`<div></div>`); container.appendChild(body);
    const COLORS = { yellow:'rgba(255,224,60,.55)', green:'rgba(105,240,174,.55)', pink:'rgba(255,138,178,.55)', blue:'rgba(130,177,255,.55)' };
    const COLORS_SOLID = { yellow:'#FFE03C', green:'#69F0AE', pink:'#FF8AB2', blue:'#82B1FF' };
    const PDF_COLORS = { yellow:[1,0.878,0.235], green:[0.41,0.94,0.68], pink:[1,0.54,0.7], blue:[0.51,0.69,1] };

    function paintUpload(){
      body.innerHTML = '';
      body.appendChild(el(`<div class="note">See the actual PDF and drag over any text to highlight it — just like a real highlighter pen. Works on selectable text; scanned/image-only PDFs won't have selectable words.</div>`));
      mountUploader(body, { accept:'application/pdf', label:'Drop a PDF file', sublabel:'',
        onAdd: async (fl)=>{
          file = fl[0]; file._buf = await readFileAsArrayBuffer(file);
          pdfjsDoc = await loadPdfJs(file._buf);
          numPages = pdfjsDoc.numPages; curPage = 1; highlightsByPage = {};
          await paintViewer();
        }});
    }

    async function loadPageData(pageNum){
      const page = await pdfjsDoc.getPage(pageNum);
      const viewport = page.getViewport({scale});
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
      const content = await page.getTextContent();
      const items = content.items.filter(it=>it.str && it.str.length).map(it=>{
        const x = it.transform[4], y = it.transform[5];
        const h = Math.abs(it.transform[3]) || 10;
        const w = it.width || (it.str.length*(it.transform[0]||6)*0.5);
        return { str: it.str, x, y, w, h };
      });
      return { canvas, items, pageWidthPt: viewport.width/scale, pageHeightPt: viewport.height/scale };
    }
    function pdfRectToDom(r){
      return { x: r.x*scale, y: (pageData.pageHeightPt - r.y - r.h)*scale, w: r.w*scale, h: r.h*scale };
    }
    function domToPdfRect(r){
      return { x: r.x/scale, y: pageData.pageHeightPt - (r.y/scale) - (r.h/scale), w: r.w/scale, h: r.h/scale };
    }

    async function paintViewer(){
      body.innerHTML = '';
      mountFileList(body, [file], ()=>{ file=null; pdfjsDoc=null; paintUpload(); });

      const nav = el(`<div class="btn-row" style="justify-content:center; align-items:center; gap:14px;"></div>`);
      const prevBtn = el(`<button class="btn secondary" style="padding:8px 14px;" ${curPage<=1?'disabled':''}>◀ Prev</button>`);
      const pageLabel = el(`<div style="font-weight:800; font-size:13px;">Page ${curPage} / ${numPages}</div>`);
      const nextBtn = el(`<button class="btn secondary" style="padding:8px 14px;" ${curPage>=numPages?'disabled':''}>Next ▶</button>`);
      prevBtn.onclick = ()=>{ if(curPage>1){ curPage--; paintViewer(); } };
      nextBtn.onclick = ()=>{ if(curPage<numPages){ curPage++; paintViewer(); } };
      nav.appendChild(prevBtn); nav.appendChild(pageLabel); nav.appendChild(nextBtn);
      body.appendChild(nav);

      const toolRow = el(`<div style="display:flex; gap:8px; justify-content:center; align-items:center; margin:12px 0; flex-wrap:wrap;"></div>`);
      Object.keys(COLORS).forEach(c=>{
        const sw = el(`<button data-color="${c}" title="${c}" style="width:32px; height:32px; border-radius:50%; border:2px solid ${c===activeColor?'#20242B':'transparent'}; background:${COLORS_SOLID[c]}; cursor:pointer;"></button>`);
        sw.onclick = ()=>{ activeColor=c; eraseMode=false; toolRow.querySelectorAll('[data-color]').forEach(b=>b.style.border='2px solid transparent'); sw.style.border='2px solid #20242B'; eraseBtn.style.background='#fff'; };
        toolRow.appendChild(sw);
      });
      const eraseBtn = el(`<button style="padding:7px 14px; border-radius:10px; border:1px solid var(--line); background:#fff; font-size:12px; font-weight:700; cursor:pointer;">🧹 Erase</button>`);
      eraseBtn.onclick = ()=>{ eraseMode=!eraseMode; eraseBtn.style.background = eraseMode?'#FDEDEC':'#fff'; };
      toolRow.appendChild(eraseBtn);
      body.appendChild(toolRow);

      const searchRow = el(`<div style="display:flex; gap:8px; margin-bottom:12px;">
        <input type="text" id="phSearch" placeholder="Find a word on this page…" style="flex:1; border:1px solid var(--line); border-radius:10px; padding:8px 11px; font-size:12.5px;">
        <button class="btn secondary" id="phSearchBtn" style="padding:8px 14px; font-size:12px;">Highlight all</button>
      </div>`);
      body.appendChild(searchRow);

      const pageWrap = el(`<div style="position:relative; max-width:100%; overflow:auto; border:1px solid var(--line); border-radius:14px; margin:0 auto; -webkit-user-select:text; user-select:text; touch-action:pan-y;"></div>`);
      body.appendChild(pageWrap);

      const prog = mountProgress(body);
      prog.set(30,'Rendering page…');
      pageData = await loadPageData(curPage);
      prog.set(95,'Almost there…'); prog.remove();

      const img = el(`<img src="${pageData.canvas.toDataURL('image/jpeg',0.92)}" width="${pageData.canvas.width}" height="${pageData.canvas.height}" style="display:block; width:100%; height:auto; pointer-events:none;">`);
      pageWrap.appendChild(img);
      const hlLayer = el(`<div style="position:absolute; left:0; top:0; width:100%; height:100%;"></div>`);
      pageWrap.appendChild(hlLayer);
      const textLayer = el(`<div style="position:absolute; left:0; top:0; width:100%; height:100%;"></div>`);
      pageWrap.appendChild(textLayer);

      pageData.items.forEach(it=>{
        const d = pdfRectToDom(it);
        const span = el(`<span style="position:absolute; left:${d.x}px; top:${d.y}px; width:${d.w}px; height:${d.h}px; font-size:${d.h}px; line-height:${d.h}px; color:transparent; white-space:pre; cursor:text;"></span>`);
        span.textContent = it.str;
        textLayer.appendChild(span);
        requestAnimationFrame(()=>{
          const natural = span.getBoundingClientRect().width;
          if(natural>0 && d.w>0){ span.style.transformOrigin = '0 0'; span.style.transform = `scaleX(${d.w/natural})`; }
        });
      });

      function redrawHighlights(){
        hlLayer.innerHTML = '';
        (highlightsByPage[curPage]||[]).forEach((h,idx)=>{
          const d = pdfRectToDom(h);
          const box = el(`<div style="position:absolute; left:${d.x}px; top:${d.y}px; width:${d.w}px; height:${d.h}px; background:${COLORS[h.color]}; border-radius:2px; pointer-events:${eraseMode?'auto':'none'}; cursor:${eraseMode?'pointer':'default'};"></div>`);
          if(eraseMode) box.onclick = ()=>{ highlightsByPage[curPage].splice(idx,1); redrawHighlights(); updateCount(); };
          hlLayer.appendChild(box);
        });
      }
      function addHighlightFromDomRect(domRect, color){
        if(domRect.w<1 || domRect.h<1) return;
        if(!highlightsByPage[curPage]) highlightsByPage[curPage]=[];
        highlightsByPage[curPage].push({ ...domToPdfRect(domRect), color });
      }
      function commitSelectionAsHighlight(){
        if(eraseMode) return;
        const sel = window.getSelection();
        if(!sel || sel.isCollapsed || sel.rangeCount===0) return;
        const range = sel.getRangeAt(0);
        if(!textLayer.contains(range.commonAncestorContainer)) return;
        const wrapRect = pageWrap.getBoundingClientRect();
        const rects = Array.from(range.getClientRects());
        if(!rects.length) return;
        rects.forEach(r=> addHighlightFromDomRect({
          x: (r.left-wrapRect.left)+pageWrap.scrollLeft, y: (r.top-wrapRect.top)+pageWrap.scrollTop, w:r.width, h:r.height
        }, activeColor));
        sel.removeAllRanges();
        redrawHighlights(); updateCount();
      }
      pageWrap.addEventListener('mouseup', commitSelectionAsHighlight);
      pageWrap.addEventListener('touchend', ()=> setTimeout(commitSelectionAsHighlight, 60));

      searchRow.querySelector('#phSearchBtn').onclick = ()=>{
        const q = (searchRow.querySelector('#phSearch').value||'').trim().toLowerCase();
        if(!q) return;
        pageData.items.forEach(it=>{
          if(it.str.toLowerCase().includes(q)){
            if(!highlightsByPage[curPage]) highlightsByPage[curPage]=[];
            highlightsByPage[curPage].push({ x:it.x, y:it.y, w:it.w, h:it.h, color:activeColor });
          }
        });
        redrawHighlights(); updateCount();
      };

      redrawHighlights();

      const actionRow = el(`<div class="btn-row"></div>`);
      const clearBtn = el(`<button class="btn secondary">Clear this page</button>`);
      clearBtn.onclick = ()=>{ highlightsByPage[curPage]=[]; redrawHighlights(); updateCount(); };
      const saveBtn = el(`<button class="btn">💾 Save &amp; Download PDF</button>`);
      saveBtn.onclick = doExport;
      actionRow.appendChild(clearBtn); actionRow.appendChild(saveBtn);
      body.appendChild(actionRow);

      const countNote = el(`<div class="note" style="text-align:center;"></div>`);
      body.appendChild(countNote);
      function updateCount(){
        const total = Object.values(highlightsByPage).reduce((s,a)=>s+a.length,0);
        countNote.textContent = `${total} highlight${total===1?'':'s'} across this document so far.`;
      }
      updateCount();
    }

    async function doExport(){
      const total = Object.values(highlightsByPage).reduce((s,a)=>s+a.length,0);
      if(total===0){ mountResult(body,'Add at least one highlight first — drag over some text.').style.background='#FDEDEC'; return; }
      const prog = mountProgress(body);
      try{
        prog.set(10,'Reading…');
        const doc = await PDFDocument.load(file._buf, {ignoreEncryption:true});
        const pages = doc.getPages();
        Object.keys(highlightsByPage).forEach(pnStr=>{
          const pn = Number(pnStr);
          const page = pages[pn-1];
          if(!page) return;
          (highlightsByPage[pnStr]||[]).forEach(h=>{
            const c = PDF_COLORS[h.color] || PDF_COLORS.yellow;
            page.drawRectangle({ x:h.x, y:h.y, width:h.w, height:h.h, color: rgb(c[0],c[1],c[2]), opacity: 0.42 });
          });
        });
        prog.set(85,'Preparing…');
        const bytes = await doc.save();
        downloadBlob(new Blob([bytes],{type:'application/pdf'}), file.name.replace(/\.pdf$/i,'')+'-highlighted.pdf');
        prog.set(100,'Done'); prog.remove();
        mountResult(body, `${total} highlight${total===1?'':'s'} saved — text stays fully selectable in the downloaded PDF.`);
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
    }

    paintUpload();
  }
};

/* ===================== VIDEO SUBTITLE / CAPTION BURN-IN ===================== */
TOOL_IMPL.videosubtitle = {
  mount(container){
    ensureFFmpeg().catch(()=>{}); // pre-warm engine in background for speed
    let file = null;
    const body = el(`<div></div>`); container.appendChild(body);
    function paint(){
      body.innerHTML = '';
      body.appendChild(el(`<div class="note tamil">ஒரு வரிக்கு ஒரு caption — வடிவம்: <b>mm:ss-mm:ss: உரை</b> (எ.கா. 00:00-00:04: வணக்கம்!)</div>`));
      mountUploader(body, { accept:'video/*', label:'வீடியோவை drag & drop or tap', sublabel:'',
        onAdd:(fl)=>{ file=fl[0]; paint(); } });
      if(file){
        mountFileList(body, [file], ()=>{ file=null; paint(); });
        const opts = el(`
          <div class="opts one tamil">
            <div class="field">
              <label>Captions</label>
              <textarea id="vsCaps" rows="5" style="width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:13px; font-family:inherit;" placeholder="00:00-00:04: வணக்கம்!&#10;00:04-00:08: இது ஒரு Caption">00:00-00:04: வணக்கம்!</textarea>
            </div>
          </div>
        `);
        body.appendChild(opts);
        const row = el(`<div class="btn-row"></div>`);
        const btn = el(`<button class="btn tamil">💬 Caption பதிக்கவும்</button>`);
        btn.onclick = doBurn;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    function escDrawtext(s){
      return s.replace(/\\/g,'\\\\\\\\').replace(/:/g,'\\:').replace(/'/g,"\u2019");
    }
    async function doBurn(){
      const lines = (body.querySelector('#vsCaps').value||'').split('\n').map(l=>l.trim()).filter(Boolean);
      if(!lines.length){ mountResult(body,'குறைந்தது ஒரு caption வரி எழுதவும்.').style.background='#FDEDEC'; return; }
      const prog = mountProgress(body);
      try{
        prog.set(5,'Loading video engine…');
        const { ffmpeg, fetchFile } = await ensureFFmpeg();
        const ext = (file.name.split('.').pop()||'mp4').toLowerCase();
        await ffmpeg.writeFile('in.'+ext, await fetchFile(file));
        const filters = [];
        lines.forEach(line=>{
          const m = line.match(/^(\d{1,2}:\d{2}(?::\d{2})?)-(\d{1,2}:\d{2}(?::\d{2})?):\s*(.+)$/);
          if(!m) return;
          const s = parseTimeToSec(m[1]), e = parseTimeToSec(m[2]), txt = escDrawtext(m[3]);
          filters.push(`drawtext=text='${txt}':fontsize=32:fontcolor=white:borderw=3:bordercolor=black:x=(w-text_w)/2:y=h-th-40:enable='between(t,${s},${e})'`);
        });
        if(!filters.length){ prog.remove(); mountResult(body,'Caption வரிகளின் வடிவம் சரியில்லை (mm:ss-mm:ss: உரை).').style.background='#FDEDEC'; return; }
        prog.set(20,'Caption பதிக்கிறது…');
        await ffmpeg.exec(['-i','in.'+ext,'-vf', filters.join(','), '-c:a','copy','out.mp4']);
        prog.set(90,'Preparing…');
        const data = await ffmpeg.readFile('out.mp4');
        downloadBlob(new Blob([data],{type:'video/mp4'}), file.name.replace(/\.[^.]+$/,'')+'-captioned.mp4');
        prog.set(100,'Done'); prog.remove();
        mountResult(body, 'Caption பதிக்கப்பட்ட வீடியோ downloaded.');
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

            </div>
            <div class="field"><label>Wave Color</label>
              <select id="vwFg"><option value="0x4FC3F7">Sky Blue</option><option value="0xFFD54F">Gold</option><option value="0xFF6E6E">Coral</option><option value="white">White</option></select>
            </div>
          </div>
        `);
        body.appendChild(opts);
        const row = el(`<div class="btn-row"></div>`);
        const btn = el(`<button class="btn tamil">🌊 Waveform வீடியோ உருவாக்கு</button>`);
        btn.onclick = doWave;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    async function doWave(){
      const bg = body.querySelector('#vwBg').value;
      const fg = body.querySelector('#vwFg').value;
      const prog = mountProgress(body);
      let progHandler=null, ffmpegRef=null;
      try{
        prog.set(5,'Loading video engine…');
        const { ffmpeg, fetchFile } = await ensureFFmpeg();
        ffmpegRef = ffmpeg;
        progHandler = ({progress})=>{ const p=Math.min(1,Math.max(0,progress||0)); prog.set(15+p*75, 'உருவாக்குகிறது… '+Math.round(p*100)+'%'); };
        ffmpeg.on('progress', progHandler);
        const ext = (file.name.split('.').pop()||'mp3').toLowerCase();
        await ffmpeg.writeFile('in.'+ext, await fetchFile(file));
        const filter = `[0:a]showwaves=s=1280x360:mode=cline:colors=${fg}:rate=25[wave];color=c=${bg}:s=1280x360:rate=25[bgv];[bgv][wave]overlay=format=auto[outv]`;
        prog.set(15,'உருவாக்குகிறது…');
        await ffmpeg.exec(['-i','in.'+ext,'-filter_complex',filter,'-map','[outv]','-map','0:a','-c:v','libx264','-preset','veryfast','-c:a','aac','-shortest','out.mp4']);
        prog.set(92,'Preparing…');
        const data = await ffmpeg.readFile('out.mp4');
        downloadBlob(new Blob([data],{type:'video/mp4'}), file.name.replace(/\.[^.]+$/,'')+'-waveform.mp4');
        prog.set(100,'Done'); prog.remove();
        mountResult(body, 'Waveform வீடியோ downloaded.');
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
      finally{ if(ffmpegRef && progHandler){ try{ ffmpegRef.off('progress', progHandler); }catch(e){} } }
    }
    paint();
  }
};

};

      mountUploader(body, { accept:'video/*', label:'வீடியோவை drag & drop or tap', sublabel:'',
        onAdd:(fl)=>{ file=fl[0]; paint(); } });
      if(file){
        mountFileList(body, [file], ()=>{ file=null; paint(); });
        const opts = el(`
          <div class="opts tamil">
            <div class="field-inline"><input type="checkbox" id="vvNorm"><label for="vvNorm">தானாக சத்தத்தை சமன்படுத்து (Normalize)</label></div>
            <div class="field"><label>கைமுறை சத்தம் (%, Normalize தேர்ந்தெடுக்கவில்லை எனில்)</label><input type="number" id="vvVol" value="150" min="0" max="400"></div>
          </div>
        `);

        const row = el(`<div class="btn-row"></div>`);
        const btn = el(`<button class="btn tamil">🔊 மாற்று & Download</button>`);
        btn.onclick = doVolume;
        row.appendChild(btn);
        body.appendChild(row);
      }

    async function doVolume(){
      const norm = body.querySelector('#vvNorm').checked;

        await ffmpeg.exec(['-i','in.'+ext,'-af',af,'-c:v','copy','out.mp4']);
        prog.set(92,'Preparing…');
        const data = await ffmpeg.readFile('out.mp4');
        downloadBlob(new Blob([data],{type:'video/mp4'}), file.name.replace(/\.[^.]+$/,'')+'-volume.mp4');

        mountResult(body, 'சத்தம் மாற்றப்பட்ட வீடியோ downloaded.');
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

/* ===================== STICKER CUTOUT ===================== */
TOOL_IMPL.imgsticker = {
  mount(container){
    ensureOpenCv().catch(()=>{}); // pre-warm engine in background for speed
    let file = null, previewUrl = null, imgCanvas = null, selector = null;
    const body = el(`<div></div>`); container.appendChild(body);
    function paint(){
      body.innerHTML = '';
      body.appendChild(el(`<div class="note tamil">பொருளை சுற்றி பெட்டி வரை — பின்னணி நீக்கப்பட்டு, White Border-உடன் Sticker போல தயார் செய்யப்படும்.</div>`));
      mountUploader(body, { accept:'image/*', label:'படத்தை drag & drop or tap', sublabel:'',
        onAdd: async (fl)=>{
          file = fl[0];
          const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
          const img = new Image(); await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=dataUrl; });
          const scale = Math.min(1, 900/img.naturalWidth);
          imgCanvas = document.createElement('canvas');
          imgCanvas.width = Math.round(img.naturalWidth*scale); imgCanvas.height = Math.round(img.naturalHeight*scale);
          imgCanvas.getContext('2d').drawImage(img,0,0,imgCanvas.width,imgCanvas.height);
          previewUrl = imgCanvas.toDataURL('image/jpeg',0.9);
          paint();
        }});
      if(file && previewUrl){
        mountFileList(body, [file], ()=>{ file=null; imgCanvas=null; previewUrl=null; paint(); });
        selector = mountRectSelector(body, previewUrl, {fx0:0.08, fy0:0.08, fx1:0.92, fy1:0.92});
        const opts = el(`
          <div class="opts one tamil">
            <div class="field"><label>Border தடிமன் (px)</label><input type="number" id="stB" value="14" min="0" max="40"></div>
          </div>
        `);
        body.appendChild(opts);
        const row = el(`<div class="btn-row"></div>`);
        const btn = el(`<button class="btn tamil">🏷️ Sticker உருவாக்கு</button>`);
        btn.onclick = doSticker;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    async function doSticker(){
      const rect = selector.getRect();
      const borderPx = Number(body.querySelector('#stB').value)||14;
      const prog = mountProgress(body);
      let src, rgbMat, mask, bgdModel, fgdModel, alphaMat, dilated, kernel;
      try{
        prog.set(15,'Loading AI engine…');
        const cv = await ensureOpenCv();
        prog.set(35,'Detecting subject…');
        src = cv.imread(imgCanvas);
        rgbMat = new cv.Mat(); cv.cvtColor(src, rgbMat, cv.COLOR_RGBA2RGB);
        mask = new cv.Mat.zeros(imgCanvas.height, imgCanvas.width, cv.CV_8UC1);
        bgdModel = new cv.Mat(); fgdModel = new cv.Mat();
        const x = Math.round(rect.fx0*imgCanvas.width), y = Math.round(rect.fy0*imgCanvas.height);
        const w = Math.max(2, Math.round((rect.fx1-rect.fx0)*imgCanvas.width));
        const h = Math.max(2, Math.round((rect.fy1-rect.fy0)*imgCanvas.height));
        cv.grabCut(rgbMat, mask, new cv.Rect(x,y,w,h), bgdModel, fgdModel, 5, cv.GC_INIT_WITH_RECT);
        prog.set(65,'Building sticker border…');
        alphaMat = new cv.Mat(imgCanvas.height, imgCanvas.width, cv.CV_8UC1, new cv.Scalar(0));
        for(let q=0;q<mask.rows*mask.cols;q++){ const v=mask.data[q]; if(v===1||v===3) alphaMat.data[q]=255; }
        dilated = new cv.Mat();
        kernel = cv.Mat.ones(Math.max(1,Math.round(borderPx/2)), Math.max(1,Math.round(borderPx/2)), cv.CV_8U);
        cv.dilate(alphaMat, dilated, kernel);
        const outCanvas = document.createElement('canvas'); outCanvas.width=imgCanvas.width; outCanvas.height=imgCanvas.height;
        const octx = outCanvas.getContext('2d');
        octx.fillStyle = '#ffffff';
        // paint white border where dilated mask is set but original alpha isn't (the "ring")
        const ringImg = octx.createImageData(outCanvas.width, outCanvas.height);
        for(let q=0, p=0; q<dilated.rows*dilated.cols; q++, p+=4){
          if(dilated.data[q] > 0){ ringImg.data[p]=255; ringImg.data[p+1]=255; ringImg.data[p+2]=255; ringImg.data[p+3]=255; }
        }
        octx.putImageData(ringImg,0,0);
        octx.drawImage(imgCanvas,0,0);
        const finalData = octx.getImageData(0,0,outCanvas.width,outCanvas.height);
        for(let q=0,p=0; q<alphaMat.rows*alphaMat.cols; q++, p+=4){
          const inObj = alphaMat.data[q] > 0, inRing = dilated.data[q] > 0;
          if(!inObj && !inRing) finalData.data[p+3] = 0;
        }
        octx.putImageData(finalData,0,0);
        prog.set(90,'Preparing…');
        const blob = await new Promise(res=> outCanvas.toBlob(res,'image/png'));
        downloadBlob(blob, file.name.replace(/\.[^.]+$/,'')+'-sticker.png');
        prog.set(100,'Done'); prog.remove();
        mountResult(body, 'Sticker படம் (transparent PNG) downloaded.');
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
      finally{ [src,rgbMat,mask,bgdModel,fgdModel,alphaMat,dilated,kernel].forEach(m=>{ try{ m && m.delete(); }catch(e){} }); }
    }
    paint();
  }
};

/* ===================== PDF QR STAMP ===================== */
TOOL_IMPL.pdfqrstamp = {
  mount(container){
    let file = null;
    const body = el(`<div></div>`); container.appendChild(body);
    function paint(){
      body.innerHTML = '';
      mountUploader(body, { accept:'application/pdf', label:'PDF-ஐ drag & drop or tap', sublabel:'',
        onAdd: async (fl)=>{ file = fl[0]; file._buf = await readFileAsArrayBuffer(file); paint(); } });
      if(file){
        mountFileList(body, [file], ()=>{ file=null; paint(); });
        const opts = el(`
          <div class="opts tamil">
            <div class="field" style="grid-column:1/-1;"><label>QR-ல் இருக்க வேண்டிய லிங்க்/உரை</label><input type="text" id="pqText" placeholder="https://example.com"></div>
            <div class="field"><label>Position</label>
              <select id="pqPos"><option value="br">Bottom-right</option><option value="bl">Bottom-left</option><option value="tr">Top-right</option><option value="tl">Top-left</option></select>
            </div>
            <div class="field"><label>Size (% பக்கம்)</label><input type="number" id="pqSize" value="12" min="5" max="35"></div>
          </div>
        `);
        body.appendChild(opts);
        const row = el(`<div class="btn-row"></div>`);
        const btn = el(`<button class="btn tamil">▦ QR பதிக்கவும்</button>`);
        btn.onclick = doStamp;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    async function doStamp(){
      const text = body.querySelector('#pqText').value||'';
      if(!text.trim()){ mountResult(body,'QR-ல் இருக்க வேண்டிய லிங்க்/உரையை உள்ளிடவும்.').style.background='#FDEDEC'; return; }
      const pos = body.querySelector('#pqPos').value;
      const sizePct = Number(body.querySelector('#pqSize').value)/100||0.12;
      const prog = mountProgress(body);
      try{
        prog.set(10,'Generating QR…');
        const QRCode = await ensureQrLib();
        const genDiv = document.createElement('div');
        new QRCode(genDiv, { text, width:300, height:300, correctLevel: QRCode.CorrectLevel.M });
        await new Promise(r=>setTimeout(r,150));
        const src = genDiv.querySelector('canvas') || genDiv.querySelector('img');
        const qrCanvas = document.createElement('canvas'); qrCanvas.width=300; qrCanvas.height=300;
        const qctx = qrCanvas.getContext('2d');
        qctx.fillStyle='#fff'; qctx.fillRect(0,0,300,300);
        if(src.tagName==='CANVAS') qctx.drawImage(src,0,0,300,300);
        else await new Promise(res=>{ if(src.complete){ qctx.drawImage(src,0,0,300,300); res(); } else src.onload=()=>{ qctx.drawImage(src,0,0,300,300); res(); }; });
        const qrPngBytes = await (await fetch(qrCanvas.toDataURL('image/png'))).arrayBuffer();

        prog.set(30,'Reading…');
        const doc = await PDFDocument.load(file._buf, {ignoreEncryption:true});
        const embeddedQr = await doc.embedPng(qrPngBytes);
        const pages = doc.getPages();
        pages.forEach((page,idx)=>{
          prog.set(30 + (idx/pages.length)*60, `பக்கம் ${idx+1}/${pages.length}…`);
          const {width,height} = page.getSize();
          const s = width*sizePct;
          const pad = width*0.03;
          let x,y;
          if(pos==='br'){ x=width-s-pad; y=pad; }
          else if(pos==='bl'){ x=pad; y=pad; }
          else if(pos==='tr'){ x=width-s-pad; y=height-s-pad; }
          else { x=pad; y=height-s-pad; }
          page.drawImage(embeddedQr, {x,y,width:s,height:s});
        });
        prog.set(92,'Preparing…');
        const bytes = await doc.save();
        downloadBlob(new Blob([bytes],{type:'application/pdf'}), file.name.replace(/\.pdf$/i,'')+'-qr.pdf');
        prog.set(100,'Done'); prog.remove();
        mountResult(body, 'QR பதிக்கப்பட்ட PDF downloaded.');
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

/* ===================== ASK AI ABOUT DOCUMENT ===================== */
/* ===================== Shared: AI document-upload tool base =====================
   Powers all 6 "AI /" tools: handles upload (image OR PDF), preview, calling the
   backend's generic /api/ai/ask, and rendering the answer with a Copy button.
   Each tool just configures the prompt + any extra inputs it needs. =============== */
function mountAiUploadTool(container, config){
  let file = null, previewUrl = null, isPdf = false;
  const body = el(`<div></div>`); container.appendChild(body);
  function paint(){
    body.innerHTML = '';
    if(config.intro) body.appendChild(el(`<div class="note">${config.intro}</div>`));
    mountUploader(body, { accept:'image/*,application/pdf', label: config.uploadLabel, sublabel: config.uploadSublabel || 'Image or PDF',
      onAdd: async (fl)=>{
        file = fl[0];
        isPdf = file.type==='application/pdf' || file.name.toLowerCase().endsWith('.pdf');
        previewUrl = isPdf ? null : await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
        paint();
      }});
    if(!file) return;
    mountFileList(body, [file], ()=>{ file=null; previewUrl=null; paint(); });
    if(previewUrl){
      body.appendChild(el(`<img src="${previewUrl}" style="max-width:100%; max-height:280px; display:block; margin:14px auto; border-radius:12px; border:1px solid var(--line);">`));
    }
    if(config.renderExtraOptions) config.renderExtraOptions(body);
    const row = el(`<div class="btn-row"></div>`);
    const btn = el(`<button class="btn">${config.buttonLabel || '✨ Run AI'}</button>`);
    btn.onclick = doAsk;
    row.appendChild(btn);
    body.appendChild(row);
    body.appendChild(el(`<div id="aiAnswerHolder"></div>`));
  }
  function defaultRenderAnswer(answerHolder, answerText){
    const card = el(`<div style="position:relative; margin-top:6px; border:1px solid var(--line); border-radius:14px; padding:16px; padding-top:38px; background:#fff; font-size:14px; line-height:1.7; white-space:pre-wrap;">${escapeHtml(answerText)}</div>`);
    const copyBtn = el(`<button style="position:absolute; top:10px; right:10px; padding:5px 12px; font-size:11.5px; font-weight:700; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer;">📋 Copy</button>`);
    copyBtn.onclick = ()=>{ navigator.clipboard && navigator.clipboard.writeText(answerText).catch(()=>{}); copyBtn.textContent='✓ Copied'; setTimeout(()=>copyBtn.textContent='📋 Copy',1200); };
    card.style.position='relative';
    card.appendChild(copyBtn);
    answerHolder.appendChild(card);
  }
  async function doAsk(){
    if(!AUTH_CONFIGURED || !authState.session){ mountResult(body,'Please sign in to use this AI feature.').style.background='#FDEDEC'; return; }
    let question;
    try{ question = config.buildQuestion(body); }catch(e){ mountResult(body, e.message).style.background='#FDEDEC'; return; }
    if(!question) return;
    const answerHolder = body.querySelector('#aiAnswerHolder');
    answerHolder.innerHTML = '';
    const prog = mountProgress(body);
    try{
      prog.set(20, isPdf ? 'Reading your PDF…' : 'Reading your image…');
      const form = new FormData();
      form.append('file', file);
      form.append('question', question);
      form.append('toolId', config.toolId);
      const res = await fetch(APP_CONFIG.BACKEND_URL + '/api/ai/ask', {
        method:'POST', headers:{ Authorization:'Bearer '+authState.session.access_token }, body: form
      });
      prog.set(80,'Thinking…');
      const result = await res.json();
      if(result.error) throw new Error(result.error);
      prog.set(100,'Done'); prog.remove();
      if(config.onAnswer) config.onAnswer(answerHolder, result.answer, body);
      else defaultRenderAnswer(answerHolder, result.answer);
      updateCreditsBadgeInline();
      refreshProfile();
    }catch(err){ prog.remove(); mountResult(body,'Error: '+friendlyErrorMessage(err)).style.background='#FDEDEC'; }
  }
  paint();
}

TOOL_IMPL.aireceipt = {
  mount(container){
    mountAiUploadTool(container, {
      toolId: 'aireceipt',
      intro: 'Snap a photo of a receipt or invoice — AI pulls out the vendor, date, amount, and line items into a downloadable spreadsheet.',
      uploadLabel: 'Drop a photo or PDF of the receipt/invoice',
      buttonLabel: '🧾 Extract Data',
      buildQuestion(){
        return 'Extract data from this receipt/invoice. Respond with ONLY valid JSON (no markdown fences, no explanation) in exactly this shape: {"vendor":"","date":"","total_amount":"","currency":"","items":[{"name":"","price":""}]}. If a field is not present, use an empty string. If there are no line items, use an empty array.';
      },
      onAnswer(answerHolder, answerText, body){
        let data;
        try{
          const cleaned = answerText.replace(/```json|```/g,'').trim();
          data = JSON.parse(cleaned);
        }catch(e){
          answerHolder.appendChild(el(`<div class="note" style="background:#FDEDEC;">Couldn't read structured data from this receipt — here's the raw AI response instead:</div>`));
          answerHolder.appendChild(el(`<div style="border:1px solid var(--line); border-radius:14px; padding:16px; background:#fff; font-size:13px; white-space:pre-wrap;">${escapeHtml(answerText)}</div>`));
          return;
        }
        const summary = el(`
          <div style="border:1px solid var(--line); border-radius:14px; padding:16px; background:#fff;">
            <div style="font-weight:800; font-size:14px; margin-bottom:8px;">${escapeHtml(data.vendor||'Unknown vendor')}</div>
            <div style="font-size:12.5px; color:var(--sub); margin-bottom:10px;">${escapeHtml(data.date||'')} &nbsp;·&nbsp; ${escapeHtml(data.currency||'')} ${escapeHtml(String(data.total_amount||''))}</div>
            ${(data.items||[]).length ? `<div style="font-size:13px;">${(data.items||[]).map(it=>`<div style="display:flex; justify-content:space-between; padding:4px 0; border-top:1px solid var(--line);"><span>${escapeHtml(it.name||'')}</span><span>${escapeHtml(String(it.price||''))}</span></div>`).join('')}</div>` : ''}
          </div>
        `);
        answerHolder.appendChild(summary);
        const dlBtn = el(`<button class="btn" style="margin-top:12px;">⬇️ Download as Excel</button>`);
        dlBtn.onclick = ()=>{
          const wb = XLSX.utils.book_new();
          const rows = [['Vendor','Date','Currency','Total Amount'], [data.vendor||'', data.date||'', data.currency||'', data.total_amount||'']];
          if((data.items||[]).length){ rows.push([]); rows.push(['Item','Price']); (data.items||[]).forEach(it=> rows.push([it.name||'', it.price||''])); }
          const ws = XLSX.utils.aoa_to_sheet(rows);
          XLSX.utils.book_append_sheet(wb, ws, 'Receipt');
          const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
          downloadBlob(new Blob([out],{type:'application/octet-stream'}), 'receipt-data.xlsx');
        };
        answerHolder.appendChild(dlBtn);
      }
    });
  }
};
