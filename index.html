<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&family=Noto+Sans+Oriya:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --ink:#20242B; --sub:#6B7280; --line:#E6E8EC; --bg:#F6F7FB; --card:#FFFFFF;
    --brand:#3752A6; --brand-dark:#28407F; --accent:#E8894A; --accent-dark:#C96A2C;
    --ok:#1E8E5A; --warn:#C0392B; --chip:#EEF1FA;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter','Noto Sans Tamil',system-ui,sans-serif; -webkit-tap-highlight-color:transparent;}
  .tamil{font-family:'Noto Sans Tamil','Inter',sans-serif;}
  #app{max-width:1080px; margin:0 auto; min-height:100vh; padding:0 16px 60px;}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:20px 4px 16px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--brand),var(--brand-dark)); display:flex; align-items:center; justify-content:center; color:white; font-weight:800; font-size:14px;}
  .brand-name{font-weight:800; font-size:17px; letter-spacing:-0.2px;}
  .brand-tag{font-size:11px; color:var(--sub); font-weight:600;}
  .free-badge{background:var(--ok); color:white; font-size:11px; font-weight:800; padding:5px 11px; border-radius:20px; letter-spacing:.3px;}

  .hero{padding:6px 4px 26px;}
  .hero h1{font-size:26px; font-weight:800; margin:0 0 6px; letter-spacing:-0.4px;}
  .hero p{color:var(--sub); font-size:14px; margin:0; max-width:560px; line-height:1.5;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(185px,1fr)); gap:14px; margin-top:8px;}
  .tool-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px 16px; cursor:pointer; transition:transform .12s, box-shadow .12s; display:flex; flex-direction:column; gap:10px; text-align:left;}
  .tool-card:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(20,30,60,.08);}
  .tool-card:active{transform:translateY(0);}
  .tool-icon{width:50px; height:50px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:24px;}
  .tool-name{font-weight:800; font-size:15.5px; line-height:1.3;}
  .tool-desc{font-size:12.5px; color:var(--sub); line-height:1.4;}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:24px; margin-top:10px;}
  .panel-head{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .back-btn{background:var(--chip); border:none; width:36px; height:36px; border-radius:10px; font-size:16px; cursor:pointer; color:var(--brand); flex-shrink:0;}
  .panel-title{font-size:19px; font-weight:800;}
  .panel-sub{font-size:12.5px; color:var(--sub); margin-top:2px;}

  .drop{border:2px dashed var(--line); border-radius:16px; padding:34px 18px; text-align:center; cursor:pointer; transition:border-color .15s, background .15s;}
  .drop.drag{border-color:var(--brand); background:#F0F3FC;}
  .drop-icon{font-size:30px; margin-bottom:8px;}
  .drop-title{font-weight:700; font-size:14px; margin-bottom:4px;}
  .drop-sub{font-size:12px; color:var(--sub);}
  .drop input{display:none;}

  .file-list{display:flex; flex-direction:column; gap:8px; margin-top:14px;}
  .file-row{display:flex; align-items:center; gap:10px; background:var(--chip); border-radius:12px; padding:10px 12px;}
  .file-row .fi{width:30px; height:30px; border-radius:8px; background:var(--brand); color:white; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex-shrink:0;}
  .file-row .fname{font-size:12.5px; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .file-row .fsize{font-size:11px; color:var(--sub);}
  .file-row .fdel{background:none; border:none; color:var(--sub); cursor:pointer; font-size:15px; padding:2px 6px;}
  .file-row .fdel:active{color:var(--warn);}
  .file-row .fmove{background:none; border:none; color:var(--brand); cursor:pointer; font-size:13px; padding:2px 6px; font-weight:700;}

  .opts{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;}
  .opts.one{grid-template-columns:1fr;}
  .field label{font-size:11.5px; font-weight:700; color:var(--sub); display:block; margin-bottom:6px;}
  .field input[type=text], .field input[type=number], .field select{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:13.5px; font-family:inherit; outline:none; background:white;
  }
  .field input[type=range]{width:100%;}
  .field-inline{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink); font-weight:600;}

  .btn{background:var(--brand); color:white; border:none; border-radius:12px; padding:12px 20px; font-weight:700; font-size:14px; cursor:pointer; display:inline-flex; align-items:center; gap:8px;}
  .btn:disabled{opacity:.4; cursor:default;}
  .btn.secondary{background:var(--chip); color:var(--brand);}
  .btn.accent{background:var(--accent);}
  .btn-row{display:flex; gap:10px; margin-top:20px; flex-wrap:wrap;}

  .thumbs{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px; margin-top:16px;}
  .thumb{border:1px solid var(--line); border-radius:12px; overflow:hidden; background:white; position:relative;}
  .thumb img, .thumb canvas{width:100%; display:block; background:#f0f0f0;}
  .thumb .tnum{position:absolute; top:8px; left:8px; background:rgba(32,36,43,.75); color:white; font-size:12px; font-weight:700; padding:3px 9px; border-radius:9px;}
  .thumb .tctrl{display:flex; justify-content:space-between; padding:8px 10px; background:var(--chip);}
  .thumb .tctrl button{background:none; border:none; font-size:14px; cursor:pointer; color:var(--brand); padding:3px 6px;}
  .thumb .tctrl button.del{color:var(--warn);}
  .thumb.removed{opacity:.35;}

  .progress-wrap{margin-top:18px;}
  .progress-bar{height:8px; background:var(--chip); border-radius:20px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--brand); width:0%; transition:width .2s;}
  .progress-label{font-size:11.5px; color:var(--sub); margin-top:6px;}

  .result-box{margin-top:18px; background:#F0FAF4; border:1px solid #CDEBDA; border-radius:14px; padding:16px; display:flex; align-items:center; gap:12px;}
  .result-box .ri{font-size:22px;}
  .result-box .rtext{flex:1; font-size:13px; font-weight:600; color:#175C3B;}
  .note{font-size:12px; color:var(--sub); background:var(--chip); border-radius:10px; padding:10px 12px; margin-top:14px; line-height:1.5;}
  .sig-canvas{border:1px solid var(--line); border-radius:12px; width:100%; touch-action:none; background:white;}

  .scan-video-wrap{position:relative; border-radius:16px; overflow:hidden; background:#000;}
  .scan-video-wrap video{width:100%; display:block; max-height:60vh; object-fit:contain; background:#000;}
  .shutter-row{display:flex; align-items:center; justify-content:center; gap:24px; margin-top:16px;}
  .shutter-btn{width:66px; height:66px; border-radius:50%; background:white; border:4px solid var(--brand); cursor:pointer;}
  .shutter-btn:active{background:var(--chip);}
  .scan-side-btn{background:var(--chip); color:var(--brand); border:none; border-radius:12px; padding:10px 14px; font-weight:700; font-size:12.5px; cursor:pointer;}
  .adjust-wrap{position:relative; touch-action:none; border-radius:14px; overflow:hidden; background:#111; margin:0 auto;}
  .adjust-wrap img{display:block; width:100%; user-select:none; -webkit-user-drag:none;}
  .adjust-wrap svg{position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;}
  .corner-handle{position:absolute; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%; background:rgba(55,82,166,.85); border:3px solid white; box-shadow:0 2px 8px rgba(0,0,0,.4); touch-action:none; cursor:grab;}
  .filter-row{display:flex; gap:8px; margin-top:14px; overflow-x:auto; padding-bottom:2px;}
  .filter-chip{flex:0 0 auto; background:var(--chip); border:2px solid transparent; border-radius:12px; padding:8px 14px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--ink);}
  .filter-chip.active{border-color:var(--brand); background:#EAF0FF; color:var(--brand-dark);}
  .scan-pages{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px; margin-top:16px;}
  .scan-page{border:1px solid var(--line); border-radius:10px; overflow:hidden; background:white; position:relative;}
  .scan-page img{width:100%; display:block;}
  .scan-page .spnum{position:absolute; top:4px; left:4px; background:rgba(32,36,43,.75); color:white; font-size:9.5px; font-weight:700; padding:1px 6px; border-radius:7px;}
  .scan-page .spdel{position:absolute; top:4px; right:4px; background:rgba(192,57,43,.9); color:white; border:none; width:20px; height:20px; border-radius:50%; font-size:12px; cursor:pointer;}
  footer{text-align:center; color:var(--sub); font-size:11.5px; padding:30px 0 10px;}
</style>
</head>

// For messages the person must not lose (e.g. a Payment ID to quote to support) —
// unlike a toast, this stays open until they close it, and offers a Copy button.
function mountCriticalNotice(title, message, copyValue){
  const overlay = el(`<div style="position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:300; display:flex; align-items:center; justify-content:center; padding:20px;"></div>`);

  `);

  if(copyBtn) copyBtn.onclick = ()=>{ navigator.clipboard && navigator.clipboard.writeText(copyValue).catch(()=>{}); copyBtn.textContent='✓ Copied'; setTimeout(()=>copyBtn.textContent='Copy',1200); };
}

// Converts raw/technical errors (network failures, null-client crashes, Supabase
// error codes) into a calm message a non-technical person can actually act on.
function friendlyErrorMessage(err){
  const msg = (err && err.message) || String(err || '');
  if(!sb || /Cannot read propert(y|ies) of null/i.test(msg) || /reading 'auth'/i.test(msg)){
    return 'Sign-in service is unavailable right now. Please check your internet connection and try again in a moment.';
  }
  if(/Failed to fetch|NetworkError|network error|ERR_/i.test(msg)){
    return 'Network error — please check your internet connection and try again.';
  }
  if(/Invalid login credentials/i.test(msg)) return 'Incorrect email or password. Please try again.';
  if(/User already registered/i.test(msg)) return 'An account with this email already exists — try signing in instead.';
  if(/Not enough credits/i.test(msg)) return msg;
  if(/Payment details missing|Invalid signature/i.test(msg)) return 'We couldn\'t verify that payment. Please contact support with your Payment ID if money was deducted.';
  return msg || 'Something went wrong. Please try again.';
}

// Lightweight, non-blocking toast (replaces alert() popups, which feel broken on mobile).
function showToast(message, kind){
  let holder = document.getElementById('__toastHolder');
  if(!holder){
    holder = el(`<div id="__toastHolder" style="position:fixed; left:0; right:0; bottom:18px; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:400; pointer-events:none;"></div>`);
    document.body.appendChild(holder);
  }
  const bg = kind==='error' ? '#C0392B' : kind==='warn' ? '#B8860B' : '#1E7145';
  const toast = el(`<div style="background:${bg}; color:#fff; font-size:13px; font-weight:600; padding:12px 20px; border-radius:12px; max-width:90vw; box-shadow:0 8px 24px rgba(0,0,0,.2); pointer-events:auto; text-align:center;">${message}</div>`);
  holder.appendChild(toast);
  setTimeout(()=>{ toast.style.transition='opacity .4s'; toast.style.opacity='0'; setTimeout(()=>toast.remove(), 400); }, 4200);
}

async function initAuth(){
  if(!sb) return;
  const { data } = await sb.auth.getSession();
  authState.session = data.session;
  if(authState.session) await refreshProfile();
  sb.auth.onAuthStateChange(async (event, session)=>{
    authState.session = session;
    if(session) await refreshProfile(); else authState.profile = null;
    render();
  });
}
// Wraps fetch() to our own backend with graceful handling for the very common
// case where Render's free tier has put the service to sleep: the platform can
// return a plain HTML "waking up" or error page instead of JSON while the
// container boots (can take 30-50s), which would otherwise crash res.json()
// with a cryptic "Unexpected token '<'" — this turns that into one clear,
// actionable message instead, and retries once automatically.
async function backendFetchJson(url, options, opts){
  const allowRetry = !opts || opts.retry !== false;
  const res = await fetch(url, options);
  const text = await res.text();
  let data;
  try{ data = JSON.parse(text); }
  catch(e){
    if(allowRetry){
      await new Promise(r=>setTimeout(r, 4000));
      return backendFetchJson(url, options, { retry: false });
    }
    throw new Error('The server is starting up (this can take up to a minute on the free tier) — please wait a moment and try again.');
  }
  if(!res.ok && !data.error) throw new Error(`Server error (${res.status})`);
  return data;
}
async function refreshProfile(){
  if(!sb || !authState.session) return;
  try{
    const data = await backendFetchJson(APP_CONFIG.BACKEND_URL + '/api/me', {
      headers: { Authorization: 'Bearer ' + authState.session.access_token }
    });
    if(!data.error) authState.profile = data;
  }catch(e){ /* backend maybe not deployed yet, or still waking up — app still works client-side-only */ }
}
async function authSignUp(email, password){
  if(!sb) throw new Error(friendlyErrorMessage(null));
  const { error } = await sb.auth.signUp({ email, password });
  if(error) throw new Error(friendlyErrorMessage(error));
}
async function authSignIn(email, password){
  if(!sb) throw new Error(friendlyErrorMessage(null));
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error) throw new Error(friendlyErrorMessage(error));
}
async function authSignOut(){
  if(!sb) return;
  await sb.auth.signOut();
  authState = { session:null, profile:null };
  render();
}
function isPro(){
  const p = authState.profile;
  if(!p) return false;
  if(p.plan !== 'pro' && p.plan !== 'business') return false;
  return !p.plan_expires_at || new Date(p.plan_expires_at) > new Date();
}

async function ensureRazorpayScript(){
  if(window.Razorpay) return;
  await loadScriptOnce('https://checkout.razorpay.com/v1/checkout.js');
}
async function startCheckout(planId, btn){
  if(!authState.session){ mountAuthModal(); return; }
  btn.textContent = '...'; btn.disabled = true;
  try{
    await ensureRazorpayScript();
    const order = await backendFetchJson(APP_CONFIG.BACKEND_URL + '/api/payment/create-order', {
      method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+authState.session.access_token },
      body: JSON.stringify({ planId })
    });
    if(order.error) throw new Error(order.error);
    const rzp = new Razorpay({
      key: order.keyId, amount: order.amount, currency: order.currency,
      name: 'PDF Tools', description: 'Credits / Plan',
      order_id: order.orderId,
      handler: async function(response){
        try{
          const result = await backendFetchJson(APP_CONFIG.BACKEND_URL + '/api/payment/verify', {
            method:'POST',
            headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+authState.session.access_token },
            body: JSON.stringify({
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature
            })
          });
          if(result.error) throw new Error(result.error);
          await refreshProfile(); render();
          showToast('✅ Payment successful! Credits have been added.', 'success');
        }catch(e){
          mountCriticalNotice(
            '⚠️ Payment received, but crediting failed',
            friendlyErrorMessage(e) + ' Please contact support with this Payment ID:',
            response.razorpay_payment_id || '—'
          );
        }
      },
      prefill: { email: authState.session.user.email }
    });
    rzp.open();
  }catch(e){ showToast(friendlyErrorMessage(e), 'error'); }
  finally{ btn.textContent='Buy'; btn.disabled=false; }
}

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function fmtBytes(b){
  if(b < 1024) return b + ' B';
  if(b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  return (b/1024/1024).toFixed(2) + ' MB';
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function readFileAsArrayBuffer(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsArrayBuffer(file);
  });
}

// compress's /api/video/compress, and the 6 AI tools' shared /api/ai/ask) —
// for these, the unlock gate below only CHECKS affordability, it doesn't also
// deduct, otherwise the first use of the tool would be charged twice.
const ACTION_CHARGED_TOOLS = new Set(['videocompress','askai','aisummarize','aitranslate','aihandwriting','aireceipt','airesume']);
async function mountPaidGate(body, tool, onUnlock){
  body.innerHTML = '';
  if(!authState.session){
    const box = el(`<div style="text-align:center; padding:40px 20px;">
      <div style="font-size:40px; margin-bottom:12px;">🔒</div>
      <div style="font-weight:900; font-size:16px; margin-bottom:6px;">Sign in required</div>
      <div style="color:var(--sub); font-size:13px; margin-bottom:18px;">This tool uses ${tool.cost} credit${tool.cost>1?'s':''} per use. Sign in to continue — new accounts get 5 free credits.</div>
      <button class="btn" id="__gateLogin">Sign In</button>
    </div>`);
    body.appendChild(box);
    box.querySelector('#__gateLogin').onclick = ()=> mountAuthModal();
    return;
  }
  if(!authState.profile){
    // Profile hasn't finished loading yet (e.g. tool opened right after sign-in) —
    // wait for it instead of wrongly showing "not enough credits" off a stale null.
    body.innerHTML = `<div style="text-align:center; padding:40px 20px; color:var(--sub); font-size:13px;">Checking your account…</div>`;
    await refreshProfile();
    if(!authState.profile){
      const box = el(`<div style="text-align:center; padding:40px 20px;">
        <div style="font-size:40px; margin-bottom:12px;">⚠️</div>
        <div style="font-weight:900; font-size:16px; margin-bottom:6px;">Couldn't verify your account</div>
        <div style="color:var(--sub); font-size:13px; margin-bottom:18px;">Please check your internet connection and try again.</div>
        <button class="btn" id="__gateRetry">Retry</button>
      </div>`);
      body.innerHTML = ''; body.appendChild(box);
      box.querySelector('#__gateRetry').onclick = ()=> mountPaidGate(body, tool, onUnlock);
      return;
    }
    updateCreditsBadgeInline();
  }
  if(isPro()){
    onUnlock();
    // Fire-and-forget so it's logged server-side too (0-cost for Pro, per deduct_credits SQL logic)
    fetch(APP_CONFIG.BACKEND_URL + '/api/credits/use', {
      method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer '+authState.session.access_token},
      body: JSON.stringify({ toolId: tool.id, cost: tool.cost, checkOnly: ACTION_CHARGED_TOOLS.has(tool.id) })
    }).catch(()=>{});
    return;
  }
  const credits = authState.profile ? authState.profile.credits : 0;
  if(credits < tool.cost){
    const box = el(`<div style="text-align:center; padding:40px 20px;">
      <div style="font-size:40px; margin-bottom:12px;">💳</div>
      <div style="font-weight:900; font-size:16px; margin-bottom:6px;">Not enough credits</div>
      <div style="color:var(--sub); font-size:13px; margin-bottom:18px;">You have ${credits} credits — this tool needs ${tool.cost}.</div>
      <button class="btn" id="__gateBuy">Buy Credits</button>
    </div>`);
    body.innerHTML = ''; body.appendChild(box);
    box.querySelector('#__gateBuy').onclick = ()=> mountPricingModal();
    return;
  }
  const actionCharged = ACTION_CHARGED_TOOLS.has(tool.id);
  const box = el(`<div style="text-align:center; padding:40px 20px;">
    <div style="font-size:40px; margin-bottom:12px;">⚡</div>
    <div style="font-weight:900; font-size:16px; margin-bottom:6px;">${actionCharged ? 'Ready to use' : 'Unlock this tool'}</div>
    <div style="color:var(--sub); font-size:13px; margin-bottom:18px;">${actionCharged ? `This tool costs ${tool.cost} credit${tool.cost>1?'s':''} each time you use it (you have ${credits}).` : `This will use ${tool.cost} credit${tool.cost>1?'s':''} from your balance (${credits} available).`}</div>
    <button class="btn" id="__gateUnlock">${actionCharged ? 'Continue' : `Use ${tool.cost} Credit${tool.cost>1?'s':''} & Continue`}</button>
  </div>`);
  body.innerHTML = ''; body.appendChild(box);
  const unlockBtn = box.querySelector('#__gateUnlock');
  unlockBtn.onclick = async ()=>{
    unlockBtn.textContent = 'Checking…'; unlockBtn.disabled = true;
    try{
      const result = await backendFetchJson(APP_CONFIG.BACKEND_URL + '/api/credits/use', {
        method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer '+authState.session.access_token},
        body: JSON.stringify({ toolId: tool.id, cost: tool.cost, checkOnly: actionCharged })
      });
      if(result.error) throw new Error(result.error);
      if(!actionCharged){ await refreshProfile(); updateCreditsBadgeInline(); }
      onUnlock();
    }catch(e){
      body.innerHTML = `<div class="note" style="background:#FDEDEC;">Error: ${friendlyErrorMessage(e)}</div>`;
    }
  };
}

async function loadPdfJs(arrayBuffer){
  const task = pdfjsLib.getDocument({data: arrayBuffer.slice(0)});
  return await task.promise;
}
async function renderThumbDataUrl(pdfjsDoc, pageNum, scale){
  const page = await pdfjsDoc.getPage(pageNum);
  const viewport = page.getViewport({scale: scale || 0.35});
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({canvasContext: ctx, viewport}).promise;
  return canvas.toDataURL('image/jpeg', 0.7);
}

/* ===================== Shared: font-correct HTML/Text -> PDF (renders via browser fonts, so any script/ligature is correct) ===================== */
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
async function waitFontsReady(){
  try{ if(document.fonts && document.fonts.ready) await document.fonts.ready; }catch(e){}
}
async function htmlToFontCorrectPdfBytes(content, opts){
  opts = opts || {};
  const pagePxW = 900, scale = opts.scale || 2;
  const holder = document.createElement('div');
  holder.style.position = 'fixed'; holder.style.left = '-99999px'; holder.style.top = '0';
  holder.style.width = pagePxW + 'px';
  holder.style.background = '#ffffff'; holder.style.color = '#111';
  holder.style.padding = '36px';
  holder.style.fontFamily = opts.fontFamily || "'Noto Sans Tamil','Noto Sans','Inter',sans-serif";
  holder.style.fontSize = (opts.fontSize||16)+'px';
  holder.style.lineHeight = '1.7';
  holder.style.whiteSpace = opts.isHtml ? 'normal' : 'pre-wrap';
  holder.style.wordBreak = 'break-word';
  if(opts.isHtml) holder.innerHTML = content; else holder.textContent = content;
  document.body.appendChild(holder);
  await waitFontsReady();
  await new Promise(r=>setTimeout(r, 80));
  const canvas = await html2canvas(holder, {scale, backgroundColor:'#ffffff', useCORS:true});
  document.body.removeChild(holder);

  const a4W = 595.28, a4H = 841.89;
  const pageCanvasH = Math.max(1, Math.floor(canvas.width * (a4H/a4W)));
  const doc = await PDFDocument.create();
  let y = 0;
  while(y < canvas.height){
    const sliceH = Math.min(pageCanvasH, canvas.height - y);
    const pc = document.createElement('canvas');
    pc.width = canvas.width; pc.height = sliceH;
    const ctx = pc.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,pc.width,pc.height);
    ctx.drawImage(canvas, 0, y, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
    const dataUrl = pc.toDataURL('image/jpeg', 0.92);
    const bytes = Uint8Array.from(atob(dataUrl.split(',')[1]), c=>c.charCodeAt(0));
    const jpg = await doc.embedJpg(bytes);
    const page = doc.addPage([a4W, a4H]);
    const drawH = a4W * (sliceH/canvas.width);
    page.drawImage(jpg, {x:0, y:a4H-drawH, width:a4W, height:drawH});
    y += sliceH;
  }
  return await doc.save();
}

/* ===================== Shared: perspective warp (document edge correction) ===================== */
// Solve H such that srcPt = H(dstPt), given 4 correspondences. dst is axis-aligned rect corners.
function solveLinear(A, b){ // Gaussian elimination, A: n x n, b: n
  const n = A.length;
  for(let i=0;i<n;i++){
    let maxRow = i;
    for(let k=i+1;k<n;k++) if(Math.abs(A[k][i]) > Math.abs(A[maxRow][i])) maxRow = k;
    [A[i],A[maxRow]] = [A[maxRow],A[i]]; [b[i],b[maxRow]] = [b[maxRow],b[i]];
    if(Math.abs(A[i][i]) < 1e-12) continue;
    for(let k=i+1;k<n;k++){
      const f = A[k][i]/A[i][i];
      for(let j=i;j<n;j++) A[k][j] -= f*A[i][j];
      b[k] -= f*b[i];
    }
  }
  const x = new Array(n).fill(0);
  for(let i=n-1;i>=0;i--){
    let s = b[i];
    for(let j=i+1;j<n;j++) s -= A[i][j]*x[j];
    x[i] = Math.abs(A[i][i])<1e-12 ? 0 : s/A[i][i];
  }
  return x;
}
function computeHomography(dstPts, srcPts){
  const A = [], b = [];
  for(let i=0;i<4;i++){
    const [x,y] = dstPts[i], [X,Y] = srcPts[i];
    A.push([x,y,1,0,0,0,-X*x,-X*y]); b.push(X);
    A.push([0,0,0,x,y,1,-Y*x,-Y*y]); b.push(Y);
  }
  const [a,bb,c,d,e,f,g,h] = solveLinear(A,b);
  return {a,b:bb,c,d,e,f,g,h};
}
function estimateOutputSize(quad){
  const dist = (p,q)=>Math.hypot(p.x-q.x,p.y-q.y);
  const wTop = dist(quad[0],quad[1]), wBot = dist(quad[3],quad[2]);
  const hL = dist(quad[0],quad[3]), hR = dist(quad[1],quad[2]);
  let w = Math.max(wTop,wBot), h = Math.max(hL,hR);
  const maxDim = 1500;
  if(w>maxDim || h>maxDim){ const s = maxDim/Math.max(w,h); w*=s; h*=s; }
  return { w: Math.max(200,Math.round(w)), h: Math.max(200,Math.round(h)) };
}
// quad: 4 points {x,y} in source-image pixel space, ordered TL,TR,BR,BL
function warpPerspective(sourceCanvas, quad){
  const {w:outW, h:outH} = estimateOutputSize(quad);
  const dstPts = [[0,0],[outW,0],[outW,outH],[0,outH]];
  const srcPts = quad.map(p=>[p.x,p.y]);
  const H = computeHomography(dstPts, srcPts);
  const sctx = sourceCanvas.getContext('2d');
  const srcData = sctx.getImageData(0,0,sourceCanvas.width, sourceCanvas.height);
  const sw = sourceCanvas.width, sh = sourceCanvas.height, sPix = srcData.data;
  const out = document.createElement('canvas'); out.width = outW; out.height = outH;
  const octx = out.getContext('2d');
  const dstImg = octx.createImageData(outW, outH);
  const dPix = dstImg.data;
  for(let v=0; v<outH; v++){
    for(let u=0; u<outW; u++){
      const denom = H.g*u + H.h*v + 1;
      const sx = (H.a*u + H.b*v + H.c)/denom;
      const sy = (H.d*u + H.e*v + H.f)/denom;
      const di = (v*outW+u)*4;
      if(sx<0 || sy<0 || sx>=sw-1 || sy>=sh-1){ dPix[di]=255;dPix[di+1]=255;dPix[di+2]=255;dPix[di+3]=255; continue; }
      const x0=Math.floor(sx), y0=Math.floor(sy), fx=sx-x0, fy=sy-y0;
      for(let c=0;c<3;c++){
        const p00=sPix[(y0*sw+x0)*4+c], p10=sPix[(y0*sw+x0+1)*4+c];
        const p01=sPix[((y0+1)*sw+x0)*4+c], p11=sPix[((y0+1)*sw+x0+1)*4+c];
        const top = p00*(1-fx)+p10*fx, bot = p01*(1-fx)+p11*fx;
        dPix[di+c] = top*(1-fy)+bot*fy;
      }
      dPix[di+3] = 255;
    }
  }
  octx.putImageData(dstImg, 0, 0);
  return out;
}
function applyDocFilter(canvas, mode){
  if(mode==='original') return canvas;
  const ctx = canvas.getContext('2d');
  const img = ctx.getImageData(0,0,canvas.width,canvas.height);
  const d = img.data;
  for(let i=0;i<d.length;i+=4){
    let gray = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    if(mode==='gray'){
      d[i]=d[i+1]=d[i+2]=gray;
    } else if(mode==='enhance'){
      gray = (gray-128)*1.35 + 128 + 12;
      gray = Math.max(0,Math.min(255,gray));
      const factor = gray/((d[i]+d[i+1]+d[i+2])/3 || 1);
      d[i]=Math.min(255,d[i]*factor); d[i+1]=Math.min(255,d[i+1]*factor); d[i+2]=Math.min(255,d[i+2]*factor);
    } else if(mode==='bw'){
      const v = gray > 150 ? 255 : (gray < 90 ? 0 : gray);
      d[i]=d[i+1]=d[i+2]= v>150?255:(v<90?0:255*((v-90)/60));
    }
  }
  ctx.putImageData(img,0,0);
  return canvas;
}

/* ===================== Shared: AI auto edge-detection (OpenCV.js, loaded on demand) ===================== */
function ensureOpenCv(){
  if(window.__cvReadyPromise) return window.__cvReadyPromise;
  window.__cvReadyPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://docs.opencv.org/4.8.0/opencv.js';
    script.async = true;
    script.onload = async ()=>{
      try{
        let cv = window.cv;
        if(cv && typeof cv.then === 'function'){ cv = await cv; window.cv = cv; resolve(cv); }
        else if(cv && cv.Mat){ resolve(cv); }
        else {
          cv['onRuntimeInitialized'] = ()=> resolve(window.cv);
        }
      }catch(e){ reject(e); }
    };
    script.onerror = ()=> reject(new Error('OpenCV.js ஏற்ற முடியவில்லை (இணையம் தேவை)'));
    document.head.appendChild(script);
  });
  return window.__cvReadyPromise;
}
/* ===================== Shared: OpenCV runs in a Web Worker (never blocks UI) =====
   grabCut/inpaint/bilateralFilter etc. are genuinely CPU-heavy — running them on
   the main thread freezes the whole page (Chrome's "Page Unresponsive" dialog)
   for several seconds on anything but tiny images. Running the SAME opencv.js
   inside a Worker keeps the UI (progress bar, buttons) fully responsive while
   the computation happens in the background. ================================= */
const CV_WORKER_SRC = `
let cvReadyPromise = null;
function ensureCv(){

      try{ importScripts('https://docs.opencv.org/4.8.0/opencv.js'); }
      catch(e){ reject(e); }

    let outData, outWidth = width, outHeight = height;

    if(op === 'grabcut'){

      const mask = track(new cv.Mat.zeros(height, width, cv.CV_8UC1));
      const bgd = track(new cv.Mat()); const fgd = track(new cv.Mat());

      outData.set(mask.data);

      const dst = track(new cv.Mat());
      cv.inpaint(src, mask, dst, 7, cv.INPAINT_TELEA);

      const inv = track(new cv.Mat()); cv.bitwise_not(gray, inv);
      const blur = track(new cv.Mat()); cv.GaussianBlur(inv, blur, new cv.Size(21,21), 0);
      const invBlur = track(new cv.Mat()); cv.bitwise_not(blur, invBlur);
      const sk = track(new cv.Mat()); cv.divide(gray, invBlur, sk, 256);
      const rgba = track(new cv.Mat()); cv.cvtColor(sk, rgba, cv.COLOR_GRAY2RGBA);
      outData = new Uint8ClampedArray(rgba.data);
    } else if(op === 'cartoon'){
      const gray = track(new cv.Mat()); cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
      const blur = track(new cv.Mat()); cv.medianBlur(gray, blur, 7);
      const edges = track(new cv.Mat()); cv.adaptiveThreshold(blur, edges, 255, cv.ADAPTIVE_THRESH_MEAN_C, cv.THRESH_BINARY, 9, 9);
      const color = track(new cv.Mat()); cv.bilateralFilter(src, color, 9, 250, 250);
      const edgesRgba = track(new cv.Mat()); cv.cvtColor(edges, edgesRgba, cv.COLOR_GRAY2RGBA);
      const cartoon = track(new cv.Mat()); cv.bitwise_and(color, edgesRgba, cartoon);
      outData = new Uint8ClampedArray(cartoon.data);
    } else if(op === 'sticker'){
      const rgb = track(new cv.Mat()); cv.cvtColor(src, rgb, cv.COLOR_RGBA2RGB);
      const mask = track(new cv.Mat.zeros(height, width, cv.CV_8UC1));
      const bgd = track(new cv.Mat()); const fgd = track(new cv.Mat());
      cv.grabCut(rgb, mask, new cv.Rect(params.x, params.y, params.w, params.h), bgd, fgd, 5, cv.GC_INIT_WITH_RECT);
      const alphaMat = track(new cv.Mat(height, width, cv.CV_8UC1, new cv.Scalar(0)));
      for(let q=0;q<mask.rows*mask.cols;q++){ const v=mask.data[q]; if(v===1||v===3) alphaMat.data[q]=255; }
      const dilated = track(new cv.Mat());

      const kernel = track(cv.Mat.ones(k, k, cv.CV_8U));
      cv.dilate(alphaMat, dilated, kernel);
      outData = new Uint8ClampedArray(src.data); // start from the original RGBA pixels
      for(let q=0, p=0; q<alphaMat.rows*alphaMat.cols; q++, p+=4){
        const inObj = alphaMat.data[q] > 0, inRing = dilated.data[q] > 0;
        if(inRing && !inObj){ outData[p]=255; outData[p+1]=255; outData[p+2]=255; outData[p+3]=255; } // white border ring
        else if(!inObj && !inRing){ outData[p+3] = 0; } // fully outside — transparent
      }

          if(area0 > largestAnyArea){ largestAnyArea = area0; if(largestAny) largestAny.delete(); largestAny = cnt.clone(); }
          const peri = cv.arcLength(cnt, true);

          if(approx.rows === 4){
            const area = Math.abs(cv.contourArea(approx));
            if(area > bestArea && area > imgArea*minAreaFrac){
              bestArea = area;
              const pts = [];
              for(let j=0;j<4;j++) pts.push({x: approx.data32S[j*2], y: approx.data32S[j*2+1]});
              best = pts;
            }
          }
          approx.delete(); cnt.delete();

          // use its bounding rectangle as a much better guess than a full-frame default.

      // backgrounds (e.g. a card photographed on a similarly-light surface).
      if(!best){

      // only fill a smaller portion of the frame.
      if(!best){

    mats.forEach(m=>{ try{ m.delete(); }catch(e){} });
    self.postMessage({ id, ok:false, error: (err && err.message) || String(err) });
  }

let __cvWorker = null, __cvMsgId = 0;
const __cvPending = {};
function ensureCvWorker(){
  if(!__cvWorker){
    const blob = new Blob([CV_WORKER_SRC], {type:'text/javascript'});
    __cvWorker = new Worker(URL.createObjectURL(blob));
    __cvWorker.onmessage = (e)=>{
      const { id, ok, error, ...rest } = e.data;
      const p = __cvPending[id]; delete __cvPending[id];
      if(!p) return;
      if(ok) p.resolve(rest); else p.reject(new Error(error));
    };
    __cvWorker.onerror = (e)=>{
      Object.keys(__cvPending).forEach(id=>{ __cvPending[id].reject(new Error('AI worker crashed: '+e.message)); delete __cvPending[id]; });
    };
  }
  return __cvWorker;
}
// Runs an OpenCV op in the background worker. imageData: {width,height,data:Uint8ClampedArray(RGBA)}.
// Returns {width,height,data} — for 'grabcut', data is a single-channel mask (0/1/2/3 per pixel);
// for the others, data is a full RGBA image the same size as the input.
function runCvOp(op, imageData, params){
  return new Promise((resolve, reject)=>{
    const worker = ensureCvWorker();
    const id = ++__cvMsgId;
    __cvPending[id] = { resolve, reject };
    const dataCopy = new Uint8Array(imageData.data); // copy so the transfer doesn't detach the caller's buffer
    worker.postMessage({ id, op, width: imageData.width, height: imageData.height, data: dataCopy, params: params||{} }, [dataCopy.buffer]);
  });
}

function orderQuadPoints(pts){
  const sum = pts.map(p=>p.x+p.y);
  const diff = pts.map(p=>p.x-p.y);
  const tl = pts[sum.indexOf(Math.min(...sum))];
  const br = pts[sum.indexOf(Math.max(...sum))];
  const tr = pts[diff.indexOf(Math.max(...diff))];
  const bl = pts[diff.indexOf(Math.min(...diff))];
  return [tl,tr,br,bl];
}
// Returns 4 ordered {x,y} points (in the given canvas's pixel space) of the largest document-like
// quadrilateral found, or null if none detected confidently. Never throws.
async function autoDetectQuad(canvas){
  try{
    const imageData = canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height);
    const result = await runCvOp('detectquad', imageData, {});
    return result.quad ? orderQuadPoints(result.quad) : null;
  }catch(e){
    return null;
  }
}

/* ===================== Shared: ffmpeg.wasm (video engine, loaded on demand) ===================== */
// Uses ffmpeg.wasm v0.12 with the single-thread core, which runs fine WITHOUT
// SharedArrayBuffer / cross-origin-isolation headers (unlike the old v0.11 API
// and unlike the multi-thread "core-mt" build) — important because this file is
// opened as a plain static HTML file with no server headers we control.
function loadScriptOnce(src){
  return new Promise((resolve, reject)=>{
    if(document.querySelector(`script[data-src="${src}"]`)){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.async = true; s.setAttribute('data-src', src);
    s.onload = ()=> resolve();
    s.onerror = ()=> reject(new Error('இயந்திரம் ஏற்ற முடியவில்லை — இணைய இணைப்பை சரிபார்த்து மீண்டும் முயற்சிக்கவும்.'));
    document.head.appendChild(s);
  });
}

/* ===================== Shared: Unicode (Tamil-capable) font for PDF text ======
   pdf-lib's built-in StandardFonts (Helvetica etc.) only support WinAnsi encoding
   — plain Latin script. Any Tamil (or other non-Latin) character typed into a
   watermark, stamp, header/footer, or Text→PDF tool throws "WinAnsi cannot
   encode…" and crashes. Fix: embed a real Unicode font (Noto Sans Tamil, covers
   Tamil + Latin + digits) via the fontkit plugin, and use IT instead for any
   text the user typed themselves. Falls back to Helvetica only if the font
   can't be fetched (e.g. no internet on first load), so English-only text still
   works even then. ================================================================ */
let __fontkitPromise = null, __tamilFontBytesPromise = null;
function ensureFontkitLib(){
  if(!__fontkitPromise){
    __fontkitPromise = loadScriptOnce('https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js')
      .then(()=> window.fontkit);
  }
  return __fontkitPromise;
}
function ensureTamilFontBytes(){
  if(!__tamilFontBytesPromise){
    __tamilFontBytesPromise = fetch('https://raw.githubusercontent.com/google/fonts/main/ofl/notosanstamil/NotoSansTamil%5Bwdth%2Cwght%5D.ttf')
      .then(r=>{ if(!r.ok) throw new Error('font fetch failed'); return r.arrayBuffer(); });
  }
  return __tamilFontBytesPromise;
}
// Embeds a Unicode-capable font into `doc` and returns it. Use this instead of
// StandardFonts.Helvetica/HelveticaBold for ANY text the person typed themselves
// (watermarks, stamps, headers/footers, Text→PDF) — not needed for our own fixed
// English UI labels.
async function embedUnicodeFont(doc){
  try{
    const fk = await ensureFontkitLib();
    doc.registerFontkit(fk);
    const bytes = await ensureTamilFontBytes();
    return await doc.embedFont(bytes, { subset: true });
  }catch(e){
    return await doc.embedFont(StandardFonts.Helvetica); // offline fallback — English-only text still works
  }
}

// Wraps a same-origin-restricted classic Worker script load: browsers refuse to

function crossOriginWorkerBlobURL(url){

  return URL.createObjectURL(new Blob([code], {type:'text/javascript'}));

function ensureFFmpeg(){

    let indicator = null;
    try{
      indicator = el(`<div style="position:fixed; left:0; right:0; bottom:0; background:#20242B; color:#fff; font-size:12.5px; font-weight:700; padding:10px 16px; text-align:center; z-index:500;">⏳ Loading video engine (first time only, ~25MB)… <span id="__ffLoadPct">0%</span></div>`);
      document.body.appendChild(indicator);
      await loadScriptOnce('https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js');
      const { FFmpeg } = window.FFmpegWASM;
      const ffmpeg = new FFmpeg();
      const base = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
      const pctEl = indicator.querySelector('#__ffLoadPct');
      await ffmpeg.load({
        coreURL: await toBlobURL(`${base}/ffmpeg-core.js`, 'text/javascript'),
        wasmURL: await toBlobURL(`${base}/ffmpeg-core.wasm`, 'application/wasm', (frac)=>{ if(pctEl) pctEl.textContent = Math.round(frac*100)+'%'; }),
        // The ffmpeg.wasm UMD build spawns its own worker chunk (814.ffmpeg.js) as a
        // raw cross-origin Worker, which fails with "cannot be accessed from origin
        // 'null'" on pages without a real http(s) origin. Routing it through a blob
        // that just importScripts()'s the real file fixes it (see comment above).
        classWorkerURL: crossOriginWorkerBlobURL('https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/814.ffmpeg.js')
      });
      indicator.remove();
      return { ffmpeg, fetchFile };
    }catch(e){
      if(indicator) indicator.remove();
      window.__ffmpegReadyPromise = null; // allow retry next time instead of caching a failure forever
      throw new Error('Could not load video engine — check your internet connection and try again. (' + (e && e.message ? e.message : e) + ')');
    }
  })();
  return window.__ffmpegReadyPromise;
}
// Local replacements for @ffmpeg/util's fetchFile/toBlobURL (that package's CDN
// UMD build was unreliable), converting a File/Blob into the bytes ffmpeg.wasm needs.
async function fetchFile(file){
  if(file instanceof Blob) return new Uint8Array(await file.arrayBuffer());
  if(typeof file === 'string'){ const r = await fetch(file); return new Uint8Array(await r.arrayBuffer()); }
  return new Uint8Array(file);
}
async function toBlobURL(url, mimeType, onProgress){
  const resp = await fetch(url);
  const total = Number(resp.headers.get('content-length')) || 0;
  if(!total || !resp.body || !onProgress){
    const buf = await resp.arrayBuffer();
    return URL.createObjectURL(new Blob([buf], {type: mimeType}));
  }
  const reader = resp.body.getReader();
  const chunks = [];
  let received = 0;
  while(true){
    const { done, value } = await reader.read();
    if(done) break;
    chunks.push(value);
    received += value.length;
    onProgress(received/total);
  }
  return URL.createObjectURL(new Blob(chunks, {type: mimeType}));
}
function fmtTime(s){
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return (h>0?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function parseTimeToSec(str){
  const parts = String(str).trim().split(':').map(x=>Number(x.trim())||0);
  if(parts.length===3) return parts[0]*3600+parts[1]*60+parts[2];
  if(parts.length===2) return parts[0]*60+parts[1];
  return Number(str)||0;
}
function getVideoDuration(file){
  return new Promise((resolve,reject)=>{
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.onloadedmetadata = ()=>{ const d = v.duration; URL.revokeObjectURL(v.src); resolve(d); };
    v.onerror = ()=>{ URL.revokeObjectURL(v.src); reject(new Error('Could not read the video')); };
    v.src = URL.createObjectURL(file);
  });
}

function ensureQrLib(){
  if(window.__qrReadyPromise) return window.__qrReadyPromise;
  window.__qrReadyPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';

    script.onload = ()=> resolve(window.QRCode);

  });

}

/* ===================== Shared: drag-to-select rectangle over an <img> preview (fractional coords) ===================== */
// Mounts an image with a draggable/resizable selection rectangle. Returns {el, getRect()} where
// getRect() returns {fx0,fy0,fx1,fy1} in 0..1 image-fraction space.
function mountRectSelector(container, imgSrc, initRect){
  let rect = initRect || {fx0:0.15, fy0:0.4, fx1:0.85, fy1:0.6};
  const wrap = el(`<div class="adjust-wrap" style="max-width:520px;"><img draggable="false"></div>`);
  const imgEl = wrap.querySelector('img');
  imgEl.src = imgSrc;
  const box = el(`<div style="position:absolute; border:2px solid var(--accent); background:rgba(232,137,74,.25); cursor:move; touch-action:none;"></div>`);
  wrap.appendChild(box);
  ['nw','ne','sw','se'].forEach(pos=>{
    const h = el(`<div class="corner-handle" data-pos="${pos}" style="background:rgba(232,137,74,.9);"></div>`);
    wrap.appendChild(h);
  });
  container.appendChild(wrap);
  function apply(){
    const x0 = Math.min(rect.fx0,rect.fx1), x1 = Math.max(rect.fx0,rect.fx1);
    const y0 = Math.min(rect.fy0,rect.fy1), y1 = Math.max(rect.fy0,rect.fy1);
    box.style.left = (x0*100)+'%'; box.style.top = (y0*100)+'%';
    box.style.width = ((x1-x0)*100)+'%'; box.style.height = ((y1-y0)*100)+'%';
    wrap.querySelectorAll('.corner-handle').forEach(h=>{
      const pos = h.getAttribute('data-pos');
      h.style.left = ((pos.includes('w')?x0:x1)*100)+'%';
      h.style.top = ((pos.includes('n')?y0:y1)*100)+'%';
    });
  }
  apply();
  let dragMode = null, startFx=0, startFy=0, startRect=null;
  function fracFromEvent(e){
    const r = wrap.getBoundingClientRect();
    return { fx: Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)), fy: Math.max(0,Math.min(1,(e.clientY-r.top)/r.height)) };
  }
  box.addEventListener('pointerdown', (e)=>{ box.setPointerCapture(e.pointerId); dragMode='move'; const f=fracFromEvent(e); startFx=f.fx; startFy=f.fy; startRect={...rect}; e.preventDefault(); });
  box.addEventListener('pointermove', (e)=>{
    if(dragMode!=='move' || e.buttons===0) return;
    const f = fracFromEvent(e); const dx=f.fx-startFx, dy=f.fy-startFy;
    const w = startRect.fx1-startRect.fx0, h = startRect.fy1-startRect.fy0;
    let x0 = startRect.fx0+dx, y0 = startRect.fy0+dy;
    x0 = Math.max(0,Math.min(1-w,x0)); y0 = Math.max(0,Math.min(1-h,y0));
    rect = {fx0:x0, fy0:y0, fx1:x0+w, fy1:y0+h}; apply();
  });
  box.addEventListener('pointerup', ()=>{ dragMode=null; });
  wrap.querySelectorAll('.corner-handle').forEach(h=>{
    const pos = h.getAttribute('data-pos');
    h.addEventListener('pointerdown', (e)=>{ h.setPointerCapture(e.pointerId); e.stopPropagation(); e.preventDefault(); });
    h.addEventListener('pointermove', (e)=>{
      if(e.buttons===0) return;
      const f = fracFromEvent(e);
      if(pos.includes('w')) rect.fx0=f.fx; else rect.fx1=f.fx;
      if(pos.includes('n')) rect.fy0=f.fy; else rect.fy1=f.fy;
      apply();
    });
  });
  return { el: wrap, getRect(){ return { fx0:Math.min(rect.fx0,rect.fx1), fy0:Math.min(rect.fy0,rect.fy1), fx1:Math.max(rect.fx0,rect.fx1), fy1:Math.max(rect.fy0,rect.fy1) }; } };
}

/* ===================== Shared: brush-paint mask over a canvas (for inpainting) ===================== */
// Draws a red translucent mask on an overlay canvas positioned on top of the base canvas.
function mountBrushMask(container, baseCanvas, initBrush){
  const holder = el(`<div style="position:relative; max-width:520px; margin:0 auto; border-radius:14px; overflow:hidden; touch-action:none;"></div>`);
  baseCanvas.style.width = '100%'; baseCanvas.style.display = 'block';
  holder.appendChild(baseCanvas);
  const maskCanvas = document.createElement('canvas');
  maskCanvas.width = baseCanvas.width; maskCanvas.height = baseCanvas.height;
  maskCanvas.style.position = 'absolute'; maskCanvas.style.left='0'; maskCanvas.style.top='0';
  maskCanvas.style.width='100%'; maskCanvas.style.height='100%';
  holder.appendChild(maskCanvas);
  container.appendChild(holder);
  const mctx = maskCanvas.getContext('2d');
  let brush = initBrush || 28;
  let painting = false;
  function paintAt(x,y){
    mctx.fillStyle = 'rgba(220,30,30,0.55)';
    mctx.beginPath(); mctx.arc(x,y,brush,0,Math.PI*2); mctx.fill();
  }
  function toCanvasXY(e){
    const r = maskCanvas.getBoundingClientRect();
    const sx = maskCanvas.width/r.width, sy = maskCanvas.height/r.height;
    return { x:(e.clientX-r.left)*sx, y:(e.clientY-r.top)*sy };
  }
  maskCanvas.addEventListener('pointerdown', (e)=>{ painting=true; maskCanvas.setPointerCapture(e.pointerId); const p=toCanvasXY(e); paintAt(p.x,p.y); e.preventDefault(); });
  maskCanvas.addEventListener('pointermove', (e)=>{ if(!painting) return; const p=toCanvasXY(e); paintAt(p.x,p.y); });
  maskCanvas.addEventListener('pointerup', ()=> painting=false);
  maskCanvas.addEventListener('pointerleave', ()=> painting=false);
  return {
    holder,
    setBrush(v){ brush = v; },
    clear(){ mctx.clearRect(0,0,maskCanvas.width,maskCanvas.height); },
    getMaskCanvas(){ return maskCanvas; },
    hasPaint(){
      const d = mctx.getImageData(0,0,maskCanvas.width,maskCanvas.height).data;
      for(let i=3;i<d.length;i+=4) if(d[i]>0) return true;
      return false;
    }
  };
}

TOOL_IMPL.split = {
  mount(container){
    let file = null, pageCount = 0;
    const body = el(`<div></div>`); container.appendChild(body);

    function paint(){
      body.innerHTML = '';
      if(!file){
        mountUploader(body, {
          accept:'application/pdf',
          label:'Drop a PDF file', sublabel:'Choose a page range to split',
          onAdd: async (fl)=>{
            file = fl[0];
            const buf = await readFileAsArrayBuffer(file);
            const doc = await PDFDocument.load(buf, {ignoreEncryption:true});
            pageCount = doc.getPageCount();
            file._buf = buf;
            paint();
          }
        });
        return;
      }
      mountFileList(body, [file], ()=>{ file=null; paint(); });
      const opts = el(`
        <div class="opts one tamil">
          <div class="field">
            <label>Page range (e.g. 1-3, 5, 7-9) — out of ${pageCount} பக்கங்கள்</label>
            <input type="text" id="rangeInput" placeholder="1-${pageCount}" value="1-${pageCount}">
          </div>
        </div>
      `);
      body.appendChild(opts);
      const row = el(`<div class="btn-row"></div>`);
      const btn = el(`<button class="btn tamil">✂️ பிரித்து Download</button>`);
      btn.onclick = doSplit;
      row.appendChild(btn);
      body.appendChild(row);
    }

    function parseRanges(str, max){
      const idxs = new Set();
      str.split(',').forEach(part=>{
        part = part.trim(); if(!part) return;
        if(part.includes('-')){
          const [a,b] = part.split('-').map(n=>parseInt(n.trim(),10));
          if(!isNaN(a) && !isNaN(b)){ for(let i=Math.max(1,a); i<=Math.min(max,b); i++) idxs.add(i-1); }
        } else {
          const n = parseInt(part,10);
          if(!isNaN(n) && n>=1 && n<=max) idxs.add(n-1);
        }
      });
      return Array.from(idxs).sort((a,b)=>a-b);
    }

    async function doSplit(){
      const rangeStr = body.querySelector('#rangeInput').value || `1-${pageCount}`;
      const idxs = parseRanges(rangeStr, pageCount);
      if(!idxs.length){ mountResult(body,'Please enter a valid page range.').style.background='#FDEDEC'; return; }
      const prog = mountProgress(body);
      try{
        prog.set(20,'Reading…');
        const src = await PDFDocument.load(file._buf, {ignoreEncryption:true});
        const outDoc = await PDFDocument.create();
        prog.set(50,'Extracting pages…');
        const pages = await outDoc.copyPages(src, idxs);
        pages.forEach(p=>outDoc.addPage(p));
        prog.set(90,'Preparing…');
        const bytes = await outDoc.save();
        prog.set(100,'Done');
        downloadBlob(new Blob([bytes],{type:'application/pdf'}), 'split.pdf');
        prog.remove();
        mountResult(body, `${idxs.length} new file with PDF downloaded.`);
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

/* ===================== Shared thumbnail-grid tool base (remove/organize/rotate) ===================== */
async function mountThumbTool(container, mode){
  let file = null, pdfjsDoc = null, pageCount = 0;
  let order = [];      // array of original page indices in current order
  let removed = new Set();
  let rotations = {};  // idx -> degrees added (0/90/180/270)
  const body = el(`<div></div>`); container.appendChild(body);

  function paintUpload(){
    body.innerHTML = '';
    mountUploader(body, {
      accept:'application/pdf',
      label:'Drop a PDF file', sublabel:'See every page clearly before you decide',
      onAdd: async (fl)=>{
        file = fl[0];
        const buf = await readFileAsArrayBuffer(file);
        file._buf = buf;
        pdfjsDoc = await loadPdfJs(buf);
        pageCount = pdfjsDoc.numPages;
        order = Array.from({length:pageCount},(_,i)=>i);
        removed = new Set();
        rotations = {};
        await paintThumbs();
      }
    });
  }

  async function paintThumbs(){
    body.innerHTML = '';
    mountFileList(body, [file], ()=>{ file=null; paintUpload(); });
    const grid = el(`<div class="thumbs"></div>`);
    body.appendChild(grid);
    const label = el(`<div class="progress-label" style="margin-top:10px;">Rendering page previews…</div>`);
    body.appendChild(label);

    for(let pos=0; pos<order.length; pos++){
      const pageIdx = order[pos];
      const dataUrl = await renderThumbDataUrl(pdfjsDoc, pageIdx+1, 1.0); // bigger, clearer preview
      const rot = rotations[pageIdx] || 0;
      const thumb = el(`
        <div class="thumb ${removed.has(pageIdx)?'removed':''}" data-pos="${pos}" style="position:relative;">
          <span class="tnum">${pos+1}</span>
          <img src="${dataUrl}" style="transform:rotate(${rot}deg); ${removed.has(pageIdx)?'opacity:.35;':''}">
          <div class="tctrl"></div>
        </div>
      `);
      const ctrl = thumb.querySelector('.tctrl');
      if(mode==='remove'){
        ctrl.innerHTML = `<label style="display:flex; align-items:center; gap:8px; cursor:pointer; width:100%; justify-content:center; padding:4px 0; font-weight:700; font-size:13px;">
          <input type="checkbox" data-toggle="${pageIdx}" ${removed.has(pageIdx)?'checked':''} style="width:20px; height:20px; accent-color:var(--warn); cursor:pointer;">
          Delete this page
        </label>`;
      } else if(mode==='organize'){
        const bl = el(`<button data-left="${pos}">◀</button>`);
        const br = el(`<button data-right="${pos}">▶</button>`);
        ctrl.appendChild(bl); ctrl.appendChild(br);
      } else if(mode==='rotate'){
        const b = el(`<button data-rot="${pageIdx}">⟳ 90°</button>`);
        ctrl.appendChild(b);
      }
      grid.appendChild(thumb);
    }
    label.remove();

    grid.addEventListener('change', (e)=>{
      const t = e.target;
      if(t.matches('[data-toggle]')){
        const idx = Number(t.getAttribute('data-toggle'));
        if(t.checked) removed.add(idx); else removed.delete(idx);
        paintThumbs();
      }
    });
    grid.addEventListener('click', (e)=>{
      const t = e.target;
      if(t.matches('[data-left]')){
        const pos = Number(t.getAttribute('data-left'));
        if(pos>0){ const tmp=order[pos]; order[pos]=order[pos-1]; order[pos-1]=tmp; paintThumbs(); }
      } else if(t.matches('[data-right]')){
        const pos = Number(t.getAttribute('data-right'));
        if(pos<order.length-1){ const tmp=order[pos]; order[pos]=order[pos+1]; order[pos+1]=tmp; paintThumbs(); }
      } else if(t.matches('[data-rot]')){
        const idx = Number(t.getAttribute('data-rot'));
        rotations[idx] = ((rotations[idx]||0) + 90) % 360;
        paintThumbs();
      }
    });

    const row = el(`<div class="btn-row"></div>`);
    let label2 = mode==='remove' ? '🗑️ Delete & Download' : mode==='organize' ? '🔀 Reorder & Download' : '🔄 Rotate & Download';
    const btn = el(`<button class="btn">${label2}</button>`);
    btn.onclick = doProcess;
    row.appendChild(btn);
    body.appendChild(row);
  }

  async function doProcess(){
    const prog = mountProgress(body);
    try{
      prog.set(20,'Reading…');
      const src = await PDFDocument.load(file._buf, {ignoreEncryption:true});
      const outDoc = await PDFDocument.create();
      let keepOrder = order.filter(idx => !removed.has(idx));
      if(mode==='remove' && keepOrder.length===0){ throw new Error('Cannot remove every page'); }
      prog.set(50,'Building pages…');
      const pages = await outDoc.copyPages(src, mode==='remove' ? keepOrder : order);
      pages.forEach((p, i)=>{
        const origIdx = (mode==='remove' ? keepOrder : order)[i];
        if(mode==='rotate' && rotations[origIdx]){
          p.setRotation(degrees((p.getRotation().angle||0) + rotations[origIdx]));
        }
        outDoc.addPage(p);
      });
      prog.set(90,'Preparing…');
      const bytes = await outDoc.save();
      prog.set(100,'Done');
      const fname = mode==='remove' ? 'pages-removed.pdf' : mode==='organize' ? 'reordered.pdf' : 'rotated.pdf';
      downloadBlob(new Blob([bytes],{type:'application/pdf'}), fname);
      prog.remove();
      mountResult(body, 'Done — file downloaded.');
    }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
  }

  paintUpload();
}
TOOL_IMPL.remove = { mount(c){ mountThumbTool(c,'remove'); } };
TOOL_IMPL.organize = { mount(c){ mountThumbTool(c,'organize'); } };
TOOL_IMPL.rotate = { mount(c){ mountThumbTool(c,'rotate'); } };

TOOL_IMPL.merge = {
  mount(container){
    let files = [];
    const body = el(`<div></div>`);
    container.appendChild(body);

    function paint(){
      body.innerHTML = '';
      mountUploader(body, {
        accept:'application/pdf', multiple:true,
        label:'PDF ஃபைல்களை drag & drop or tap', sublabel:'2 or more PDFs',
        onAdd: async (fl)=>{
          for(const f of fl){ if(f.type==='application/pdf' || f.name.toLowerCase().endsWith('.pdf')) files.push(f); }
          paint();
        }
      });
      if(files.length){
        mountFileList(body, files,
          (idx)=>{ files.splice(idx,1); paint(); },
          (idx,dir)=>{ const j=idx+dir; if(j<0||j>=files.length) return; const t=files[idx]; files[idx]=files[j]; files[j]=t; paint(); }
        );
        const row = el(`<div class="btn-row"></div>`);
        const btn = el(`<button class="btn tamil" ${files.length<2?'disabled':''}>🧩 Merge</button>`);
        btn.onclick = doMerge;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }

    async function doMerge(){
      const prog = mountProgress(body);
      try{
        const outDoc = await PDFDocument.create();
        for(let i=0;i<files.length;i++){
          prog.set((i/files.length)*90, `${files[i].name} Adding… (${i+1}/${files.length})`);
          const buf = await readFileAsArrayBuffer(files[i]);
          const src = await PDFDocument.load(buf, {ignoreEncryption:true});
          const pages = await outDoc.copyPages(src, src.getPageIndices());
          pages.forEach(p=>outDoc.addPage(p));
        }
        prog.set(95,'Preparing file…');
        const bytes = await outDoc.save();
        prog.set(100,'Done');
        downloadBlob(new Blob([bytes],{type:'application/pdf'}), 'merged.pdf');
        prog.remove();
        mountResult(body, `${files.length} PDF-files merged and downloaded.`);
      }catch(err){
        prog.remove();
        mountResult(body, 'Error: '+err.message).style.background = '#FDEDEC';
      }
    }
    paint();
  }
};

TOOL_IMPL.compress = {
  mount(container){
    let file = null;
    const body = el(`<div></div>`); container.appendChild(body);
    function paint(){
      body.innerHTML = '';
      mountUploader(body, {
        accept:'application/pdf',
        label:'Drop a PDF file', sublabel:'Current size shown after you drop it',
        onAdd: async (fl)=>{ file = fl[0]; file._buf = await readFileAsArrayBuffer(file); paint(); }
      });
      if(file){
        mountFileList(body, [file], ()=>{ file=null; paint(); });
        const opts = el(`
          <div class="opts one tamil">
            <div class="field">
              <label>Compress Size</label>
              <select id="cLevel">
                <option value="1.5">Low compression (higher quality)</option>
                <option value="1.1" selected>Medium (Recommended)</option>
                <option value="0.75">High compression (smaller size)</option>
              </select>
            </div>
          </div>
          <div class="note">This re-renders every page as an image to compress it — best for image-heavy/scanned PDFs. எழுத்து-அடிப்படையிலான PDF-ல் எழுத்தை select/copy does தன்மை போய்விடும்.</div>
        `);
        body.appendChild(opts);
        const row = el(`<div class="btn-row"></div>`);
        const btn = el(`<button class="btn tamil">📦 Compress</button>`);
        btn.onclick = doCompress;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    async function doCompress(){
      const scale = Number(body.querySelector('#cLevel').value);
      const prog = mountProgress(body);
      try{
        const originalSize = file.size;
        const pdfjsDoc = await loadPdfJs(file._buf);
        const outDoc = await PDFDocument.create();
        for(let i=1;i<=pdfjsDoc.numPages;i++){
          prog.set((i/pdfjsDoc.numPages)*85, `page ${i}/${pdfjsDoc.numPages}…`);
          const page = await pdfjsDoc.getPage(i);
          const viewport = page.getViewport({scale});
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width; canvas.height = viewport.height;
          await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
          const jpgUrl = canvas.toDataURL('image/jpeg', 0.55);
          const jpgBytes = Uint8Array.from(atob(jpgUrl.split(',')[1]), c=>c.charCodeAt(0));
          const img = await outDoc.embedJpg(jpgBytes);
          const newPage = outDoc.addPage([canvas.width, canvas.height]);
          newPage.drawImage(img, {x:0,y:0,width:canvas.width,height:canvas.height});
        }
        prog.set(95,'Preparing…');
        const bytes = await outDoc.save();
        prog.set(100,'Done'); prog.remove();
        const newSize = bytes.length;
        const pct = Math.round((1 - newSize/originalSize)*100);
        if(pct < 5){
          // This method rasterizes every page to a JPEG — great for scanned/image-heavy
          // PDFs, but a mostly-text PDF is often ALREADY more compact as vector text
          // than as an image, so this can fail to shrink it (or even grow it).
          mountResult(body, `This PDF is already compact as text (vector) — converting it to images didn't reduce the size (${fmtBytes(originalSize)} → ${fmtBytes(newSize)}). This method works best on scanned/image-heavy PDFs.`).style.background='#FFF3E0';
          const dlAnywayRow = el(`<div class="btn-row"></div>`);
          const dlBtn = el(`<button class="btn secondary">Download anyway</button>`);
          dlBtn.onclick = ()=> downloadBlob(new Blob([bytes],{type:'application/pdf'}), 'compressed.pdf');
          dlAnywayRow.appendChild(dlBtn);
          body.appendChild(dlAnywayRow);
        } else {
          downloadBlob(new Blob([bytes],{type:'application/pdf'}), 'compressed.pdf');
          mountResult(body, `${fmtBytes(originalSize)} → ${fmtBytes(newSize)} (${pct}% lower) — downloaded.`);
        }
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

TOOL_IMPL.sign = {
  mount(container){
    let file = null, pdfjsDoc = null, pageCount = 0, currentPage = 1;
    let sigDataUrl = null;
    let sigPos = {xPct:0.65, yPct:0.15};
    const body = el(`<div></div>`); container.appendChild(body);

    function paint(){
      body.innerHTML = '';
      if(!file){
        mountUploader(body, {
          accept:'application/pdf',
          label:'Drop the PDF you want to sign', sublabel:'',
          onAdd: async (fl)=>{
            file = fl[0]; file._buf = await readFileAsArrayBuffer(file);
            pdfjsDoc = await loadPdfJs(file._buf); pageCount = pdfjsDoc.numPages;
            paint();
          }
        });
        return;
      }
      mountFileList(body, [file], ()=>{ file=null; sigDataUrl=null; paint(); });

      const sigWrap = el(`
        <div class="tamil" style="margin-top:16px;">
          <label style="font-size:11.5px; font-weight:700; color:var(--sub); display:block; margin-bottom:6px;">Draw your signature</label>
          <canvas class="sig-canvas" id="sigPad" width="600" height="180"></canvas>
          <div class="btn-row">
            <button class="btn secondary tamil" id="clearSig">🧹 Clear</button>
          </div>
        </div>
      `);
      body.appendChild(sigWrap);
      setupSignaturePad(sigWrap.querySelector('#sigPad'));
      sigWrap.querySelector('#clearSig').onclick = ()=>{
        const c = sigWrap.querySelector('#sigPad');
        c.getContext('2d').clearRect(0,0,c.width,c.height);
        sigDataUrl = null;
      };

      const opts = el(`
        <div class="opts tamil" style="margin-top:14px;">
          <div class="field">
            <label>Which page (out of ${pageCount})</label>
            <input type="number" id="signPage" value="${currentPage}" min="1" max="${pageCount}">
          </div>
          <div class="field">
            <label>Signature width (%)</label>
            <input type="number" id="sigWidthPct" value="25" min="10" max="60">
          </div>
        </div>
      `);
      body.appendChild(opts);

      const row = el(`<div class="btn-row"></div>`);
      const btn = el(`<button class="btn tamil">✍️ Sign</button>`);
      btn.onclick = doApply;
      row.appendChild(btn);
      body.appendChild(row);
    }

    function setupSignaturePad(canvas){
      const ctx = canvas.getContext('2d');
      ctx.strokeStyle = '#20242B'; ctx.lineWidth = 2.5; ctx.lineCap='round';
      let drawing = false, last = null;
      function getPos(e){
        const rect = canvas.getBoundingClientRect();
        const cx = (e.touches? e.touches[0].clientX : e.clientX) - rect.left;
        const cy = (e.touches? e.touches[0].clientY : e.clientY) - rect.top;
        return {x: cx*(canvas.width/rect.width), y: cy*(canvas.height/rect.height)};
      }
      function start(e){ drawing=true; last=getPos(e); e.preventDefault(); }
      function move(e){
        if(!drawing) return;
        const p = getPos(e);
        ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
        last = p; e.preventDefault();
      }
      function end(){ if(drawing){ drawing=false; sigDataUrl = canvas.toDataURL('image/png'); } }
      canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);
      canvas.addEventListener('touchstart', start, {passive:false});
      canvas.addEventListener('touchmove', move, {passive:false});
      canvas.addEventListener('touchend', end);
    }

    async function doApply(){
      if(!sigDataUrl){ mountResult(body, 'முதலில் கையொப்பம் வரையவும்.').style.background='#FDEDEC'; return; }
      const pageNum = Math.min(pageCount, Math.max(1, Number(body.querySelector('#signPage').value)||1));
      const widthPct = (Number(body.querySelector('#sigWidthPct').value)||25)/100;
      const prog = mountProgress(body);
      try{
        prog.set(20,'Reading…');
        const doc = await PDFDocument.load(file._buf, {ignoreEncryption:true});
        const pngBytes = Uint8Array.from(atob(sigDataUrl.split(',')[1]), c=>c.charCodeAt(0));
        const sigImg = await doc.embedPng(pngBytes);
        const page = doc.getPages()[pageNum-1];
        const {width, height} = page.getSize();
        const sigW = width*widthPct;
        const sigH = sigW * (sigImg.height/sigImg.width);
        prog.set(60,'Signக்கிறது…');
        page.drawImage(sigImg, { x: width*sigPos.xPct, y: height*sigPos.yPct, width: sigW, height: sigH });
        prog.set(90,'Preparing…');
        const bytes = await doc.save();
        prog.set(100,'Done');
        downloadBlob(new Blob([bytes],{type:'application/pdf'}), 'signed.pdf');
        prog.remove();
        mountResult(body, `page ${pageNum}-ல் Signக்கப்பட்ட PDF downloaded.`);
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

TOOL_IMPL.ocr = {

    function preprocessForOcr(srcCanvasOrImg, w, h){
      // Grayscale + auto-contrast stretch tends to noticeably improve Tesseract's
      // accuracy on photographed (as opposed to cleanly scanned) documents.
      const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(srcCanvasOrImg, 0, 0, w, h);
      const imgData = ctx.getImageData(0,0,w,h);
      const d = imgData.data;
      let min=255, max=0;
      for(let p=0;p<d.length;p+=4){
        const l = 0.299*d[p] + 0.587*d[p+1] + 0.114*d[p+2];
        d[p]=d[p+1]=d[p+2]=l;
        if(l<min) min=l; if(l>max) max=l;
      }
      const range = Math.max(1, max-min);
      for(let p=0;p<d.length;p+=4){
        const v = Math.max(0, Math.min(255, (d[p]-min)*255/range));
        d[p]=d[p+1]=d[p+2]=v;
      }
      ctx.putImageData(imgData,0,0);
      return canvas;
    }
    async function doOcr(){
      const langStr = Array.from(selectedLangs).join('+');
      const prog = mountProgress(body);
      try{
        let images = [];
        if(isPdf){
          const pdfjsDoc = await loadPdfJs(file._buf);
          for(let i=1;i<=pdfjsDoc.numPages;i++){
            const page = await pdfjsDoc.getPage(i);
            const viewport = page.getViewport({scale:2.2});
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width; canvas.height = viewport.height;
            await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
            const clean = preprocessForOcr(canvas, canvas.width, canvas.height);
            images.push(clean.toDataURL('image/png'));
          }
        } else {
          const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
          const img = new Image(); await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=dataUrl; });
          const clean = preprocessForOcr(img, img.naturalWidth, img.naturalHeight);
          images = [clean.toDataURL('image/png')];
        }
        let fullText = '';
        for(let i=0;i<images.length;i++){
          const { data } = await Tesseract.recognize(images[i], langStr, {
            workerBlobURL: true, // route the worker script through a blob so it loads reliably even on pages without a normal http(s) origin
            logger: (m)=>{
              if(m.status==='recognizing text'){
                const base = (i/images.length)*100;
                prog.set(base + (m.progress*100/images.length), `படம் ${i+1}/${images.length} — Reading… ${Math.round(m.progress*100)}%`);
              }
            }
          });
          fullText += (images.length>1 ? `\n----- page ${i+1} -----\n` : '') + data.text;
        }
        recognizedText = fullText.trim();
        prog.set(100,'Done');
        prog.remove();
        paint();
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

TOOL_IMPL.pdf2excel = {
  mount(container){
    let file = null;
    const body = el(`<div></div>`); container.appendChild(body);
    function paint(){
      body.innerHTML = '';
      mountUploader(body, {
        accept:'application/pdf',
        label:'Drop a PDF file', sublabel:'Converts text/tables to .xlsx',
        onAdd: async (fl)=>{ file = fl[0]; file._buf = await readFileAsArrayBuffer(file); paint(); }
      });
      if(file){
        mountFileList(body, [file], ()=>{ file=null; paint(); });
        const note = el(`<div class="note tamil">✅ இப்போது வரிசைகள் (rows) மற்றும் நெடுவரிசைகள் (columns) PDF-ல் இருக்கும் இடத்தை வைத்தே தானாக கண்டறியப்பட்டு, ஒவ்வொரு நெடுவரிசையும் Excel-ல் அதே இடத்தில் வரும் வகையில் சீரமைக்கப்படும் — PDF-ன் அட்டவணை வடிவமைப்பு அப்படியே பாதுகாக்கப்படும். (Scan completed/படமாக உள்ள PDF எனில் முதலில் "OCR" கருவியை பயன்படுத்தவும்.)</div>`);
        body.appendChild(note);
        const row = el(`<div class="btn-row"></div>`);
        const btn = el(`<button class="btn tamil">🧮 Excel Convert to (Exact Layout)</button>`);
        btn.onclick = doConvert;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    // Cluster a sorted list of numeric centers into groups within `tol` of each other.
    function clusterPositions(values, tol){
      const sorted = [...values].sort((a,b)=>a-b);
      const clusters = [];
      sorted.forEach(v=>{
        const last = clusters[clusters.length-1];
        if(last && (v - last.max) <= tol){ last.items.push(v); last.max = v; last.center = (last.items.reduce((s,x)=>s+x,0))/last.items.length; }
        else clusters.push({items:[v], max:v, center:v});
      });
      return clusters.map(c=>c.center);
    }
    async function doConvert(){
      const prog = mountProgress(body);
      try{
        prog.set(10,'Reading…');
        const pdfjsDoc = await loadPdfJs(file._buf);
        const wb = XLSX.utils.book_new();
        for(let i=1;i<=pdfjsDoc.numPages;i++){
          prog.set(10+(i/pdfjsDoc.numPages)*75, `page ${i}/${pdfjsDoc.numPages} — அட்டவணை கண்டறிகிறது…`);
          const page = await pdfjsDoc.getPage(i);
          const content = await page.getTextContent();
          const items = content.items
            .filter(it=>it.str !== undefined)
            .map(it=>({
              x: it.transform[4],
              y: it.transform[5],
              w: it.width || (it.str.length * (it.transform[0]||6) * 0.5),
              h: Math.abs(it.transform[3]) || 10,
              str: it.str
            }))
            .filter(it=> it.str.length>0);

          if(!items.length){
            const ws = XLSX.utils.aoa_to_sheet([['']]);
            XLSX.utils.book_append_sheet(wb, ws, `Page${i}`.slice(0,31));
            continue;
          }

          // 1) Group items into text rows using a y-tolerance based on median glyph height.
          const heights = items.map(it=>it.h).sort((a,b)=>a-b);
          const medH = heights[Math.floor(heights.length/2)] || 10;
          const yTol = Math.max(2.5, medH * 0.55);
          items.sort((a,b)=> b.y - a.y || a.x - b.x);
          const rows = [];
          items.forEach(it=>{
            let r = rows.find(r0 => Math.abs(r0.y - it.y) <= yTol);
            if(!r){ r = {y: it.y, items: []}; rows.push(r); }
            r.items.push(it);
            r.y = (r.y*(r.items.length-1) + it.y)/r.items.length; // running average baseline
          });
          rows.sort((a,b)=> b.y - a.y);
          rows.forEach(r=> r.items.sort((a,b)=> a.x - b.x));

          // 2) Merge items within a row that are close together horizontally into a single cell
          //    (words that belong together, separated only by a normal space), while a bigger
          //    gap marks a real column boundary — this mirrors how the text is laid out in the PDF.
          const allGaps = [];
          rows.forEach(r=>{
            for(let k=1;k<r.items.length;k++){
              const prev = r.items[k-1];
              allGaps.push(r.items[k].x - (prev.x + prev.w));
            }
          });
          allGaps.sort((a,b)=>a-b);
          const avgCharW = (items.reduce((s,it)=> s + (it.w/Math.max(1,it.str.length)), 0))/items.length || 5;
          const colGapTol = Math.max(avgCharW*1.6, 8); // gaps bigger than this = new column

          rows.forEach(r=>{
            const cells = [];
            let cur = null;
            r.items.forEach(it=>{
              if(cur && (it.x - (cur.x + cur.w)) <= colGapTol){
                cur.str += (it.x - (cur.x+cur.w) > avgCharW*0.35 ? ' ' : '') + it.str;
                cur.w = (it.x + it.w) - cur.x;
              } else {
                cur = { x: it.x, w: it.w, str: it.str };
                cells.push(cur);
              }
            });
            r.cells = cells;
          });

          // 3) Determine global column positions by clustering the left-x of every cell across
          //    all rows, so the same PDF column lines up in the same Excel column every row.
          const colTol = Math.max(avgCharW*2.2, 12);
          const colCenters = clusterPositions(rows.flatMap(r=>r.cells.map(c=>c.x)), colTol).sort((a,b)=>a-b);

          function nearestColIdx(x){
            let bi=0, bd=Infinity;
            colCenters.forEach((c,ci)=>{ const d=Math.abs(c-x); if(d<bd){ bd=d; bi=ci; } });
            return bi;
          }

          // 4) Build the grid: place each cell text at its column index (merge if two cells map
          //    to the same column in one row — keep them space-joined, in x order).
          const aoa = rows.map(r=>{
            const rowArr = new Array(colCenters.length).fill('');
            r.cells.forEach(c=>{
              const ci = nearestColIdx(c.x);
              rowArr[ci] = rowArr[ci] ? (rowArr[ci] + ' ' + c.str) : c.str;
            });
            return rowArr;
          });

          const ws = XLSX.utils.aoa_to_sheet(aoa.length ? aoa : [['']]);
          // Reasonable auto column widths based on content length.
          const colWidths = colCenters.map((_,ci)=>{
            let maxLen = 6;
            aoa.forEach(r=>{ if(r[ci] && r[ci].length>maxLen) maxLen = r[ci].length; });
            return { wch: Math.min(60, maxLen+2) };
          });
          ws['!cols'] = colWidths;
          XLSX.utils.book_append_sheet(wb, ws, `Page${i}`.slice(0,31));
        }
        prog.set(92,'Excel Preparing file…');
        const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
        prog.set(100,'Done');
        downloadBlob(new Blob([out],{type:'application/octet-stream'}), file.name.replace(/\.pdf$/i,'')+'.xlsx');
        prog.remove();
        mountResult(body, 'Excel ஃபைல் (.xlsx) — PDF வடிவமைப்பு பாதுகாக்கப்பட்ட வகையில் downloaded.');
      }catch(err){ prog.remove(); mountResult(body,'Error: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

        body.appendChild(badge);
