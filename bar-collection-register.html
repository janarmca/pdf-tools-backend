<div id="root"></div>
<script>
  // window.storage polyfill — see hr-attendance-register.html for the same
  // approach. "shared" data and "personal" (staff_name) data are both just
  // kept in this browser's localStorage since there's no multi-user backend
  // for this embedded tool.
  window.storage = {
    async get(key, shared){
      try{ const v = localStorage.getItem('barreg_'+key); return v==null ? null : {key, value:v, shared: !!shared}; }
      catch(e){ throw e; }
    },
    async set(key, value, shared){
      localStorage.setItem('barreg_'+key, value);
      return {key, value, shared: !!shared};
    },
    async delete(key, shared){
      localStorage.removeItem('barreg_'+key);
      return {key, deleted:true, shared: !!shared};
    },
    async list(prefix, shared){
      const keys = Object.keys(localStorage).filter(k=>k.startsWith('barreg_'+(prefix||''))).map(k=>k.replace('barreg_',''));
      return {keys, prefix, shared: !!shared};
    }
  };
</script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;
function makeIcon(glyph){
  return function Icon({size=16, color, style}){
    return React.createElement('span', {style:{fontSize:size, lineHeight:1, display:'inline-block', color, ...(style||{})}}, glyph);
  };
}
const Wine = makeIcon('🍷');
const Snowflake = makeIcon('❄️');
const Lock = makeIcon('🔒');
const Unlock = makeIcon('🔓');
const Check = makeIcon('✓');
const Clock = makeIcon('🕐');
const IndianRupee = makeIcon('₹');
const Download = makeIcon('⬇️');
const Settings = makeIcon('⚙️');
const ClipboardList = makeIcon('📋');
const ShieldCheck = makeIcon('🛡️');
const Plus = makeIcon('➕');
const Minus = makeIcon('➖');
const X = makeIcon('✕');
async function importShim(name){ if(name==='xlsx') return window.XLSX; throw new Error('Unknown module: '+name); }

















/* ---------------------------------------------------------
   Bar Sitting Collection Register
   Subject: a barman's order chit / cash docket.
   Warm tavern wood + copper, cream ticket paper, torn-chit list.
--------------------------------------------------------- */

const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => new Date().toISOString().slice(0, 10);
const pad = (n) => String(n).padStart(2, "0");
const fmtTime = (ts) => {
  const d = new Date(ts);
  let h = d.getHours();
  const m = pad(d.getMinutes());
  const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return `${h}:${m} ${ap}`;
};
const fmtMoney = (n) => `₹${Number(n).toLocaleString("en-IN")}`;

const DEFAULT_TABLE_COUNT = 20;
const defaultTables = () =>
  Array.from({ length: DEFAULT_TABLE_COUNT }, (_, i) => ({
    id: `t${i + 1}`,
    num: i + 1,
    isAC: i < 6, // first 6 tables AC by default, owner can change in Setup
  }));

const defaultConfig = () => ({
  baseAmount: 200,
  acSurcharge: 100,
  ownerPin: "1234",
  tables: defaultTables(),
});

async function storageGet(key, fallback, shared) {
  try {
    const res = await window.storage.get(key, shared);
    return res ? JSON.parse(res.value) : fallback;
  } catch {
    return fallback;
  }
}
async function storageSet(key, value, shared) {
  try {
    await window.storage.set(key, JSON.stringify(value), shared);
  } catch (e) {
    console.error("storage set failed", e);
  }
}

export default function App() {
  const [tab, setTab] = useState("entry");
  const [config, setConfig] = useState(defaultConfig());
  const [entries, setEntries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [staffName, setStaffName] = useState("");
  const [toast, setToast] = useState(null);
  const [ownerAuthed, setOwnerAuthed] = useState(false);

  useEffect(() => {
    (async () => {
      const cfg = await storageGet("config", defaultConfig(), true);
      const ent = await storageGet("entries", [], true);
      const name = await storageGet("staff_name", "", false);
      setConfig(cfg);
      setEntries(ent);
      setStaffName(name);
      setLoading(false);
    })();
  }, []);

  const flash = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 1700);
  };

  const saveConfig = async (next) => {
    setConfig(next);
    await storageSet("config", next, true);
  };

  const addEntry = async (entry) => {
    const next = [entry, ...entries];
    setEntries(next);
    await storageSet("entries", next, true);
  };

  const verifyEntry = async (id) => {
    const next = entries.map((e) =>
      e.id === id ? { ...e, verified: !e.verified, verifiedAt: !e.verified ? Date.now() : null } : e
    );
    setEntries(next);
    await storageSet("entries", next, true);
  };

  const updateStaffName = async (name) => {
    setStaffName(name);
    await storageSet("staff_name", name, false);
  };

  if (loading) {
    return (
      <div style={styles.loadingWrap}>
        <FontImport />
        <div style={styles.loadingText}>பதிவேடு தயாராகிறது…</div>
      </div>
    );
  }

  return (
    <div style={styles.app}>
      <FontImport />
      <Header />

      <nav style={styles.tabRow}>
        <TabBtn active={tab === "entry"} onClick={() => setTab("entry")} icon={<Wine size={16} />} label="புதிய பதிவு" />
        <TabBtn active={tab === "owner"} onClick={() => setTab("owner")} icon={<ShieldCheck size={16} />} label="உரிமையாளர் பரிசோதனை" />
        <TabBtn active={tab === "setup"} onClick={() => setTab("setup")} icon={<Settings size={16} />} label="அமைப்பு" />
      </nav>

      <main style={styles.main}>
        {tab === "entry" && (
          <EntryTab
            config={config}
            staffName={staffName}
            setStaffName={updateStaffName}
            onSubmit={async (entry) => {
              await addEntry(entry);
              flash("பதிவு சேர்க்கப்பட்டது ✓");
            }}
          />
        )}

        {tab === "owner" && (
          <OwnerTab
            config={config}
            entries={entries}
            authed={ownerAuthed}
            setAuthed={setOwnerAuthed}
            onVerify={verifyEntry}
            flash={flash}
          />
        )}

        {tab === "setup" && (
          <SetupTab
            config={config}
            authed={ownerAuthed}
            setAuthed={setOwnerAuthed}
            onSave={async (next) => {
              await saveConfig(next);
              flash("அமைப்பு சேமிக்கப்பட்டது");
            }}
          />
        )}
      </main>

      {toast && <div style={styles.toast}>{toast}</div>}

      <footer style={styles.footer}>
        இந்தத் தரவு இந்தக் கருவியைப் பயன்படுத்தும் அனைவருக்கும் பகிரப்படும் — bar staff மற்றும் owner சேர்ந்து பயன்படுத்த ஏற்றது.
      </footer>
    </div>
  );
}

      @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap');

      button { font-family: inherit; cursor: pointer; }
      input, select { font-family: inherit; }
      ::selection { background: #B87333; color: #F2E8D8; }
    `}</style>
  );
}

function Header() {
  return (
    <header style={styles.header}>
      <div style={styles.headerIconCircle}>
        <Wine size={20} color="#F2E8D8" />
      </div>
      <div>
        <div style={styles.eyebrow}>பார் கலெக்‌ஷன் பதிவேடு</div>
        <h1 style={styles.title}>சிட்டிங் கலெக்ஷன் & பரிசோதனை</h1>

function TabBtn({ active, onClick, icon, label }) {

    <button style={{ ...styles.tabBtn, ...(active ? styles.tabBtnActive : {}) }} onClick={onClick}>
      {icon}
      <span style={{ fontFamily: "'Noto Sans Tamil', sans-serif" }}>{label}</span>

/* ---- Entry tab (staff) ---- */

function EntryTab({ config, staffName, setStaffName, onSubmit }) {
  const [selectedTable, setSelectedTable] = useState(null);
  const [amount, setAmount] = useState("");
  const [note, setNote] = useState("");

  const table = config.tables.find((t) => t.id === selectedTable);

  useEffect(() => {
    if (table) {
      setAmount(String(config.baseAmount + (table.isAC ? config.acSurcharge : 0)));
    }
  }, [selectedTable]); // eslint-disable-line

  const submit = () => {
    if (!table || !amount || !staffName.trim()) return;
    onSubmit({
      id: uid(),
      tableId: table.id,
      tableNum: table.num,
      isAC: table.isAC,
      amount: Number(amount),
      staffName: staffName.trim(),
      note: note.trim(),
      timestamp: Date.now(),
      verified: false,
      verifiedAt: null,
    });
    setSelectedTable(null);
    setAmount("");
    setNote("");
  };

  return (
    <div>
      <label style={styles.label}>ஊழியர் பெயர்</label>
      <input
        style={{ ...styles.input, maxWidth: 260 }}
        value={staffName}
        onChange={(e) => setStaffName(e.target.value)}
        placeholder="உங்கள் பெயர்"
      />

      <div style={{ marginTop: 20, marginBottom: 10, fontWeight: 700, fontFamily: "'Noto Sans Tamil', serif" }}>
        Table தேர்ந்தெடுக்கவும்
      </div>
      <div style={styles.tableGrid}>
        {config.tables.map((t) => (
          <button
            key={t.id}
            onClick={() => setSelectedTable(t.id)}
            style={{
              ...styles.tableBtn,
              ...(t.isAC ? styles.tableBtnAC : styles.tableBtnNonAC),
              ...(selectedTable === t.id ? styles.tableBtnSelected : {}),
            }}
          >
            {t.isAC && <Snowflake size={11} style={{ marginBottom: 2 }} />}
            {t.num}
          </button>
        ))}
      </div>

      {table && (
        <div style={styles.chit}>
          <div style={styles.chitRow}>
            <span>Table {table.num}</span>
            <span style={{ color: table.isAC ? "#2F4A3D" : "#B87333", fontWeight: 700 }}>
              {table.isAC ? "AC" : "Non-AC"}
            </span>
          </div>
          <label style={styles.label}>Amount</label>
          <input
            style={styles.input}
            type="number"
            value={amount}
            onChange={(e) => setAmount(e.target.value)}
          />
          <label style={styles.label}>குறிப்பு (optional)</label>
          <input
            style={styles.input}
            value={note}
            onChange={(e) => setNote(e.target.value)}
            placeholder="எ.கா. 2nd round"
          />
          <button
            style={{ ...styles.primaryBtn, width: "100%", justifyContent: "center", marginTop: 14 }}
            disabled={!amount || !staffName.trim()}
            onClick={submit}
          >
            <Check size={16} /> பதிவு செய்
          </button>
        </div>
      )}
    </div>
  );
}

/* ---- Owner tab ---- */

function PinGate({ config, setAuthed, purpose }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState(false);

  const submit = () => {
    if (pin === config.ownerPin) {
      setAuthed(true);
    } else {
      setError(true);
      setTimeout(() => setError(false), 900);
    }
  };

  return (
    <div style={styles.pinGate}>
      <Lock size={26} color="#B87333" />
      <div style={{ fontWeight: 700, marginTop: 8, fontFamily: "'Noto Sans Tamil', serif" }}>
        {purpose} — Owner PIN தேவை
      </div>
      <input
        style={{ ...styles.input, ...styles.pinInput, ...(error ? styles.pinInputError : {}) }}
        type="password"
        inputMode="numeric"
        value={pin}
        onChange={(e) => setPin(e.target.value)}
        placeholder="PIN"
        onKeyDown={(e) => e.key === "Enter" && submit()}
        autoFocus
      />
      <button style={styles.primaryBtn} onClick={submit}>
        <Unlock size={15} /> திற
      </button>
    </div>
  );
}

function OwnerTab({ config, entries, authed, setAuthed, onVerify, flash }) {
  const [date, setDate] = useState(todayISO());

  if (!authed) return <PinGate config={config} setAuthed={setAuthed} purpose="பரிசோதனை" />;

  const dayEntries = entries.filter((e) => new Date(e.timestamp).toISOString().slice(0, 10) === date);
  const total = dayEntries.reduce((s, e) => s + e.amount, 0);
  const verifiedTotal = dayEntries.filter((e) => e.verified).reduce((s, e) => s + e.amount, 0);
  const pendingCount = dayEntries.filter((e) => !e.verified).length;

  const exportXLSX = async () => {
    const XLSX = await importShim("xlsx");
    const rows = [["Table", "AC/Non-AC", "Amount", "Staff", "Time", "Verified", "குறிப்பு"]];
    dayEntries.forEach((e) => {
      rows.push([
        e.tableNum,
        e.isAC ? "AC" : "Non-AC",
        e.amount,
        e.staffName,
        fmtTime(e.timestamp),
        e.verified ? "Yes" : "No",
        e.note || "",
      ]);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Collections");
    XLSX.writeFile(wb, `bar_collections_${date}.xlsx`);
    flash("Excel பதிவிறக்கம் ஆனது");
  };

  return (
    <div>
      <div style={styles.sectionHeadRow}>
        <h2 style={styles.sectionHead}>உரிமையாளர் பரிசோதனை</h2>
        <div style={{ display: "flex", gap: 8 }}>
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={styles.dateInput} />
          <button style={styles.secondaryBtn} onClick={exportXLSX} disabled={dayEntries.length === 0}>
            <Download size={15} /> Excel
          </button>
        </div>
      </div>

      <div style={styles.statRow}>
        <StatCard label="மொத்த சிட்டிங்" value={dayEntries.length} icon={<ClipboardList size={16} />} />
        <StatCard label="மொத்த தொகை" value={fmtMoney(total)} icon={<IndianRupee size={16} />} accent="#B87333" />
        <StatCard label="பரிசோதிக்கப்பட்டது" value={fmtMoney(verifiedTotal)} icon={<ShieldCheck size={16} />} accent="#2F4A3D" />
        <StatCard label="நிலுவையில்" value={pendingCount} icon={<Clock size={16} />} accent="#D98E2B" />
      </div>

      {dayEntries.length === 0 ? (
        <div style={styles.empty}>இந்த தேதிக்கு பதிவுகள் இல்லை.</div>
      ) : (
        <div style={styles.chitStack}>
          {dayEntries.map((e, i) => (
            <div
              key={e.id}
              style={{
                ...styles.listChit,
                transform: `rotate(${(i % 2 === 0 ? -1 : 1) * (0.4 + (i % 3) * 0.3)}deg)`,
              }}
            >
              <div style={styles.listChitLeft}>
                <div style={styles.listChitTable}>
                  T{e.tableNum} {e.isAC && <Snowflake size={12} style={{ marginLeft: 3 }} color="#2F4A3D" />}
                </div>
                <div style={styles.listChitMeta}>
                  {e.staffName} · {fmtTime(e.timestamp)}
                  {e.note && ` · ${e.note}`}
                </div>
              </div>
              <div style={styles.listChitRight}>
                <div style={styles.listChitAmount}>{fmtMoney(e.amount)}</div>
                <button
                  onClick={() => onVerify(e.id)}
                  style={{
                    ...styles.verifyBtn,
                    ...(e.verified ? styles.verifyBtnDone : {}),
                  }}
                >
                  <Check size={14} /> {e.verified ? "பரிசோதிக்கப்பட்டது" : "பரிசோதி"}
                </button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function StatCard({ label, value, icon, accent }) {
  return (
    <div style={styles.statCard}>
      <div style={{ color: accent || "#2B1D14", display: "flex", alignItems: "center", gap: 6 }}>
        {icon}
        <span style={styles.statValue}>{value}</span>
      </div>
      <div style={styles.statLabel}>{label}</div>
    </div>
  );
}

/* ---- Setup tab ---- */

function SetupTab({ config, authed, setAuthed, onSave }) {
  const [local, setLocal] = useState(config);
  const [newPin, setNewPin] = useState("");

  useEffect(() => setLocal(config), [config]);

  if (!authed) return <PinGate config={config} setAuthed={setAuthed} purpose="அமைப்பு" />;

  const updateTable = (id, patch) => {
    setLocal({ ...local, tables: local.tables.map((t) => (t.id === id ? { ...t, ...patch } : t)) });
  };

  const addTable = () => {
    const nextNum = local.tables.length ? Math.max(...local.tables.map((t) => t.num)) + 1 : 1;
    setLocal({ ...local, tables: [...local.tables, { id: uid(), num: nextNum, isAC: false }] });
  };

  const removeTable = (id) => {
    setLocal({ ...local, tables: local.tables.filter((t) => t.id !== id) });
  };

  const save = () => {
    const toSave = newPin.trim() ? { ...local, ownerPin: newPin.trim() } : local;
    onSave(toSave);
    setNewPin("");
  };

  return (
    <div>
      <h2 style={styles.sectionHead}>அமைப்பு</h2>

      <div style={styles.setupGrid}>
        <div>
          <label style={styles.label}>Base sitting amount (Non-AC)</label>
          <input
            style={styles.input}
            type="number"
            value={local.baseAmount}
            onChange={(e) => setLocal({ ...local, baseAmount: Number(e.target.value) })}
          />
        </div>
        <div>
          <label style={styles.label}>AC extra amount</label>
          <input
            style={styles.input}
            type="number"
            value={local.acSurcharge}
            onChange={(e) => setLocal({ ...local, acSurcharge: Number(e.target.value) })}
          />
        </div>
        <div>
          <label style={styles.label}>புதிய Owner PIN (மாற்ற விரும்பினால் மட்டும்)</label>
          <input
            style={styles.input}
            type="password"
            inputMode="numeric"
            value={newPin}
            onChange={(e) => setNewPin(e.target.value)}
            placeholder="•••• "
          />
        </div>
      </div>

      <div style={{ marginTop: 22, marginBottom: 10, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div style={{ fontWeight: 700, fontFamily: "'Noto Sans Tamil', serif" }}>Tables ({local.tables.length})</div>
        <button style={styles.secondaryBtn} onClick={addTable}>
          <Plus size={14} /> Table சேர்
        </button>
      </div>

      <div style={styles.setupTableGrid}>
        {local.tables.map((t) => (
          <div key={t.id} style={styles.setupTableRow}>
            <span style={styles.setupTableNum}>T{t.num}</span>
            <button
              style={{
                ...styles.acToggle,
                ...(t.isAC ? styles.acToggleOn : {}),
              }}
              onClick={() => updateTable(t.id, { isAC: !t.isAC })}
            >
              <Snowflake size={12} /> AC
            </button>
            <button style={styles.iconBtnSm} onClick={() => removeTable(t.id)}>
              <Minus size={13} color="#B23A2E" />
            </button>
          </div>
        ))}
      </div>

      <button style={{ ...styles.primaryBtn, marginTop: 22 }} onClick={save}>
        <Check size={16} /> அமைப்பை சேமி
      </button>
    </div>
  );
}
