<svg width="200" height="160" viewBox="0 0 600 480"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <radialGradient id="bg" cx="50%" cy="45%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#eefcff"/>
      <stop offset="100%" stop-color="#dff7ff"/>
    </radialGradient>

    <radialGradient id="glass" cx="35%" cy="25%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="35%" stop-color="#a9f4ff" stop-opacity=".55"/>
      <stop offset="75%" stop-color="#24cfe5" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#087eaf" stop-opacity=".5"/>
    </radialGradient>

    <linearGradient id="blueBrain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#68f4ff"/>
      <stop offset="45%" stop-color="#159fe5"/>
      <stop offset="100%" stop-color="#0752b7"/>
    </linearGradient>

    <linearGradient id="purpleBrain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e49cff"/>
      <stop offset="45%" stop-color="#a44bea"/>
      <stop offset="100%" stop-color="#5421b7"/>
    </linearGradient>

    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42eaff"/>
      <stop offset="50%" stop-color="#126bc5"/>
      <stop offset="100%" stop-color="#182b91"/>
    </linearGradient>

    <linearGradient id="orbitBlue">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#22e7ff"/>
      <stop offset="100%" stop-color="#2768ff"/>
    </linearGradient>

    <linearGradient id="orbitPurple">
      <stop offset="0%" stop-color="#b9ffff"/>
      <stop offset="45%" stop-color="#c75cff"/>
      <stop offset="100%" stop-color="#6c30e8"/>
    </linearGradient>

    <linearGradient id="gold">
      <stop offset="0%" stop-color="#fff7a0"/>
      <stop offset="50%" stop-color="#ffd329"/>
      <stop offset="100%" stop-color="#e99b00"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10"
                    flood-color="#159bc5"
                    flood-opacity=".28"/>
    </filter>

  </defs>

  <!-- BACKGROUND -->
  <rect width="600" height="480" fill="url(#bg)"/>

  <!-- SOFT GLOW -->
  <ellipse cx="300" cy="400"
           rx="210" ry="35"
           fill="#5ddff5"
           opacity=".18"/>

  <circle cx="300" cy="240"
          r="215"
          fill="#65eaff"
          opacity=".12"/>

  <!-- BACK ORBIT -->
  <ellipse cx="300" cy="240"
           rx="250"
           ry="115"
           fill="none"
           stroke="url(#orbitBlue)"
           stroke-width="7"
           opacity=".75"
           transform="rotate(18 300 240)"/>

  <ellipse cx="300" cy="240"
           rx="250"
           ry="115"
           fill="none"
           stroke="url(#orbitPurple)"
           stroke-width="6"
           opacity=".7"
           transform="rotate(-18 300 240)"/>

  <!-- LEFT ORBIT NODE -->
  <circle cx="75" cy="220"
          r="18"
          fill="#17cfff"
          opacity=".25"/>

  <circle cx="75" cy="220"
          r="11"
          fill="url(#orbitBlue)"
          filter="url(#glow)"/>

  <!-- RIGHT ORBIT NODE -->
  <circle cx="525" cy="255"
          r="18"
          fill="#b94dff"
          opacity=".25"/>

  <circle cx="525" cy="255"
          r="11"
          fill="url(#orbitPurple)"
          filter="url(#glow)"/>

  <!-- GOLD ORBIT -->
  <path d="M90 320
           C205 425 405 435 525 300"
        fill="none"
        stroke="url(#gold)"
        stroke-width="7"
        stroke-linecap="round"/>

  <circle cx="470" cy="350"
          r="15"
          fill="url(#gold)"
          filter="url(#glow)"/>

  <!-- GLASS SPHERE -->
  <circle cx="300" cy="240"
          r="185"
          fill="url(#glass)"
          stroke="#56dcf7"
          stroke-width="5"
          opacity=".9"
          filter="url(#shadow)"/>

  <circle cx="300" cy="240"
          r="168"
          fill="none"
          stroke="#ffffff"
          stroke-opacity=".5"
          stroke-width="3"/>

  <!-- LEFT BRAIN -->
  <path d="
    M300 125
    C255 105 210 130 195 170
    C165 175 150 200 158 225
    C135 255 150 290 180 300
    C165 335 200 365 235 355
    C255 390 292 375 300 345
    Z"
    fill="url(#blueBrain)"
    stroke="#57eaff"
    stroke-width="4"/>

  <!-- LEFT BRAIN DETAILS -->
  <g fill="none"
     stroke="#7af5ff"
     stroke-width="7"
     stroke-linecap="round"
     opacity=".65">

    <path d="M205 150 C245 180 210 200 240 220"/>
    <path d="M170 195 C210 215 180 245 220 255"/>
    <path d="M165 255 C205 265 180 300 225 305"/>
    <path d="M190 320 C225 300 220 340 250 350"/>
    <path d="M245 135 C265 170 250 190 275 210"/>
  </g>

  <!-- RIGHT BRAIN -->
  <path d="
    M300 125
    C345 105 390 130 405 170
    C435 175 450 200 442 225
    C465 255 450 290 420 300
    C435 335 400 365 365 355
    C345 390 308 375 300 345
    Z"
    fill="url(#purpleBrain)"
    stroke="#d48cff"
    stroke-width="4"/>

  <!-- RIGHT BRAIN DETAILS -->
  <g fill="none"
     stroke="#e9b1ff"
     stroke-width="7"
     stroke-linecap="round"
     opacity=".65">

    <path d="M395 150 C355 180 390 200 360 220"/>
    <path d="M430 195 C390 215 420 245 380 255"/>
    <path d="M435 255 C395 265 420 300 375 305"/>
    <path d="M410 320 C375 300 380 340 350 350"/>
    <path d="M355 135 C335 170 350 190 325 210"/>
  </g>

  <!-- NEURAL CONNECTIONS -->
  <g fill="none"
     stroke="#ffffff"
     stroke-width="4"
     stroke-linecap="round">

    <path d="M245 185 L275 210"/>
    <path d="M220 235 L270 240"/>
    <path d="M230 300 L275 270"/>

    <path d="M355 185 L325 210"/>
    <path d="M380 235 L330 240"/>
    <path d="M370 300 L325 270"/>
  </g>

  <!-- NEURAL NODES -->
  <g filter="url(#glow)">

    <circle cx="245" cy="185" r="9"
            fill="#ffffff"
            stroke="#53efff"
            stroke-width="5"/>

    <circle cx="220" cy="235" r="9"
            fill="#ffffff"
            stroke="#53efff"
            stroke-width="5"/>

    <circle cx="230" cy="300" r="9"
            fill="#ffffff"
            stroke="#53efff"
            stroke-width="5"/>

    <circle cx="355" cy="185" r="9"
            fill="#ffffff"
            stroke="#ff9cff"
            stroke-width="5"/>

    <circle cx="380" cy="235" r="9"
            fill="#ffffff"
            stroke="#ff9cff"
            stroke-width="5"/>

    <circle cx="370" cy="300" r="9"
            fill="#ffffff"
            stroke="#ff9cff"
            stroke-width="5"/>
  </g>

  <!-- CENTRAL AI CHIP -->
  <g filter="url(#shadow)">

    <rect x="240"
          y="185"
          width="120"
          height="120"
          rx="20"
          fill="url(#chip)"
          stroke="#65efff"
          stroke-width="5"/>

    <rect x="253"
          y="198"
          width="94"
          height="94"
          rx="12"
          fill="#102c91"
          stroke="#63eaff"
          stroke-width="3"/>

    <text x="300"
          y="263"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="48"
          font-weight="900"
          fill="#ffffff">
      AI
    </text>
  </g>

  <!-- CHIP PINS -->
  <g stroke="#ffd84d"
     stroke-width="6"
     stroke-linecap="round">

    <line x1="265" y1="185" x2="265" y2="170"/>
    <line x1="280" y1="185" x2="280" y2="170"/>
    <line x1="295" y1="185" x2="295" y2="170"/>
    <line x1="310" y1="185" x2="310" y2="170"/>
    <line x1="325" y1="185" x2="325" y2="170"/>
    <line x1="340" y1="185" x2="340" y2="170"/>

    <line x1="265" y1="305" x2="265" y2="320"/>
    <line x1="280" y1="305" x2="280" y2="320"/>
    <line x1="295" y1="305" x2="295" y2="320"/>
    <line x1="310" y1="305" x2="310" y2="320"/>
    <line x1="325" y1="305" x2="325" y2="320"/>
    <line x1="340" y1="305" x2="340" y2="320"/>

    <line x1="240" y1="210" x2="225" y2="210"/>
    <line x1="240" y1="225" x2="225" y2="225"/>
    <line x1="240" y1="240" x2="225" y2="240"/>
    <line x1="240" y1="255" x2="225" y2="255"/>
    <line x1="240" y1="270" x2="225" y2="270"/>
    <line x1="240" y1="285" x2="225" y2="285"/>

    <line x1="360" y1="210" x2="375" y2="210"/>
    <line x1="360" y1="225" x2="375" y2="225"/>
    <line x1="360" y1="240" x2="375" y2="240"/>
    <line x1="360" y1="255" x2="375" y2="255"/>
    <line x1="360" y1="270" x2="375" y2="270"/>
    <line x1="360" y1="285" x2="375" y2="285"/>
  </g>

  <!-- GOLD STAR -->
  <g transform="translate(465 90)"
     fill="url(#gold)"
     filter="url(#glow)">
    <path d="
      M0 -30
      L7 -7
      L30 0
      L7 7
      L0 30
      L-7 7
      L-30 0
      L-7 -7
      Z"/>
  </g>

  <!-- CYAN STAR -->
  <g transform="translate(105 330)"
     fill="#21e8ff"
     filter="url(#glow)">
    <path d="
      M0 -16
      L4 -4
      L16 0
      L4 4
      L0 16
      L-4 4
      L-16 0
      L-4 -4
      Z"/>
  </g>

  <!-- GLASS HIGHLIGHT -->
  <path d="M175 145
           C215 90 305 85 375 115"
        fill="none"
        stroke="#ffffff"
        stroke-width="11"
        stroke-linecap="round"
        opacity=".6"/>

</svg>
