# pdf-tools-api — Cloudflare Worker that replaces Supabase (login, credits, matrimony data).
# Deployed by .github/workflows/deploy-cloudflare.yml. The two __..._ID__ placeholders are filled in
# by that workflow (it creates the D1 database / KV namespace the first time) — leave them as they are.
name = "pdf-tools-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# same site as the Cloudflare Pages frontend: https://pdftoolsindia.com/cfapi/*
routes = [
  { pattern = "pdftoolsindia.com/cfapi/*", zone_name = "pdftoolsindia.com" }
]

[vars]
PUBLIC_API_URL = "https://pdftoolsindia.com/cfapi"

[[d1_databases]]
binding = "DB"
database_name = "pdftools-db"
database_id = "__D1_DATABASE_ID__"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "MAT_PHOTOS"
id = "__KV_NAMESPACE_ID__"

[observability]
enabled = true

# Secrets (set by the workflow from GitHub repository secrets, never stored here):
#   AUTH_JWT_SECRET   — same value as Cloud Run's AUTH_JWT_SECRET
#   INTERNAL_KEY      — same value as Cloud Run's CF_INTERNAL_KEY
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET — Google sign-in
#   RESEND_API_KEY, EMAIL_FROM             — optional: confirmation / password-reset e-mails
#   MAT_ADMIN_EMAILS  — optional: comma-separated e-mails that become matrimony admins on sign-in
