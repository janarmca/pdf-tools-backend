<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#120a06" />
<title>Carrom Disc Pool — Quiz Quest</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Trebuchet MS','Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at 50% 12%,#2e1e13 0%,#170e08 45%,#070403 100%);
    color:#f5e9d4;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;overflow:hidden;user-select:none;
  }
  body::before{
    content:'';position:fixed;inset:-40%;
    background:
      radial-gradient(circle at 20% 20%,rgba(255,160,60,.10),transparent 45%),
      radial-gradient(circle at 80% 80%,rgba(255,90,40,.08),transparent 45%);
    animation:drift 22s ease-in-out infinite alternate;
    pointer-events:none;
  }
  @keyframes drift{
    0%{transform:translate(0,0) scale(1);}
    100%{transform:translate(4%,-4%) scale(1.12);}
  }

  .app{
    position:relative;
    width:min(94vw,68vh);
    max-width:660px;
    display:flex;flex-direction:column;gap:10px;
    z-index:2;
  }

  .hud{display:flex;align-items:stretch;gap:8px;}

  .pcard{
    flex:1;display:flex;align-items:center;gap:9px;
    padding:7px 11px;border-radius:14px;
    background:linear-gradient(150deg,rgba(255,255,255,.075),rgba(255,255,255,.015));
    border:1px solid rgba(255,200,130,.14);
    transition:.35s cubic-bezier(.2,.8,.3,1);
    min-width:0;
  }
  .pcard.active{
    border-color:rgba(255,200,90,.75);
    background:linear-gradient(150deg,rgba(255,190,80,.17),rgba(255,255,255,.02));
    box-shadow:0 0 22px rgba(255,175,55,.30),inset 0 0 20px rgba(255,180,60,.09);
    transform:translateY(-1px);
  }
  .disc{
    width:25px;height:25px;border-radius:50%;flex-shrink:0;
    box-shadow:0 2px 5px rgba(0,0,0,.55);
  }
  .disc.white{background:radial-gradient(circle at 32% 28%,#fffdf6,#f2e4c0 46%,#c9b083);}
  .disc.black{background:radial-gradient(circle at 32% 28%,#787878,#2b2b2b 46%,#040404);}
  .pinfo{display:flex;flex-direction:column;line-height:1.05;min-width:0;}
  .pname{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#c9b295;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pscore{font-size:19px;font-weight:800;color:#ffd884;text-shadow:0 0 14px rgba(255,190,70,.45);}

  .status{
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding:6px 12px;border-radius:14px;font-size:11px;font-weight:700;
    letter-spacing:.10em;text-transform:uppercase;
    background:linear-gradient(150deg,rgba(255,190,80,.18),rgba(255,255,255,.02));
    border:1px solid rgba(255,200,90,.35);
    color:#ffd884;white-space:nowrap;
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 rgba(255,180,60,0);}
    50%{box-shadow:0 0 18px rgba(255,180,60,.35);}
  }

  .boardwrap{
    position:relative;width:100%;aspect-ratio:1/1;
    border-radius:18px;overflow:hidden;
    box-shadow:
      0 28px 60px rgba(0,0,0,.80),
      0 0 0 1px rgba(255,200,120,.13),
      0 0 90px rgba(255,140,40,.07);
    transition:box-shadow .6s ease;
  }
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;}

  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(9,5,2,.84);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    opacity:0;pointer-events:none;transition:opacity .4s ease;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .ovcard{
    text-align:center;padding:26px 34px;border-radius:20px;
    background:linear-gradient(160deg,rgba(255,200,110,.13),rgba(255,255,255,.03));
    border:1px solid rgba(255,200,110,.28);
    box-shadow:0 20px 50px rgba(0,0,0,.6);
    transform:scale(.85);transition:transform .45s cubic-bezier(.2,1.4,.4,1);
  }
  .overlay.show .ovcard{transform:scale(1);}
  .ovcard h2{margin:0 0 6px;font-size:26px;color:#ffd884;letter-spacing:.04em;
             text-shadow:0 0 22px rgba(255,190,70,.55);}
  .ovcard p{margin:0 0 18px;font-size:14px;color:#d8c6ab;}

  button{
    font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:#2a1608;cursor:pointer;
    padding:9px 20px;border-radius:11px;border:none;
    background:linear-gradient(160deg,#ffd884,#e8a93c);
    box-shadow:0 5px 16px rgba(255,170,50,.32);
    transition:.2s;
  }
  button:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(255,170,50,.45);}
  button:active{transform:translateY(0) scale(.97);}

  .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .controls button{
    flex:0 0 auto;padding:8px 15px;
    background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
    color:#f0dcbb;border:1px solid rgba(255,200,130,.22);box-shadow:none;
  }
  .controls button:hover{background:rgba(255,200,130,.16);}
  .controls button.on{
    background:linear-gradient(160deg,#ffd884,#e8a93c);color:#2a1608;
    border-color:transparent;box-shadow:0 5px 16px rgba(255,170,50,.32);
  }
  .hint{
    flex:1;text-align:right;font-size:10.5px;color:#9d8a70;letter-spacing:.04em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .levelbadge{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 10px;border-radius:10px;font-size:10px;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;
    background:linear-gradient(160deg,rgba(120,220,255,.20),rgba(80,160,255,.08));
    border:1px solid rgba(120,210,255,.40);
    color:#bfe9ff;text-shadow:0 0 10px rgba(120,210,255,.6);
    white-space:nowrap;
  }
  .trophybadge{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 10px;border-radius:10px;font-size:11px;font-weight:800;
    letter-spacing:.08em;text-transform:uppercase;
    background:linear-gradient(160deg,rgba(255,215,90,.24),rgba(255,180,60,.06));
    border:1px solid rgba(255,215,90,.45);
    color:#ffe9a0;text-shadow:0 0 12px rgba(255,200,70,.65);
    white-space:nowrap;
  }
  @media(max-width:430px){
    .pname{font-size:9px;}
    .pscore{font-size:16px;}
    .hint{display:none;}
  }

  /* ============ QUIZ OVERLAY ============ */
  .quiz-overlay{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(6,3,1,.90);
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:50;
    padding:16px;
  }
  .quiz-overlay.show{opacity:1;pointer-events:auto;}

  .quiz-card{
    width:min(96vw,520px);
    padding:20px 20px 18px;border-radius:22px;
    background:linear-gradient(160deg,rgba(255,205,120,.15),rgba(255,255,255,.035));
    border:1px solid rgba(255,205,120,.32);
    box-shadow:0 28px 70px rgba(0,0,0,.75),0 0 60px rgba(255,170,50,.10);
    transform:scale(.88) translateY(24px);
    transition:transform .45s cubic-bezier(.2,1.3,.4,1);
  }
  .quiz-overlay.show .quiz-card{transform:scale(1) translateY(0);}

  .quiz-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-bottom:12px;
  }
  .quiz-level{
    font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:#ffd884;text-shadow:0 0 14px rgba(255,190,70,.55);
  }
  .quiz-subject{
    font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    padding:4px 10px;border-radius:9px;
    background:rgba(120,210,255,.16);border:1px solid rgba(120,210,255,.35);
    color:#bfe9ff;
  }

  .quiz-timer{
    height:5px;border-radius:3px;overflow:hidden;
    background:rgba(255,255,255,.08);margin-bottom:14px;
  }
  .quiz-timer-fill{
    height:100%;width:100%;border-radius:3px;
    background:linear-gradient(90deg,#6ee7a0,#ffd884,#ff7a5c);
    transform-origin:left center;
    transition:transform .1s linear;
  }

  .quiz-question{
    margin:0 0 16px;font-size:17px;line-height:1.4;color:#fdf1da;
    letter-spacing:.01em;min-height:48px;
    animation:qin .4s ease both;
  }
  @keyframes qin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  @media(max-width:400px){.quiz-options{grid-template-columns:1fr;}}

  .opt{
    position:relative;text-align:left;
    padding:12px 14px;border-radius:13px;cursor:pointer;
    background:linear-gradient(150deg,rgba(255,255,255,.075),rgba(255,255,255,.02));
    border:1px solid rgba(255,200,130,.20);
    color:#f2e3c8;font-size:13.5px;font-weight:600;letter-spacing:.02em;
    transition:.18s;font-family:inherit;
    display:flex;align-items:center;gap:9px;
    transform:translateY(0);
  }
  .opt .k{
    flex:0 0 auto;width:22px;height:22px;border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;color:#2a1608;
    background:linear-gradient(160deg,#ffd884,#e8a93c);
  }
  .opt:hover{
    background:rgba(255,200,130,.16);
    border-color:rgba(255,200,130,.45);
    transform:translateY(-2px);
  }
  .opt.correct{
    background:linear-gradient(150deg,rgba(110,231,160,.30),rgba(60,200,120,.10));
    border-color:rgba(110,231,160,.85);
    box-shadow:0 0 24px rgba(110,231,160,.35);
    animation:pop .4s ease;
  }
  .opt.wrong{
    background:linear-gradient(150deg,rgba(255,110,90,.28),rgba(255,60,40,.10));
    border-color:rgba(255,110,90,.85);
    animation:shake .4s ease;
  }
  .opt.dim{opacity:.35;}
  @keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.06);}100%{transform:scale(1);}}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}

  .quiz-feedback{
    margin-top:13px;text-align:center;font-size:13px;font-weight:800;
    letter-spacing:.06em;min-height:20px;
    opacity:0;transition:opacity .3s;
  }
  .quiz-feedback.show{opacity:1;}
  .quiz-feedback.ok{color:#8df0b4;text-shadow:0 0 16px rgba(110,231,160,.7);}
  .quiz-feedback.no{color:#ff9a86;text-shadow:0 0 16px rgba(255,110,90,.7);}

  .quiz-streak{
    margin-top:10px;text-align:center;font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:#c9b295;
  }

  /* ============ LEVEL UP BURST ============ */
  .levelup{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:60;opacity:0;
  }
  .levelup.show{animation:lvl 1.3s ease forwards;}
  @keyframes lvl{
    0%{opacity:0;transform:scale(.5);}
    20%{opacity:1;transform:scale(1.1);}
    70%{opacity:1;transform:scale(1);}
    100%{opacity:0;transform:scale(1.25);}
  }
  .levelup span{
    font-size:44px;font-weight:900;letter-spacing:.06em;
    color:#ffd884;text-shadow:0 0 40px rgba(255,190,70,.9),0 0 80px rgba(255,150,40,.6);
  }

  /* ============ VICTORY OVERLAY ============ */
  .victory-overlay{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(6,3,1,.92);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    opacity:0;pointer-events:none;transition:opacity .45s ease;z-index:55;
    padding:18px;
  }
  .victory-overlay.show{opacity:1;pointer-events:auto;}

  .victory-card{
    width:min(96vw,520px);text-align:center;
    padding:26px 24px 22px;border-radius:24px;
    background:linear-gradient(160deg,rgba(255,205,120,.18),rgba(255,255,255,.04));
    border:1px solid rgba(255,205,120,.40);
    box-shadow:0 30px 80px rgba(0,0,0,.80),0 0 70px rgba(255,180,60,.20);
    transform:scale(.85) translateY(20px);
    transition:transform .55s cubic-bezier(.2,1.3,.4,1);
  }
  .victory-overlay.show .victory-card{transform:scale(1) translateY(0);}

  .vic-trophy{
    font-size:60px;line-height:1;
    filter:drop-shadow(0 0 20px rgba(255,200,70,.75));
    animation:trophyPop .8s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes trophyPop{
    0%{transform:scale(.3) rotate(-30deg);}
    60%{transform:scale(1.15) rotate(8deg);}
    100%{transform:scale(1) rotate(0);}
  }

  .victory-card h2{
    margin:6px 0 4px;font-size:34px;color:#ffd884;letter-spacing:.06em;
    text-shadow:0 0 30px rgba(255,190,70,.85),0 0 60px rgba(255,150,40,.5);
  }
  .victory-card p.sub{
    margin:0 0 16px;font-size:13px;color:#e6d5b5;letter-spacing:.04em;
  }

  .vic-stats{
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
    margin-bottom:18px;
  }
  .vic-stat{
    padding:9px 14px;border-radius:13px;
    background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
    border:1px solid rgba(255,200,130,.22);
    display:flex;flex-direction:column;gap:1px;min-width:88px;
  }
  .vic-stat .lbl{
    font-size:9px;letter-spacing:.16em;text-transform:uppercase;
    color:#b9a486;font-weight:700;
  }
  .vic-stat .val{
    font-size:20px;font-weight:900;color:#ffd884;
    text-shadow:0 0 14px rgba(255,190,70,.45);
  }

  .vic-unlock{
    margin:0 auto 18px;padding:13px 16px;border-radius:16px;
    background:linear-gradient(160deg,rgba(120,220,255,.16),rgba(80,160,255,.05));
    border:1px solid rgba(140,220,255,.45);
    box-shadow:0 0 32px rgba(120,210,255,.25);
    display:none;
  }
  .vic-unlock.show{display:block;animation:pop .6s ease;}
  .vic-unlock .tag{
    font-size:9.5px;font-weight:900;letter-spacing:.20em;text-transform:uppercase;
    color:#bfe9ff;text-shadow:0 0 12px rgba(120,210,255,.7);
  }
  .vic-unlock .name{
    margin-top:4px;font-size:19px;font-weight:900;color:#fff;
    letter-spacing:.03em;
    text-shadow:0 0 20px rgba(120,210,255,.9);
  }
  .vic-unlock .preview{
    margin:9px auto 0;height:22px;width:180px;border-radius:8px;
    border:1px solid rgba(255,255,255,.22);
  }

  .vic-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  /* ============ THEMES OVERLAY ============ */
  .themes-overlay{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(6,3,1,.90);
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:54;
    padding:18px;
  }
  .themes-overlay.show{opacity:1;pointer-events:auto;}
  .themes-card{
    width:min(96vw,560px);max-height:88vh;overflow-y:auto;
    padding:22px 22px 18px;border-radius:22px;text-align:center;
    background:linear-gradient(160deg,rgba(255,205,120,.14),rgba(255,255,255,.03));
    border:1px solid rgba(255,205,120,.30);
    box-shadow:0 30px 80px rgba(0,0,0,.8);
    transform:scale(.9);transition:transform .45s cubic-bezier(.2,1.3,.4,1);
  }
  .themes-overlay.show .themes-card{transform:scale(1);}
  .themes-card h2{
    margin:0 0 4px;font-size:23px;color:#ffd884;letter-spacing:.05em;
    text-shadow:0 0 22px rgba(255,190,70,.55);
  }
  .themes-card .sub{
    margin:0 0 18px;font-size:12px;color:#b9a486;letter-spacing:.05em;
  }

  .themes-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:11px;margin-bottom:18px;
  }
  .theme-tile{
    position:relative;padding:12px 10px 11px;border-radius:16px;cursor:pointer;
    background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));
    border:1px solid rgba(255,200,130,.20);
    transition:.22s;text-align:center;
  }
  .theme-tile:hover{transform:translateY(-3px);border-color:rgba(255,200,130,.5);}
  .theme-tile.equipped{
    border-color:rgba(110,231,160,.85);
    box-shadow:0 0 24px rgba(110,231,160,.35);
  }
  .theme-tile.locked{
    opacity:.55;cursor:not-allowed;filter:grayscale(.5);
  }
  .theme-tile.locked:hover{transform:none;border-color:rgba(255,200,130,.20);}
  .theme-tile .sw{
    height:38px;border-radius:11px;margin-bottom:8px;
    border:1px solid rgba(255,255,255,.18);
    box-shadow:inset 0 0 18px rgba(0,0,0,.35);
  }
  .theme-tile .nm{
    font-size:11px;font-weight:800;letter-spacing:.06em;color:#f2e3c8;
    text-transform:uppercase;
  }
  .theme-tile .lk{
    margin-top:5px;font-size:9.5px;letter-spacing:.14em;font-weight:800;
    color:#b9a486;text-transform:uppercase;
  }
  .theme-tile.equipped .lk{color:#8df0b4;}
  .theme-tile .stk{
    position:absolute;top:6px;right:8px;font-size:18px;opacity:.85;
  }

  /* confetti canvas */
  #confettiCanvas{
    position:fixed;inset:0;pointer-events:none;z-index:80;
  }
</style>
</head>
<body>

<div class="app">
  <div class="hud">
    <div class="pcard active" id="card0">
      <div class="disc white"></div>
      <div class="pinfo"><div class="pname" id="name0">You</div><div class="pscore" id="score0">0</div></div>
    </div>
    <div class="status" id="status">Your Turn</div>
    <div class="pcard" id="card1">
      <div class="disc black"></div>
      <div class="pinfo"><div class="pname" id="name1">CPU</div><div class="pscore" id="score1">0</div></div>
    </div>
  </div>

  <div class="boardwrap" id="boardwrap">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay">
      <div class="ovcard">
        <h2 id="ovTitle">Game Over</h2>
        <p id="ovText"></p>
        <button id="ovBtn">Play Again</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="newGame">New Game</button>
    <button id="themesBtn">🎨 Themes</button>
    <span class="trophybadge" id="trophyBadge">🏆 0</span>
    <span class="levelbadge" id="levelBadge">Lv 1 · 0 ✓</span>
    <span class="hint">Drag striker • pull back &amp; release</span>
  </div>
</div>

<!-- ============ QUIZ OVERLAY ============ -->
<div class="quiz-overlay" id="quizOverlay">
  <div class="quiz-card">
    <div class="quiz-head">
      <span class="quiz-level" id="quizLevel">Level 1</span>
      <span class="quiz-subject" id="quizSubject">Math</span>
    </div>
    <div class="quiz-timer"><div class="quiz-timer-fill" id="quizTimerFill"></div></div>
    <h3 class="quiz-question" id="quizQuestion">Question…</h3>
    <div class="quiz-options" id="quizOptions"></div>
    <div class="quiz-feedback" id="quizFeedback"></div>
    <div class="quiz-streak" id="quizStreak"></div>
  </div>
</div>

<!-- ============ VICTORY OVERLAY ============ -->
<div class="victory-overlay" id="victoryOverlay">
  <div class="victory-card">
    <div class="vic-trophy">🏆</div>
    <h2 id="vicTitle">VICTORY!</h2>
    <p class="sub" id="vicSubtitle">You won the match!</p>
    <div class="vic-stats" id="vicStats"></div>
    <div class="vic-unlock" id="vicUnlock">
      <div class="tag">🎁 New Board Unlocked</div>
      <div class="name" id="vicUnlockName">—</div>
      <div class="preview" id="vicUnlockPreview"></div>
    </div>
    <div class="vic-actions">
      <button id="vicContinue">Next Game</button>
      <button id="vicThemes">🎨 View Boards</button>
    </div>
  </div>
</div>

<!-- ============ THEMES OVERLAY ============ -->
<div class="themes-overlay" id="themesOverlay">
  <div class="themes-card">
    <h2>🎨 Board Collection</h2>
    <p class="sub">Win matches to unlock new boards &amp; stickers</p>
    <div class="themes-grid" id="themesGrid"></div>
    <button id="themesClose">Close</button>
  </div>
</div>

<div class="levelup" id="levelup"><span id="levelupText">LEVEL UP!</span></div>
<canvas id="confettiCanvas"></canvas>

<script>
(function(){
'use strict';

/* =========================================================
   CONSTANTS
   ========================================================= */
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');

const SIZE   = 720;
const BORDER = 60;
const INNER  = SIZE - BORDER*2;      // 600
const TAU    = Math.PI * 2;

let actx = null;
function initAudio(){
  if (actx) { if(actx.state==='suspended') actx.resume(); return; }
  try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}
function tone(type, f0, f1, dur, vol){
  if(!actx || actx.state!=='running') return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.connect(g); g.connect(actx.destination);
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1), t+dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.start(t); o.stop(t+dur+0.02);
}
function sfx(type, vol){
  if(!actx || actx.state!=='running') return;
  if(type==='clack')      tone('triangle', 900+Math.random()*500, 170, 0.09, Math.min(vol,0.22));
  else if(type==='pocket')tone('sine', 430, 85, 0.30, 0.16);
  else if(type==='wall')  tone('sine', 210, 75, 0.10, Math.min(vol,0.10));
  else if(type==='correct'){
    tone('sine', 660, 990, 0.16, 0.16);
    setTimeout(()=>tone('sine', 990, 1320, 0.20, 0.14), 90);
  }
  else if(type==='wrong') tone('sawtooth', 260, 110, 0.34, 0.14);
  else if(type==='levelup'){
    [523,659,784,1047].forEach((f,i)=>
      setTimeout(()=>tone('sine', f, f*1.5, 0.22, 0.15), i*95));
  }
  else if(type==='victory'){
    [523,659,784,1047,1319].forEach((f,i)=>
      setTimeout(()=>tone('triangle', f, f*1.25, 0.28, 0.18), i*110));
  }
}

function makeCoin(x,y,type){
  return { x, y, vx:0, vy:0, r: COIN_R, m:1, type,
           active:true, sinking:false, sinkT:0, pocket:null };
}

function setupCoins(){
  coins = [];
  const cx = INNER/2, cy = INNER/2;

  coins.push(makeCoin(cx, cy, 'queen'));

  const innerColors = ['white','black','white','black','white','black'];
  const R1 = COIN_R*2 + 0.6;
  for(let i=0;i<6;i++){
    const a = -Math.PI/2 + i*Math.PI/3;
    coins.push(makeCoin(cx+Math.cos(a)*R1, cy+Math.sin(a)*R1, innerColors[i]));
  }

  const R2 = COIN_R*4 + 1.2;
  for(let i=0;i<12;i++){
    const a = -Math.PI/2 + i*Math.PI/6 + Math.PI/12;
    coins.push(makeCoin(cx+Math.cos(a)*R2, cy+Math.sin(a)*R2, i%2===0?'black':'white'));
  }
}

/* =========================================================
   PHYSICS
   ========================================================= */
function physicsList(){
  const list = [];
  for(const c of coins) if(c.active && !c.sinking) list.push(c);
  if(striker && striker.active && !striker.sinking) list.push(striker);
  return list;
}

function physicsStep(dt){
  const list = physicsList();
  const damp = Math.pow(FRICTION_BASE, dt*60);

  for(const b of list){
    b.x += b.vx*dt;
    b.y += b.vy*dt;
    b.vx *= damp;
    b.vy *= damp;
    if(Math.hypot(b.vx,b.vy) < 5){ b.vx = 0; b.vy = 0; }
  }

  for(let i=0;i<list.length;i++)
    for(let j=i+1;j<list.length;j++)
      collideDiscs(list[i], list[j]);

  for(const b of list){
    let sunk = false;
    for(const p of POCKETS){
      if(Math.hypot(b.x-p.x, b.y-p.y) < POCKET_R*0.85){ sinkBody(b,p); sunk = true; break; }
    }
    if(sunk) continue;

    if(b.x - b.r < 0){
      b.x = b.r;
      if(b.vx < 0){ if(Math.abs(b.vx)>200) sfx('wall', Math.abs(b.vx)/4000); b.vx = -b.vx*WALL_E; }
    }
    if(b.x + b.r > INNER){
      b.x = INNER - b.r;
      if(b.vx > 0){ if(Math.abs(b.vx)>200) sfx('wall', Math.abs(b.vx)/4000); b.vx = -b.vx*WALL_E; }
    }
    if(b.y - b.r < 0){
      b.y = b.r;
      if(b.vy < 0){ if(Math.abs(b.vy)>200) sfx('wall', Math.abs(b.vy)/4000); b.vy = -b.vy*WALL_E; }
    }
    if(b.y + b.r > INNER){
      b.y = INNER - b.r;
      if(b.vy > 0){ if(Math.abs(b.vy)>200) sfx('wall', Math.abs(b.vy)/4000); b.vy = -b.vy*WALL_E; }
    }
  }
}

function collideDiscs(a,b){
  const dx = b.x-a.x, dy = b.y-a.y;
  const minD = a.r + b.r;
  const d2 = dx*dx + dy*dy;
  if(d2 >= minD*minD || d2 === 0) return;

  const d = Math.sqrt(d2);
  const nx = dx/d, ny = dy/d;
  const overlap = minD - d;
  const im1 = 1/a.m, im2 = 1/b.m;
  const imSum = im1 + im2;

  a.x -= nx * overlap * (im1/imSum);
  a.y -= ny * overlap * (im1/imSum);
  b.x += nx * overlap * (im2/imSum);
  b.y += ny * overlap * (im2/imSum);

  const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
  const vn = rvx*nx + rvy*ny;
  if(vn > 0) return;

  const j = -(1+RESTITUTION) * vn / imSum;
  a.vx -= j*nx*im1;  a.vy -= j*ny*im1;
  b.vx += j*nx*im2;  b.vy += j*ny*im2;

  const impact = Math.abs(vn);
  if(impact > 90){
    sfx('clack', clamp(impact/2600, 0.03, 0.22));
    spawnHitParticles((a.x+b.x)/2, (a.y+b.y)/2, impact);
    if(impact > 700){ shake.t = 0.22; shake.mag = Math.min(9, impact/260); }
  }
}

function sinkBody(b,p){
  b.sinking = true;
  b.sinkT = 0;
  b.pocket = p;
  b.vx = 0; b.vy = 0;
  pocketedThisShot.push(b.type);
  sfx('pocket', 0.18);

  for(let i=0;i<22;i++){
    const a = Math.random()*TAU;
    const sp = 40 + Math.random()*190;
    particles.push({
      x:p.x, y:p.y,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:0.45+Math.random()*0.45, max:0.9,
      r:1.5+Math.random()*3.0,
      c: Math.random()<0.5 ? '#ffd98a' : '#ffb347'
    });
  }
}

function spawnHitParticles(x,y,impact){
  const n = Math.min(9, 2 + Math.floor(impact/220));
  for(let i=0;i<n;i++){
    const a = Math.random()*TAU;
    const sp = 25 + Math.random()*110;
    particles.push({
      x, y,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:0.22+Math.random()*0.22, max:0.45,
      r:0.9+Math.random()*1.7,
      c:'rgba(255,238,200,0.95)'
    });
  }
}

/* =========================================================
   EFFECTS
   ========================================================= */
function updateEffects(dt){
  for(const c of coins){
    if(c.sinking){
      c.sinkT += dt;
      if(c.sinkT > 0.40){ c.active = false; c.sinking = false; }
    }
  }
  if(striker && striker.sinking){
    striker.sinkT += dt;
    if(striker.sinkT > 0.40){ striker.active = false; striker.sinking = false; }
  }
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx*dt;  p.y += p.vy*dt;
    p.vx *= 0.93;    p.vy *= 0.93;
    p.life -= dt;
    if(p.life <= 0) particles.splice(i,1);
  }
  if(shake.t > 0){
    shake.t -= dt;
    if(shake.t <= 0) shake.mag = 0;
  }
}

/* =========================================================
   TURN LOGIC
   ========================================================= */
function checkSettle(){
  if(state !== 'shooting') return;
  for(const c of coins){
    if(!c.active) continue;
    if(c.sinking) return;
    if(Math.hypot(c.vx,c.vy) > 3) return;
  }
  if(striker && striker.active){
    if(striker.sinking) return;
    if(Math.hypot(striker.vx,striker.vy) > 3) return;
  }
  state = 'settling';
  endShot();
}

async function endShot(){
  const me = current, opp = 1-current;
  const myColor  = me===0 ? 'white' : 'black';
  const oppColor = me===0 ? 'black' : 'white';

  let keepTurn = false, foul = false;
  let pocketedOwn = false, pocketedQueen = false;

  for(const t of pocketedThisShot){
    if(t === 'striker'){ foul = true; }
    else if(t === 'queen'){ scores[me] += 3; keepTurn = true; pocketedQueen = true; }
    else if(t === myColor){ scores[me] += 1; keepTurn = true; pocketedOwn = true; }
    else if(t === oppColor){ scores[opp] += 1; }
  }

  if(foul){
    scores[me] = Math.max(0, scores[me]-1);
    keepTurn = false;
  }

  if(!foul && (pocketedOwn || pocketedQueen)){
    const quizPassed = await runQuizStage(me);
    keepTurn = quizPassed;
  }

  if(!keepTurn) current = opp;

  // Reset striker on the correct side
  striker.active = true;
  striker.sinking = false;
  striker.sinkT = 0;
  striker.vx = 0; striker.vy = 0;
  striker.y = (current === 0) ? BASE_Y : CPU_BASE_Y;
  striker.x = clamp(striker.x, MIN_X, MAX_X);

  pocketedThisShot = [];

  const whiteLeft = coins.filter(c=>c.active && c.type==='white').length;
  const blackLeft = coins.filter(c=>c.active && c.type==='black').length;
  if(whiteLeft === 0 || blackLeft === 0){
    gameOver(whiteLeft, blackLeft);
    return;
  }

  state = 'aim';
  updateHUD();

  if(current === 1) startAI();
}

function gameOver(whiteLeft, blackLeft){
  state = 'over';
  updateHUD();

  // Determine if human won
  let humanWon = false;
  let draw = false;
  if(whiteLeft === 0 && blackLeft === 0){
    if(scores[0] > scores[1])      humanWon = true;
    else if(scores[1] > scores[0]) humanWon = false;
    else                           draw = true;
  } else if(whiteLeft === 0){
    humanWon = true;
  } else {
    humanWon = false;
  }

  if(humanWon && !draw){
    // ── Celebration! ──
    trophies++;
    persist();

    // Check for newly unlocked theme
    let newlyUnlocked = null;
    for(let i=0;i<THEMES.length;i++){
      if(!unlockedThemes.includes(i) && trophies >= THEMES[i].unlockWins){
        unlockedThemes.push(i);
        if(!newlyUnlocked) newlyUnlocked = i;
      }
    }
    persist();

    // Auto-equip newly unlocked theme
    if(newlyUnlocked !== null){
      applyTheme(newlyUnlocked);
    }

    sfx('victory');
    spawnConfetti(160);

    showVictory({
      score: scores[0] + ' — ' + scores[1],
      level: level,
      streak: bestStreak,
      unlockedTheme: newlyUnlocked
    });
    return;
  }

  // Loss or draw → standard overlay
  let title, text;
  if(draw){
    title = '🤝 Draw!';
    text  = 'Final Score ' + scores[0] + ' — ' + scores[1];
  } else if(whiteLeft === 0){
    title = '🏆 You Win!';
    text  = 'All white coins cleared — ' + scores[0] + ' pts';
  } else {
    title = '🤖 CPU Wins!';
    text  = 'CPU cleared all black coins — ' + scores[1] + ' pts';
  }
  text += ' • Level ' + level + ' • Best Streak ' + bestStreak;

  document.getElementById('ovTitle').textContent = title;
  document.getElementById('ovText').textContent  = text;
  setTimeout(()=>document.getElementById('overlay').classList.add('show'), 450);
}

function doShoot(ux, uy, power){
  striker.vx = ux * power * MAX_SPEED;
  striker.vy = uy * power * MAX_SPEED;
  state = 'shooting';
  pocketedThisShot = [];
  aiming.active = false;
  aiming.moving = false;

/* =========================================================
   AI  (now shoots from the TOP)
   ========================================================= */
function startAI(){
  ai.active = true;
  ai.phase = 0;
  ai.t = 0.75;
  computeAIPlan();
  updateHUD();
}

function pathBlocked(x1,y1,x2,y2,ignoreCoin){
  const dx = x2-x1, dy = y2-y1;
  const len = Math.hypot(dx,dy);
  if(len < 1) return false;
  const ux = dx/len, uy = dy/len;
  for(const c of coins){
    if(!c.active || c.sinking || c === ignoreCoin) continue;
    const rx = c.x - x1, ry = c.y - y1;
    const t = rx*ux + ry*uy;
    if(t < 0 || t > len) continue;
    const px = x1 + ux*t, py = y1 + uy*t;
    const d = Math.hypot(c.x-px, c.y-py);
    if(d < STRIKER_R + c.r - 2) return true;
  }
  return false;
}

function computeAIPlan(){
  const targets = coins.filter(c => c.active && !c.sinking && c.type === 'black');
  let best = null;

  // AI skill scales with trophies (slightly better aim as you win more)
  const noise = clamp(0.070 - trophies*0.004, 0.012, 0.070);

  for(const c of targets){
    for(const p of POCKETS){
      const dx = c.x-p.x, dy = c.y-p.y;
      const d = Math.hypot(dx,dy);
      if(d < 1) continue;
      const ux = dx/d, uy = dy/d;
      const gx = c.x + ux*(STRIKER_R + c.r);
      const gy = c.y + uy*(STRIKER_R + c.r);
      // Ghost must be below CPU's top baseline
      if(gy < CPU_BASE_Y + 55) continue;
      if(gx < 45 || gx > INNER-45) continue;
      const sx = clamp(gx, MIN_X, MAX_X);
      // Path check
      if(pathBlocked(sx, CPU_BASE_Y, gx, gy, c)) continue;
      const cost = d + Math.hypot(gx-sx, gy-CPU_BASE_Y)*0.35;
      if(!best || cost < best.cost) best = {gx, gy, cost, sx, coin:c};
    }
  }

  let tx, ty, sx;
  if(best){
    tx = best.gx; ty = best.gy; sx = best.sx;
  } else if(targets.length){
    const c = targets[Math.floor(Math.random()*targets.length)];
    tx = c.x; ty = c.y;
    sx = clamp(c.x, MIN_X, MAX_X);
  } else {
    tx = INNER/2; ty = INNER/2 + 100;
    sx = INNER/2;
  }

  ai.targetX = sx;

  const dx = tx - sx, dy = ty - CPU_BASE_Y;
  let ang = Math.atan2(dy, dx);
  ang += (Math.random()-0.5) * noise;

  const dist = Math.hypot(dx,dy);
  ai.dir = {x:Math.cos(ang), y:Math.sin(ang)};
  ai.power = clamp(0.44 + dist/1150, 0.46, 1);
}

function updateAI(dt){
  if(!ai.active) return;
  ai.t -= dt;

  if(ai.phase === 0 && ai.t <= 0){
    striker.x = ai.targetX;
    striker.y = CPU_BASE_Y;   // ← CPU shoots from the top
    ai.phase = 1;
    ai.t = 0.65;
  } else if(ai.phase === 1 && ai.t <= 0){
    ai.active = false;
    doShoot(ai.dir.x, ai.dir.y, ai.power);
  }
}

  else if(current === 1) st.textContent = 'CPU Thinking…';
  else st.textContent = 'Your Turn';
}

/* =========================================================
   RENDERING
   ========================================================= */
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,SIZE,SIZE);

  if(shake.mag > 0){
    const s = shake.mag * (shake.t/0.22);
    ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s);
  }

  drawWood();
  drawSurface();

  ctx.save();
  ctx.translate(BORDER, BORDER);
  drawSticker();
  drawMarkings();
  drawPockets();
  drawParticles();
  drawDiscs();
  drawAimGuide();
  ctx.restore();
}

function drawWood(){
  const g = ctx.createLinearGradient(0,0,SIZE,SIZE);
  g.addColorStop(0, T.wood[0]);
  g.addColorStop(0.35, T.wood[1]);
  g.addColorStop(0.7, T.wood[2]);
  g.addColorStop(1, T.wood[3]);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,SIZE,SIZE);

  ctx.save();
  ctx.globalAlpha = 0.075;
  for(let i=0;i<64;i++){
    const y = i*(SIZE/64);
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.bezierCurveTo(SIZE*0.33, y+13, SIZE*0.66, y-13, SIZE, y+5);
    ctx.strokeStyle = i%2 ? '#000' : '#ffd9a0';
    ctx.lineWidth   = i%3===0 ? 3 : 1.4;
    ctx.stroke();
  }
  ctx.restore();

  ctx.strokeStyle = 'rgba(255,210,150,0.16)';
  ctx.lineWidth = 2;
  ctx.strokeRect(6,6,SIZE-12,SIZE-12);
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 3;
  ctx.strokeRect(2,2,SIZE-4,SIZE-4);
}

function drawSurface(){
  ctx.save();
  ctx.beginPath();
  ctx.rect(BORDER,BORDER,INNER,INNER);
  ctx.clip();

  const g = ctx.createRadialGradient(SIZE/2, SIZE*0.42, 60, SIZE/2, SIZE/2, SIZE*0.62);
  g.addColorStop(0,   T.surface[0]);
  g.addColorStop(0.55,T.surface[1]);
  g.addColorStop(1,   T.surface[2]);
  ctx.fillStyle = g;
  ctx.fillRect(BORDER,BORDER,INNER,INNER);

  const v = ctx.createRadialGradient(SIZE/2,SIZE/2, INNER*0.28, SIZE/2,SIZE/2, INNER*0.80);
  v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(1, T.vignette);
  ctx.fillStyle = v;
  ctx.fillRect(BORDER,BORDER,INNER,INNER);

  ctx.restore();

  ctx.strokeStyle = 'rgba(58,29,10,0.9)';
  ctx.lineWidth = 9;
  ctx.strokeRect(BORDER-4.5, BORDER-4.5, INNER+9, INNER+9);
  ctx.strokeStyle = 'rgba(255,215,165,0.22)';
  ctx.lineWidth = 2;
  ctx.strokeRect(BORDER-10, BORDER-10, INNER+20, INNER+20);
}

/* Sticker watermark (subtle on the play surface) */
function drawSticker(){
  ctx.save();
  ctx.globalAlpha = 0.09;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '140px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.fillText(T.sticker, INNER/2, INNER/2);
  ctx.restore();
}

function drawMarkings(){
  const c = INNER/2;

  ctx.save();
  ctx.strokeStyle = T.marking;
  ctx.fillStyle   = T.marking;

  ctx.lineWidth = 2.5;
  ctx.strokeRect(15,15,INNER-30,INNER-30);

  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(c,c,72,0,TAU); ctx.stroke();
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(c,c,52,0,TAU); ctx.stroke();

  for(let i=0;i<8;i++){
    const a = i*TAU/8;
    ctx.beginPath();
    ctx.arc(c+Math.cos(a)*34, c+Math.sin(a)*34, 9, 0, TAU);
    ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(c,c,15,0,TAU); ctx.fill();

  ctx.lineWidth = 2;
  for(let i=0;i<4;i++){
    const a = Math.PI/4 + i*Math.PI/2;
    const x1 = c+Math.cos(a)*92,  y1 = c+Math.sin(a)*92;
    const x2 = c+Math.cos(a)*196, y2 = c+Math.sin(a)*196;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();

    ctx.save();
    ctx.translate(x2,y2);
    ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(-13,-7);
    ctx.lineTo(-13, 7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  drawBaseLines();
}

function drawBaseLines(){
  for(let k=0;k<4;k++){
    ctx.save();
    ctx.translate(INNER/2, INNER/2);
    ctx.rotate(k*Math.PI/2);
    ctx.translate(-INNER/2, -INNER/2);

    const y1 = INNER - 90;
    const y2 = INNER - 52;

    ctx.strokeStyle = T.marking;
    ctx.lineWidth = 2.5;

    ctx.beginPath(); ctx.moveTo(58,y1); ctx.lineTo(INNER-58,y1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(92,y2); ctx.lineTo(INNER-92,y2); ctx.stroke();

    ctx.beginPath(); ctx.arc(58,(y1+y2)/2,11,0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(INNER-58,(y1+y2)/2,11,0,TAU); ctx.stroke();

    ctx.restore();
  }
}

function drawPockets(){
  for(const p of POCKETS){
    ctx.beginPath(); ctx.arc(p.x,p.y,POCKET_R+4,0,TAU);
    ctx.fillStyle = 'rgba(46,25,9,0.95)';
    ctx.fill();

    const g = ctx.createRadialGradient(
      p.x - POCKET_R*0.30, p.y - POCKET_R*0.30, 2,
      p.x, p.y, POCKET_R
    );
    g.addColorStop(0,'#000');
    g.addColorStop(0.65,'#0a0603');
    g.addColorStop(1,'#2c1a0b');
    ctx.beginPath(); ctx.arc(p.x,p.y,POCKET_R,0,TAU);
    ctx.fillStyle = g;
    ctx.fill();

    ctx.beginPath(); ctx.arc(p.x,p.y,POCKET_R-1.5,0,TAU);
    ctx.strokeStyle = 'rgba(255,190,110,0.10)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

function drawParticles(){
  for(const p of particles){
    const a = Math.max(0, p.life/p.max);
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r*a, 0, TAU);
    ctx.fillStyle = p.c;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function bodyRenderPos(b){
  if(b.sinking){
    const t = Math.min(b.sinkT/0.40, 1);
    const e = t*t;
    return {
      x: b.x + (b.pocket.x - b.x)*e,
      y: b.y + (b.pocket.y - b.y)*e,
      r: b.r * (1 - 0.78*e),
      a: 1 - e
    };
  }
  return {x:b.x, y:b.y, r:b.r, a:1};
}

function drawDiscs(){
  const list = coins.filter(c => c.active);
  const strikerVisible = striker && striker.active;

  ctx.save();
  ctx.fillStyle = 'rgba(62,36,10,0.26)';
  for(const b of list){
    const p = bodyRenderPos(b);
    ctx.globalAlpha = p.a * 0.9;
    ctx.beginPath();
    ctx.arc(p.x+3, p.y+4, p.r*0.97, 0, TAU);
    ctx.fill();
  }
  if(strikerVisible){
    const p = bodyRenderPos(striker);
    ctx.globalAlpha = p.a * 0.9;
    ctx.beginPath();
    ctx.arc(p.x+3, p.y+4, p.r*0.97, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  for(const b of list) drawCoin(b);
  if(strikerVisible) drawStriker(striker);
}

function drawCoin(b){
  const p = bodyRenderPos(b);
  ctx.save();
  ctx.globalAlpha = p.a;

  const cols = b.type === 'white' ? T.white : (b.type === 'black' ? T.black : T.queen);
  const g = ctx.createRadialGradient(p.x-p.r*0.35, p.y-p.r*0.40, p.r*0.10,
                                     p.x, p.y, p.r*1.05);
  g.addColorStop(0,   cols[0]);
  g.addColorStop(0.50,cols[1]);
  g.addColorStop(0.85,cols[2]);
  g.addColorStop(1,   cols[3]);

  ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU);
  ctx.fillStyle = g; ctx.fill();

  ctx.lineWidth = 1.4;
  ctx.strokeStyle = b.type==='white'
      ? 'rgba(150,120,70,0.70)'
      : (b.type==='queen' ? 'rgba(255,190,160,0.35)' : 'rgba(255,255,255,0.16)');
  ctx.stroke();

  ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.63,0,TAU);
  ctx.strokeStyle = 'rgba(0,0,0,0.13)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(p.x-p.r*0.30, p.y-p.r*0.38, p.r*0.42, p.r*0.27, -0.6, 0, TAU);
  ctx.fillStyle = b.type==='black'
      ? 'rgba(255,255,255,0.18)'
      : 'rgba(255,255,255,0.55)';
  ctx.fill();

  ctx.restore();
}

function drawStriker(b){
  const p = bodyRenderPos(b);
  ctx.save();
  ctx.globalAlpha = p.a;

  if(state === 'aim' && !b.sinking && current === 0){
    const pulse = 0.5 + 0.5*Math.sin(performance.now()/320);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 6 + pulse*5, 0, TAU);
    ctx.strokeStyle = 'rgba(90,205,255,'+(0.20 + pulse*0.35)+')';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  const g = ctx.createRadialGradient(p.x-p.r*0.35, p.y-p.r*0.42, p.r*0.10,
                                     p.x, p.y, p.r*1.05);
  g.addColorStop(0,   T.striker[0]);
  g.addColorStop(0.35,T.striker[1]);
  g.addColorStop(0.80,T.striker[2]);
  g.addColorStop(1,   T.striker[3]);

  ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU);
  ctx.fillStyle = g; ctx.fill();

  ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.73,0,TAU);
  ctx.strokeStyle = 'rgba(255,255,255,0.92)';
  ctx.lineWidth = 2.4;
  ctx.stroke();

  ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.30,0,TAU);
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(p.x-p.r*0.30, p.y-p.r*0.40, p.r*0.36, p.r*0.22, -0.6, 0, TAU);
  ctx.fillStyle = 'rgba(255,255,255,0.60)';
  ctx.fill();

  ctx.restore();
}

function drawAimGuide(){
  if(state !== 'aim' || !aiming.active) return;
  if(!striker || !striker.active || striker.sinking) return;

  const len = Math.hypot(aiming.dx, aiming.dy);
  if(len < 8) return;

  const ux = -aiming.dx/len;
  const uy = -aiming.dy/len;
  const power = Math.min(len, MAX_PULL) / MAX_PULL;

  ctx.save();
  ctx.beginPath();
  ctx.rect(-8,-8,INNER+16,INNER+16);
  ctx.clip();

  const sx = striker.x, sy = striker.y;
  const L = 70 + power*520;

  ctx.setLineDash([14,10]);
  ctx.lineDashOffset = -(performance.now()/22) % 24;
  ctx.strokeStyle = 'rgba(255,214,90,'+(0.35 + power*0.55)+')';
  ctx.lineWidth = 3.6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(sx + ux*(striker.r+2), sy + uy*(striker.r+2));
  ctx.lineTo(sx + ux*L, sy + uy*L);
  ctx.stroke();
  ctx.setLineDash([]);

  const ex = sx + ux*L, ey = sy + uy*L;
  ctx.save();
  ctx.translate(ex,ey);
  ctx.rotate(Math.atan2(uy,ux));
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(-17,-9);
  ctx.lineTo(-17, 9);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,214,90,'+(0.55 + power*0.45)+')';
  ctx.fill();
  ctx.restore();

  ctx.setLineDash([6,6]);
  ctx.strokeStyle = 'rgba(255,255,255,0.32)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(sx,sy);
  ctx.lineTo(sx+aiming.dx, sy+aiming.dy);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.beginPath();
  ctx.arc(sx, sy, striker.r+12, -Math.PI/2, -Math.PI/2 + TAU*power);
  ctx.strokeStyle = power > 0.8 ? '#ff5b4a' : (power > 0.5 ? '#ffb703' : '#6ee7a0');
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.stroke();

  ctx.restore();
}

/* =========================================================
   INPUT
   ========================================================= */
function toLocal(e){
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width  * SIZE - BORDER;
  const y = (e.clientY - rect.top ) / rect.height * SIZE - BORDER;
  return {x,y};
}

function canAct(){
  return state === 'aim' && current === 0;
}

function moveStrikerTo(x){
  const nx = clamp(x, MIN_X, MAX_X);
  const old = striker.x;
  striker.x = nx;
  for(const c of coins){
    if(!c.active || c.sinking) continue;
    if(Math.hypot(c.x-striker.x, c.y-striker.y) < c.r + striker.r){
      striker.x = old;
      return;
    }
  }
}

function onDown(e){
  initAudio();
  if(!canAct()) return;

  const p = toLocal(e);
  const d = Math.hypot(p.x - striker.x, p.y - striker.y);

  if(d < striker.r + 32){
    aiming.active = true;
    aiming.moving = false;
    aiming.ox = striker.x;
    aiming.oy = striker.y;
    aiming.dx = 0;
    aiming.dy = 0;
  } else {
    aiming.moving = true;
    aiming.active = false;
    moveStrikerTo(p.x);
  }
  e.preventDefault();
}

function onMove(e){
  if(state !== 'aim') return;
  const p = toLocal(e);

  if(aiming.active){
    aiming.dx = p.x - aiming.ox;
    aiming.dy = p.y - aiming.oy;
    const len = Math.hypot(aiming.dx, aiming.dy);
    if(len > MAX_PULL){
      aiming.dx *= MAX_PULL/len;
      aiming.dy *= MAX_PULL/len;
    }
  } else if(aiming.moving){
    moveStrikerTo(p.x);
  }
}

function onUp(){
  if(aiming.active){
    const len = Math.hypot(aiming.dx, aiming.dy);
    if(len > 14){
      const ux = -aiming.dx/len;
      const uy = -aiming.dy/len;
      const power = Math.min(len, MAX_PULL) / MAX_PULL;
      doShoot(ux, uy, power);
    }
  }
  aiming.active = false;
  aiming.moving = false;
}

canvas.addEventListener('pointerdown', e=>{
  if(canvas.setPointerCapture){ try{ canvas.setPointerCapture(e.pointerId); }catch(err){} }
  onDown(e);
});
window.addEventListener('pointermove', onMove, {passive:false});
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);

function genMathQ(lv){
  const L = Math.min(lv, 12);
  let a,b,ans,text;
  const r = Math.random();
  if(L <= 3){
    if(r < 0.5){ a=ri(1,20); b=ri(1,20); ans=a+b; text=a+' + '+b+' = ?'; }
    else { a=ri(5,30); b=ri(1,a); ans=a-b; text=a+' − '+b+' = ?'; }
  } else if(L <= 6){
    if(r < 0.35){ a=ri(10,99); b=ri(10,99); ans=a+b; text=a+' + '+b+' = ?'; }
    else if(r < 0.7){ a=ri(20,99); b=ri(1,a); ans=a-b; text=a+' − '+b+' = ?'; }
    else { a=ri(2,12); b=ri(2,12); ans=a*b; text=a+' × '+b+' = ?'; }
  } else {
    const p = Math.random();
    if(p < 0.30){ a=ri(3,15); b=ri(3,15); ans=a*b; text=a+' × '+b+' = ?'; }
    else if(p < 0.55){ b=ri(2,12); ans=ri(2,12); a=b*ans; text=a+' ÷ '+b+' = ?'; }
    else if(p < 0.72){ a=ri(50,200); b=ri(10,50); ans=a+b; text=a+' + '+b+' = ?'; }
    else if(p < 0.88){ a=ri(100,500); b=ri(10,a); ans=a-b; text=a+' − '+b+' = ?'; }
    else { a=ri(2,20); ans=a*a; text=a+'² = ?'; }
  }
  const spread = Math.max(3, Math.floor(Math.abs(ans)*0.18));
  const set = new Set([ans]);
  let guard = 0;
  while(set.size < 4 && guard++ < 200){
    const d = ans + ri(-spread, spread);
    if(d !== ans && d >= 0) set.add(d);
  }
  while(set.size < 4) set.add(ans + set.size*7 + 1);
  const arr = [...set].sort(()=>Math.random()-0.5);
  return { q:text, o:arr, a:arr.indexOf(ans), s:'Math', lv:L };
}

const recentQuestions = new Set();
function pickQuestion(lv){
  if(Math.random() < 0.45) return genMathQ(lv);

  const tier = lv <= 3 ? 1 : (lv <= 7 ? 2 : 3);
  let pool = BANK.filter(q => q[4] === tier);
  if(pool.length < 4) pool = BANK;
  pool = pool.filter(q => !recentQuestions.has(q[0]));
  if(pool.length < 4){ recentQuestions.clear(); pool = BANK.filter(q => q[4] === tier); }

  const picked = pool[Math.floor(Math.random()*pool.length)];
  recentQuestions.add(picked[0]);
  if(recentQuestions.size > 80){
    const it = recentQuestions.values();
    recentQuestions.delete(it.next().value);
  }

  const opts = picked[1].split('|');
  const correctText = opts[picked[2]];
  const shuffled = opts.slice().sort(()=>Math.random()-0.5);
  return {
    q: picked[0], o: shuffled, a: shuffled.indexOf(correctText),
    s: picked[3], lv: tier
  };
}

/* ---------- Quiz UI ---------- */
const quizOverlay   = document.getElementById('quizOverlay');
const quizLevelEl   = document.getElementById('quizLevel');
const quizSubjectEl = document.getElementById('quizSubject');
const quizQuestion  = document.getElementById('quizQuestion');
const quizOptions   = document.getElementById('quizOptions');
const quizFeedback  = document.getElementById('quizFeedback');
const quizStreakEl  = document.getElementById('quizStreak');
const quizTimerFill = document.getElementById('quizTimerFill');

let quizResolve = null;
let quizTimerId = null;
let quizLocked = false;

function runQuizStage(player){
  return new Promise(resolve => {
    quizResolve = resolve;
    state = 'quiz';
    updateHUD();

    const isCPU = (player === 1);

    if(isCPU){
      quizLevelEl.textContent = 'CPU Thinking…';
      quizSubjectEl.textContent = '🤖';
      quizQuestion.textContent = 'CPU is answering…';
      quizOptions.innerHTML = '';
      quizFeedback.textContent = '';
      quizFeedback.classList.remove('show');
      quizTimerFill.style.transform = 'scaleX(1)';
      quizStreakEl.textContent = '';
      quizOverlay.classList.add('show');
      setTimeout(()=>{
        // CPU gets better as you collect trophies
        const chance = clamp(0.42 + level*0.02 + trophies*0.005, 0.42, 0.85);
        const correct = Math.random() < chance;
        finishQuiz(correct, true);
      }, 900 + Math.random()*700);
      return;
    }

    const q = pickQuestion(level);
    quizLevelEl.textContent = 'Level ' + level;
    quizSubjectEl.textContent = q.s;
    quizQuestion.textContent = q.q;

    quizOptions.innerHTML = '';
    q.o.forEach((opt, i)=>{
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="k">'+String.fromCharCode(65+i)+'</span><span>'+opt+'</span>';
      btn.dataset.idx = i;
      btn.addEventListener('click', ()=> answerClick(i, q.a));
      quizOptions.appendChild(btn);
    });

    quizFeedback.textContent = '';
    quizFeedback.classList.remove('show','ok','no');
    quizStreakEl.textContent = streak > 0 ? '🔥 Streak: '+streak : '';
    quizLocked = false;

    const total = Math.max(9, 22 - level*0.6);
    let left = total;
    quizTimerFill.style.transition = 'none';
    quizTimerFill.style.transform = 'scaleX(1)';
    void quizTimerFill.offsetWidth;
    quizTimerFill.style.transition = 'transform 0.1s linear';

    clearInterval(quizTimerId);
    quizTimerId = setInterval(()=>{
      left -= 0.1;
      const frac = Math.max(0, left/total);
      quizTimerFill.style.transform = 'scaleX('+frac+')';
      if(left <= 0){
        clearInterval(quizTimerId);
        if(!quizLocked) timeoutQuiz(q.a);
      }
    }, 100);

    quizOverlay.classList.add('show');
  });
}

function answerClick(idx, correctIdx){
  if(quizLocked) return;
  quizLocked = true;
  clearInterval(quizTimerId);

  const buttons = [...quizOptions.querySelectorAll('.opt')];
  const isRight = (idx === correctIdx);

  buttons.forEach((b,i)=>{
    if(i === correctIdx) b.classList.add('correct');
    else if(i === idx)   b.classList.add('wrong');
    else                 b.classList.add('dim');
    b.disabled = true;
  });

  showFeedback(isRight);
  setTimeout(()=> finishQuiz(isRight, false), isRight ? 900 : 1250);
}

function timeoutQuiz(correctIdx){
  quizLocked = true;
  const buttons = [...quizOptions.querySelectorAll('.opt')];
  buttons.forEach((b,i)=>{
    if(i === correctIdx) b.classList.add('correct');
    else b.classList.add('dim');
    b.disabled = true;
  });
  quizFeedback.textContent = '⏰ Time up!';
  quizFeedback.classList.add('show','no');
  setTimeout(()=> finishQuiz(false, false), 1100);
}

function showFeedback(isRight){
  if(isRight){
    sfx('correct');
    quizFeedback.textContent = '✅ Correct!  +2 bonus';
    quizFeedback.classList.remove('no');
    quizFeedback.classList.add('show','ok');
  } else {
    sfx('wrong');
    quizFeedback.textContent = '❌ Wrong answer';
    quizFeedback.classList.remove('ok');
    quizFeedback.classList.add('show','no');
  }
}

function finishQuiz(correct, isCPU){
  clearInterval(quizTimerId);

  if(correct){
    correctCount++;
    streak++;
    if(streak > bestStreak) bestStreak = streak;
    if(level < 50) level++;
    sfx('levelup');
    showLevelUp(isCPU ? 'CPU +1 LV' : 'LEVEL '+level+'!');
  } else {
    streak = 0;
  }

  updateHUD();

  setTimeout(()=>{
    hideQuiz();
    if(quizResolve){
      const r = quizResolve;
      quizResolve = null;
      r(correct);
    }
  }, 700);
}

function showLevelUp(text){
  const el = document.getElementById('levelup');
  document.getElementById('levelupText').textContent = text;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  setTimeout(()=> el.classList.remove('show'), 1300);
}

const confettiCanvas = document.getElementById('confettiCanvas');
const confettiCtx    = confettiCanvas.getContext('2d');
let confetti = [];
let confettiRaf = null;
let confettiLast = 0;

function resizeConfetti(){
  confettiCanvas.width  = window.innerWidth  * DPR;
  confettiCanvas.height = window.innerHeight * DPR;
  confettiCanvas.style.width  = window.innerWidth+'px';
  confettiCanvas.style.height = window.innerHeight+'px';
  confettiCtx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resizeConfetti);
resizeConfetti();

function spawnConfetti(count){
  const colors = ['#ffd700','#ff5b4a','#6ee7a0','#3f92f2','#ff9ed8','#ffb347','#a8ff8a'];
  for(let i=0;i<count;i++){
    confetti.push({
      x: Math.random()*window.innerWidth,
      y: -20 - Math.random()*300,
      vx: (Math.random()-0.5)*140,
      vy: 90 + Math.random()*200,
      size: 6 + Math.random()*9,
      rot: Math.random()*TAU,
      vrot: (Math.random()-0.5)*7,
      color: colors[Math.floor(Math.random()*colors.length)],
      life: 2.6 + Math.random()*1.6,
      maxLife: 4.5,
      shape: Math.random() < 0.5 ? 'rect' : 'circle'
    });
  }
  if(!confettiRaf){
    confettiLast = performance.now();
    confettiRaf = requestAnimationFrame(confettiLoop);
  }
}

function confettiLoop(now){
  const dt = Math.min((now - confettiLast)/1000, 0.05);
  confettiLast = now;

  confettiCtx.clearRect(0,0,window.innerWidth,window.innerHeight);

  for(let i=confetti.length-1;i>=0;i--){
    const p = confetti[i];
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    p.vy += 130*dt;
    p.vx *= 0.99;
    p.rot += p.vrot*dt;
    p.life -= dt;
    if(p.life <= 0 || p.y > window.innerHeight + 40){
      confetti.splice(i,1);
      continue;
    }
    const a = Math.min(1, p.life);
    confettiCtx.save();
    confettiCtx.globalAlpha = a;
    confettiCtx.translate(p.x, p.y);
    confettiCtx.rotate(p.rot);
    confettiCtx.fillStyle = p.color;
    if(p.shape === 'rect'){
      confettiCtx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
    } else {
      confettiCtx.beginPath();
      confettiCtx.arc(0,0,p.size/2,0,TAU);
      confettiCtx.fill();
    }
    confettiCtx.restore();
  }

  if(confetti.length > 0){
    confettiRaf = requestAnimationFrame(confettiLoop);
  } else {
    confettiRaf = null;
    confettiCtx.clearRect(0,0,window.innerWidth,window.innerHeight);
  }
}

function renderThemes(){
  themesGrid.innerHTML = '';
  THEMES.forEach((th, idx)=>{
    const unlocked = unlockedThemes.includes(idx);
    const tile = document.createElement('div');
    tile.className = 'theme-tile' + (unlocked ? '' : ' locked') +
                     (idx === currentThemeIdx ? ' equipped' : '');
    const swBg = `linear-gradient(135deg, ${th.wood[0]} 0%, ${th.wood[1]} 30%, ${th.surface[0]} 30%, ${th.surface[1]} 100%)`;
    let bottomLabel = '';
    if(!unlocked){
      bottomLabel = '🔒 '+th.unlockWins+' 🏆';
    } else if(idx === currentThemeIdx){
      bottomLabel = '✓ Equipped';
    } else {
      bottomLabel = 'Tap to equip';
    }
    tile.innerHTML = `
      <div class="stk">${unlocked ? th.sticker : '🔒'}</div>
      <div class="sw" style="background:${swBg}"></div>
      <div class="nm">${th.name}</div>
      <div class="lk">${bottomLabel}</div>
    `;
    if(unlocked){
      tile.addEventListener('click', ()=>{
        applyTheme(idx);
        renderThemes();
      });
    }
    themesGrid.appendChild(tile);
  });
}

/* =========================================================
   MAIN LOOP
   ========================================================= */
let last = performance.now();
let acc = 0;
const FIXED = 1/240;

function loop(now){
  const dt = Math.min((now - last)/1000, 0.05);
  last = now;

  updateAI(dt);

  acc += dt;
  let iter = 0;
  while(acc >= FIXED && iter < 80){
    physicsStep(FIXED);
    acc -= FIXED;
    iter++;
  }
  if(acc > 0.2) acc = 0;

  updateEffects(dt);
  checkSettle();

  render();
  requestAnimationFrame(loop);
}
