concurrency:
  group: promo-youtube
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Work out the chosen tool
        id: pick
        env:
          T_PDF: ${{ inputs.tool_pdf }}
          T_IMAGE: ${{ inputs.tool_image }}
          T_BUSINESS: ${{ inputs.tool_business }}
          T_VIDEO: ${{ inputs.tool_video }}
          T_AI: ${{ inputs.tool_ai }}
          T_EDUCATION: ${{ inputs.tool_education }}
        run: |
          picked=""
          for v in "$T_PDF" "$T_IMAGE" "$T_BUSINESS" "$T_VIDEO" "$T_AI" "$T_EDUCATION"; do
            case "$v" in ""|"("*) ;; *) if [ -z "$picked" ]; then picked="${v%% *}"; else echo "::warning::More than one tool chosen — using the first ($picked)"; fi;; esac
          done
          echo "tool=$picked" >> "$GITHUB_OUTPUT"
          echo "Chosen tool: ${picked:-(brain decides)}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg, emoji font, Inter font and the free Tamil voice (edge-tts, gTTS)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
          npm i --no-save --no-package-lock @fontsource/inter@5 playwright-core@1
          python3 -m pip install --user --break-system-packages --quiet edge-tts gTTS
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Make and post the Short
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TOOL: ${{ steps.pick.outputs.tool }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PRIVACY: ${{ inputs.privacy }}
          STORY: ${{ inputs.story }}
        run: node .github/scripts/promo-youtube.mjs

      - name: Keep the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: |
            short.mp4
            social-captions.txt
          if-no-files-found: ignore
          retention-days: 7
