name: Promotion — YouTube Short

# Every day after the 09:05 IST promotion post: turns that tool into a 10-second Tamil + English
# YouTube Short and uploads it (.github/scripts/promo-youtube.mjs). Does nothing until YouTube is
# connected on the admin page (matrimony → Admin → Promotion → Connect YouTube) or promotion is off.
# Uses the existing secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET.
on:
  # The daily schedule is switched OFF (YouTube is not connected, so every run only burned CI minutes).
  # To turn it back on after "Connect YouTube": remove the leading '#' of the two lines below.
  # schedule:
  #   - cron: '50 3 * * *'   # 09:20 IST
  workflow_dispatch:
    inputs:
      tool:
        description: 'Tool id (empty = today''s promotion post)'
        type: string
        default: ''

concurrency:
  group: promo-youtube
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Make and upload the Short
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TOOL: ${{ inputs.tool }}
        run: node .github/scripts/promo-youtube.mjs

      - name: Keep the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: short.mp4
          if-no-files-found: ignore
          retention-days: 7
