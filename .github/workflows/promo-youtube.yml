name: Promotion — YouTube Short

# Every day after the 09:05 IST promotion post: turns that tool into a funny animated Tamil
# YouTube Short (story/colours/character rotate daily; made by code, no AI cost) and uploads it (.github/scripts/promo-youtube.mjs). Does nothing until YouTube is
# connected on the admin page (matrimony → Admin → Promotion → Connect YouTube) or promotion is off.
# Uses the existing secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET.
# Optional secret GEMINI_API_KEY = natural Tamil voice (Gemini TTS, free tier); without it the voice falls back to edge-tts / gTTS.
on:
  # Daily at 09:20 IST (after the 09:05 promotion post). YouTube is connected. If promotion is switched off the run just exits.
  # To stop the daily Short: put '#' in front of the two lines below (or switch promotion off on the admin page).
  schedule:
    - cron: '50 3 * * *'   # 09:20 IST
  workflow_dispatch:
    inputs:
      tool:
        description: 'Tool id (empty = today''s promotion post)'
        type: string
        default: ''
      privacy:
        description: 'public (normal) or private (to test the voice without showing the video to everyone)'
        type: choice
        options: [public, private]
        default: public
      story:
        description: 'Story template (auto = a different one each day by date)'
        type: choice
        options: [auto, reject, queue, beard]
        default: auto
      gemini_voice:
        description: 'Gemini voice name (Kore, Aoede, Leda, Zephyr = female; Charon, Puck, Orus, Fenrir = male)'
        type: string
        default: 'Kore'

concurrency:
  group: promo-youtube
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg, emoji font, Inter font and the free Tamil voice (edge-tts, gTTS)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
          npm i --no-save --no-package-lock @fontsource/inter@5 playwright-core@1
          python3 -m pip install --user --break-system-packages --quiet edge-tts gTTS
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Make and upload the Short
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TOOL: ${{ inputs.tool }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VOICE: ${{ inputs.gemini_voice }}
          PRIVACY: ${{ inputs.privacy }}
          STORY: ${{ inputs.story }}
        run: node .github/scripts/promo-youtube.mjs

      - name: Keep the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: |
            short.mp4
            social-captions.txt
          if-no-files-found: ignore
          retention-days: 7
