<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>உழவர் கருவிப்பெட்டி — Farmer Tools (Land, Fertiliser, Cost) | PDF Tools India</title>
<meta name="description" content="Free Tamil farmer tools: cent/acre/kuzhi/veli land converter, rice fertiliser bag calculator, spray dilution, cost and break-even price, trial-plot record book. No login, works offline.">
<link rel="canonical" href="https://pdftoolsindia.com/uzhavar-tools">
<meta property="og:title" content="உழவர் கருவிப்பெட்டி — free farmer tools in Tamil">

<meta property="og:url" content="https://pdftoolsindia.com/uzhavar-tools">

<link rel="stylesheet" href="/fonts/tamil.css">
<style>
*{box-sizing:border-box}
:root{--ink:#16301f;--sub:#4f6657;--line:#d8e6da;--bg:#f3f8f3;--card:#fff;--brand:#2f7d32;--brand2:#e8f5e9;--warn:#fff7e3;--bad:#b42318;--ok:#127a3e}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Tamil',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.65;-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top a{color:var(--ink);text-decoration:none;font-weight:800;font-size:.9rem}
.sp{flex:1}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{border:0;background:#fff;padding:8px 12px;font:inherit;font-size:.85rem;cursor:pointer;min-height:40px}
.lang button.on{background:var(--brand);color:#fff}
.wrap{max-width:820px;margin:0 auto;padding:14px}
h1{font-size:1.35rem;margin:4px 0 4px}
.sub{color:var(--sub);font-size:.88rem;margin:0 0 10px}
.note{background:var(--warn);border-radius:12px;padding:10px 12px;font-size:.84rem;margin:10px 0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:thin}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font:inherit;font-size:.86rem;font-weight:700;cursor:pointer;white-space:nowrap;min-height:42px}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 4px 16px #0b3b1a0a}
.card h2{font-size:1rem;margin:0 0 8px}
label{display:block;font-size:.84rem;font-weight:700;margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;font-size:1rem;padding:10px;border:1px solid #bfd3c2;border-radius:10px;background:#fff;min-height:44px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:420px){.row3{grid-template-columns:1fr 1fr}}
.btn{border:0;background:var(--brand);color:#fff;border-radius:12px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer;min-height:44px}
.btn.alt{background:var(--brand2);color:var(--brand);border:1px solid #b7d9ba}
.res{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.n{text-align:right;font-weight:800;white-space:nowrap}
.big{font-size:1.3rem;font-weight:800;color:var(--ok)}
.src{font-size:.76rem;color:var(--sub);margin-top:8px}
.tag{display:inline-block;font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:99px;background:#e6f0ff;color:#1d4ed8}
.tag.est{background:#e8f8ee;color:#127a3e}.tag.unp{background:#fdecea;color:#b42318}.tag.ass{background:#fff1d6;color:#8a5a00}
a{color:var(--brand)}
ul.links{padding-left:18px;margin:6px 0}
.foot{font-size:.76rem;color:var(--sub);text-align:center;margin:18px 0}
</style>
</head>
<body>
<div class="top"><a href="/">← PDF Tools India</a><span class="sp"></span><div class="lang"><button id="lta" class="on">தமிழ்</button><button id="len">EN</button></div></div>
<div class="wrap">
  <h1 id="ttl"></h1>
  <p class="sub" id="sub"></p>
  <div class="note" id="disc"></div>
  <div class="tabs" id="tabs"></div>
  <div id="panel"></div>
  <p class="foot" id="foot"></p>
</div>
<script src="/farm-core.js?v=2"></script>
<script>
(function(){
'use strict';
const F = window.KALVI_FARM;
let LANG = 'ta'; try{ LANG = localStorage.getItem('pti-farm-lang') || 'ta'; }catch(e){}
const T = (ta, en) => LANG === 'ta' ? ta : en;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (v, d) => { const x = parseFloat(v); return isFinite(x) ? x : (d || 0); };
const fmt = (x, d) => (x == null || !isFinite(x)) ? '—' : Number(x).toLocaleString('en-IN', {maximumFractionDigits: d == null ? 2 : d});
const store = {
  get(k, dflt){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : dflt; }catch(e){ return dflt; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

const TABS = [
  ['land', '📐', 'நிலம்', 'Land'], ['plant', '🌱', 'நடவு', 'Planting'], ['fert', '🧂', 'உரம்', 'Fertiliser'], ['mix', '🧪', 'கரைசல்', 'Spray mix'],
  ['cost', '💰', 'செலவு', 'Cost'], ['trial', '📒', 'சோதனை நிலம்', 'Trial plot'], ['organic', '🌿', 'இயற்கை', 'Organic'], ['season', '🗓️', 'பருவம்', 'Season'], ['help', '☎️', 'உதவி', 'Help'], ['proof', '🔬', 'சான்று', 'Evidence']
];
let tab = 'land';
const SRC = (ta, en) => `<div class="src">${T(ta, en)}</div>`;
const CHECK = () => SRC('இது கணிதக் கருவி; உங்கள் மண், பயிர், பகுதிக்கு ஏற்ப அருகிலுள்ள வேளாண் அலுவலர் / KVK-ஐ உறுதிசெய்யுங்கள்.', 'This is a calculator; confirm with your local agriculture officer / KVK for your soil, crop and area.');

/* ---------- panels ---------- */
function panelLand(){
  const st = store.get('pti-farm-land', {v: 1, from: 'acre', kuzhi: 144});
  const el = $('#panel');
  const opts = k => Object.keys(F.AREA).map(u => `<option value="${u}" ${u === k ? 'selected' : ''}>${F.AREA[u][LANG === 'ta' ? 'ta' : 'en']}</option>`).join('');
  el.innerHTML = `<div class="card"><h2>${T('நிலஅளவை மாற்றி', 'Land area converter')}</h2>
    <div class="row2"><div><label>${T('அளவு', 'Value')}</label><input id="v" type="number" inputmode="decimal" min="0" step="any" value="${st.v}"></div>
    <div><label>${T('அலகு', 'Unit')}</label><select id="f">${opts(st.from)}</select></div></div>
    <label>${T('உங்கள் ஊரில் 1 குழி = எத்தனை சதுர அடி? (பொதுவாக 144)', 'In your area, 1 kuzhi = how many sq ft? (commonly 144)')}</label><input id="k" type="number" inputmode="decimal" min="1" step="any" value="${st.kuzhi}">
    <div class="res" id="r"></div>
    ${SRC('1 சென்ட் = 435.6 ச.அடி; 1 ஏக்கர் = 100 சென்ட் = 43,560 ச.அடி; 1 ஹெக்டேர் ≈ 2.471 ஏக்கர். குழி, மா (=100 குழி), காணி (=4 மா), வேலி (=20 மா) ஊருக்கு ஊர் மாறலாம் — பட்டாவில் உள்ள சதுர மீட்டர்/ஹெக்டேர் அளவே அதிகாரப்பூர்வம்.', '1 cent = 435.6 sq ft; 1 acre = 100 cent = 43,560 sq ft; 1 hectare ≈ 2.471 acre. Kuzhi, ma (=100 kuzhi), kani (=4 ma) and veli (=20 ma) vary by place — the sq m / hectare figure in your patta is the official one.')}</div>`;
  const run = () => {
    const v = num($('#v').value), f = $('#f').value, k = num($('#k').value, 144) || 144;
    store.set('pti-farm-land', {v, from: f, kuzhi: k});
    $('#r').innerHTML = '<table>' + Object.keys(F.AREA).filter(u => u !== f).map(u => `<tr><td>${F.AREA[u][LANG === 'ta' ? 'ta' : 'en']}</td><td class="n">${fmt(F.convertArea(v, f, u, k), 4)}</td></tr>`).join('') + '</table>';
  };
  ['#v', '#f', '#k'].forEach(s => $(s).oninput = run); run();
}

function panelPlant(){
  $('#panel').innerHTML = `<div class="card"><h2>${T('ஏக்கருக்கு எத்தனை செடி / நாற்று?', 'How many plants per acre?')}</h2>
    <div class="row3"><div><label>${T('வரிசை இடைவெளி', 'Row spacing')}</label><input id="a" type="number" inputmode="decimal" min="0" step="any" value="9"></div>
    <div><label>${T('செடி இடைவெளி', 'Plant spacing')}</label><input id="b" type="number" inputmode="decimal" min="0" step="any" value="9"></div>
    <div><label>${T('அலகு', 'Unit')}</label><select id="u"><option value="in">${T('அங்குலம்', 'inch')}</option><option value="cm">cm</option><option value="ft">${T('அடி', 'feet')}</option></select></div></div>
    <div class="res" id="r"></div>
    ${SRC('கணிதம்: 43,560 ச.அடி ÷ (வரிசை இடைவெளி × செடி இடைவெளி, அடியில்). பயிருக்கு ஏற்ற இடைவெளியை உங்கள் வேளாண் அலுவலரிடம் / TNAU பயிர் வழிகாட்டியில் பாருங்கள்; இங்கே பரிந்துரை இல்லை.', 'Maths: 43,560 sq ft ÷ (row spacing × plant spacing in feet). Take the right spacing for your crop from your agriculture officer / TNAU crop guide; no recommendation is given here.')}</div>`;
  const run = () => {
    const u = $('#u').value, c = u === 'in' ? 1 / 12 : u === 'cm' ? 1 / 30.48 : 1;
    const a = num($('#a').value) * c, b = num($('#b').value) * c, n = F.plantsPerAcre(a, b);
    $('#r').innerHTML = n ? `<div class="big">${fmt(n, 0)}</div><div>${T('செடிகள் / ஏக்கர்', 'plants / acre')} &nbsp;·&nbsp; ${fmt(F.plantsPerCent(a, b), 0)} ${T('செடிகள் / சென்ட்', 'plants / cent')}</div>` : T('இடைவெளியை உள்ளிடுங்கள்', 'Enter the spacing');
  };
  ['#a', '#b', '#u'].forEach(s => $(s).oninput = run); run();
}

const RICE = {
  tp: {N: 150, P: 50, K: 50, splits: 4, basal: true, ta: 'நடவு நெல் — காவிரி டெல்டா / கோவை பகுதி (150:50:50)', en: 'Transplanted rice — Cauvery delta / Coimbatore tract (150:50:50)', sta: 'அடியுரம், தூர்கட்டும் பருவம், கதிர் உருவாகும் பருவம், கதிர் வெளிவரும் பருவம்', sen: 'basal, tillering, panicle initiation, heading'},
  tpo: {N: 120, P: 40, K: 40, splits: 4, basal: true, ta: 'நடவு நெல் — குறுகிய கால, கோடைப் பருவம், மற்ற பகுதிகள் (120:40:40)', en: 'Transplanted rice — short duration, dry season, other tracts (120:40:40)', sta: 'அடியுரம், தூர்கட்டும் பருவம், கதிர் உருவாகும் பருவம், கதிர் வெளிவரும் பருவம்', sen: 'basal, tillering, panicle initiation, heading'},
  ws: {N: 125, P: 50, K: 50, splits: 4, basal: false, ta: 'நேரடி நனை விதைப்பு நெல் — காவிரி டெல்டா (125:50:50 + துத்தநாக சல்பேட் 25 கிலோ/ஹெ)', en: 'Direct wet-seeded rice — Cauvery delta (125:50:50 + zinc sulphate 25 kg/ha)', sta: 'விதைத்து 21 நாள், தூர்கட்டும் பருவம், கதிர் உருவாகும் பருவம், கதிர் வெளிவரும் பருவம்', sen: '21 days after sowing, active tillering, panicle initiation, heading'},
  hy: {N: 175, P: 60, K: 60, splits: 4, basal: true, ta: 'வீரிய ஒட்டு (hybrid) நெல் (175:60:60)', en: 'Hybrid rice (175:60:60)', sta: 'அடியுரம், தூர்கட்டும் பருவம், கதிர் உருவாகும் பருவம், கதிர் வெளிவரும் பருவம்', sen: 'basal, tillering, panicle initiation, heading'},
  iwp: {N: 75, P: 50, K: 50, splits: 3, basal: false, ta: 'மேம்படுத்திய வெள்ளைப் பொன்னி (75:50:50)', en: 'Improved White Ponni (75:50:50)', sta: 'தூர்கட்டும் பருவம், கதிர் உருவாகும் பருவம், கதிர் வெளிவரும் பருவம்', sen: 'active tillering, panicle initiation, heading'},
  custom: {ta: 'என் மண் பரிசோதனை அளவு (நானே உள்ளிடுகிறேன்)', en: 'My soil-test dose (I will enter it)'}
};
function panelFert(){
  const st = store.get('pti-farm-fert2', {area: 1, unit: 'acre', crop: 'tp', N: 150, P: 50, K: 50, psrc: 'dap', bu: 45, bo: 50});
  $('#panel').innerHTML = `<div class="card"><h2>${T('உர மூட்டைக் கணக்கு', 'Fertiliser bag calculator')}</h2>
    <div class="note">${T('அளவுகள் TNAU நெல் பொதுப் பரிந்துரை (கிலோ சத்து / ஹெக்டேர்). உங்கள் <b>மண் பரிசோதனை (Soil Health Card)</b> முடிவே முதன்மை — அதன்படி மாற்றலாம்.', 'Doses are TNAU blanket rice recommendations (kg nutrient / hectare). Your <b>soil test (Soil Health Card)</b> comes first — change the numbers to match it.')}</div>
    <label>${T('நெல் வகை / முறை', 'Rice type / method')}</label><select id="crop">${Object.keys(RICE).map(k => `<option value="${k}" ${k === st.crop ? 'selected' : ''}>${T(RICE[k].ta, RICE[k].en)}</option>`).join('')}</select>
    <div class="row2"><div><label>${T('நிலப் பரப்பு', 'Land area')}</label><input id="area" type="number" inputmode="decimal" min="0" step="any" value="${st.area}"></div>
    <div><label>${T('அலகு', 'Unit')}</label><select id="unit"><option value="acre" ${st.unit === 'acre' ? 'selected' : ''}>${T('ஏக்கர்', 'acre')}</option><option value="cent" ${st.unit === 'cent' ? 'selected' : ''}>${T('சென்ட்', 'cent')}</option><option value="hectare" ${st.unit === 'hectare' ? 'selected' : ''}>${T('ஹெக்டேர்', 'hectare')}</option></select></div></div>
    <div class="row3"><div><label>N (kg/ha)</label><input id="N" type="number" inputmode="decimal" min="0" step="any" value="${st.N}"></div><div><label>P₂O₅ (kg/ha)</label><input id="P" type="number" inputmode="decimal" min="0" step="any" value="${st.P}"></div><div><label>K₂O (kg/ha)</label><input id="K" type="number" inputmode="decimal" min="0" step="any" value="${st.K}"></div></div>
    <label>${T('மணிச்சத்து (P) எதிலிருந்து?', 'Phosphorus (P) from?')}</label><select id="psrc"><option value="dap" ${st.psrc === 'dap' ? 'selected' : ''}>DAP (18-46-0)</option><option value="ssp" ${st.psrc === 'ssp' ? 'selected' : ''}>SSP (16% P₂O₅)</option></select>
    <div class="row2"><div><label>${T('யூரியா பை எடை (கிலோ)', 'Urea bag weight (kg)')}</label><input id="bu" type="number" inputmode="decimal" min="1" step="any" value="${st.bu}"></div><div><label>${T('மற்ற பை எடை (கிலோ)', 'Other bag weight (kg)')}</label><input id="bo" type="number" inputmode="decimal" min="1" step="any" value="${st.bo}"></div></div>
    <div class="src">${T('பையின் மேல் அச்சிட்ட எடையைப் பாருங்கள்.', 'Check the weight printed on your bag.')}</div>
    <div class="res" id="r"></div>
    ${SRC('மூலம்: TNAU Agritech — நடவு நெல், நேரடி விதைப்பு நெல் உரப் பரிந்துரைப் பக்கங்கள் (agritech.tnau.ac.in). TNAU-வின் இரு பக்கங்களில் சில எண்கள் முரண்படுகின்றன — உங்கள் KVK-இடம் உறுதிசெய்யுங்கள். சத்து விகிதங்கள்: யூரியா 46% N; DAP 18% N + 46% P₂O₅; SSP 16% P₂O₅; MOP 60% K₂O — பை லேபிளில் உறுதிசெய்யுங்கள். DAP-இல் உள்ள N கழிக்கப்பட்டுள்ளது.', 'Source: TNAU Agritech — transplanted and direct-seeded rice nutrient pages (agritech.tnau.ac.in). Two TNAU pages disagree on some numbers — confirm with your KVK. Grades: urea 46% N; DAP 18% N + 46% P₂O₅; SSP 16% P₂O₅; MOP 60% K₂O — confirm on your bag label. The N supplied by DAP has been deducted.')}</div>`;
  const run = () => {
    const unit = $('#unit').value, a = num($('#area').value);
    const acres = unit === 'acre' ? a : unit === 'cent' ? a / 100 : a * 2.4710538147;
    const crop = $('#crop').value, R = RICE[crop];
    const dose = {N: num($('#N').value), P2O5: num($('#P').value), K2O: num($('#K').value)}, psrc = $('#psrc').value, bu = num($('#bu').value, 45) || 45, bo = num($('#bo').value, 50) || 50;
    store.set('pti-farm-fert2', {area: a, unit, crop, N: dose.N, P: dose.P2O5, K: dose.K2O, psrc, bu, bo});
    const p = F.fertPlan(dose, acres, psrc), rows = [];
    const row = (name, kg, bag) => rows.push(`<tr><td>${name}</td><td class="n">${fmt(kg, 1)} kg</td><td class="n">${fmt(kg / bag, 2)} ${T('பை', 'bags')}</td></tr>`);
    row(T('யூரியா', 'Urea'), p.products.urea, bu);
    if(p.products.dap != null) row('DAP', p.products.dap, bo);
    if(p.products.ssp != null) row('SSP', p.products.ssp, bo);
    row('MOP', p.products.mop, bo);
    if(crop === 'ws') rows.push(`<tr><td>${T('துத்தநாக சல்பேட் (ZnSO₄)', 'Zinc sulphate (ZnSO₄)')}</td><td class="n">${fmt(25 * acres / 2.4710538147, 1)} kg</td><td class="n">${T('அடியுரம்', 'basal')}</td></tr>`);
    $('#r').innerHTML = `<table>${rows.join('')}</table><div class="src">${T('DAP-இலிருந்து கிடைக்கும் N: ', 'N supplied by DAP: ')}${fmt(p.nCredit, 1)} kg · ${T('மொத்த N தேவை: ', 'Total N needed: ')}${fmt(p.nutrient.N, 1)} kg</div>
      ${splitInfo(R, p)}`;
  };
  const splitInfo = (R, p) => {
    if(!R || !R.splits) return `<div class="src">${T('உங்கள் மண் பரிசோதனை அட்டை / வேளாண் அலுVலர் சொல்லும் பிரிவு முறையைப் பின்பற்றுங்கள்.', 'Follow the split schedule given with your soil test / by your agriculture officer.').replace('அலுVலர்', 'அலுவலர்')}</div>`;
    const n = R.splits, nPart = p.nutrient.N / n, ureaPart = nPart / 0.46;
    let ureaTxt;
    if(R.basal){ const basalUrea = Math.max(0, (nPart - p.nCredit) / 0.46); ureaTxt = T(`அடியுரம்: யூரியா ${fmt(basalUrea, 1)} kg (DAP-இன் N கழித்து); மற்ற ஒவ்வொரு பாகமும்: யூரியா ${fmt(ureaPart, 1)} kg`, `Basal: urea ${fmt(basalUrea, 1)} kg (after DAP's N); each later part: urea ${fmt(ureaPart, 1)} kg`); }
    else ureaTxt = T(`ஒவ்வொரு பாகமும்: யூரியா ≈ ${fmt(p.products.urea / n, 1)} kg (DAP-இன் N அடியுரமாக முன்பே செல்கிறது)`, `Each part: urea ≈ ${fmt(p.products.urea / n, 1)} kg (DAP's N already goes in at the last ploughing)`);
    return `<div class="src">${T(`TNAU: N-ஐ ${n} சம பாகங்களாக இடவும் — ${R.sta}. மணிச்சத்து (P) முழுவதும் அடியுரமாக. ${ureaTxt}; MOP ஒவ்வொரு பாகமும் ${fmt(p.products.mop / n, 1)} kg.`, `TNAU: apply N in ${n} equal parts — ${R.sen}. All P as basal. ${ureaTxt}; MOP each part ${fmt(p.products.mop / n, 1)} kg.`)}</div>`;
  };
  $('#crop').onchange = () => { const R = RICE[$('#crop').value]; if(R.N != null){ $('#N').value = R.N; $('#P').value = R.P; $('#K').value = R.K; } run(); };
  ['#area', '#unit', '#N', '#P', '#K', '#psrc', '#bu', '#bo'].forEach(s => $(s).oninput = run); run();
}

}

    ['est', 'நிறுவப்பட்டது', 'Established', 'மத்திய நிலத்தடி நீர் வாரியத்தின் (CGWB) 2024 அறிக்கையில் (2023 மாதிரிகள்) இந்திய அளவில் சுமார் ஐந்தில் ஒரு மாதிரியில் நைட்ரேட் குடிநீர் வரம்பைத் தாண்டியது; தமிழ்நாட்டில் இது 40%-க்கு மேல். உங்கள் ஆழ்துளைக் கிணற்று நீரைப் பரிசோதியுங்கள். உரம் பல சாத்தியமான மூலங்களில் ஒன்று (கழிவுநீர், கால்நடையும் உண்டு).', 'In the Central Ground Water Board 2024 report (2023 samples), about one in five groundwater samples in India had nitrate above the drinking-water limit; in Tamil Nadu it was over 40%. Test your own borewell water. Fertiliser is one possible source among several (sewage and livestock too).'],
    ['est', 'நிறுவப்பட்டது', 'Established', '2022-25-இல் சோதித்த 86,401 உணவு மாதிரிகளில் 2.8%-இல் பூச்சிமருந்து எச்சம் சட்ட வரம்பைத் தாண்டியது; பெரும்பாலானவை வரம்புக்குள் இருந்தன. இது தேசிய எண்; வரம்பைத் தாண்டுவது "நஞ்சு" என்று பொருள் அல்ல.', 'Of 86,401 food samples tested in 2022-25, 2.8% had pesticide residue above the legal limit; most were within it. This is a national figure; exceeding a limit does not by itself mean "poison".'],
    ['unp', 'நிரூபிக்கப்படவில்லை', 'Not proven', 'பஞ்சாபில் புற்றுநோய்க்குப் பூச்சிமருந்துதான் காரணம் என்று நிரூபிக்கப்படவில்லை; பல காரணிகள் ஆராயப்படுகின்றன. "செயற்கை உரம் பல நவீன நோய்களுக்குக் காரணம்" என்பதற்கும் நாங்கள் படித்த நம்பகமான மூலங்களில் சான்று இல்லை.', 'It has not been proven that pesticides caused the cancer cases in Punjab; many factors are being studied. Neither did the reliable sources we read show that "chemical fertiliser causes many modern diseases".'],
    ['ass', 'தொடர்பு மட்டும்', 'Association only', 'பிரான்ஸ் பெரிய ஆய்வில் ஆர்கானிக் உணவை அதிகம் உண்டவர்களுக்குப் புற்றுநோய் குறைவாக இருந்தது; ஆனால் வருமானம், கல்வி, வாழ்க்கைமுறை வேறுபட்டதால் ஆர்கானிக் உணவுதான் காரணம் என்று சொல்ல முடியாது.', 'In a large French study, people who ate more organic food had less cancer, but income, education and lifestyle also differed, so organic food itself cannot be named as the cause.'],
    ['est', 'தொடர்பு', 'Association', 'சுமார் 18,000 இந்தியர்களிடம் நடந்த ICMR-INDIAB ஆய்வில், மாவுச்சத்து (பெரும்பாலும் refined அரிசி, கோதுமை, சர்க்கரை) அதிகமுள்ள உணவு நீரிழிவு ஆபத்துடன் தொடர்புடையது; அதில் ஒரு பகுதியைப் பயறு போன்ற தாவரப் புரதம் அல்லது பால் புரதத்தால் மாற்றுவது குறைந்த ஆபத்துடன் தொடர்புடையது. மொத்த மாவுச்சத்தைக் குறைக்காமல் refined தானியத்தை முழுக் கோதுமை / மில்லட் மாவாக மட்டும் மாற்றுவது குறைந்த ஆபத்துடன் தொடர்புடையதாகக் காணப்படவில்லை.', 'In an ICMR-INDIAB analysis of about 18,000 Indian adults, diets high in carbohydrate (mostly refined rice, wheat and sugar) were linked to higher diabetes risk; replacing some carbohydrate with plant protein (such as pulses) or dairy protein was linked to lower risk. Simply swapping refined cereal for whole-wheat or millet flour, without cutting total carbohydrate, was not linked to lower risk.'],
    ['ass', 'சுயாதீன மதிப்பீடுகள்', 'Independent evaluations', 'இயற்கை வேளாண்மை வெளியிடு செலவைக் குறைத்தது; விளைச்சல் உயர்வு நம்பகமாகக் காணப்படவில்லை, சில ஆய்வுகளில் குறைந்தது (எ.கா. ஆந்திராவில் 3-ஆம் ஆண்டில் 6–20% குறைவு), சில கட்டுப்படுத்தப்பட்ட சோதனைகளில் நன்மையும் காணப்பட்டது. தமிழ்நாட்டுக்கான தரவு கிடைக்கவில்லை. முதலில் சிறிய நிலத்தில் சோதியுங்கள்.', 'Natural farming reduced purchased-input cost; a reliable yield gain was not found and some studies showed lower yield (for example 6–20% lower in year 3 in Andhra Pradesh), while some controlled trials showed benefits. No Tamil Nadu data was found. Test on a small plot first.']
  ];
  const TAGS = {est: 'est', ass: 'ass', unp: 'unp'};
  $('#panel').innerHTML = `<div class="card"><h2>${T('எது நிரூபிக்கப்பட்டது? எது இல்லை?', 'What is proven and what is not?')}</h2>
    <p class="src" style="margin-top:0">${T('இந்தப் பக்கம் நம்பகமான ஆய்வுகளில் உண்மையாகக் கண்டறியப்பட்டதை மட்டும் சொல்கிறது. "எனக்குத் தெரிந்த ஊரில் இப்படி நடந்தது" போன்ற அனுபவங்கள் மதிப்புமிக்கவை — ஆனால் அவை ஆய்வு முடிவுகள் அல்ல.', 'This page states only what reliable studies found. Experience such as "this happened in my village" is valuable — but it is not a study result.')}</p>
    ${S.map(x => `<div style="margin:10px 0"><span class="tag ${TAGS[x[0]]}">${T(x[1], x[2])}</span><div>${T(x[3], x[4])}</div></div>`).join('')}
    <div class="note">${T('பாரம்பரிய முறைகளின் செய்முறைகளில் (பஞ்சகவ்யம், ஜீவாமிர்தம், அஸ்திரங்கள்) மூலங்களுக்கிடையே அளவு வேறுபாடுகள் உள்ளன; கட்டுப்படுத்தப்பட்ட விளைச்சல் சோதனைகள் நாங்கள் படித்த மூலங்களில் இல்லை. அதனால் இங்கே எந்த "அற்புத" நன்மையும் கூறப்படவில்லை — உங்கள் நிலத்தில் சிறு சோதனை செய்து நீங்களே அறிந்துகொள்ளுங்கள்.', 'The recipes of traditional preparations (panchagavya, jeevamrutha, astras) differ between sources, and the sources we read had no controlled yield trials. So no "miracle" benefit is claimed here — run a small trial on your own land and find out.')}</div>
    ${SRC('மூலங்கள்: CSE (Soil Health Card பகுப்பாய்வு), Frontiers in Plant Science 2024 (பெங்களூரு சோதனை), CGWB நிலத்தடி நீர்த் தர அறிக்கை 2024, FSSAI (மாநிலங்களவைப் பதில், 6 ஆகஸ்ட் 2025), JAMA Internal Medicine 2018 (NutriNet-Santé), ICMR-INDIAB (Nature Medicine 2025; Down To Earth வழி), NITI Aayog / ICAR-NAARM இயற்கை வேளாண்மை ஆய்வு (2020), Reddy மற்றும் பலர் (Indian Journal of Agricultural Economics, 2019). சில எண்கள் இரண்டாம்நிலை மூலம் வழி வந்தவை; அசல் மூலங்களை உறுதிசெய்யும் பணி நடந்து வருகிறது.', 'Sources: CSE (Soil Health Card analysis), Frontiers in Plant Science 2024 (Bengaluru trial), CGWB Ground Water Quality Report 2024, FSSAI (Rajya Sabha reply, 6 Aug 2025), JAMA Internal Medicine 2018 (NutriNet-Santé), ICMR-INDIAB (Nature Medicine 2025; via Down To Earth), NITI Aayog / ICAR-NAARM natural-farming study (2020), Reddy et al. (Indian Journal of Agricultural Economics, 2019). Some figures came via secondary reports; checking the originals is ongoing.')}</div>`;
}

const PANELS = {land: panelLand, plant: panelPlant, fert: panelFert, mix: panelMix, cost: panelCost, trial: panelTrial, organic: panelOrganic, season: panelSeason, help: panelHelp, proof: panelProof};
function render(){
  document.documentElement.lang = LANG === 'ta' ? 'ta' : 'en';
  $('#ttl').textContent = T('🌾 உழவர் கருவிப்பெட்டி', '🌾 Farmer Toolbox');
  $('#sub').textContent = T('உங்கள் பாரம்பரிய முறையை மாற்றாமல், கணக்கையும் தகவலையும் எளிதாக்கும் இலவசக் கருவிகள். உள்நுழைவு இல்லை; விளம்பரம் இல்லை; தரவு உங்கள் போனிலேயே இருக்கும்.', 'Free tools that make the maths and information easier without changing your traditional way of farming. No login, no ads, your data stays on your phone.');
  $('#disc').innerHTML = T('<b>கவனம்:</b> இங்குள்ளவை கணிதக் கருவிகளும் ஆய்வுகளின் சுருக்கமும். இது வேளாண் அலுவலரின் அல்லது KVK-இன் ஆலோசனைக்கு மாற்று அல்ல; உங்கள் மண், பயிர், பகுதிக்கு ஏற்ப அவர்களிடம் உறுதிசெய்யுங்கள்.', '<b>Note:</b> These are calculators and summaries of studies. They are not a substitute for the advice of your agriculture officer or KVK; confirm with them for your soil, crop and area.');
  $('#foot').textContent = T('PDF Tools India · எப்போதும் இலவசம் · எந்தத் தரவும் சேவையகத்துக்குப் போவதில்லை', 'PDF Tools India · always free · no data is sent to any server');
  $('#lta').className = LANG === 'ta' ? 'on' : ''; $('#len').className = LANG === 'en' ? 'on' : '';
  $('#tabs').innerHTML = TABS.map(t => `<button data-t="${t[0]}" class="${t[0] === tab ? 'on' : ''}">${t[1]} ${T(t[2], t[3])}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.t; try{ history.replaceState(null, '', '#' + tab); }catch(e){} render(); });
  PANELS[tab]();
}
$('#lta').onclick = () => { LANG = 'ta'; try{ localStorage.setItem('pti-farm-lang', 'ta'); }catch(e){} render(); };
$('#len').onclick = () => { LANG = 'en'; try{ localStorage.setItem('pti-farm-lang', 'en'); }catch(e){} render(); };
const h = (location.hash || '').slice(1); if(PANELS[h]) tab = h;
render();
})();
</script>
