<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TN Property Registration & Stamp Duty Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&family=Merriweather:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0F2A4A; --navy-deep:#0A1D33; --gold:#B8860B; --gold-light:#F4E9CF;
    --paper:#F7F5EF; --card:#FFFFFF; --ink:#1C2530; --sub:#5B6472; --line:#E2DFD5;
    --good:#1F7A4C; --good-bg:#E7F5EC; --warn:#8A5A00; --warn-bg:#FFF3DE;
    --shadow:0 2px 6px rgba(15,42,74,.06), 0 12px 28px -14px rgba(15,42,74,.18);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink); line-height:1.5;}
  .ta{font-family:'Noto Sans Tamil',sans-serif;}
  h1,h2,h3{font-family:'Merriweather',serif;}
  .wrap{max-width:920px; margin:0 auto; padding:0 18px 60px;}

  header.top{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:26px 0 18px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .mark{width:44px; height:44px; border-radius:10px; background:linear-gradient(155deg,var(--navy),var(--navy-deep)); display:flex; align-items:center; justify-content:center; font-size:22px; box-shadow:var(--shadow);}
  .brand h1{font-size:18px; margin:0; color:var(--navy);}
  .brand .sub{font-size:12px; color:var(--sub); margin-top:2px;}
  .lang-btn{background:var(--navy); color:#fff; border:none; padding:8px 14px; border-radius:8px; font-weight:700; cursor:pointer; font-size:12px;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:var(--shadow);}
  .card h2{font-size:15px; color:var(--navy); margin:0 0 12px;}
  .card h2 .n{display:inline-flex; width:22px; height:22px; border-radius:50%; background:var(--gold); color:#fff; align-items:center; justify-content:center; font-size:12px; font-family:'Inter',sans-serif; margin-right:8px; vertical-align:middle;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px;}
  .opt{background:#FBFAF6; border:1.5px solid var(--line); border-radius:12px; padding:12px; cursor:pointer; transition:.15s;}
  .opt:hover{border-color:var(--gold);}
  .opt.active{border-color:var(--navy); background:var(--gold-light);}
  .opt .t1{font-weight:700; font-size:13px; color:var(--ink);}
  .opt .t2{font-size:11px; color:var(--sub); margin-top:3px;}

  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:.3px; margin-bottom:6px;}
  .field input[type=number], .field input[type=text]{width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:9px; font-size:15px; font-family:'Inter',sans-serif; background:#fff;}
  .field input:focus{outline:none; border-color:var(--navy);}
  .checkbox-row{display:flex; align-items:flex-start; gap:9px; font-size:13px; color:var(--ink); background:#FBFAF6; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:6px;}
  .checkbox-row input{margin-top:3px;}

  .note{background:var(--warn-bg); color:var(--warn); border-radius:10px; padding:10px 14px; font-size:12.5px; margin-top:10px;}
  .note.info{background:#E9F1FB; color:#1C4E80;}

  .result-row{display:flex; justify-content:space-between; align-items:baseline; padding:10px 0; border-bottom:1px dashed var(--line);}
  .result-row:last-child{border-bottom:none;}
  .result-row .l{font-size:13px; color:var(--sub);}
  .result-row .v{font-size:16px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums;}
  .result-row.total .l, .result-row.total .v{font-size:19px; font-weight:800; color:var(--navy);}

  .btn{background:var(--navy); color:#fff; border:none; padding:13px 22px; border-radius:10px; font-weight:700; cursor:pointer; font-size:14px; width:100%;}
  .btn:hover{background:var(--navy-deep);}

  footer{text-align:center; color:var(--sub); font-size:11px; margin-top:24px; padding-top:14px; border-top:1px solid var(--line);}
  a{color:var(--navy);}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark">🏛️</div>
      <div>
        <h1 id="titleTxt">TN Property Registration Calculator</h1>
        <div class="sub" id="subTxt">Stamp duty & registration fee — Tamil Nadu, all deed types</div>
      </div>
    </div>
    <button class="lang-btn" onclick="toggleLang()"><span id="langLabel">தமிழ் / English</span></button>
  </header>

  <div class="card">
    <h2><span class="n">1</span><span id="step1Txt">Choose the type of document (deed)</span></h2>
    <div class="grid" id="deedGrid"></div>
    <div class="grid" id="deedSubGrid" style="margin-top:10px; display:none;"></div>
  </div>

  <div class="card">
    <h2><span class="n">2</span><span id="step2Txt">Enter the value</span></h2>
    <div class="field">
      <label id="valueLabel">Property / Guideline Value (₹)</label>
      <input type="number" id="valueInput" min="0" step="1000" placeholder="e.g. 2500000">
    </div>
    <div class="field" id="sharesField" style="display:none;">
      <label id="sharesLabel">Number of shares (people dividing the property)</label>
      <input type="number" id="sharesInput" min="2" step="1" value="2">
    </div>
    <div class="checkbox-row" id="womenRow" style="display:none;">
      <input type="checkbox" id="womenCheck">
      <label for="womenCheck" id="womenLabel" style="font-weight:500; text-transform:none; margin:0;"></label>
    </div>
    <div class="note" id="familyNote" style="display:none;"></div>
    <button class="btn" style="margin-top:14px;" onclick="calculate()" id="calcBtn">🧮 Calculate</button>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <h2><span class="n">✓</span><span id="resultH">Estimated Cost</span></h2>
    <div id="resultRows"></div>
    <div class="note info" id="guidelineNote"></div>
  </div>

  <div class="note" id="disclaimerNote"></div>

  <footer id="footerTxt"></footer>
</div>

<script>
let lang = localStorage.getItem('tnprc_lang') || 'en';

/* ============ VERIFIED RATE TABLE (Tamil Nadu Registration Dept published schedule) ============
   Every number here is cross-checked against the current published stamp-duty & registration-fee
   schedule (Sept 2026). This is a deterministic calculator — no AI, no network calls, no guessing:
   the same inputs always produce the same result from these fixed rates. */
const DEEDS = {

    stampPct:7, regPct:4, valueLabel:{en:'Property / Guideline Value (₹)', ta:'சொத்து / வழிகாட்டி மதிப்பு (₹)'}, womenConcession:true },
  giftFamily: { en:'Gift Deed — to a Family Member', ta:'தான தத்து பத்திரம் — குடும்ப உறுப்பினருக்கு', desc_en:'Parent, spouse, child, grandchild, sibling', desc_ta:'பெற்றோர், மனைவி/கணவர், பிள்ளை, பேரக்குழந்தை, உடன்பிறப்பு',
    stampPct:1, regPct:1, valueLabel:{en:'Property / Guideline Value (₹)', ta:'சொத்து / வழிகாட்டி மதிப்பு (₹)'}, familyConcession:true },
  giftOther: { en:'Gift Deed — to Others (Non-Family)', ta:'தான தத்து பத்திரம் — குடும்பம் அல்லாதவருக்கு', desc_en:'Same rate as a Sale Deed', desc_ta:'கிரய பத்திரத்தின் விகிதமே',
    stampPct:7, regPct:4, valueLabel:{en:'Property / Guideline Value (₹)', ta:'சொத்து / வழிகாட்டி மதிப்பு (₹)'} },

    stampPct:1, stampCap:25000, regPct:1, regCap:4000, valueLabel:{en:'Property / Guideline Value (₹)', ta:'சொத்து / வழிகாட்டி மதிப்பு (₹)'}, familyConcession:true },
  settlementOther: { en:'Settlement Deed — Non-Family', ta:'செட்டில்மென்ட் பத்திரம் — குடும்பம் அல்லாதவர்', desc_en:'Same rate as a Sale Deed', desc_ta:'கிரய பத்திரத்தின் விகிதமே',
    stampPct:7, regPct:4, valueLabel:{en:'Property / Guideline Value (₹)', ta:'சொத்து / வழிகாட்டி மதிப்பு (₹)'} },
  releaseFamily: { en:'Release Deed — Family Member', ta:'விடுவிப்பு பத்திரம் — குடும்ப உறுப்பினர்', desc_en:'Giving up your share to a co-owner relative — capped at ₹25,000 + ₹4,000', desc_ta:'உங்கள் பங்கை உறவினர் இணை-உரிமையாளருக்கு விடுவித்தல் — அதிகபட்சம் ₹25,000 + ₹4,000',
    stampPct:1, stampCap:25000, regPct:1, regCap:4000, valueLabel:{en:'Property / Guideline Value (₹)', ta:'சொத்து / வழிகாட்டி மதிப்பு (₹)'}, familyConcession:true },
  partitionFamily: { en:'Partition Deed — Among Family', ta:'பங்கு பிரிவினை பத்திரம் — குடும்பத்தினருக்குள்', desc_en:'Dividing joint family property — capped per share', desc_ta:'கூட்டு குடும்ப சொத்தைப் பிரித்தல் — ஒவ்வொரு பங்கிற்கும் அதிகபட்ச வரம்பு',

  partitionOther: { en:'Partition Deed — Non-Family', ta:'பங்கு பிரிவினை பத்திரம் — குடும்பம் அல்லாதவர்', desc_en:'Between unrelated co-owners', desc_ta:'உறவு இல்லாத இணை-உரிமையாளர்களுக்கிடையே',
    stampPct:4, regPct:1, valueLabel:{en:'Total Property Value (₹)', ta:'மொத்த சொத்து மதிப்பு (₹)'} },
  mortgageSimple: { en:'Simple Mortgage (no possession)', ta:'எளிய அடமானம் (உடைமை மாறாது)', desc_en:'Loan against property, lender does not take possession', desc_ta:'சொத்தின் மீது கடன், வைப்பாளர் உடைமை பெறுவதில்லை',
    stampPct:1, stampCap:40000, regPct:1, regCap:10000, valueLabel:{en:'Loan Amount (₹)', ta:'கடன் தொகை (₹)'} },
  mortgagePossession: { en:'Mortgage with Possession', ta:'உடைமையுடன் அடமானம்', desc_en:'Lender takes possession of the property', desc_ta:'வைப்பாளர் சொத்தின் உடைமையைப் பெறுவார்',

  poaFamily: { en:'General POA — to Family Member', ta:'பொது அதிகாரப் பத்திரம் — குடும்ப உறுப்பினருக்கு', desc_en:'Authorising a close relative', desc_ta:'நெருங்கிய உறவினருக்கு அதிகாரம் அளித்தல்',
    stampFlat:100, regFlat:1000, valueLabel:{en:'Not needed for this type', ta:'இந்த வகைக்கு தேவையில்லை'}, noValue:true },
  poaConsideration: { en:'General POA — with Consideration (payment)', ta:'பொது அதிகாரப் பத்திரம் — பணம் பெற்றுக்கொண்டு', desc_en:'POA given in exchange for money', desc_ta:'பணத்திற்கு ஈடாக அளிக்கப்படும் அதிகாரப் பத்திரம்',
    stampPct:4, regPct:1, regFloor:10000, valueLabel:{en:'Consideration Amount (₹)', ta:'பெறப்படும் தொகை (₹)'} }
};
const DEED_GROUPS = [
  { key:'transfer', label:{en:'Transferring a Property', ta:'சொத்தை மாற்றுதல்'}, items:['sale','giftFamily','giftOther','settlementFamily','settlementOther','releaseFamily','partitionFamily','partitionOther'] },
  { key:'loan', label:{en:'Loan / Mortgage', ta:'கடன் / அடமானம்'}, items:['mortgageSimple','mortgagePossession'] },
  { key:'poa', label:{en:'Power of Attorney', ta:'அதிகாரப் பத்திரம்'}, items:['poaSale','poaFamily','poaConsideration'] }
];

const T = {
  en:{ title:'TN Property Registration Calculator', sub:'Stamp duty & registration fee — Tamil Nadu, all deed types',
       step1:'Choose the type of document (deed)', step2:'Enter the value', resultH:'Estimated Cost',
       womenLabel:'This property is valued ₹10 lakh or below AND will be registered solely in a woman\'s name (eligible for 1% registration-fee concession)',
       familyNoteConcession:'"Family member" for this concession is generally understood by the Registration Department to mean parents, spouse, children, grandchildren and siblings — but the exact eligibility is decided at the Sub-Registrar office. Please confirm your relationship qualifies before registration; declaring it incorrectly can lead to a deficit-duty demand later.',
       guidelineNote:'Not sure of your property\'s exact Guideline Value? Check it for free on the official portal: ',
       disclaimer:'These are the standard rates published by the Tamil Nadu Registration Department (verified against multiple sources, Sept 2026). Actual amounts can include small additional charges (user fee, scanning, etc.) decided at the Sub-Registrar office, and government rates can change — always confirm the final amount with your Sub-Registrar / document writer, or on TNREGINET, before paying. This tool is 100% free and does not store or send your data anywhere.',
       footer:'🏛️ Free forever • No sign-up • No AI, no ads — just the government\'s own published formula',
       calc:'🧮 Calculate', sharesLabel:'Number of shares (people dividing the property)'
     },
  ta:{ title:'தமிழ்நாடு சொத்து பதிவு கால்குலேட்டர்', sub:'முத்திரைத் தீர்வை & பதிவுக் கட்டணம் — அனைத்து பத்திர வகைகளும்',
       step1:'ஆவணத்தின் (பத்திரம்) வகையைத் தேர்ந்தெடுக்கவும்', step2:'மதிப்பை உள்ளிடவும்', resultH:'மதிப்பிடப்பட்ட செலவு',
       womenLabel:'இந்த சொத்தின் மதிப்பு ₹10 லட்சம் அல்லது அதற்கும் குறைவு, மற்றும் ஒரு பெண் மட்டும் உரிமையாளராக பதிவு செய்யப்படும் (1% பதிவுக் கட்டண சலுகைக்கு தகுதி)',
       familyNoteConcession:'இந்த சலுகைக்கான "குடும்ப உறுப்பினர்" என்பது பொதுவாக பெற்றோர், மனைவி/கணவர், பிள்ளைகள், பேரக்குழந்தைகள் மற்றும் உடன்பிறப்புகளைக் குறிக்கும் — ஆனால் இறுதி தகுதியை சார்பதிவாளர் அலுவலகம் தான் முடிவு செய்யும். பதிவுக்கு முன் உங்கள் உறவுமுறை தகுதியுடையதா என்பதை உறுதிப்படுத்தவும்.',
       guidelineNote:'உங்கள் சொத்தின் வழிகாட்டி மதிப்பு தெரியவில்லையா? இதை அரசு போர்ட்டலில் இலவசமாக சரிபார்க்கவும்: ',
       disclaimer:'இவை தமிழ்நாடு பதிவுத் துறை வெளியிட்ட நிலையான விகிதங்கள் (பல மூலங்களுடன் சரிபார்க்கப்பட்டது, செப். 2026). இறுதி தொகையில் சிறிய கூடுதல் கட்டணங்கள் (பயனர் கட்டணம் போன்றவை) சேரலாம், மற்றும் அரசு விகிதங்கள் மாறலாம் — கட்டணம் செலுத்தும் முன் சார்பதிவாளர் அலுவலகம் / TNREGINET-ல் இறுதி தொகையை உறுதிப்படுத்தவும். இந்த கருவி 100% இலவசம், உங்கள் தரவை எங்கும் சேமிக்காது அனுப்பாது.',
       footer:'🏛️ எப்போதும் இலவசம் • பதிவு தேவையில்லை • AI இல்லை, விளம்பரம் இல்லை — அரசின் சொந்த விகிதம் தான்',
       calc:'🧮 கணக்கிடு', sharesLabel:'பங்கு பெறும் நபர்களின் எண்ணிக்கை'
     }
};

let selectedDeed = 'sale';

function toggleLang(){ lang = lang==='en'?'ta':'en'; localStorage.setItem('tnprc_lang', lang); renderAll(); }

function fmt(n){ return '₹' + Math.round(n).toLocaleString('en-IN'); }

function renderDeedGrid(){
  const grid = document.getElementById('deedGrid');
  grid.innerHTML = '';
  DEED_GROUPS.forEach(g=>{
    const gHeader = document.createElement('div');
    gHeader.style.cssText = 'grid-column:1/-1; font-size:11px; font-weight:800; color:var(--sub); text-transform:uppercase; margin-top:8px;';
    gHeader.textContent = g.label[lang];
    grid.appendChild(gHeader);
    g.items.forEach(key=>{
      const d = DEEDS[key];
      const card = document.createElement('div');
      card.className = 'opt' + (selectedDeed===key ? ' active' : '');
      card.innerHTML = `<div class="t1">${d[lang]}</div><div class="t2">${lang==='en'?d.desc_en:d.desc_ta}</div>`;
      card.onclick = () => { selectedDeed = key; renderAll(); };
      grid.appendChild(card);
    });
  });
}

function renderInputs(){
  const d = DEEDS[selectedDeed];
  document.getElementById('valueLabel').textContent = d.valueLabel[lang];
  const valueInput = document.getElementById('valueInput');
  valueInput.style.display = d.noValue ? 'none' : 'block';
  document.getElementById('sharesField').style.display = d.perShare ? 'block' : 'none';
  document.getElementById('sharesLabel').textContent = T[lang].sharesLabel;
  document.getElementById('womenRow').style.display = d.womenConcession ? 'flex' : 'none';
  document.getElementById('womenLabel').textContent = T[lang].womenLabel;
  const fn = document.getElementById('familyNote');
  if(d.familyConcession){ fn.style.display='block'; fn.textContent = T[lang].familyNoteConcession; }
  else fn.style.display = 'none';
  document.getElementById('resultCard').style.display = 'none';
}

function calcOne(deedKey, value, shares, isWoman){
  const d = DEEDS[deedKey];
  if(d.noValue){
    return { stamp: d.stampFlat, reg: d.regFlat, note:null };
  }
  if(d.perShare){
    const n = Math.max(2, shares||2);
    const perShareValue = value / n;
    const stampPerShare = Math.min(perShareValue * d.stampPct/100, d.stampCap);
    const regPerShare = Math.min(perShareValue * d.regPct/100, d.regCap);
    return { stamp: stampPerShare*n, reg: regPerShare*n, note: (lang==='en'?`${n} shares × `:`${n} பங்குகள் × `) + fmt(stampPerShare)+' + '+fmt(regPerShare) };
  }
  let stamp = value * (d.stampPct||0)/100;
  if(d.stampCap) stamp = Math.min(stamp, d.stampCap);
  let regPct = d.regPct||0;
  let womenApplied = false;
  if(d.womenConcession && isWoman && value <= 1000000){ regPct = 3; womenApplied = true; }
  let reg = value * regPct/100;
  if(d.regCap) reg = Math.min(reg, d.regCap);
  if(d.regFloor) reg = Math.max(reg, d.regFloor);
  return { stamp, reg, note: womenApplied ? (lang==='en'?'Women\'s concession applied: 3% registration fee instead of 4%':'பெண்கள் சலுகை பயன்படுத்தப்பட்டது: 4%க்கு பதிலாக 3% பதிவுக் கட்டணம்') : null };
}

function calculate(){
  const d = DEEDS[selectedDeed];
  const value = Number(document.getElementById('valueInput').value) || 0;
  const shares = Number(document.getElementById('sharesInput').value) || 2;
  const isWoman = document.getElementById('womenCheck').checked;
  if(!d.noValue && value <= 0){
    alert(lang==='en' ? 'Please enter a value greater than 0.' : 'தயவுசெய்து 0-க்கு மேற்பட்ட மதிப்பை உள்ளிடவும்.');
    return;
  }
  const r = calcOne(selectedDeed, value, shares, isWoman);
  const total = r.stamp + r.reg;
  const rows = document.getElementById('resultRows');
  rows.innerHTML = `
    <div class="result-row"><div class="l">${lang==='en'?'Stamp Duty':'முத்திரைத் தீர்வை'}</div><div class="v">${fmt(r.stamp)}</div></div>
    <div class="result-row"><div class="l">${lang==='en'?'Registration Fee':'பதிவுக் கட்டணம்'}</div><div class="v">${fmt(r.reg)}</div></div>
    <div class="result-row total"><div class="l">${lang==='en'?'Total (approx.)':'மொத்தம் (தோராயமாக)'}</div><div class="v">${fmt(total)}</div></div>
    ${r.note ? `<div class="note info" style="margin-top:10px;">${r.note}</div>` : ''}
  `;
  document.getElementById('resultCard').style.display = 'block';
  document.getElementById('resultCard').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function renderAll(){
  document.getElementById('titleTxt').textContent = T[lang].title;
  document.getElementById('subTxt').textContent = T[lang].sub;
  document.getElementById('step1Txt').textContent = T[lang].step1;
  document.getElementById('step2Txt').textContent = T[lang].step2;
  document.getElementById('resultH').textContent = T[lang].resultH;
  document.getElementById('calcBtn').textContent = T[lang].calc;
  document.getElementById('disclaimerNote').textContent = T[lang].disclaimer;
  document.getElementById('footerTxt').textContent = T[lang].footer;
  document.getElementById('guidelineNote').innerHTML = T[lang].guidelineNote + '<a href="https://tnreginet.gov.in" target="_blank" rel="noopener">tnreginet.gov.in</a>';
  renderDeedGrid();
  renderInputs();
}

renderAll();
</script>
