function chip(list, holder, multi){
  holder.innerHTML='';
  list.forEach(([k,ta,en])=>{
    const b=document.createElement('button'); b.type='button'; b.className='chip'; b.dataset.k=k; b.dataset.label=en; b.textContent = LANG==='ta'?ta:en;
    b.onclick=()=>{ if(!multi) holder.querySelectorAll('.chip').forEach(x=>{ if(x!==b) x.classList.remove('on'); }); b.classList.toggle('on'); refreshAmber(); };
    holder.appendChild(b);
  });
}
function sel(holder){ return [...holder.querySelectorAll('.chip.on')].map(b=>b.dataset.label); }

function paintText(){
  const t = TX[LANG];
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-t]').forEach(n=>{ const k=n.dataset.t; if(t[k]!=null) n.innerHTML = t[k]; });
  document.querySelectorAll('[data-tp]').forEach(n=>{ n.placeholder = t[n.dataset.tp]||''; });
  const keep = { main:sel($('mainChips')), sym:sel($('symChips')), env:sel($('envChips')), flags:[...document.querySelectorAll('#flags input:checked')].map(i=>i.value) };
  $('flags').innerHTML = FLAGS.map(([k,ta,en])=>`<label class="flag"><input type="checkbox" value="${k}" ${keep.flags.includes(k)?'checked':''}><span>${LANG==='ta'?ta:en}</span></label>`).join('');
  chip(MAIN, $('mainChips'), false); chip(SYM, $('symChips'), true); chip(ENV, $('envChips'), true);
  [['mainChips',keep.main],['symChips',keep.sym],['envChips',keep.env]].forEach(([id,arr])=> $(id).querySelectorAll('.chip').forEach(b=>{ if(arr.includes(b.dataset.label)) b.classList.add('on'); }));
  $('sevOut').textContent = $('sev').value + '/10';
  paintBtn(); refreshAmber();
  if(LAST) renderResult(LAST);
}

    profile: { age: $('age').value, sex: $('sex').value, pregnant: $('sex').value==='female' && $('preg').value==='yes' },
    complaint: main.join(', '), details: $('details').value, durationValue: $('durV').value, durationUnit: $('durU').value, severity: $('sev').value,
    context: { temp: $('temp').value, symptoms: sel($('symChips')), sleep: $('sleep').value, water: $('water').value, stress: $('stress').value, screen: $('screen').value,
      contacts: $('contacts').value, work: $('work').value, food: $('food').value, env: sel($('envChips')), conditions: $('conditions').value, meds: $('meds').value,
      tookForThis: $('took').value, allergies: $('allergies').value }
  };
  try{
    const r = await fetch(BACKEND + '/api/ai/health', { method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer '+tk}, body: JSON.stringify(body) });
    const j = await r.json().catch(()=>({error:'Server is starting up — please try again in a moment.'}));
    if(r.status===401){ TOKEN=null; throw new Error(t.signinMsg); }
    if(j.error) throw new Error(j.error);
    LAST = j.result; st.classList.add('hidden'); renderResult(LAST);
    try{ window.opener && window.opener.postMessage({type:'jamtaris-credits-changed'}, '*'); }catch(e){}
  }catch(e){ st.innerHTML = '❌ ' + esc(e.message || 'Something went wrong.'); }
  finally{ $('analyse').disabled = false; }
};

function list(arr){ return (arr&&arr.length) ? `<ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : ''; }
function renderResult(o){
  const t = TX[LANG], u = t.u[o.urgency] || t.u.see_doctor_soon, R = $('result');
  if(o.urgency==='emergency'){ showEmergency([]); return; }
  R.innerHTML = `
    <div class="banner ${u[1]}"><h2>${u[0]}</h2>${esc(o.urgency_reason||'')}</div>
    <h3>${t.rSummary}</h3><div>${esc(o.summary||'')}</div>
    ${(o.possible_causes||[]).length?`<h3>${t.rCauses}</h3>${o.possible_causes.map(c=>`<div class="cause"><div class="top"><span>${esc(c.cause)}</span><span class="pill p-${esc(c.likelihood||'medium')}">${t.like[c.likelihood]||esc(c.likelihood||'')}</span></div><div class="why"><b>${t.angle[c.angle]||t.angle.other}</b> · ${esc(c.why||'')}</div></div>`).join('')}`:''}
    ${o.root_cause_insight?`<h3>${t.rRoot}</h3><div class="note">${esc(o.root_cause_insight)}</div>`:''}
    ${(o.self_care||[]).length?`<h3>${t.rSelf}</h3>${list(o.self_care)}`:''}
    ${(o.siddha_remedies||[]).length?`<h3>${t.rSiddha}</h3>${o.siddha_remedies.map(s=>`<div class="siddha"><b>${esc(s.name)}</b><div>${esc(s.how||'')}</div>${s.caution?`<div class="c">⚠️ ${esc(s.caution)}</div>`:''}</div>`).join('')}<div class="sub">${t.siddhaNote}</div>`:''}
    ${o.medicine_advice?`<h3>${t.rMed}</h3><div>${esc(o.medicine_advice)}</div>`:''}
    ${(o.tests_to_consider||[]).length?`<h3>${t.rTests}</h3>${list(o.tests_to_consider)}`:''}
    ${(o.see_doctor_if||[]).length?`<h3>${t.rWatch}</h3>${list(o.see_doctor_if)}`:''}
    ${(o.questions_for_doctor||[]).length?`<h3>${t.rAsk}</h3>${list(o.questions_for_doctor)}`:''}
    ${(o.missing_info||[]).length?`<h3 class="sub">${t.rMissing}</h3><div class="sub">${list(o.missing_info)}</div>`:''}
    <div class="disc">${t.disc}<br><br>${t.free} <a href="https://esanjeevani.mohfw.gov.in/" target="_blank" rel="noopener" style="color:#9ff0cc"><b>eSanjeevani OPD</b></a> · 📞 <a href="tel:104" style="color:#9ff0cc">104</a> · 🚑 <a href="tel:108" style="color:#9ff0cc">108</a></div>
    <div class="row noprint" style="margin-top:14px"><button class="btn" id="again">${t.again}</button><button class="btn" id="printR">${t.print}</button></div>`;
  R.classList.remove('hidden');
  $('again').onclick = ()=> location.reload();
  $('printR').onclick = ()=> window.print();
  R.scrollIntoView({behavior:'smooth'});
}

paintText();
})();
</script>
</body>
</html>
