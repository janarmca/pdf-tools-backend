        onAdd: async (fl)=>{ file = fl[0]; file._buf = await readFileAsArrayBuffer(file); paint(); }
      });
      if(file){
        mountFileList(body, [file], ()=>{ file=null; paint(); });
        const note = el(`<div class="note tamil">✅ இப்போது வரிசைகள் (rows) மற்றும் நெடுவரிசைகள் (columns) PDF-ல் இருக்கும் இடத்தை வைத்தே தானாக கண்டறியப்பட்டு, ஒவ்வொரு நெடுவரிசையும் Excel-ல் அதே இடத்தில் வரும் வகையில் சீரமைக்கப்படும் — PDF-ன் அட்டவணை வடிவமைப்பு அப்படியே பாதுகாக்கப்படும். (Scan செய்யப்பட்ட/படமாக உள்ள PDF எனில் முதலில் "OCR" கருவியை பயன்படுத்தவும்.)</div>`);
        body.appendChild(note);
        const row = el(`<div class="btn-row"></div>`);
        const btn = el(`<button class="btn tamil">🧮 Excel ஆக மாற்று (Exact Layout)</button>`);
        btn.onclick = doConvert;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    // Cluster a sorted list of numeric centers into groups within `tol` of each other.
    function clusterPositions(values, tol){
      const sorted = [...values].sort((a,b)=>a-b);
      const clusters = [];
      sorted.forEach(v=>{
        const last = clusters[clusters.length-1];
        if(last && (v - last.max) <= tol){ last.items.push(v); last.max = v; last.center = (last.items.reduce((s,x)=>s+x,0))/last.items.length; }
        else clusters.push({items:[v], max:v, center:v});
      });
      return clusters.map(c=>c.center);
    }
    async function doConvert(){
      const prog = mountProgress(body);
      try{
        prog.set(10,'படிக்கிறது…');
        const pdfjsDoc = await loadPdfJs(file._buf);
        const wb = XLSX.utils.book_new();
        for(let i=1;i<=pdfjsDoc.numPages;i++){
          prog.set(10+(i/pdfjsDoc.numPages)*75, `பக்கம் ${i}/${pdfjsDoc.numPages} — அட்டவணை கண்டறிகிறது…`);
          const page = await pdfjsDoc.getPage(i);
          const content = await page.getTextContent();
          const items = content.items
            .filter(it=>it.str !== undefined)
            .map(it=>({
              x: it.transform[4],
              y: it.transform[5],
              w: it.width || (it.str.length * (it.transform[0]||6) * 0.5),
              h: Math.abs(it.transform[3]) || 10,
              str: it.str
            }))
            .filter(it=> it.str.length>0);

          if(!items.length){
            const ws = XLSX.utils.aoa_to_sheet([['']]);
            XLSX.utils.book_append_sheet(wb, ws, `Page${i}`.slice(0,31));
            continue;
          }

          // 1) Group items into text rows using a y-tolerance based on median glyph height.
          const heights = items.map(it=>it.h).sort((a,b)=>a-b);
          const medH = heights[Math.floor(heights.length/2)] || 10;
          const yTol = Math.max(2.5, medH * 0.55);
          items.sort((a,b)=> b.y - a.y || a.x - b.x);
          const rows = [];
          items.forEach(it=>{
            let r = rows.find(r0 => Math.abs(r0.y - it.y) <= yTol);
            if(!r){ r = {y: it.y, items: []}; rows.push(r); }
            r.items.push(it);
            r.y = (r.y*(r.items.length-1) + it.y)/r.items.length; // running average baseline
          });
          rows.sort((a,b)=> b.y - a.y);
          rows.forEach(r=> r.items.sort((a,b)=> a.x - b.x));

          // 2) Merge items within a row that are close together horizontally into a single cell
          //    (words that belong together, separated only by a normal space), while a bigger
          //    gap marks a real column boundary — this mirrors how the text is laid out in the PDF.
          const allGaps = [];
          rows.forEach(r=>{
            for(let k=1;k<r.items.length;k++){
              const prev = r.items[k-1];
              allGaps.push(r.items[k].x - (prev.x + prev.w));
            }
          });
          allGaps.sort((a,b)=>a-b);
          const avgCharW = (items.reduce((s,it)=> s + (it.w/Math.max(1,it.str.length)), 0))/items.length || 5;
          const colGapTol = Math.max(avgCharW*1.6, 8); // gaps bigger than this = new column

          rows.forEach(r=>{
            const cells = [];
            let cur = null;
            r.items.forEach(it=>{
              if(cur && (it.x - (cur.x + cur.w)) <= colGapTol){
                cur.str += (it.x - (cur.x+cur.w) > avgCharW*0.35 ? ' ' : '') + it.str;
                cur.w = (it.x + it.w) - cur.x;
              } else {
                cur = { x: it.x, w: it.w, str: it.str };
                cells.push(cur);
              }
            });
            r.cells = cells;
          });

          // 3) Determine global column positions by clustering the left-x of every cell across
          //    all rows, so the same PDF column lines up in the same Excel column every row.
          const colTol = Math.max(avgCharW*2.2, 12);
          const colCenters = clusterPositions(rows.flatMap(r=>r.cells.map(c=>c.x)), colTol).sort((a,b)=>a-b);

          function nearestColIdx(x){
            let bi=0, bd=Infinity;
            colCenters.forEach((c,ci)=>{ const d=Math.abs(c-x); if(d<bd){ bd=d; bi=ci; } });
            return bi;
          }

          // 4) Build the grid: place each cell text at its column index (merge if two cells map
          //    to the same column in one row — keep them space-joined, in x order).
          const aoa = rows.map(r=>{
            const rowArr = new Array(colCenters.length).fill('');
            r.cells.forEach(c=>{
              const ci = nearestColIdx(c.x);
              rowArr[ci] = rowArr[ci] ? (rowArr[ci] + ' ' + c.str) : c.str;
            });
            return rowArr;
          });

          const ws = XLSX.utils.aoa_to_sheet(aoa.length ? aoa : [['']]);
          // Reasonable auto column widths based on content length.
          const colWidths = colCenters.map((_,ci)=>{
            let maxLen = 6;
            aoa.forEach(r=>{ if(r[ci] && r[ci].length>maxLen) maxLen = r[ci].length; });
            return { wch: Math.min(60, maxLen+2) };
          });
          ws['!cols'] = colWidths;
          XLSX.utils.book_append_sheet(wb, ws, `Page${i}`.slice(0,31));
        }
        prog.set(92,'Excel ஃபைல் தயார் செய்கிறது…');
        const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
        prog.set(100,'முடிந்தது');
        downloadBlob(new Blob([out],{type:'application/octet-stream'}), file.name.replace(/\.pdf$/i,'')+'.xlsx');
        prog.remove();
        mountResult(body, 'Excel ஃபைல் (.xlsx) — PDF வடிவமைப்பு பாதுகாக்கப்பட்ட வகையில் பதிவிறக்கம் ஆனது.');
      }catch(err){ prog.remove(); mountResult(body,'பிழை: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

/* ===================== CAMERA SCANNER (photo -> perspective-corrected multi-page PDF) ===================== */
TOOL_IMPL.camscan = {
  mount(container){
    let view = 'home';
    let pages = [];
    let queue = [];
    let stream = null;
    let adjustImg = null, corners = null, filterMode = 'enhance';
    const body = el(`<div></div>`); container.appendChild(body);

    function paint(){
      body.innerHTML = '';
      if(view === 'home'){
        const introRow = el(`<div class="btn-row tamil" style="margin-top:0;"></div>`);
        const bCam = el(`<button class="btn">📷 கேமரா திற</button>`);
        bCam.onclick = openCamera;
        const bGal = el(`<button class="btn secondary">🖼️ கேலரியிலிருந்து சேர்</button>`);
        const galInput = el(`<input type="file" accept="image/*" multiple style="display:none;">`);
        bGal.onclick = ()=> galInput.click();
        galInput.addEventListener('change', async ()=>{
          const files = Array.from(galInput.files||[]);
          for(const f of files){
            const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });
            queue.push({dataUrl});
          }
          galInput.value = '';
          if(queue.length) startAdjustNext();
        });
        introRow.appendChild(bCam); introRow.appendChild(bGal); introRow.appendChild(galInput);
        body.appendChild(introRow);

        const note = el(`<div class="note tamil">உங்கள் கேமரா/படங்கள் browser-க்குள்ளேயே செயலாகும் — எங்கும் அப்லோட் ஆகாது. ஒவ்வொரு புகைப்படமும் விளிம்பு திருத்தத்திற்குப் பிறகு (corners drag செய்து) பட்டியலில் சேரும்; தேவையான அளவு புகைப்படங்கள் தொடர்ந்து எடுத்து இறுதியில் ஒரே PDF ஆக சேமிக்கலாம்.</div>`);
        body.appendChild(note);

        if(pages.length){
          const grid = el(`<div class="scan-pages"></div>`);
          pages.forEach((p,idx)=>{
            const card = el(`<div class="scan-page"><span class="spnum">${idx+1}</span><img src="${p.dataUrl}"><button class="spdel" data-del="${idx}">✕</button></div>`);
            grid.appendChild(card);
          });
          grid.addEventListener('click', (e)=>{
            const b = e.target.closest('[data-del]'); if(!b) return;
            pages.splice(Number(b.getAttribute('data-del')),1);
            paint();
          });
          body.appendChild(grid);
          const finalRow = el(`<div class="btn-row tamil"></div>`);
          const bSave = el(`<button class="btn accent">📕 PDF ஆக சேமி (${pages.length} பக்கம்)</button>`);
          bSave.onclick = doSavePdf;
          const bClear = el(`<button class="btn secondary">🗑️ அனைத்தையும் அழி</button>`);
          bClear.onclick = ()=>{ pages=[]; paint(); };
          finalRow.appendChild(bSave); finalRow.appendChild(bClear);
          body.appendChild(finalRow);
          body.appendChild(el(`<div class="note tamil">💡 இந்த ஸ்கேன் PDF-ல் இருந்து தட்டச்சு செய்யக்கூடிய உரையை எடுக்க வேண்டுமா? Save செய்த பிறகு, முகப்புக்கு சென்று "🔎 படத்திலிருந்து எழுத்து (OCR)" கருவியை திற — அந்த PDF-ஐ போட்டால் உரையை படித்துத் தரும் (தமிழ் + 20 மொழிகள்).</div>`));
        }
      } else if(view === 'camera'){
        const wrap = el(`<div class="scan-video-wrap"><video id="scanVideo" autoplay playsinline muted></video></div>`);
        body.appendChild(wrap);
        const video = wrap.querySelector('#scanVideo');
        video.srcObject = stream;
        video.play().catch(()=>{});
        const badge = el(`<div class="tamil" style="text-align:center;margin-top:10px;font-weight:700;font-size:12.5px;color:var(--sub);">📄 சேர்க்கப்பட்ட பக்கங்கள்: ${pages.length}</div>`);
        body.appendChild(badge);
        const shRow = el(`<div class="shutter-row"></div>`);
        const bStop = el(`<button class="scan-side-btn">✕ மூடு</button>`);
        bStop.onclick = ()=>{ stopCamera(); view='home'; paint(); };
        const bShutter = el(`<button class="shutter-btn" title="புகைப்படம் எடு"></button>`);
        bShutter.onclick = capturePhoto;
        const bDone = el(`<button class="scan-side-btn">✅ முடிந்தது</button>`);
        bDone.onclick = ()=>{ stopCamera(); view='home'; paint(); };
        shRow.appendChild(bStop); shRow.appendChild(bShutter); shRow.appendChild(bDone);
        body.appendChild(shRow);
      } else if(view === 'adjust'){
        const title = el(`<div class="tamil" style="font-weight:700;font-size:13.5px;margin-bottom:10px;">🤖 AI ஆவண விளிம்பு தானாக கண்டறியப்படும் — தேவைப்பட்டால் 4 மூலைகளையும் இழுத்து சரிசெய்யவும்</div>`);
        body.appendChild(title);
        const wrap = el(`<div class="adjust-wrap" id="adjustWrap"></div>`);
        const imgEl = el(`<img id="adjustImg" src="${adjustImg}">`);
        wrap.appendChild(imgEl);
        const svg = el(`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><polygon id="quadPoly" points="" fill="rgba(55,82,166,.22)" stroke="#3752A6" stroke-width="0.6"/></svg>`);
        wrap.appendChild(svg);
        corners.forEach((c,idx)=>{ wrap.appendChild(el(`<div class="corner-handle" data-idx="${idx}"></div>`)); });
        body.appendChild(wrap);
        updateOverlay();
        setupDrag(wrap);

        const filterRow = el(`<div class="filter-row tamil"></div>`);
        [['enhance','✨ Enhance'],['bw','⚫ B&W ஆவணம்'],['gray','🌫️ Grayscale'],['original','🎨 Original']].forEach(([m,label])=>{
          const chip = el(`<button class="filter-chip ${filterMode===m?'active':''}" data-filter="${m}">${label}</button>`);
          filterRow.appendChild(chip);
        });
        filterRow.addEventListener('click', (e)=>{
          const b = e.target.closest('[data-filter]'); if(!b) return;
          filterMode = b.getAttribute('data-filter');
          paint();
        });
        body.appendChild(filterRow);

        const btnRow = el(`<div class="btn-row tamil"></div>`);
        const bReset = el(`<button class="btn secondary">↺ முழு படம்</button>`);
        bReset.onclick = ()=>{ corners = [{fx:0.02,fy:0.02},{fx:0.98,fy:0.02},{fx:0.98,fy:0.98},{fx:0.02,fy:0.98}]; updateOverlay(); };
        const bCancel = el(`<button class="btn secondary">✕ ரத்து</button>`);
        bCancel.onclick = ()=>{ startAdjustNext(); };
        const bAdd = el(`<button class="btn">✅ பக்கத்தை சேர்</button>`);
        bAdd.onclick = applyAdjust;
        btnRow.appendChild(bReset); btnRow.appendChild(bCancel); btnRow.appendChild(bAdd);
        body.appendChild(btnRow);
      }
    }

    async function openCamera(){
      if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
        mountResult(body, '⚠️ இந்த பக்கத்தில் கேமராவை அணுக முடியவில்லை. இந்த HTML ஃபைலை WhatsApp/Telegram-க்குள்ளேயே திறக்காமல், மேலே உள்ள "⋮" மெனுவில் "Open in Chrome" / "Open in browser" தேர்ந்தெடுத்து Chrome-ல் திறக்கவும் (கேமராவிற்கு சரியான browser தேவை).').style.background='#FFF6E5';
        return;
      }
      try{
        stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} }, audio:false });
        window.__camStream = stream;
        ensureOpenCv().catch(()=>{});
        view = 'camera'; paint();
      }catch(err){
        let msg = 'கேமராவை திறக்க முடியவில்லை: '+err.message;
        if(err.name==='NotAllowedError' || err.name==='PermissionDeniedError') msg = '📵 கேமரா அனுமதி மறுக்கப்பட்டது. Browser Settings → Site settings → Camera-ல் இந்த தளத்திற்கு அனுமதி கொடுத்து, பக்கத்தை மீண்டும் ஏற்றவும் (reload) செய்யவும்.';
        else if(err.name==='NotFoundError' || err.name==='DevicesNotFoundError') msg = '📵 கேமரா கண்டறியப்படவில்லை. உங்கள் device-ல் கேமரா இருக்கிறதா என சரிபார்க்கவும்.';
        else if(err.name==='NotReadableError' || err.name==='TrackStartError') msg = '📵 கேமராவை வேறு ஆப் ஏற்கனவே பயன்படுத்துகிறது. மற்ற ஆப்களை மூடிவிட்டு மீண்டும் முயற்சிக்கவும்.';
        mountResult(body, msg).style.background='#FDEDEC';
      }
    }
    function stopCamera(){
      if(stream){ try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){} stream = null; window.__camStream = null; }
    }
    function capturePhoto(){
      const video = body.querySelector('#scanVideo');
      if(!video || !video.videoWidth) return;
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video,0,0);
      queue.push({dataUrl: canvas.toDataURL('image/jpeg',0.95)});
      startAdjustNext();
    }
    async function openAdjust(dataUrl){
      adjustImg = dataUrl;
      corners = [{fx:0.06,fy:0.06},{fx:0.94,fy:0.06},{fx:0.94,fy:0.94},{fx:0.06,fy:0.94}];
      filterMode = 'enhance';
      view = 'adjust';
      paint();
      // AI auto edge-detection runs in background; if it finds the document, corners update automatically.
      try{
        const img = new Image();
        await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=dataUrl; });
        const c = document.createElement('canvas');
        const scale = Math.min(1, 900/img.naturalWidth);
        c.width = Math.max(1, Math.round(img.naturalWidth*scale));
        c.height = Math.max(1, Math.round(img.naturalHeight*scale));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        const quad = await autoDetectQuad(c);
        if(quad && view==='adjust' && adjustImg===dataUrl){
          corners = quad.map(p=>({ fx: Math.max(0,Math.min(1,p.x/c.width)), fy: Math.max(0,Math.min(1,p.y/c.height)) }));
          updateOverlay();
        }
      }catch(e){ /* silent — manual corners remain */ }
    }
    function startAdjustNext(){
      if(queue.length){ const item = queue.shift(); openAdjust(item.dataUrl); return; }
      view = stream ? 'camera' : 'home';
      paint();
    }
    function updateOverlay(){
      const wrap = body.querySelector('#adjustWrap'); if(!wrap) return;
      const poly = wrap.querySelector('#quadPoly');
      poly.setAttribute('points', corners.map(c=>`${c.fx*100},${c.fy*100}`).join(' '));
      wrap.querySelectorAll('.corner-handle').forEach(h=>{
        const idx = Number(h.getAttribute('data-idx'));
        h.style.left = (corners[idx].fx*100)+'%';
        h.style.top = (corners[idx].fy*100)+'%';
      });
    }
    function setupDrag(wrap){
      wrap.querySelectorAll('.corner-handle').forEach(h=>{
        const idx = Number(h.getAttribute('data-idx'));
        h.addEventListener('pointerdown', (e)=>{ h.setPointerCapture(e.pointerId); e.preventDefault(); });
        h.addEventListener('pointermove', (e)=>{
          if(e.buttons === 0) return;
          const rect = wrap.getBoundingClientRect();
          let fx = (e.clientX-rect.left)/rect.width, fy = (e.clientY-rect.top)/rect.height;
          fx = Math.max(0,Math.min(1,fx)); fy = Math.max(0,Math.min(1,fy));
          corners[idx] = {fx,fy};
          updateOverlay();
        });
      });
    }
    async function applyAdjust(){
      const prog = mountProgress(body);
      try{
        prog.set(20,'செயலாக்குகிறது…');
        const img = new Image();
        await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=adjustImg; });
        const srcCanvas = document.createElement('canvas');
        srcCanvas.width = img.naturalWidth; srcCanvas.height = img.naturalHeight;
        srcCanvas.getContext('2d').drawImage(img,0,0);
        const quad = corners.map(c=>({x:c.fx*img.naturalWidth, y:c.fy*img.naturalHeight}));
        prog.set(50,'விளிம்பு திருத்தம் (perspective correction)…');
        await new Promise(r=>setTimeout(r,10));
        let outCanvas = warpPerspective(srcCanvas, quad);
        prog.set(85,'வடிகட்டி பயன்படுத்துகிறது…');
        outCanvas = applyDocFilter(outCanvas, filterMode);
        const dataUrl = outCanvas.toDataURL('image/jpeg',0.92);
        pages.push({dataUrl, w:outCanvas.width, h:outCanvas.height});
        prog.set(100,'முடிந்தது');
        prog.remove();
        startAdjustNext();
      }catch(err){ prog.remove(); mountResult(body,'பிழை: '+err.message).style.background='#FDEDEC'; }
    }
    async function doSavePdf(){
      if(!pages.length){ mountResult(body,'குறைந்தது ஒரு பக்கத்தையாவது சேர்க்கவும்.').style.background='#FDEDEC'; return; }
      const prog = mountProgress(body);
      try{
        const doc = await PDFDocument.create();
        for(let i=0;i<pages.length;i++){
          prog.set((i/pages.length)*90, `பக்கம் ${i+1}/${pages.length} சேர்க்கிறது…`);
          const p = pages[i];
          const bytes = Uint8Array.from(atob(p.dataUrl.split(',')[1]), c=>c.charCodeAt(0));
          const jpg = await doc.embedJpg(bytes);
          const pw = 595.28, ph = pw * (p.h/p.w);
          const page = doc.addPage([pw, ph]);
          page.drawImage(jpg, {x:0,y:0,width:pw,height:ph});
        }
        prog.set(100,'முடிந்தது');
        const bytes = await doc.save();
        downloadBlob(new Blob([bytes],{type:'application/pdf'}), 'scanned-document.pdf');
        prog.remove();
        mountResult(body, `${pages.length} பக்கங்கள் கொண்ட ஸ்கேன் செய்யப்பட்ட PDF பதிவிறக்கம் ஆனது.`);
      }catch(err){ prog.remove(); mountResult(body,'பிழை: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

/* ===================== IMAGE COMPRESSOR ===================== */
TOOL_IMPL.imgcompress = {
  mount(container){
    let files = [];
    const body = el(`<div></div>`); container.appendChild(body);
    function paint(){
      body.innerHTML = '';
      mountUploader(body, {
        accept:'image/*', multiple:true,
        label:'JPG/PNG படங்களை இழுத்துப் போடு', sublabel:'அளவை (file size) குறைத்து பதிவிறக்கலாம்',
        onAdd: (fl)=>{ files = files.concat(fl); paint(); }
      });
      if(files.length){
        mountFileList(body, files, (idx)=>{ files.splice(idx,1); paint(); });
        const opts = el(`
          <div class="opts tamil" style="margin-top:16px;">
            <div class="field">
              <label>தரம் (Quality) — <span id="qLbl">78</span>%</label>
              <input type="range" id="qRange" min="20" max="95" value="78">
            </div>
            <div class="field">
              <label>அதிகபட்ச அகலம் (Max width)</label>
              <select id="maxW">
                <option value="0">மூல அளவு (Original)</option>
                <option value="1600" selected>1600 px</option>
                <option value="1200">1200 px</option>
                <option value="800">800 px</option>
              </select>
            </div>
          </div>
        `);
        body.appendChild(opts);
        opts.querySelector('#qRange').addEventListener('input', (e)=>{ opts.querySelector('#qLbl').textContent = e.target.value; });
        const row = el(`<div class="btn-row"></div>`);
        const btn = el(`<button class="btn tamil">🗜️ குறைத்து பதிவிறக்கு</button>`);
        btn.onclick = doCompress;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    async function doCompress(){
      const quality = Number(body.querySelector('#qRange').value)/100;
      const maxW = Number(body.querySelector('#maxW').value);
      const prog = mountProgress(body);
      try{
        const results = [];
        for(let i=0;i<files.length;i++){
          prog.set((i/files.length)*90, `${files[i].name} — குறைக்கிறது…`);
          const f = files[i];
          const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });
          const img = new Image();
          await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=dataUrl; });
          let w = img.naturalWidth, h = img.naturalHeight;
          if(maxW>0 && w>maxW){ h = Math.round(h*(maxW/w)); w = maxW; }
          const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          const blob = await new Promise(res=> canvas.toBlob(res,'image/jpeg', quality));
          results.push({name: f.name.replace(/\.[^.]+$/,'')+'.jpg', blob, before:f.size, after:blob.size});
        }
        prog.set(95,'தயார் செய்கிறது…');
        if(results.length===1){
          downloadBlob(results[0].blob, results[0].name);
        } else {
          const zip = new JSZip();
          results.forEach(r=> zip.file(r.name, r.blob));
          const zipBlob = await zip.generateAsync({type:'blob'});
          downloadBlob(zipBlob, 'compressed-images.zip');
        }
        prog.set(100,'முடிந்தது');
        prog.remove();
        const savedPct = results.reduce((s,r)=>s+r.before,0) > 0 ? Math.round((1 - results.reduce((s,r)=>s+r.after,0)/results.reduce((s,r)=>s+r.before,0))*100) : 0;
        mountResult(body, `${results.length} படங்கள் குறைக்கப்பட்டன — சராசரி ${savedPct}% அளவு குறைப்பு.`);
      }catch(err){ prog.remove(); mountResult(body,'பிழை: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

/* ===================== PDF -> GRAYSCALE / B&W ===================== */
TOOL_IMPL.pdfgray = {
  mount(container){
    let file = null, mode = 'gray';
    const body = el(`<div></div>`); container.appendChild(body);
    function paint(){
      body.innerHTML = '';
      mountUploader(body, {
        accept:'application/pdf',
        label:'ஒரு PDF ஃபைலை இழுத்துப் போடு', sublabel:'அனைத்து பக்கங்களையும் Grayscale/B&W ஆக்கும்',
        onAdd: async (fl)=>{ file = fl[0]; file._buf = await readFileAsArrayBuffer(file); paint(); }
      });
      if(file){
        mountFileList(body, [file], ()=>{ file=null; paint(); });
        const filterRow = el(`<div class="filter-row tamil" style="margin-top:16px;"></div>`);
        [['gray','🌫️ Grayscale'],['bw','⚫ கருப்பு-வெள்ளை (B&W)']].forEach(([m,label])=>{
          const chip = el(`<button class="filter-chip ${mode===m?'active':''}" data-mode="${m}">${label}</button>`);
          filterRow.appendChild(chip);
        });
        filterRow.addEventListener('click', (e)=>{
          const b = e.target.closest('[data-mode]'); if(!b) return;
          mode = b.getAttribute('data-mode'); paint();
        });
        body.appendChild(filterRow);
        const row = el(`<div class="btn-row"></div>`);
        const btn = el(`<button class="btn tamil">⚫ மாற்று</button>`);
        btn.onclick = doConvert;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    async function doConvert(){
      const prog = mountProgress(body);
      try{
        prog.set(10,'படிக்கிறது…');
        const pdfjsDoc = await loadPdfJs(file._buf);
        const outDoc = await PDFDocument.create();
        for(let i=1;i<=pdfjsDoc.numPages;i++){
          prog.set(10+(i/pdfjsDoc.numPages)*80, `பக்கம் ${i}/${pdfjsDoc.numPages}…`);
          const page = await pdfjsDoc.getPage(i);
          const viewport = page.getViewport({scale:2});
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width; canvas.height = viewport.height;
          await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
          applyDocFilter(canvas, mode);
          const dataUrl = canvas.toDataURL('image/jpeg',0.9);
          const bytes = Uint8Array.from(atob(dataUrl.split(',')[1]), c=>c.charCodeAt(0));
          const jpg = await outDoc.embedJpg(bytes);
          const origView = page.view; // [x0,y0,x1,y1]
          const pw = origView[2]-origView[0], ph = origView[3]-origView[1];
          const opage = outDoc.addPage([pw, ph]);
          opage.drawImage(jpg, {x:0,y:0,width:pw,height:ph});
        }
        prog.set(95,'தயார் செய்கிறது…');
        const bytes = await outDoc.save();
        downloadBlob(new Blob([bytes],{type:'application/pdf'}), file.name.replace(/\.pdf$/i,'')+'-bw.pdf');
        prog.set(100,'முடிந்தது');
        prog.remove();
        mountResult(body, 'மாற்றப்பட்ட PDF பதிவிறக்கம் ஆனது.');
      }catch(err){ prog.remove(); mountResult(body,'பிழை: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

          btn.onclick = doReplace;
          row.appendChild(btn);
          body.appendChild(row);
        }
      } else if(mode === 'extract'){
        body.appendChild(el(`<div class="note tamil" style="margin-top:14px;">வீடியோவிலிருந்து ஆடியோவை (குரல்/பாடல்) தனியாக MP3 ஆக பிரித்தெடுக்கும்.</div>`));

          row.appendChild(btn);
          body.appendChild(row);
        }
      } else if(mode === 'record'){
        body.appendChild(el(`<div class="note tamil" style="margin-top:14px;">கேமரா + மைக்கை பயன்படுத்தி வீடியோவும் குரலும் ஒன்றாக பதிவு செய்யலாம். பதிவு browser-க்குள்ளேயே நடக்கும்.</div>`));

        const badge = el(`<div class="tamil" style="text-align:center;margin-top:10px;font-weight:800;font-size:13px;color:${recording?'var(--warn)':'var(--sub)'};">${recording? '🔴 பதிவாகிறது… '+fmtTime(recSeconds) : 'கேமராவைத் திற பதிவு செய்ய'}</div>`);
        body.appendChild(badge);
        const row = el(`<div class="btn-row tamil" style="justify-content:center;"></div>`);
        if(!recStream){
          const bOpen = el(`<button class="btn">📷 கேமரா திற</button>`);
          bOpen.onclick = openRecCamera;
          row.appendChild(bOpen);
        } else if(!recording){
          const bStart = el(`<button class="btn accent">⏺️ பதிவு தொடங்கு</button>`);
          bStart.onclick = startRecording;
          const bClose = el(`<button class="btn secondary">✕ மூடு</button>`);
          bClose.onclick = ()=>{ stopRecording(true); paint(); };
          row.appendChild(bStart); row.appendChild(bClose);
        } else {
          const bStop = el(`<button class="btn" style="background:var(--warn);">⏹️ பதிவை நிறுத்து</button>`);
          bStop.onclick = ()=> stopRecording(false);
          row.appendChild(bStop);
        }
        body.appendChild(row);
        if(recStream){
          const v = body.querySelector('#vvLive');
          v.srcObject = recStream; v.play().catch(()=>{});
        }
        if(window.__vvLastRecording){
          const rb = el(`<div class="result-box tamil"><div class="ri">✅</div><div class="rtext">பதிவு தயார் — கீழே பதிவிறக்கம் செய்யலாம்.</div></div>`);
          body.appendChild(rb);
          const dRow = el(`<div class="btn-row"></div>`);
          const dBtn = el(`<button class="btn tamil">⬇️ பதிவிறக்கு (.webm)</button>`);
          dBtn.onclick = ()=> downloadBlob(window.__vvLastRecording, 'recording-'+Date.now()+'.webm');
          dRow.appendChild(dBtn);
          body.appendChild(dRow);
        }
      }
    }

    async function openRecCamera(){
      if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
        mountResult(body,'⚠️ இந்த browser-ல் கேமரா/மைக் அணுக முடியவில்லை.').style.background='#FDEDEC';
        return;
      }
      try{
        recStream = await navigator.mediaDevices.getUserMedia({ video:{facingMode:{ideal:'environment'}}, audio:true });
        window.__camStream = recStream;
        paint();
      }catch(err){
        mountResult(body,'கேமரா/மைக் அனுமதி தேவை: '+err.message).style.background='#FDEDEC';
      }
    }
    function startRecording(){
      recChunks = []; window.__vvLastRecording = null;
      const mime = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
      recorder = new MediaRecorder(recStream, mime?{mimeType:mime}:undefined);
      recorder.ondataavailable = (e)=>{ if(e.data && e.data.size) recChunks.push(e.data); };
      recorder.onstop = ()=>{
        window.__vvLastRecording = new Blob(recChunks, {type:'video/webm'});
        paint();
      };
      recorder.start(250);
      recording = true; recSeconds = 0;
      recTimer = setInterval(()=>{ recSeconds++; const b = body.querySelector('.scan-video-wrap + div'); if(b) b.textContent = '🔴 பதிவாகிறது… '+fmtTime(recSeconds); }, 1000);
      paint();
    }
    function stopRecording(discardStream){
      if(recTimer){ clearInterval(recTimer); recTimer=null; }
      if(recorder && recording){ try{ recorder.stop(); }catch(e){} }
      recording = false;
      if(discardStream && recStream){ try{ recStream.getTracks().forEach(t=>t.stop()); }catch(e){} recStream=null; window.__camStream=null; }
    }

    async function doReplace(){
      const mix = body.querySelector('#vvMix') && body.querySelector('#vvMix').checked;
      const prog = mountProgress(body);
      let progHandler = null, ffmpegRef = null;
      try{
        prog.set(5,'வீடியோ இயந்திரம் ஏற்றுகிறது… (முதல் முறை சிறிது நேரம் ஆகும்)');
        const { ffmpeg, fetchFile } = await ensureFFmpeg();
        ffmpegRef = ffmpeg;

        const vExt = (videoFile.name.split('.').pop()||'mp4').toLowerCase();
        const aExt = (audioFile.name.split('.').pop()||'mp3').toLowerCase();
        await ffmpeg.writeFile('in_v.'+vExt, await fetchFile(videoFile));
        await ffmpeg.writeFile('in_a.'+aExt, await fetchFile(audioFile));
        prog.set(20,'இணைக்கிறது…');
        // Always re-encode (rather than "-c:v copy") — stream-copying a webm/mkv video
        // straight into an .mp4 container fails whenever the source codec isn't natively
        // mp4-compatible (e.g. a video recorded with this app's own camera tool, which
        // saves as .webm/VP8). Re-encoding to h264+aac guarantees a playable result
        // regardless of the input format, at the cost of a little extra time.
        if(mix){
          await ffmpeg.exec(['-i','in_v.'+vExt,'-i','in_a.'+aExt,'-filter_complex','[0:a][1:a]amix=inputs=2:duration=shortest:dropout_transition=2[aout]','-map','0:v:0','-map','[aout]','-c:v','libx264','-preset','veryfast','-c:a','aac','-shortest','out.mp4']);
        } else {
          await ffmpeg.exec(['-i','in_v.'+vExt,'-i','in_a.'+aExt,'-map','0:v:0','-map','1:a:0','-c:v','libx264','-preset','veryfast','-c:a','aac','-shortest','out.mp4']);
        }
        prog.set(92,'ஃபைல் தயார் செய்கிறது…');
        const data = await ffmpeg.readFile('out.mp4');
        downloadBlob(new Blob([data],{type:'video/mp4'}), videoFile.name.replace(/\.[^.]+$/,'')+'-newvoice.mp4');
        prog.set(100,'முடிந்தது'); prog.remove();
        mountResult(body, 'குரல் இணைக்கப்பட்ட வீடியோ பதிவிறக்கம் ஆனது.');
      }catch(err){ prog.remove(); mountResult(body,'பிழை: '+err.message).style.background='#FDEDEC'; }
      finally{ if(ffmpegRef && progHandler){ try{ ffmpegRef.off('progress', progHandler); }catch(e){} } }
    }
    async function doExtract(){
      const prog = mountProgress(body);
      let progHandler = null, ffmpegRef = null;
      try{
        prog.set(5,'வீடியோ இயந்திரம் ஏற்றுகிறது…');
        const { ffmpeg, fetchFile } = await ensureFFmpeg();
        ffmpegRef = ffmpeg;
        progHandler = ({progress})=>{ const p = Math.min(1,Math.max(0,progress||0)); prog.set(20+p*70, 'ஆடியோ எடுக்கிறது… '+Math.round(p*100)+'%'); };
        ffmpeg.on('progress', progHandler);
        const vExt = (videoFile.name.split('.').pop()||'mp4').toLowerCase();
        await ffmpeg.writeFile('in_v.'+vExt, await fetchFile(videoFile));
        await ffmpeg.exec(['-i','in_v.'+vExt,'-vn','-ar','44100','-ac','2','-b:a','192k','out.mp3']);
        prog.set(92,'ஃபைல் தயார் செய்கிறது…');
        const data = await ffmpeg.readFile('out.mp3');
        downloadBlob(new Blob([data],{type:'audio/mp3'}), videoFile.name.replace(/\.[^.]+$/,'')+'.mp3');
        prog.set(100,'முடிந்தது'); prog.remove();
        mountResult(body, 'ஆடியோ (.mp3) பிரித்தெடுக்கப்பட்டு பதிவிறக்கம் ஆனது.');
      }catch(err){ prog.remove(); mountResult(body,'பிழை: '+err.message).style.background='#FDEDEC'; }
      finally{ if(ffmpegRef && progHandler){ try{ ffmpegRef.off('progress', progHandler); }catch(e){} } }
    }
    paint();
  }
};

TOOL_IMPL.vidsplit = {
  mount(container){
    ensureFFmpeg().catch(()=>{}); // pre-warm engine in background for speed
    let file = null, duration = 0, mode = 'equal';
    const body = el(`<div></div>`); container.appendChild(body);
    function paint(){
      body.innerHTML = '';
      mountUploader(body, { accept:'video/*', label:'ஒரு வீடியோவை இழுத்துப் போடு', sublabel:'MP4 / MOV / WEBM — கட் ஆனாலும் தரம் குறையாது',

          const chip = el(`<button class="filter-chip ${mode===m?'active':''}" data-m="${m}">${label}</button>`);

        body.appendChild(modeRow);

        if(mode==='equal'){
          const opts = el(`

              <div class="field">

                <input type="number" id="vsN" min="2" max="30" value="3">
              </div>
            </div>
          `);
          body.appendChild(opts);

          const opts = el(`
            <div class="opts one tamil">
              <div class="field">
                <label>ஒவ்வொரு வரியிலும் ஒரு பகுதி — mm:ss-mm:ss (எ.கா. 00:00-00:30)</label>
                <textarea id="vsRanges" rows="4" style="width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:13px; font-family:inherit;" placeholder="00:00-00:30&#10;00:30-01:15">00:00-00:30</textarea>

          body.appendChild(opts);

        const row = el(`<div class="btn-row"></div>`);
        const btn = el(`<button class="btn tamil">🎬 பிரி</button>`);
        btn.onclick = doSplit;

    async function doSplit(){
      let segments = [];
      const ext = (file.name.split('.').pop()||'mp4').toLowerCase();
      if(mode==='equal'){
        const n = Math.max(2, Math.min(30, Number(body.querySelector('#vsN').value)||3));
        if(!duration){ mountResult(body,'வீடியோவின் நேரத்தை கண்டறிய முடியவில்லை.').style.background='#FDEDEC'; return; }
        const len = duration/n;
        for(let k=0;k<n;k++) segments.push({start:k*len, dur: (k===n-1? duration-k*len : len)});
      } else {
        const lines = (body.querySelector('#vsRanges').value||'').split('\n').map(l=>l.trim()).filter(Boolean);
        if(!lines.length){ mountResult(body,'குறைந்தது ஒரு நேர வரம்பையாவது கொடுக்கவும்.').style.background='#FDEDEC'; return; }
        for(const line of lines){
          const [a,b] = line.split('-').map(s=>s.trim());
          const s = parseTimeToSec(a), e = parseTimeToSec(b);
          if(e>s) segments.push({start:s, dur:e-s});
        }
        if(!segments.length){ mountResult(body,'நேர வரம்புகளை சரியாக உள்ளிடவும் (mm:ss-mm:ss).').style.background='#FDEDEC'; return; }
      }
      const prog = mountProgress(body);
      try{
        prog.set(5,'வீடியோ இயந்திரம் ஏற்றுகிறது… (முதல் முறை சிறிது நேரம் ஆகும்)');
        const { ffmpeg, fetchFile } = await ensureFFmpeg();
        await ffmpeg.writeFile('in.'+ext, await fetchFile(file));
        const results = [];
        for(let k=0;k<segments.length;k++){
          const seg = segments[k];
          prog.set(15 + (k/segments.length)*70, `பாகம் ${k+1}/${segments.length} வெட்டுகிறது…`);
          const outName = `part${k+1}.${ext}`;
          await ffmpeg.exec(['-ss', String(seg.start), '-i','in.'+ext, '-t', String(seg.dur), '-c','copy', outName]);
          const data = await ffmpeg.readFile(outName);
          results.push({name: file.name.replace(/\.[^.]+$/,'')+`-part${k+1}.${ext}`, blob: new Blob([data],{type:'video/'+ext})});
        }
        prog.set(90,'தயார் செய்கிறது…');
        if(results.length===1){ downloadBlob(results[0].blob, results[0].name); }
        else {
          const zip = new JSZip();
          results.forEach(r=> zip.file(r.name, r.blob));
          const zipBlob = await zip.generateAsync({type:'blob'});
          downloadBlob(zipBlob, file.name.replace(/\.[^.]+$/,'')+'-parts.zip');
        }
        prog.set(100,'முடிந்தது'); prog.remove();
        mountResult(body, `${results.length} வீடியோ பாகங்கள் பதிவிறக்கம் ஆனது.`);
      }catch(err){ prog.remove(); mountResult(body,'பிழை: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

/* ===================== WATERMARK REMOVER ===================== */
TOOL_IMPL.wmremove = {
  mount(container){
    ensureOpenCv().catch(()=>{}); // pre-warm engine in background for speed
    let kind = 'pdf';
    let file = null, previewUrl = null, pdfjsDoc = null, previewW=0, previewH=0;
    let selector = null;
    let imgCanvas = null, brush = null;
    const body = el(`<div></div>`); container.appendChild(body);

    function paint(){
      body.innerHTML = '';
      const kindRow = el(`<div class="filter-row tamil"></div>`);
      [['pdf','📄 PDF'],['image','🖼️ படம் (Image)']].forEach(([k,label])=>{
        const chip = el(`<button class="filter-chip ${kind===k?'active':''}" data-k="${k}">${label}</button>`);
        kindRow.appendChild(chip);
      });
      kindRow.addEventListener('click',(e)=>{ const b=e.target.closest('[data-k]'); if(!b) return; kind=b.getAttribute('data-k'); file=null; previewUrl=null; paint(); });
      body.appendChild(kindRow);

      if(kind==='pdf'){
        body.appendChild(el(`<div class="note tamil" style="margin-top:14px;">முத்திரை/வாட்டர்மார்க் இருக்கும் இடத்தை பெட்டியால் குறி — அது எல்லா பக்கங்களிலும் ஒரே இடத்தில் மறைக்கப்படும். (குறிப்பு: அந்த பகுதியில் உண்மையான உரை/படம் இருந்தால் அதுவும் மறையும் — வாட்டர்மார்க் மட்டும் இருக்கும் இடத்தையே தேர்ந்தெடுக்கவும்.)</div>`));
        mountUploader(body, { accept:'application/pdf', label:'PDF-ஐ இழுத்துப் போடு', sublabel:'',
          onAdd: async (fl)=>{
            file = fl[0]; file._buf = await readFileAsArrayBuffer(file);
            pdfjsDoc = await loadPdfJs(file._buf);
            const page = await pdfjsDoc.getPage(1);
            const viewport = page.getViewport({scale: Math.min(1.6, 720/page.getViewport({scale:1}).width)});
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width; canvas.height = viewport.height;
            await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
            previewUrl = canvas.toDataURL('image/jpeg',0.85);
            previewW = viewport.width; previewH = viewport.height;
            paint();
          }});
        if(file){
          mountFileList(body, [file], ()=>{ file=null; previewUrl=null; paint(); });
          if(previewUrl){
            selector = mountRectSelector(body, previewUrl, {fx0:0.2, fy0:0.42, fx1:0.8, fy1:0.58});
            const opts = el(`
              <div class="opts tamil">
                <div class="field">
                  <label>நிறம்</label>
                  <select id="wrColor">
                    <option value="auto">தானாக (பக்கத்தின் அடிப்படை நிறம்)</option>
                    <option value="white">வெள்ளை</option>
                  </select>
                </div>
                <div class="field-inline" style="align-self:end;">
                  <input type="checkbox" id="wrAll" checked><label for="wrAll">எல்லா பக்கங்களிலும் பயன்படுத்து</label>
                </div>
              </div>
            `);
            body.appendChild(opts);
            const row = el(`<div class="btn-row"></div>`);
            const btn = el(`<button class="btn tamil">🧽 நீக்கு</button>`);
            btn.onclick = doPdfRemove;
            row.appendChild(btn);
            body.appendChild(row);
          }
        }
      } else {
        body.appendChild(el(`<div class="note tamil" style="margin-top:14px;">வாட்டர்மார்க்/லோகோ இருக்கும் இடத்தை விரலால் (brush) தடவி குறி — சுற்றியுள்ள படத்தைக் கொண்டு அந்த பகுதி புத்திசாலித்தனமாக நிரப்பப்படும் (AI inpainting).</div>`));
        mountUploader(body, { accept:'image/*', label:'படத்தை இழுத்துப் போடு', sublabel:'JPG / PNG',
          onAdd: async (fl)=>{
            file = fl[0];
            const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
            const img = new Image();
            await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=dataUrl; });
            const scale = Math.min(1, 900/img.naturalWidth);
            imgCanvas = document.createElement('canvas');
            imgCanvas.width = Math.round(img.naturalWidth*scale); imgCanvas.height = Math.round(img.naturalHeight*scale);
            imgCanvas.getContext('2d').drawImage(img,0,0,imgCanvas.width,imgCanvas.height);
            paint();
          }});
        if(file && imgCanvas){
          mountFileList(body, [file], ()=>{ file=null; imgCanvas=null; paint(); });
          brush = mountBrushMask(body, imgCanvas, 28);
          const opts = el(`
            <div class="opts one tamil">
              <div class="field">
                <label>Brush அளவு</label>
                <input type="range" id="wrBrush" min="8" max="60" value="28">
              </div>
            </div>
          `);
          body.appendChild(opts);
          opts.querySelector('#wrBrush').addEventListener('input',(e)=> brush.setBrush(Number(e.target.value)));
          const row = el(`<div class="btn-row"></div>`);
          const bClear = el(`<button class="btn secondary tamil">↺ மீண்டும் குறி</button>`);
          bClear.onclick = ()=> brush.clear();
          const bDo = el(`<button class="btn tamil">🧽 நீக்கு (Inpaint)</button>`);
          bDo.onclick = doImageRemove;
          row.appendChild(bClear); row.appendChild(bDo);
          body.appendChild(row);
        }
      }
    }

    async function doPdfRemove(){
      const rect = selector.getRect();
      const colorMode = body.querySelector('#wrColor').value;
      const allPages = body.querySelector('#wrAll').checked;
      const prog = mountProgress(body);
      try{
        prog.set(10,'படிக்கிறது…');
        // sample fill color from the preview canvas at the rectangle's edge
        let fillColor = rgb(1,1,1);
        if(colorMode==='auto'){
          const img = new Image();
          await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=previewUrl; });
          const c = document.createElement('canvas'); c.width=previewW; c.height=previewH;
          const cx = c.getContext('2d'); cx.drawImage(img,0,0);
          const sx = Math.min(previewW-1, Math.max(0, Math.round(rect.fx0*previewW)-2));
          const sy = Math.min(previewH-1, Math.max(0, Math.round(rect.fy0*previewH)-2));
          const px = cx.getImageData(sx,sy,1,1).data;
          fillColor = rgb(px[0]/255, px[1]/255, px[2]/255);
        }
        const doc = await PDFDocument.load(file._buf, {ignoreEncryption:true});
        const pages = doc.getPages();
        const targets = allPages ? pages : [pages[0]];
        targets.forEach((page,idx)=>{
          prog.set(10 + (idx/targets.length)*75, `பக்கம் ${idx+1}/${targets.length}…`);
          const {width,height} = page.getSize();
          const x = rect.fx0*width, w = (rect.fx1-rect.fx0)*width;
          const yTop = rect.fy0*height, yBot = rect.fy1*height;
          const y = height - yBot, h = yBot - yTop;
          page.drawRectangle({ x, y, width:w, height:h, color: fillColor });
        });
        prog.set(92,'தயார் செய்கிறது…');
        const bytes = await doc.save();
        downloadBlob(new Blob([bytes],{type:'application/pdf'}), file.name.replace(/\.pdf$/i,'')+'-nowm.pdf');
        prog.set(100,'முடிந்தது'); prog.remove();
        mountResult(body, 'வாட்டர்மார்க் மறைக்கப்பட்ட PDF பதிவிறக்கம் ஆனது.');
      }catch(err){ prog.remove(); mountResult(body,'பிழை: '+err.message).style.background='#FDEDEC'; }
    }
    async function doImageRemove(){
      if(!brush.hasPaint()){ mountResult(body,'முதலில் வாட்டர்மார்க் மேல் brush-ஆல் தடவி குறிக்கவும்.').style.background='#FDEDEC'; return; }
      const prog = mountProgress(body);
      let src,mask,dst;
      try{
        prog.set(10,'AI inpainting இயந்திரம் ஏற்றுகிறது…');
        const cv = await ensureOpenCv();
        prog.set(40,'செயலாக்குகிறது…');
        src = cv.imread(imgCanvas);
        const maskCanvas = brush.getMaskCanvas();
        const mCtx = maskCanvas.getContext('2d');
        const mData = mCtx.getImageData(0,0,maskCanvas.width,maskCanvas.height);
        mask = new cv.Mat(maskCanvas.height, maskCanvas.width, cv.CV_8UC1);
        for(let p=0, q=0; p<mData.data.length; p+=4, q++){
          mask.data[q] = mData.data[p+3] > 20 ? 255 : 0;
        }
        dst = new cv.Mat();
        cv.inpaint(src, mask, dst, 7, cv.INPAINT_TELEA);
        cv.imshow(imgCanvas, dst);
        prog.set(90,'தயார் செய்கிறது…');
        const blob = await new Promise(res=> imgCanvas.toBlob(res, 'image/png'));
        downloadBlob(blob, file.name.replace(/\.[^.]+$/,'')+'-nowm.png');
        prog.set(100,'முடிந்தது'); prog.remove();
        brush.clear();
        mountResult(body, 'வாட்டர்மார்க் நீக்கப்பட்ட படம் பதிவிறக்கம் ஆனது.');
      }catch(err){ prog.remove(); mountResult(body,'பிழை: '+err.message).style.background='#FDEDEC'; }
      finally{ [src,mask,dst].forEach(m=>{ try{ m && m.delete(); }catch(e){} }); }
    }
    paint();
  }
};

/* ===================== IMAGE ENHANCER (upscale + sharpen + denoise) ===================== */
TOOL_IMPL.imgenhance = {
  mount(container){
    let files = [];
    const body = el(`<div></div>`); container.appendChild(body);
    function paint(){
      body.innerHTML = '';
      mountUploader(body, { accept:'image/*', multiple:true, label:'படங்களை இழுத்துப் போடு', sublabel:'JPG / PNG — பல படங்களையும் ஒரே நேரத்தில் தேர்வு செய்யலாம்',
        onAdd: (fl)=>{ files = files.concat(fl); paint(); } });
      if(files.length){
        mountFileList(body, files, (idx)=>{ files.splice(idx,1); paint(); });
        body.appendChild(el(`<div class="note tamil">இது browser-அடிப்படையிலான தெளிவூட்டல் (upscale + sharpen + noise‑reduction) — உண்மையான AI நியூரல் மாடல் அல்ல, ஆனால் பெரும்பாலான புகைப்படங்களுக்கு காட்சி தெளிவை நன்றாக மேம்படுத்தும்.</div>`));
        const opts = el(`
          <div class="opts tamil">
            <div class="field">
              <label>Upscale</label>
              <select id="ieScale">
                <option value="1">1× (அளவு மாறாது)</option>
                <option value="1.5">1.5×</option>
                <option value="2" selected>2×</option>
                <option value="3">3×</option>
              </select>
            </div>
            <div class="field">
              <label>Sharpen (தெளிவு) <span id="ieShLbl">60</span>%</label>
              <input type="range" id="ieSharp" min="0" max="150" value="60">
            </div>
            <div class="field-inline"><input type="checkbox" id="ieDenoise" checked><label for="ieDenoise">Noise குறை (Denoise)</label></div>
            <div class="field-inline"><input type="checkbox" id="ieContrast" checked><label for="ieContrast">Auto Contrast</label></div>
          </div>
        `);
        body.appendChild(opts);
        opts.querySelector('#ieSharp').addEventListener('input',(e)=> opts.querySelector('#ieShLbl').textContent = e.target.value);
        const row = el(`<div class="btn-row"></div>`);
        const btn = el(`<button class="btn tamil">✨ தெளிவூட்டி பதிவிறக்கு</button>`);
        btn.onclick = doEnhance;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    function ensureEnhanceWorker(){
      if(window.__enhanceWorker) return window.__enhanceWorker;
      const src = `
        function boxBlurPass(data,w,h,horizontal){
          var out = new Float32Array(data.length);
          if(horizontal){
            for(var y=0;y<h;y++){
              var row=y*w;
              for(var x=0;x<w;x++){
                var xl=x>0?x-1:0, xr=x<w-1?x+1:w-1;
                var base=(row+x)*4, bl=(row+xl)*4, br=(row+xr)*4;
                out[base]=(data[bl]+2*data[base]+data[br])/4;
                out[base+1]=(data[bl+1]+2*data[base+1]+data[br+1])/4;
                out[base+2]=(data[bl+2]+2*data[base+2]+data[br+2])/4;
                out[base+3]=data[base+3];
              }
            }
          } else {
            for(var y2=0;y2<h;y2++){
              var yt=y2>0?y2-1:0, yb=y2<h-1?y2+1:h-1;
              for(var x2=0;x2<w;x2++){
                var base2=(y2*w+x2)*4, bt=(yt*w+x2)*4, bb=(yb*w+x2)*4;
                out[base2]=(data[bt]+2*data[base2]+data[bb])/4;
                out[base2+1]=(data[bt+1]+2*data[base2+1]+data[bb+1])/4;
                out[base2+2]=(data[bt+2]+2*data[base2+2]+data[bb+2])/4;
                out[base2+3]=data[base2+3];
              }
            }
          }
          return out;
        }
        function gaussianBlur(data,w,h){ return boxBlurPass(boxBlurPass(data,w,h,true),w,h,false); }
        onmessage = function(e){
          var m = e.data;
          var cur = new Uint8ClampedArray(m.buffer);
          if(m.denoise){ cur = Uint8ClampedArray.from(gaussianBlur(cur, m.w, m.h)); }
          if(m.sharpAmt>0){
            var blurred = gaussianBlur(cur, m.w, m.h);
            var out = new Uint8ClampedArray(cur.length);
            for(var p=0;p<cur.length;p+=4){
              out[p]  =cur[p]  +m.sharpAmt*(cur[p]  -blurred[p]);
              out[p+1]=cur[p+1]+m.sharpAmt*(cur[p+1]-blurred[p+1]);
              out[p+2]=cur[p+2]+m.sharpAmt*(cur[p+2]-blurred[p+2]);
              out[p+3]=cur[p+3];
            }
            cur = out;
          }
          if(m.autoContrast){
            var min=255,max=0;
            for(var q=0;q<cur.length;q+=4){ var l=(cur[q]+cur[q+1]+cur[q+2])/3; if(l<min)min=l; if(l>max)max=l; }
            var range=Math.max(1,max-min);
            for(var q2=0;q2<cur.length;q2+=4){
              cur[q2]  =(cur[q2]  -min)*255/range;
              cur[q2+1]=(cur[q2+1]-min)*255/range;
              cur[q2+2]=(cur[q2+2]-min)*255/range;
            }
          }
          postMessage({id:m.id, buffer:cur.buffer}, [cur.buffer]);
        };
      `;
      const worker = new Worker(URL.createObjectURL(new Blob([src], {type:'text/javascript'})));
      window.__enhanceWorker = worker;
      return worker;
    }
    function runEnhanceWorker(uint8arr, w, h, opts){
      return new Promise((resolve, reject)=>{
        const worker = ensureEnhanceWorker();
        const id = Math.random().toString(36).slice(2);
        function handler(e){
          if(e.data.id !== id) return;
          worker.removeEventListener('message', handler);
          resolve(new Uint8ClampedArray(e.data.buffer));
        }
        worker.addEventListener('message', handler);
        const buf = uint8arr.buffer.slice(0); // standalone copy so it can be transferred (zero-copy) without touching the canvas's own buffer
        worker.postMessage({id, buffer:buf, w, h, denoise:opts.denoise, sharpAmt:opts.sharpAmt, autoContrast:opts.autoContrast}, [buf]);
        setTimeout(()=>{ worker.removeEventListener('message', handler); reject(new Error('தெளிவூட்டல் நேரம் மீறியது')); }, 60000);
      });
    }
    function yieldFrame(){ return new Promise(r=> setTimeout(r,0)); }
    async function doEnhance(){
      const scale = Number(body.querySelector('#ieScale').value)||1;
      const sharpAmt = Number(body.querySelector('#ieSharp').value)/100;
      const denoise = body.querySelector('#ieDenoise').checked;
      const autoContrast = body.querySelector('#ieContrast').checked;
      const MAX_PIXELS = 3200*3200; // keep processing time reasonable on phones
      const prog = mountProgress(body);
      try{
        const results = [];
        for(let i=0;i<files.length;i++){
          const base = (i/files.length)*95;
          prog.set(base, `${files[i].name} — படிக்கிறது…`);
          const f = files[i];
          const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });
          const img = new Image();
          await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=dataUrl; });
          let w = Math.round(img.naturalWidth*scale), h = Math.round(img.naturalHeight*scale);
          if(w*h > MAX_PIXELS){ const fct = Math.sqrt(MAX_PIXELS/(w*h)); w = Math.max(1,Math.round(w*fct)); h = Math.max(1,Math.round(h*fct)); }
          const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img,0,0,w,h);
          await yieldFrame();
          let imgData = ctx.getImageData(0,0,w,h);

          prog.set(base+4, `${files[i].name} — Background thread-ல் தெளிவூட்டுகிறது… (UI freeze ஆகாது)`);
          const processed = await runEnhanceWorker(imgData.data, w, h, {denoise, sharpAmt, autoContrast});
          ctx.putImageData(new ImageData(processed, w, h), 0, 0);

          const blob = await new Promise(res=> canvas.toBlob(res,'image/jpeg',0.95));
          results.push({name: f.name.replace(/\.[^.]+$/,'')+'-enhanced.jpg', blob});
          await yieldFrame();
        }
        prog.set(96,'தயார் செய்கிறது…');
        if(results.length===1) downloadBlob(results[0].blob, results[0].name);
        else {
          const zip = new JSZip();
          results.forEach(r=> zip.file(r.name, r.blob));
          const zipBlob = await zip.generateAsync({type:'blob'});
          downloadBlob(zipBlob, 'enhanced-images.zip');
        }
        prog.set(100,'முடிந்தது'); prog.remove();

/* ===================== BACKGROUND REMOVER ===================== */
TOOL_IMPL.bgremove = {
  mount(container){
    ensureOpenCv().catch(()=>{}); // pre-warm engine in background for speed
    let file = null, imgCanvas = null, selector = null, previewUrl = null;
    const body = el(`<div></div>`); container.appendChild(body);
    function paint(){
      body.innerHTML = '';
      body.appendChild(el(`<div class="note tamil">பொருளை (subject) சுற்றி பெட்டி வரை — அதற்கு வெளியே உள்ள பின்னணி தானாக வெளிப்படையாக்கப்படும் (transparent PNG).</div>`));
      mountUploader(body, { accept:'image/*', label:'படத்தை இழுத்துப் போடு', sublabel:'JPG / PNG',
        onAdd: async (fl)=>{
          file = fl[0];
          const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
          const img = new Image();
          await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=dataUrl; });
          const scale = Math.min(1, 900/img.naturalWidth);
          imgCanvas = document.createElement('canvas');
          imgCanvas.width = Math.round(img.naturalWidth*scale); imgCanvas.height = Math.round(img.naturalHeight*scale);
          imgCanvas.getContext('2d').drawImage(img,0,0,imgCanvas.width,imgCanvas.height);
          previewUrl = imgCanvas.toDataURL('image/jpeg',0.9);
          paint();
        }});
      if(file && previewUrl){
        mountFileList(body, [file], ()=>{ file=null; imgCanvas=null; previewUrl=null; paint(); });
        selector = mountRectSelector(body, previewUrl, {fx0:0.08, fy0:0.08, fx1:0.92, fy1:0.92});
        const row = el(`<div class="btn-row"></div>`);
        const btn = el(`<button class="btn tamil">🪄 பின்னணி நீக்கு</button>`);
        btn.onclick = doRemove;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    async function doRemove(){
      const rect = selector.getRect();
      const prog = mountProgress(body);
      let src, mask, bgdModel, fgdModel;
      try{
        prog.set(10,'AI இயந்திரம் ஏற்றுகிறது…');
        const cv = await ensureOpenCv();
        prog.set(35,'பொருளை கண்டறிகிறது…');
        await new Promise(r=>setTimeout(r,10));
        src = cv.imread(imgCanvas);
        // grabCut needs a 3-channel image
        const rgbMat = new cv.Mat(); cv.cvtColor(src, rgbMat, cv.COLOR_RGBA2RGB);
        mask = new cv.Mat.zeros(imgCanvas.height, imgCanvas.width, cv.CV_8UC1);
        bgdModel = new cv.Mat(); fgdModel = new cv.Mat();
        const x = Math.round(rect.fx0*imgCanvas.width), y = Math.round(rect.fy0*imgCanvas.height);
        const w = Math.max(2, Math.round((rect.fx1-rect.fx0)*imgCanvas.width));
        const h = Math.max(2, Math.round((rect.fy1-rect.fy0)*imgCanvas.height));
        const cvRect = new cv.Rect(x,y,w,h);
        cv.grabCut(rgbMat, mask, cvRect, bgdModel, fgdModel, 5, cv.GC_INIT_WITH_RECT);
        prog.set(75,'பின்னணியை வெளிப்படையாக்குகிறது…');
        const outCanvas = document.createElement('canvas'); outCanvas.width=imgCanvas.width; outCanvas.height=imgCanvas.height;
        const octx = outCanvas.getContext('2d');
        octx.drawImage(imgCanvas,0,0);
        const outData = octx.getImageData(0,0,outCanvas.width,outCanvas.height);
        for(let p=0, q=0; q<mask.rows*mask.cols; p+=4, q++){
          const v = mask.data[q]; // 0=bg,1=fg,2=probable bg,3=probable fg
          const isFg = (v===1 || v===3);
          if(!isFg) outData.data[p+3] = 0;
        }
        octx.putImageData(outData,0,0);
        rgbMat.delete();
        const blob = await new Promise(res=> outCanvas.toBlob(res,'image/png'));
        prog.set(95,'தயார் செய்கிறது…');
        downloadBlob(blob, file.name.replace(/\.[^.]+$/,'')+'-nobg.png');
        prog.set(100,'முடிந்தது'); prog.remove();
        mountResult(body, 'பின்னணி நீக்கப்பட்ட PNG பதிவிறக்கம் ஆனது.');
      }catch(err){ prog.remove(); mountResult(body,'பிழை: '+err.message).style.background='#FDEDEC'; }
      finally{ [src,mask,bgdModel,fgdModel].forEach(m=>{ try{ m && m.delete(); }catch(e){} }); }
    }
    paint();
  }
};

/* ===================== QR CODE GENERATOR ===================== */
TOOL_IMPL.qrgen = {
  mount(container){
    let mode = 'text';
    const body = el(`<div></div>`); container.appendChild(body);
    function paint(){
      body.innerHTML = '';
      const modeRow = el(`<div class="filter-row tamil"></div>`);
      [['text','📝 எழுத்து/லிங்க்'],['wifi','📶 Wi‑Fi'],['vcard','👤 தொடர்பு (Contact)']].forEach(([m,label])=>{
        const chip = el(`<button class="filter-chip ${mode===m?'active':''}" data-m="${m}">${label}</button>`);
        modeRow.appendChild(chip);
      });
      modeRow.addEventListener('click',(e)=>{ const b=e.target.closest('[data-m]'); if(!b) return; mode=b.getAttribute('data-m'); paint(); });
      body.appendChild(modeRow);

      let fieldsHtml = '';
      if(mode==='text'){
        fieldsHtml = `<div class="field" style="grid-column:1/-1;"><label>எழுத்து / URL</label><input type="text" id="qText" placeholder="https://example.com அல்லது எந்த உரையும்"></div>`;
      } else if(mode==='wifi'){
        fieldsHtml = `
          <div class="field"><label>Wi‑Fi பெயர் (SSID)</label><input type="text" id="qSsid"></div>
          <div class="field"><label>கடவுச்சொல்</label><input type="text" id="qPass"></div>
          <div class="field"><label>பாதுகாப்பு</label><select id="qSec"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option><option value="nopass">இல்லை (Open)</option></select></div>
        `;
      } else if(mode==='vcard'){
        fieldsHtml = `
          <div class="field"><label>பெயர்</label><input type="text" id="qName"></div>
          <div class="field"><label>தொலைபேசி</label><input type="text" id="qPhone"></div>
          <div class="field" style="grid-column:1/-1;"><label>மின்னஞ்சல்</label><input type="text" id="qEmail"></div>
        `;
      }
      const opts = el(`<div class="opts tamil">${fieldsHtml}<div class="field"><label>அளவு</label><select id="qSize"><option value="256">256 px</option><option value="400" selected>400 px</option><option value="600">600 px</option></select></div></div>`);
      body.appendChild(opts);
      const row = el(`<div class="btn-row"></div>`);
      const btn = el(`<button class="btn tamil">▦ QR உருவாக்கு</button>`);
      btn.onclick = doGenerate;
      row.appendChild(btn);
      body.appendChild(row);
      const holder = el(`<div id="qrHolder" style="margin-top:18px; text-align:center;"></div>`);
      body.appendChild(holder);
    }
    function buildPayload(){
      if(mode==='text') return body.querySelector('#qText').value || '';
      if(mode==='wifi'){
        const ssid = body.querySelector('#qSsid').value||'';
        const pass = body.querySelector('#qPass').value||'';
        const sec = body.querySelector('#qSec').value;
        return `WIFI:T:${sec};S:${ssid};P:${pass};;`;
      }
      if(mode==='vcard'){
        const name = body.querySelector('#qName').value||'';
        const phone = body.querySelector('#qPhone').value||'';
        const email = body.querySelector('#qEmail').value||'';
        return `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nTEL:${phone}\nEMAIL:${email}\nEND:VCARD`;
      }
      return '';
    }
    async function doGenerate(){
      const text = buildPayload();
      if(!text.trim()){ mountResult(body,'தேவையான தகவலை நிரப்பவும்.').style.background='#FDEDEC'; return; }
      const size = Number(body.querySelector('#qSize').value)||400;
      const holder = body.querySelector('#qrHolder');
      holder.innerHTML = '';
      const prog = mountProgress(body);
      try{
        prog.set(30,'QR உருவாக்குகிறது…');
        const QRCode = await ensureQrLib();
        const genDiv = document.createElement('div');
        new QRCode(genDiv, { text, width:size, height:size, correctLevel: QRCode.CorrectLevel.M });
        await new Promise(r=>setTimeout(r,150));
        prog.set(80,'தயார் செய்கிறது…');
        const imgOrCanvas = genDiv.querySelector('canvas') || genDiv.querySelector('img');
        let finalCanvas = document.createElement('canvas'); finalCanvas.width=size; finalCanvas.height=size;
        const fctx = finalCanvas.getContext('2d');
        fctx.fillStyle = '#fff'; fctx.fillRect(0,0,size,size);
        if(imgOrCanvas.tagName === 'CANVAS') fctx.drawImage(imgOrCanvas,0,0,size,size);
        else await new Promise(res=>{ if(imgOrCanvas.complete) { fctx.drawImage(imgOrCanvas,0,0,size,size); res(); } else { imgOrCanvas.onload=()=>{ fctx.drawImage(imgOrCanvas,0,0,size,size); res(); }; } });
        finalCanvas.style.maxWidth = '260px'; finalCanvas.style.border = '1px solid var(--line)'; finalCanvas.style.borderRadius = '12px';
        holder.appendChild(finalCanvas);
        const dRow = el(`<div class="btn-row tamil" style="justify-content:center;"></div>`);
        const dBtn = el(`<button class="btn">⬇️ PNG பதிவிறக்கு</button>`);
        dBtn.onclick = async ()=>{ const blob = await new Promise(res=>finalCanvas.toBlob(res,'image/png')); downloadBlob(blob,'qrcode.png'); };
        dRow.appendChild(dBtn); holder.appendChild(dRow);
        prog.set(100,'முடிந்தது'); prog.remove();
      }catch(err){ prog.remove(); mountResult(body,'பிழை: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

/* ===================== IMAGE FORMAT CONVERTER ===================== */
TOOL_IMPL.imgconvert = {
  mount(container){
    let files = [];
    const body = el(`<div></div>`); container.appendChild(body);
    function paint(){
      body.innerHTML = '';
      mountUploader(body, { accept:'image/*', multiple:true, label:'படங்களை இழுத்துப் போடு', sublabel:'JPG / PNG / WEBP',
        onAdd:(fl)=>{ files = files.concat(fl); paint(); } });
      if(files.length){
        mountFileList(body, files, (idx)=>{ files.splice(idx,1); paint(); });
        const opts = el(`
          <div class="opts tamil">
            <div class="field">
              <label>வெளியீட்டு வடிவம்</label>
              <select id="icFmt">
                <option value="image/png">PNG (வெளிப்படையானதை பாதுகாக்கும்)</option>
                <option value="image/jpeg">JPG</option>
                <option value="image/webp">WEBP</option>
              </select>
            </div>
            <div class="field">
              <label>தரம் (JPG/WEBP) %</label>
              <input type="number" id="icQ" value="92" min="10" max="100">
            </div>
          </div>
        `);
        body.appendChild(opts);
        const row = el(`<div class="btn-row"></div>`);
        const btn = el(`<button class="btn tamil">🔁 மாற்று பதிவிறக்கு</button>`);
        btn.onclick = doConvert;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    async function doConvert(){
      const fmt = body.querySelector('#icFmt').value;
      const q = Math.min(1, Math.max(0.1, Number(body.querySelector('#icQ').value)/100||0.92));
      const extMap = {'image/png':'png','image/jpeg':'jpg','image/webp':'webp'};
      const prog = mountProgress(body);
      try{
        const results = [];
        for(let i=0;i<files.length;i++){
          prog.set((i/files.length)*90, `${files[i].name} — மாற்றுகிறது…`);
          const f = files[i];
          const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });
          const img = new Image();
          await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=dataUrl; });
          const canvas = document.createElement('canvas'); canvas.width=img.naturalWidth; canvas.height=img.naturalHeight;
          const ctx = canvas.getContext('2d');
          if(fmt==='image/jpeg'){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); } // flatten transparency for JPG
          ctx.drawImage(img,0,0);
          const blob = await new Promise(res=> canvas.toBlob(res, fmt, q));
          results.push({name: f.name.replace(/\.[^.]+$/,'')+'.'+extMap[fmt], blob});
        }
        prog.set(95,'தயார் செய்கிறது…');
        if(results.length===1) downloadBlob(results[0].blob, results[0].name);
        else {
          const zip = new JSZip();
          results.forEach(r=> zip.file(r.name, r.blob));
          downloadBlob(await zip.generateAsync({type:'blob'}), 'converted-images.zip');
        }
        prog.set(100,'முடிந்தது'); prog.remove();
        mountResult(body, `${results.length} படங்கள் மாற்றப்பட்டு பதிவிறக்கம் ஆனது.`);
      }catch(err){ prog.remove(); mountResult(body,'பிழை: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

TOOL_IMPL.imgcrop = {
  mount(container){
    let file = null, previewUrl = null, natW=0, natH=0, selector = null;
    const body = el(`<div></div>`); container.appendChild(body);
    function paint(){
      body.innerHTML = '';
      mountUploader(body, { accept:'image/*', label:'படத்தை இழுத்துப் போடு', sublabel:'JPG / PNG',
        onAdd: async (fl)=>{
          file = fl[0];
          previewUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
          const img = new Image(); await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=previewUrl; });
          natW = img.naturalWidth; natH = img.naturalHeight;
          paint();
        }});
      if(file && previewUrl){
        mountFileList(body, [file], ()=>{ file=null; previewUrl=null; paint(); });
        body.appendChild(el(`<div class="note tamil">Crop செய்ய பெட்டியை இழு — வேண்டாம் எனில் முழு படத்தையும் அப்படியே Resize மட்டும் செய்யலாம்.</div>`));
        selector = mountRectSelector(body, previewUrl, {fx0:0.05, fy0:0.05, fx1:0.95, fy1:0.95});
        const opts = el(`
          <div class="opts tamil">
            <div class="field">
              <label>வெளியீட்டு அகலம் (px) — காலியாக விட்டால் Crop அளவு அப்படியே</label>
              <input type="number" id="icW" placeholder="எ.கா. 1080" min="10">
            </div>
          </div>
        `);
        body.appendChild(opts);
        const row = el(`<div class="btn-row"></div>`);
        const btn = el(`<button class="btn tamil">✂️ Crop & பதிவிறக்கு</button>`);
        btn.onclick = doCrop;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    async function doCrop(){
      const rect = selector.getRect();
      const targetW = Number(body.querySelector('#icW').value)||0;
      const prog = mountProgress(body);
      try{
        prog.set(20,'செயலாக்குகிறது…');
        const img = new Image(); await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=previewUrl; });
        const sx = Math.round(rect.fx0*natW), sy = Math.round(rect.fy0*natH);
        const sw = Math.max(1,Math.round((rect.fx1-rect.fx0)*natW)), sh = Math.max(1,Math.round((rect.fy1-rect.fy0)*natH));
        let outW = targetW>0 ? targetW : sw;
        let outH = targetW>0 ? Math.round(sh*(targetW/sw)) : sh;
        const canvas = document.createElement('canvas'); canvas.width=outW; canvas.height=outH;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
        prog.set(80,'தயார் செய்கிறது…');
        const blob = await new Promise(res=> canvas.toBlob(res,'image/png'));
        downloadBlob(blob, file.name.replace(/\.[^.]+$/,'')+'-cropped.png');
        prog.set(100,'முடிந்தது'); prog.remove();
        mountResult(body, 'Crop செய்யப்பட்ட படம் பதிவிறக்கம் ஆனது.');
      }catch(err){ prog.remove(); mountResult(body,'பிழை: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

TOOL_IMPL.txt2pdf = {
  mount(container){
    let text = '';
    const body = el(`<div></div>`); container.appendChild(body);
    function paint(){
      body.innerHTML = '';
      body.appendChild(el(`<div class="note tamil">உரையை நேரடியாக தட்டச்சு செய்யலாம் அல்லது .txt ஃபைலை பதிவேற்றலாம்.</div>`));
      mountUploader(body, { accept:'.txt,text/plain', label:'.txt ஃபைலை இழுத்துப் போடு (விருப்பம்)', sublabel:'',
        onAdd: async (fl)=>{ text = await fl[0].text(); paint(); } });
      const ta = el(`<textarea id="t2pText" rows="10" style="width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; margin-top:12px;" placeholder="இங்கே உரையை தட்டச்சு செய்யவும்…">${text}</textarea>`);
      body.appendChild(ta);
      ta.addEventListener('input', (e)=> text = e.target.value);
      const opts = el(`
        <div class="opts tamil">
          <div class="field" style="grid-column:1/-1;"><label>தலைப்பு (Title, விருப்பம்)</label><input type="text" id="t2pTitle" placeholder="எ.கா. என் குறிப்பு"></div>
          <div class="field"><label>Font அளவு</label><input type="number" id="t2pSize" value="13" min="8" max="28"></div>
        </div>
      `);
      body.appendChild(opts);
      const row = el(`<div class="btn-row"></div>`);
      const btn = el(`<button class="btn tamil">📝 PDF ஆக்கு</button>`);
      btn.onclick = doMake;
      row.appendChild(btn);
      body.appendChild(row);
    }
    function wrapLines(str, font, size, maxWidth){
      const lines = [];
      str.split('\n').forEach(paragraph=>{
        if(paragraph.trim()===''){ lines.push(''); return; }
        const words = paragraph.split(' ');
        let cur = '';
        words.forEach(word=>{
          const test = cur ? cur+' '+word : word;
          if(font.widthOfTextAtSize(test, size) > maxWidth && cur){ lines.push(cur); cur = word; }
          else cur = test;
        });
        if(cur) lines.push(cur);
      });
      return lines;
    }
    async function doMake(){
      const body_ = body.querySelector('#t2pText').value || text || '';
      if(!body_.trim()){ mountResult(body,'முதலில் உரையை உள்ளிடவும்.').style.background='#FDEDEC'; return; }
      const title = body.querySelector('#t2pTitle').value || '';
      const size = Number(body.querySelector('#t2pSize').value)||13;
      const prog = mountProgress(body);
      try{
        prog.set(15,'தயார் செய்கிறது…');
        const doc = await PDFDocument.create();
        const font = await doc.embedFont(StandardFonts.Helvetica);
        const titleFont = await doc.embedFont(StandardFonts.HelveticaBold);
        const pageW = 595.28, pageH = 841.89; // A4
        const margin = 50;
        const maxWidth = pageW - margin*2;
        const lineHeight = size*1.4;
        let page = doc.addPage([pageW,pageH]);
        let y = pageH - margin;
        if(title){
          page.drawText(title, {x:margin, y, size:size+6, font:titleFont, color:rgb(0.1,0.1,0.1)});
          y -= (size+6)*1.6;
        }
        const lines = wrapLines(body_, font, size, maxWidth);
        for(const line of lines){
          if(y < margin){ page = doc.addPage([pageW,pageH]); y = pageH - margin; }
          page.drawText(line, {x:margin, y, size, font, color:rgb(0.15,0.15,0.15)});
          y -= lineHeight;
        }
        prog.set(85,'தயார் செய்கிறது…');
        const bytes = await doc.save();
        downloadBlob(new Blob([bytes],{type:'application/pdf'}), (title||'document')+'.pdf');
        prog.set(100,'முடிந்தது'); prog.remove();
        mountResult(body, 'PDF பதிவிறக்கம் ஆனது.');
      }catch(err){ prog.remove(); mountResult(body,'பிழை: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};

/* ===================== IMAGE COLLAGE ===================== */
TOOL_IMPL.imgcollage = {
  mount(container){
    let files = [];
    const body = el(`<div></div>`); container.appendChild(body);
    function paint(){
      body.innerHTML = '';
      mountUploader(body, { accept:'image/*', multiple:true, label:'படங்களை இழுத்துப் போடு (2 அல்லது அதற்கு மேல்)', sublabel:'',
        onAdd:(fl)=>{ files = files.concat(fl); paint(); } });
      if(files.length){
        mountFileList(body, files, (idx)=>{ files.splice(idx,1); paint(); }, (idx,dir)=>{
          const ni = idx+dir; if(ni<0||ni>=files.length) return;
          [files[idx],files[ni]] = [files[ni],files[idx]]; paint();
        });
        const opts = el(`
          <div class="opts tamil">
            <div class="field">
              <label>ஒரு வரிசையில் எத்தனை படங்கள்</label>
              <input type="number" id="clCols" value="2" min="1" max="6">
            </div>
            <div class="field">
              <label>இடைவெளி (px)</label>
              <input type="number" id="clGap" value="10" min="0" max="60">
            </div>
          </div>
        `);
        body.appendChild(opts);
        const row = el(`<div class="btn-row"></div>`);
        const btn = el(`<button class="btn tamil">🖇️ Collage உருவாக்கு</button>`);
        btn.onclick = doMake;
        row.appendChild(btn);
        body.appendChild(row);
      }
    }
    async function doMake(){
      if(files.length<2){ mountResult(body,'குறைந்தது 2 படங்களையாவது சேர்க்கவும்.').style.background='#FDEDEC'; return; }
      const cols = Math.max(1, Math.min(6, Number(body.querySelector('#clCols').value)||2));
      const gap = Math.max(0, Number(body.querySelector('#clGap').value)||10);
      const prog = mountProgress(body);
      try{
        prog.set(10,'படங்களை படிக்கிறது…');
        const imgs = [];
        for(let i=0;i<files.length;i++){
          const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(files[i]); });
          const img = new Image(); await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=dataUrl; });
          imgs.push(img);
          prog.set(10 + (i/files.length)*40, `படிக்கிறது ${i+1}/${files.length}…`);
        }
        const rows = Math.ceil(imgs.length/cols);
        const cellW = 600, cellH = 600; // fixed cell box; images fit inside via 'contain'
        const canvas = document.createElement('canvas');
        canvas.width = cols*cellW + (cols+1)*gap;
        canvas.height = rows*cellH + (rows+1)*gap;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
        imgs.forEach((img,i)=>{
          const col = i%cols, row = Math.floor(i/cols);
          const cx = gap + col*(cellW+gap), cy = gap + row*(cellH+gap);
          const scale = Math.min(cellW/img.naturalWidth, cellH/img.naturalHeight);
          const dw = img.naturalWidth*scale, dh = img.naturalHeight*scale;
          const dx = cx + (cellW-dw)/2, dy = cy + (cellH-dh)/2;
          ctx.drawImage(img, dx, dy, dw, dh);
        });
        prog.set(85,'தயார் செய்கிறது…');
        const blob = await new Promise(res=> canvas.toBlob(res,'image/jpeg',0.92));
        downloadBlob(blob, 'collage.jpg');
        prog.set(100,'முடிந்தது'); prog.remove();
        mountResult(body, 'Collage படம் பதிவிறக்கம் ஆனது.');
      }catch(err){ prog.remove(); mountResult(body,'பிழை: '+err.message).style.background='#FDEDEC'; }
    }
    paint();
  }
};
