/*--------- SAVE ---------*/
const SK='LittleStar_v1';
let S={lang:'en',diff:1,music:1,sfx:1,
  char:{skin:0,hair:0,hairStyle:0,dress:0,acc:0},
  stats:{total:0,byDay:{},byGame:{}},best:{},stars:0,dailyDone:'',dailyClaimed:''};
try{const r=localStorage.getItem(SK);if(r){const p=JSON.parse(r);S={...S,...p,char:{...S.char,...(p.char||{})},stats:{...S.stats,...(p.stats||{})}};}}catch(e){}
function save(){try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){}}
function setBest(id,v){if(!S.best[id]||v>S.best[id]){S.best[id]=v;save();}}
function td(){return new Date().toISOString().slice(0,10);}
function addStat(id,sec,score){
  const d=td();S.stats.total+=sec;S.stats.byDay[d]=(S.stats.byDay[d]||0)+sec;
  if(!S.stats.byGame[id])S.stats.byGame[id]={plays:0,time:0,best:0};
  const g=S.stats.byGame[id];g.plays++;g.time+=sec;if(score>g.best)g.best=score;
  setBest(id,score);save();
}

/*--------- AUDIO ---------*/
let AC=null;
function ac(){if(!AC){try{AC=new(AudioContext||webkitAudioContext)()}catch(e){}}return AC}
function tone(f,d,t='sine',v=.13,dl=0){
  if(!S.sfx)return;const a=ac();if(!a)return;
  const st=a.currentTime+dl,o=a.createOscillator(),g=a.createGain();
  o.type=t;o.frequency.value=f;o.connect(g);g.connect(a.destination);
  g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(v,st+.01);
  g.gain.exponentialRampToValueAtTime(.001,st+d);o.start(st);o.stop(st+d+.05);
}
const SFX={
  tap:()=>tone(600,.05,'sine',.08),
  ok:()=>{tone(660,.09);setTimeout(()=>tone(880,.13),80);setTimeout(()=>tone(1174,.2),170);},
  coin:()=>{tone(1046,.05);setTimeout(()=>tone(1568,.1),40);},
  jump:()=>{tone(523,.08,'square',.08);setTimeout(()=>tone(784,.1,'square',.06),40);},
  bad:()=>{tone(200,.15,'sawtooth',.12);setTimeout(()=>tone(140,.2,'sawtooth',.1),80);},
  pop:()=>tone(880,.08,'sine',.12),
  win:()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,.25,'triangle',.14,i*.09));},
  flip:()=>tone(440,.06,'sine',.08),
  star:()=>{[880,1174,1568,2093].forEach((f,i)=>tone(f,.2,'sine',.13,i*.08));}
};
let musicTimer=null,musicOn=false;
function startMusic(){
  if(!S.music||musicOn)return;const a=ac();if(!a)return;musicOn=true;
  const bpm=102,beat=60/bpm;
  const chords=[[261.63,329.63,392],[196,246.94,392],[220,261.63,329.63],[174.61,220,349.23]];
  const melody=[[523,0,.5],[587,.5,.25],[659,.75,.25],[523,1,.5],[440,1.5,.5],[392,2,.5],[440,2.5,.25],[523,2.75,.25],[494,3,1],[440,4,.5],[523,4.5,.5],[587,5,.5],[659,5.5,.5],[587,6,.5],[523,6.5,.5],[440,7,1]];
  const bass=[131,98,110,87];
  let next=a.currentTime+.1;
  const loop=()=>{
    if(!musicOn||!a)return;const st=next;
    chords.forEach((ch,i)=>ch.forEach(f=>{
      const o=a.createOscillator(),g=a.createGain();
      o.type='sine';o.frequency.value=f;o.connect(g);g.connect(a.destination);
      g.gain.setValueAtTime(0,st+i*beat*2);g.gain.linearRampToValueAtTime(.025,st+i*beat*2+.05);
      g.gain.exponentialRampToValueAtTime(.001,st+i*beat*2+beat*2);
      o.start(st+i*beat*2);o.stop(st+i*beat*2+beat*2+.05);
    }));
    melody.forEach(([f,o,d])=>{
      const osc=a.createOscillator(),g=a.createGain();
      osc.type='triangle';osc.frequency.value=f;osc.connect(g);g.connect(a.destination);
      g.gain.setValueAtTime(0,st+o*beat);g.gain.linearRampToValueAtTime(.05,st+o*beat+.02);
      g.gain.exponentialRampToValueAtTime(.001,st+o*beat+d*beat*.9);
      osc.start(st+o*beat);osc.stop(st+o*beat+d*beat+.05);
    });
    bass.forEach((f,i)=>{
      const o=a.createOscillator(),g=a.createGain();
      o.type='sine';o.frequency.value=f;o.connect(g);g.connect(a.destination);
      g.gain.setValueAtTime(0,st+i*beat*2);g.gain.linearRampToValueAtTime(.05,st+i*beat*2+.03);
      g.gain.exponentialRampToValueAtTime(.001,st+i*beat*2+beat*2);
      o.start(st+i*beat*2);o.stop(st+i*beat*2+beat*2+.05);
    });
    next+=8*beat;
    musicTimer=setTimeout(loop,Math.max(100,(next-a.currentTime-.1)*1000));
  };loop();
}
function stopMusic(){musicOn=false;if(musicTimer)clearTimeout(musicTimer);}

/*--------- INPUT ---------*/
const In={down:0,x:0,y:0,sx:0,sy:0,sw:null};
function gp(e){const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height}}
function down(e){e.preventDefault();const a=ac();if(a&&a.state==='suspended')a.resume();const p=gp(e);In.down=1;In.x=p.x;In.y=p.y;In.sx=p.x;In.sy=p.y;In.sw=null;if(App.scr==='home')tapHome(p.x,p.y);else if(App.scr==='set')tapSet(p.x,p.y);else if(App.scr==='look')tapLook(p.x,p.y);else if(App.scr==='daily')tapDaily(p.x,p.y);else if(App.scr==='parent')tapParent(p.x,p.y);else if(App.scr==='game'&&App.g&&App.g.onDown)App.g.onDown(p.x,p.y);}
function move(e){
  if(!In.down)return;e.preventDefault();const p=gp(e);In.x=p.x;In.y=p.y;
  const dx=p.x-In.sx,dy=p.y-In.sy;
  if(!In.sw&&Math.max(Math.abs(dx),Math.abs(dy))>40){
    In.sw=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
    if(App.scr==='game'&&App.g&&App.g.onSwipe)App.g.onSwipe(In.sw);
    In.sx=p.x;In.sy=p.y;
  }
  if(App.scr==='game'&&App.g&&App.g.onMove)App.g.onMove(p.x,p.y);
}
function up(){In.down=0;}
cv.addEventListener('mousedown',down);addEventListener('mousemove',move);addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',up,{passive:false});

addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k))e.preventDefault();
  const a=ac();if(a&&a.state==='suspended')a.resume();
  if(k==='Escape'){if(App.scr!=='home')App.goHome();return;}
  if(App.scr==='home'){if(k>='1'&&k<='9'){const i=+k-1;if(GA[i])App.start(GA[i].id);}return;}
  if(App.scr!=='game'||!App.g)return;
  const g=App.g,id=g.id;
  if(id==='memory'||id==='pop'||id==='kolam'){if(k===' '&&g.auto){g.auto();}return;}
  if(id==='snake'){if(k==='ArrowLeft'&&g.dir.x!==1)g.nd={x:-1,y:0};else if(k==='ArrowRight'&&g.dir.x!==-1)g.nd={x:1,y:0};else if(k==='ArrowUp'&&g.dir.y!==1)g.nd={x:0,y:-1};else if(k==='ArrowDown'&&g.dir.y!==-1)g.nd={x:0,y:1};}
  if(id==='merge'){if(k==='ArrowLeft')g.onSwipe('left');else if(k==='ArrowRight')g.onSwipe('right');else if(k==='ArrowUp')g.onSwipe('up');else if(k==='ArrowDown')g.onSwipe('down');}
  if(id==='math'||id==='tamil'||id==='dress'){if(k>='1'&&k<='3'&&g.pick)g.pick(+k-1);}
});

/*--------- PARTICLES ---------*/
const P=[];
function spawn(o){P.push({x:o.x,y:o.y,vx:o.vx||0,vy:o.vy||0,g:o.g??.4,l:o.l||.7,ml:o.l||.7,s:o.s||5,c:o.c||'#fff',sh:o.sh||'c'})}
function updP(dt){for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l-=dt;if(p.l<=0)P.splice(i,1)}}
function drawP(){
  for(const p of P){ctx.save();ctx.globalAlpha=Math.max(0,p.l/p.ml);ctx.fillStyle=p.c;
    if(p.sh==='s'){ctx.beginPath();for(let i=0;i<10;i++){const r=i%2?p.s*.45:p.s,a=(i/10)*Math.PI*2-Math.PI/2;const px=Math.cos(a)*r,py=Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();ctx.fill();}
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fill();}
    ctx.restore();}ctx.globalAlpha=1;
}
function burst(x,y,n,o){for(let i=0;i<(n||10);i++)spawn({x,y,vx:(o&&o.vx)||(Math.random()-.5)*6,vy:(o&&o.vy)||(Math.random()*-6-1),s:(o&&o.s)||4,c:(o&&o.c)||'#FFD700',sh:(o&&o.sh)||'c',l:(o&&o.l)||.7,g:o&&o.g});}

/*--------- HELPERS ---------*/
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function txt(t,x,y,sz,col,al,w){ctx.font=`${w||900} ${sz}px 'Comic Sans MS','Segoe UI Rounded','Noto Sans Tamil',sans-serif`;ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillText(t,x+2,y+2);ctx.fillStyle=col||'#fff';ctx.fillText(t,x,y);}
function btn(x,y,w,h,label,col){
  ctx.fillStyle='rgba(0,0,0,.18)';rr(ctx,x,y+4,w,h,h/3);ctx.fill();
  ctx.fillStyle=col;rr(ctx,x,y,w,h,h/3);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;rr(ctx,x+3,y+3,w-6,h-6,h/3);ctx.stroke();
  txt(label,x+w/2,y+h/2+1,h*.33,'#fff');
}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');}
function inside(x,y,rx,ry,rw,rh){return x>rx&&x<rx+rw&&y>ry&&y<ry+rh;}

function drawPanda(c,lv){

const App={
  scr:'home',g:null,timeStart:0,
  goHome(){if(this.g&&this.g.cleanup)this.g.cleanup();this.g=null;this.scr='home';P.length=0;},
  start(id){const def=GA.find(g=>g.id===id);if(!def)return;this.g={...def};if(this.g.init)this.g.init();this.scr='game';P.length=0;this.timeStart=performance.now();
    setTimeout(()=>{if(S.sfx)SFX.tap();},50);},
  endGame(){if(this.g&&this.g.update){const dt=0;}this.goHome();},
  goSet(){this.scr='set';},
  goLook(){this.scr='look';},
  goDaily(){this.scr='daily';},
  goParent(){this.scr='parent';}
};
function tapHome(x,y){
  const cw=Math.min(W-40,520);const cx=(W-cw)/2;
  // Header icons
  if(inside(x,y,W-70,20,50,50)){SFX.tap();App.goSet();return;}
  if(inside(x,y,W-140,20,50,50)){SFX.tap();App.goParent();return;}
  if(inside(x,y,W-210,20,50,50)){SFX.tap();App.goDaily();return;}
  // Character tap → customize
  if(inside(x,y,W/2-70,170,140,260)){SFX.tap();App.goLook();return;}
  // Game cards
  const cols=2;const pad=14;const cardW=(cw-pad)/2;const cardH=Math.min((H-500)/4,86);const y0=460;
  GA.forEach((g,i)=>{const col=i%cols,row=Math.floor(i/cols);const gx=cx+col*(cardW+pad);const gy=y0+row*(cardH+8);if(gx+cardW<W-10||row<Math.ceil(GA.length/cols)){if(inside(x,y,gx,gy,cardW,cardH)){App.start(g.id);return;}}});
}
function tapSet(x,y){
  const cw=Math.min(W-60,440);const cx=(W-cw)/2;
  // Language toggle
  if(inside(x,y,cx,180,cw/2-6,60)){S.lang='en';save();SFX.tap();return;}
  if(inside(x,y,cx+cw/2+6,180,cw/2-6,60)){S.lang='ta';save();SFX.tap();return;}
  // Difficulty
  const dy=290;
  for(let i=0;i<3;i++){const bw=cw/3-4;const x0=cx+i*(bw+6);if(inside(x,y,x0,dy,bw,60)){S.diff=i;save();SFX.tap();return;}}
  // Music
  if(inside(x,y,cx,400,cw,60)){S.music=S.music?0:1;save();if(S.music){startMusic();}else stopMusic();SFX.tap();return;}
  // SFX
  if(inside(x,y,cx,470,cw,60)){S.sfx=S.sfx?0:1;save();SFX.tap();return;}
  // Reset
  if(inside(x,y,cx,570,cw,60)){if(confirm(T('resetCfm'))){localStorage.removeItem(SK);location.reload();}return;}
  // Back
  if(inside(x,y,30,30,140,50)){SFX.tap();App.goHome();return;}
}
function tapLook(x,y){
  const cw=Math.min(W-40,440);const cx=(W-cw)/2;
  if(inside(x,y,30,30,140,50)){SFX.tap();App.goHome();return;}
  const tabsY=H-220;const tw=cw/4;
  for(let i=0;i<4;i++){const x0=cx+i*(tw+4);if(inside(x,y,x0,tabsY,tw-4,44)){App.lookTab=i;SFX.tap();return;}}
  App.lookTab=App.lookTab||0;

  const n=lists[App.lookTab];const bw=Math.min(56,(cw-20)/n-8);const bx=cx+(cw-(n*(bw+8)-8))/2;
  for(let i=0;i<n;i++){const x0=bx+i*(bw+8);if(inside(x,y,x0,swY,bw,bw)){
    if(App.lookTab===0)S.char.hairStyle=i;
    else if(App.lookTab===1)S.char.skin=i;

}
function tapDaily(x,y){

/*=============== MAIN LOOP ===============*/
let lt=0;
function loop(t){
  requestAnimationFrame(loop);
  let dt=(t-lt)/1000;lt=t;if(dt>.1)dt=.1;
  ctx.clearRect(0,0,W,H);
  if(App.scr==='home')drawHome();
  else if(App.scr==='set')drawSet();
  else if(App.scr==='look')drawLook();
  else if(App.scr==='daily')drawDaily();
  else if(App.scr==='parent')drawParent();
  else if(App.scr==='game'&&App.g){if(App.g.update)App.g.update(dt);if(App.g.draw)App.g.draw();}
  drawP();
}
requestAnimationFrame(loop);

// Daily auto-check
function dailyCheck(){
  const any=S.best&&Object.values(S.best).some(v=>v>=50);
  if(any&&S.dailyDone!==td()){S.dailyDone=td();save();}
}
setInterval(dailyCheck,3000);dailyCheck();

  document.addEventListener('touchstart',unlock,{once:true});
  document.addEventListener('click',unlock,{once:true});
