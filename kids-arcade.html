const SK='LittleStar_v2';

/*--------- AUDIO ---------*/
let AC=null;
function ac(){if(!AC){try{AC=new(AudioContext||webkitAudioContext)()}catch(e){}}return AC}
function tone(f,d,t='sine',v=.13,dl=0){
  if(!S.sfx)return;const a=ac();if(!a)return;
  const st=a.currentTime+dl,o=a.createOscillator(),g=a.createGain();
  o.type=t;o.frequency.value=f;o.connect(g);g.connect(a.destination);
  g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(v,st+.01);
  g.gain.exponentialRampToValueAtTime(.001,st+d);o.start(st);o.stop(st+d+.05);
}
const SFX={
  tap:()=>tone(600,.05,'sine',.08),
  ok:()=>{tone(660,.09);setTimeout(()=>tone(880,.13),80);setTimeout(()=>tone(1174,.2),170);},
  coin:()=>{tone(1046,.05);setTimeout(()=>tone(1568,.1),40);},
  bad:()=>{tone(200,.15,'sawtooth',.12);setTimeout(()=>tone(140,.2,'sawtooth',.1),80);},
  pop:()=>tone(880,.08,'sine',.12),
  win:()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,.25,'triangle',.14,i*.09));},
  flip:()=>tone(440,.06,'sine',.08),
  star:()=>{[880,1174,1568,2093].forEach((f,i)=>tone(f,.2,'sine',.13,i*.08));}
};
let musicTimer=null,musicOn=false;
function startMusic(){
  if(!S.music||musicOn)return;const a=ac();if(!a)return;musicOn=true;
  const bpm=100,beat=60/bpm;
  const chords=[[261.63,329.63,392],[196,246.94,392],[220,261.63,329.63],[174.61,220,349.23]];
  const melody=[[523,0,.5],[587,.5,.25],[659,.75,.25],[523,1,.5],[440,1.5,.5],[392,2,.5],[440,2.5,.25],[523,2.75,.25],[494,3,1],[440,4,.5],[523,4.5,.5],[587,5,.5],[659,5.5,.5],[587,6,.5],[523,6.5,.5],[440,7,1]];
  const bass=[131,98,110,87];
  let next=a.currentTime+.1;
  const loop=()=>{
    if(!musicOn||!a)return;const st=next;
    chords.forEach((ch,i)=>ch.forEach(f=>{
      const o=a.createOscillator(),g=a.createGain();
      o.type='sine';o.frequency.value=f;o.connect(g);g.connect(a.destination);
      g.gain.setValueAtTime(0,st+i*beat*2);g.gain.linearRampToValueAtTime(.022,st+i*beat*2+.05);
      g.gain.exponentialRampToValueAtTime(.001,st+i*beat*2+beat*2);
      o.start(st+i*beat*2);o.stop(st+i*beat*2+beat*2+.05);
    }));
    melody.forEach(([f,o,d])=>{
      const osc=a.createOscillator(),g=a.createGain();
      osc.type='triangle';osc.frequency.value=f;osc.connect(g);g.connect(a.destination);
      g.gain.setValueAtTime(0,st+o*beat);g.gain.linearRampToValueAtTime(.045,st+o*beat+.02);
      g.gain.exponentialRampToValueAtTime(.001,st+o*beat+d*beat*.9);
      osc.start(st+o*beat);osc.stop(st+o*beat+d*beat+.05);
    });
    bass.forEach((f,i)=>{
      const o=a.createOscillator(),g=a.createGain();
      o.type='sine';o.frequency.value=f;o.connect(g);g.connect(a.destination);
      g.gain.setValueAtTime(0,st+i*beat*2);g.gain.linearRampToValueAtTime(.045,st+i*beat*2+.03);
      g.gain.exponentialRampToValueAtTime(.001,st+i*beat*2+beat*2);
      o.start(st+i*beat*2);o.stop(st+i*beat*2+beat*2+.05);
    });
    next+=8*beat;
    musicTimer=setTimeout(loop,Math.max(100,(next-a.currentTime-.1)*1000));
  };loop();
}
function stopMusic(){musicOn=false;if(musicTimer)clearTimeout(musicTimer);}

const In={down:0,x:0,y:0};
function gp(e){const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*(W/r.width),y:(t.clientY-r.top)*(H/r.height)}}
function down(e){
  e.preventDefault();const a=ac();if(a&&a.state==='suspended')a.resume();
  const p=gp(e);In.down=1;In.x=p.x;In.y=p.y;
  dispatch(p.x,p.y);
}
function dispatch(x,y){
  if(App.scr==='home')tapHome(x,y);
  else if(App.scr==='set')tapSet(x,y);
  else if(App.scr==='look')tapLook(x,y);
  else if(App.scr==='daily')tapDaily(x,y);
  else if(App.scr==='parent')tapParent(x,y);
  else if(App.scr==='game'&&App.g&&App.g.onDown)App.g.onDown(x,y);
}
function up(){In.down=0;}

addEventListener('keydown',e=>{

  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k))e.preventDefault();

  const g=App.g;

  if(g && g.pick && k>='1'&&k<='4'){g.pick(+k-1);}

const P=[];
function spawn(o){P.push({x:o.x,y:o.y,vx:o.vx||0,vy:o.vy||0,g:o.g??.4,l:o.l||.7,ml:o.l||.7,s:o.s||5,c:o.c||'#fff',sh:o.sh||'c'})}
function updP(dt){for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l-=dt;if(p.l<=0)P.splice(i,1)}}
function drawP(){
  for(const p of P){ctx.save();ctx.globalAlpha=Math.max(0,p.l/p.ml);ctx.fillStyle=p.c;
    if(p.sh==='s'){ctx.beginPath();for(let i=0;i<10;i++){const r=i%2?p.s*.45:p.s,a=(i/10)*Math.PI*2-Math.PI/2;const px=Math.cos(a)*r,py=Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();ctx.fill();}
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fill();}
    ctx.restore();}ctx.globalAlpha=1;
}
function burst(x,y,n,o){for(let i=0;i<(n||10);i++)spawn({x,y,vx:(o&&o.vx)||(Math.random()-.5)*6,vy:(o&&o.vy)||(Math.random()*-6-1),s:(o&&o.s)||4,c:(o&&o.c)||'#FFD700',sh:(o&&o.sh)||'c',l:(o&&o.l)||.7,g:o&&o.g});}

function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');}
function inside(x,y,rx,ry,rw,rh){return x>rx&&x<rx+rw&&y>ry&&y<ry+rh;}
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function pickN(a,n){return shuffle(a).slice(0,n);}

/*=============== GAMES ===============*/
const GA=[];
function dmul(){return [.75,1,1.35][S.diff];}
// Standard option picker for MCQ-based games
function MCQOptionPick(g,x,y){
  if(!g.q)return;
  const n=g.q.opts.length;
  const bw=Math.min((W-60)/n,130);
  const bh=Math.min(bw*0.9,90);
  const gap=12;
  const totalW=n*bw+(n-1)*gap;
  const bx=(W-totalW)/2;
  const by=H-Math.max(bh+80,140);
  for(let i=0;i<n;i++){
    const x0=bx+i*(bw+gap);
    if(inside(x,y,x0,by,bw,bh)){g.pick(i);return;}
  }
}

/*---- 1. MEMORY MATCH ----*/
GA.push({id:'memory',name:{en:'Memory Match',ta:'நினைவு'},icon:'🃏',color:'#BA68C8',
init(){const e=['🍎','🐱','🌟','🌸','🐶','🦋','🍓','🎈','🌺','🌈','🐟','🦚'];const n=4+(S.diff*2);const pick=pickN(e,n);const cards=shuffle([...pick,...pick]);
this.cols=4;this.rows=Math.ceil(cards.length/this.cols);
const padTop=SAFE_TOP+70,padBot=SAFE_BOTTOM+80;
this.sz=Math.min((W-40)/this.cols,(H-padTop-padBot)/this.rows,105);
this.ox=(W-this.cols*this.sz)/2;this.oy=padTop;
this.cards=cards.map((em,i)=>({em,x:this.ox+(i%this.cols)*this.sz+this.sz/2,y:this.oy+Math.floor(i/this.cols)*this.sz+this.sz/2,fl:0,mt:0}));

    const x0=bx+col*(bw+gap),y0=by+row*(bh+gap);
    ctx.fillStyle='rgba(0,0,0,.15)';rr(ctx,x0,y0+4,bw,bh,16);ctx.fill();
    ctx.fillStyle='#fff';rr(ctx,x0,y0,bw,bh,16);ctx.fill();
    ctx.strokeStyle='#FF9800';ctx.lineWidth=3;rr(ctx,x0,y0,bw,bh,16);ctx.stroke();
    txt(v,x0+bw/2,y0+bh/2+2,Math.min(bh*.55,52),'#333');});
  if(this.fb)txt(this.fb,W/2,H/2-Math.min(H*.2,140),Math.min(50,W*.12),this.fb==='✓'?'#4CAF50':'#E53935');
},
wrapText(text,maxW,sz){
  ctx.font=`900 ${sz}px 'Comic Sans MS',sans-serif`;
  const words=text.split(' ');const lines=[];let cur='';
  words.forEach(w=>{const test=cur?cur+' '+w:w;if(ctx.measureText(test).width>maxW&&cur){lines.push(cur);cur=w;}else cur=test;});
  if(cur)lines.push(cur);
  return lines.slice(0,3);
}
});

/*=============== APP ===============*/
const App={
  scr:'home',g:null,timeStart:0,lookTab:0,
  goHome(){this.goHomeReal();},
  goHomeReal(){
    if(this.g&&this.g.id){const dur=(performance.now()-this.timeStart)/1000;if(dur>2){/* save time only if played longer than 2s */}}
    this.g=null;this.scr='home';P.length=0;
  },
  start(id){
    const def=GA.find(g=>g.id===id);if(!def)return;
    this.g=Object.assign({},def);
    if(this.g.init)this.g.init();
    this.scr='game';P.length=0;this.timeStart=performance.now();
  },
  goSet(){this.scr='set';},
  goLook(){this.scr='look';this.lookTab=0;},
  goDaily(){this.scr='daily';},
  goParent(){this.scr='parent';}
};

/*=============== HIT TESTING ===============*/
function hudBtnRect(){const w=Math.min(120,W*.3),h=Math.max(42,Math.min(50,H*.07));return {x:15,y:SAFE_TOP,w,h};}
function tapHome(x,y){
  const hb=hudBtnRect();
  // Top icons (right side)
  const iconY=SAFE_TOP;
  const iconSize=Math.max(44,Math.min(50,H*.07));
  const ix3=W-iconSize-15;
  const ix2=ix3-iconSize-8;
  const ix1=ix2-iconSize-8;
  if(inside(x,y,ix1,iconY,iconSize,iconSize)){SFX.tap();App.goDaily();return;}
  if(inside(x,y,ix2,iconY,iconSize,iconSize)){SFX.tap();App.goParent();return;}
  if(inside(x,y,ix3,iconY,iconSize,iconSize)){SFX.tap();App.goSet();return;}
  // Stars badge (left)
  if(inside(x,y,15,iconY,Math.min(130,W*.35),iconSize)){/* stars badge tap - no-op */}
  // Character
  const charY=H*0.42;
  const charScale=Math.min(W/340,1.0);
  if(inside(x,y,W/2-70,charY-140,140,260)){SFX.tap();App.goLook();return;}
  // Game grid
  const cw=Math.min(W-30,520);
  const cx=(W-cw)/2;
  const cols=2;
  const pad=10;
  const cardW=(cw-pad)/2;
  const gridTop=H*0.55;
  const gridBottom=H-SAFE_BOTTOM-30;
  const gridH=gridBottom-gridTop;
  const rows=Math.ceil(GA.length/cols);
  const cardH=Math.min((gridH-(rows-1)*8)/rows,80);
  GA.forEach((g,i)=>{
    const col=i%cols,row=Math.floor(i/cols);
    const gx=cx+col*(cardW+pad);
    const gy=gridTop+row*(cardH+8);
    if(inside(x,y,gx,gy,cardW,cardH)){App.start(g.id);return;}
  });
}
function tapSet(x,y){
  const hb=hudBtnRect();
  if(inside(x,y,hb.x,hb.y,hb.w,hb.h)){SFX.tap();App.goHome();return;}
  const cw=Math.min(W-40,420);
  const cx=(W-cw)/2;
  const baseY=SAFE_TOP+110;
  const rowH=Math.max(56,Math.min(66,H*.09));
  const gap=14;
  // Language
  const lw=cw/2-6;
  if(inside(x,y,cx,baseY+50,lw,rowH)){S.lang='en';save();SFX.tap();return;}
  if(inside(x,y,cx+lw+12,baseY+50,lw,rowH)){S.lang='ta';save();SFX.tap();return;}
  // Difficulty
  const dy=baseY+50+rowH+gap+50;
  for(let i=0;i<3;i++){const bw=cw/3-4;const x0=cx+i*(bw+6);if(inside(x,y,x0,dy,bw,rowH)){S.diff=i;save();SFX.tap();return;}}
  // Music
  const my=dy+rowH+gap+50;
  if(inside(x,y,cx,my,cw,rowH)){S.music=S.music?0:1;save();if(S.music)startMusic();else stopMusic();SFX.tap();return;}
  // SFX
  const sy=my+rowH+gap;
  if(inside(x,y,cx,sy,cw,rowH)){S.sfx=S.sfx?0:1;save();SFX.tap();return;}
  // Reset
  const ry=sy+rowH+gap;
  if(inside(x,y,cx,ry,cw,rowH)){if(confirm(T('resetCfm'))){localStorage.removeItem(SK);location.reload();}return;}
}
function tapLook(x,y){
  const hb=hudBtnRect();
  if(inside(x,y,hb.x,hb.y,hb.w,hb.h)){SFX.tap();App.goHome();return;}
  const cw=Math.min(W-30,440);
  const cx=(W-cw)/2;
  // Tabs
  const tabsY=H-SAFE_BOTTOM-150;
  const tw=(cw-8)/4;
  for(let i=0;i<4;i++){const x0=cx+i*(tw+4);if(inside(x,y,x0,tabsY,tw-4,44)){App.lookTab=i;SFX.tap();return;}}
  // Swatches
  const swY=H-SAFE_BOTTOM-90;
  const lists=[HAIRSTYLES.length,SKINS.length,DRESSES.length,HAIRS.length];
  const n=lists[App.lookTab];
  const bw=Math.min(60,(cw-20)/n-8);
  const bx=(W-(n*(bw+8)-8))/2;
  for(let i=0;i<n;i++){
    const x0=bx+i*(bw+8);
    if(inside(x,y,x0,swY,bw,bw)){
      if(App.lookTab===0)S.char.hairStyle=i;
      else if(App.lookTab===1)S.char.skin=i;
      else if(App.lookTab===2)S.char.dress=i;
      else S.char.hair=i;
      save();SFX.tap();return;
    }
  }
}
function tapDaily(x,y){
  const hb=hudBtnRect();
  if(inside(x,y,hb.x,hb.y,hb.w,hb.h)){SFX.tap();App.goHome();return;}
  const cw=Math.min(W-40,400);

}
function tapParent(x,y){

  if(inside(x,y,hb.x,hb.y,hb.w,hb.h)){SFX.tap();App.goHome();return;}
}

    const gm=GA.find(g=>g.id===id);if(!gm)return;
    ctx.fillStyle='rgba(255,255,255,.85)';rr(ctx,cx,y,cw,50,10);ctx.fill();
    ctx.font=`${Math.min(24,50*.45)}px sans-serif`;ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(gm.icon,cx+14,y+25);
    ctx.fillStyle='#333';ctx.font=`800 ${Math.min(13,W*.033)}px sans-serif`;
    ctx.fillText(gm.name[S.lang]||gm.name.en,cx+52,y+18);
    ctx.fillStyle='#888';ctx.font=`500 ${Math.min(11,W*.028)}px sans-serif`;
    ctx.fillText(`${data.plays} plays · ${Math.floor(data.time/60)}m · best ${data.best}`,cx+52,y+36);
    y+=56;
  });
}

/*=============== MAIN LOOP ===============*/
let lt=0;
function loop(t){
  requestAnimationFrame(loop);
  let dt=(t-lt)/1000;lt=t;if(dt>.1)dt=.1;
  ctx.clearRect(0,0,W,H);
  if(App.scr==='home')drawHome();
  else if(App.scr==='set')drawSet();
  else if(App.scr==='look')drawLook();
  else if(App.scr==='daily')drawDaily();
  else if(App.scr==='parent')drawParent();
  else if(App.scr==='game'&&App.g){if(App.g.update)App.g.update(dt);if(App.g.draw)App.g.draw();}
  drawP();
}
requestAnimationFrame(loop);

/* Daily auto-check */
function dailyCheck(){
  const any=S.best&&Object.values(S.best).some(v=>v>=50);
  if(any&&S.dailyDone!==td()){S.dailyDone=td();save();}
}
setInterval(dailyCheck,3000);dailyCheck();

/* Boot */
setTimeout(()=>{
  const unlock=()=>{ac();if(AC&&AC.state==='suspended')AC.resume();if(S.music)startMusic();};
  document.addEventListener('touchstart',unlock,{once:true});
  document.addEventListener('click',unlock,{once:true});
},200);
</script>
